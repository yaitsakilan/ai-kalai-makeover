    },
    render: function (ctx) {
      var tab = tabOf(ctx.query);
      var body = tab === 'expenses' ? expensesTab(ctx) : tab === 'drawer' ? drawerTab() : tab === 'bills' ? billsTab(ctx) : duesTab();
      return h`
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title">Money</h1>
            <p class="page-sub">${F.date(today(), 'month')}</p>
          </div>
        </header>
        ${kpis()}
        ${tabsNav(tab)}
        <div class="mn-tab mn-tab-${tab}">${body}</div>`;
    },
    mount: function (root, ctx) {
      var sel = root.querySelector('#mn-cat');
      if (sel) sel.addEventListener('change', function () {
        KM.setQuery({ tab: 'expenses', month: sel.getAttribute('data-month') || '', cat: sel.value });
      });
      if (ctx.query.bill) setTimeout(function () { var b = root.querySelector('#bill-' + ctx.query.bill); if (b) b.scrollIntoView({ block: 'center' }); }, 80);
    }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'money') KM.refresh(); });

  /* ================================================================ OVERLAY: collect */
  function dueContext(d) {
    if (!d) return null;
    if (d.kind === 'booking') {
      var b = q.booking(d.id);
      var fn = b.fns[b.fns.length - 1];
      return { title: b.title + ' makeup', line: (fn.name !== b.title ? fn.name + ' · ' : '') + F.date(fn.date, 'dow') + ' · ' + b.venue,
        kv: [['Package', F.inr(b.total)], ['Paid so far', F.inr(b.paid) + ' · ' + F.plural(b.payments.length, 'payment')]], defMode: 'upi', note: d.upcoming ? 'Balance before function' : 'Balance after function' };
    }
    if (d.kind === 'academy') {
      var s = q.student(d.id);
      return { title: s.courseName, line: s.batch + ' · joined ' + F.date(s.start, 'dmy'),
        kv: [['Course fee', F.inr(s.fee)], ['Paid so far', F.inr(s.paid) + ' · ' + F.plural(s.payments.length, 'instalment')]], defMode: 'upi', note: 'Instalment ' + (s.payments.length + 1) };
    }
    var v = KM.data.visits.filter(function (x) { return x.id === d.id; })[0];
    return { title: 'Salon bill', line: v.items.map(function (i) { return i.name; }).join(', ') + ' · ' + F.date(v.date, 'dow'),
      kv: [['Bill total', F.inr(v.total)], ['Paid so far', F.inr(v.received)]], defMode: 'cash', note: '' };
  }
  function collectPicker() {
    var g = duesSplit();
    if (!g.all.length) return h`<div class="empty"><div class="empty-icon">${I('circle-check')}</div><div class="empty-title">Nothing to collect</div><div class="empty-body">Every bill, booking and course fee is fully paid.</div></div>`;
    var group = function (title, rows) {
      if (!rows.length) return '';
      return h`<div class="mn-pick-group"><h3 class="eyebrow mn-pick-h">${title}</h3>
        <div class="list">${rows.map(function (d) {
          return h`<button class="list-item mn-pick" data-open="collect" data-p-kind="${d.kind}" data-p-id="${d.id}" data-find="${(d.name + ' ' + d.phone).toLowerCase()}">
            <span class="li-body"><span class="li-title">${d.name}</span><span class="li-meta">${dueMeta(d)}</span></span>
            <span class="li-trail"><span class="money num ${d.upcoming ? '' : 'is-due'}">${F.inr(d.amount)}</span></span>${I('chevron-right', { cls: 'subtle' })}</button>`;
        })}</div></div>`;
    };
    return h`<div class="search mn-pick-search">${I('search')}<input class="input" id="col-find" placeholder="Search name or phone" autocomplete="off" aria-label="Search dues"></div>
      <div class="mn-pick-groups">${group('Overdue', g.late)}${group('Coming up', g.ahead)}</div>
      <div class="empty mn-pick-none" hidden><div class="empty-body">No dues match that search.</div></div>`;
  }
  function receiptText(d, ctxx, amount, mode, date, left) {
    return 'Vanakkam ' + firstOf(d.name) + '! 🙏 Kalai Makeover received ' + F.inr(amount) + ' (' + (mode === 'cash' ? 'Cash' : 'UPI') + ') on ' + F.date(date, 'dmy') +
      ' towards your ' + ctxx.title + '.\nBalance: ' + (left > 0 ? F.inr(left) : 'nil — fully paid') + '.\nThank you! ✨';
  }

  KM.overlay('collect', {
    kind: 'sheet', role: 'owner',
    // header = who (full name once) + phone; the verb lives on the footer button ("Collect ₹7,200")
    title: function (ctx) {
      if (!ctx.params.kind) return 'Collect a payment';
      var d = findDue(ctx.params.kind, ctx.params.id);
      return KM.esc(d ? d.name : 'Already paid');
    },
    sub: function (ctx) {
      if (!ctx.params.kind) return '';
      var d = findDue(ctx.params.kind, ctx.params.id);
      return d ? KM.esc(F.phone(d.phone)) : '';
    },
    render: function (ctx) {
      var p = ctx.params;
      if (!p.kind) return collectPicker();
      var d = findDue(p.kind, p.id);
      if (!d) return h`<div class="empty"><div class="empty-icon">${I('circle-check')}</div><div class="empty-title">Nothing due here</div>
        <div class="empty-body">This balance is already cleared.</div><button class="btn btn-secondary btn-sm" data-open="collect">See other dues</button></div>`;
      var c = dueContext(d);
      var half = Math.round(d.amount / 2 / 100) * 100;
      var quick = [[d.amount, 'Full balance']];
      if (d.amount >= 1000 && half > 0) quick.push([half, 'Half · ' + F.inr(half)]);
      if (d.amount > 5000 && half !== 5000) quick.push([5000, F.inr(5000)]);
      return h`<div class="mn-col">
        <div class="panel mn-col-who">
          <div class="row"><div class="li-body"><div class="strong">${c.title}</div><div class="subtle xsmall mn-col-line">${c.line}</div></div>
            <button type="button" class="link mn-col-change" data-open="collect">Change</button></div>
          <div class="kv mn-col-kv">${c.kv.map(function (r) { return h`<div class="kv-row"><span>${r[0]}</span><span class="num">${r[1]}</span></div>`; })}
            <div class="kv-row is-total"><span>Balance due</span><span class="num money ${d.upcoming ? '' : 'is-due'}">${F.inr(d.amount)}</span></div></div>
          <a class="btn btn-wa btn-sm mn-col-remind" href="${KM.wa(d.phone, remindText(d))}" target="_blank" rel="noopener">${I('brand-whatsapp')} Send reminder on WhatsApp</a>
        </div>
        <label class="field"><span class="label">Amount received <span class="req" aria-hidden="true">*</span></span>
          <span class="input-group"><span class="input-prefix mn-big-pre">₹</span><input class="input is-big num" id="col-amt" inputmode="numeric" autocomplete="off" value="${d.amount}" aria-describedby="col-hint" autofocus></span>
          <span class="hint" id="col-hint" aria-live="polite"></span></label>
        <div class="chips mn-col-quick" role="group" aria-label="Quick amounts">${quick.map(function (x) {
          return h`<button type="button" class="chip no-check" data-amt="${x[0]}">${x[1]}</button>`;
        })}</div>
        <div class="field"><span class="label" id="col-mode-l">Paid by</span>${seg('mode', [['cash', 'Cash'], ['upi', 'UPI / GPay']], c.defMode, 'Paid by')}</div>
        <div class="form-grid cols-2">
          <label class="field"><span class="label">Date</span><input class="input" type="date" id="col-date" value="${today()}" max="${today()}"></label>
          <label class="field"><span class="label">Note <span class="subtle">(optional)</span></span><input class="input" id="col-note" placeholder="${c.note ? 'e.g. ' + c.note : 'e.g. Paid at the counter'}" autocomplete="off"></label>
        </div>
      </div>`;
    },
    footer: function (ctx) {
      var p = ctx.params;
      if (!p.kind) return '';
      var d = findDue(p.kind, p.id);
      if (!d) return h`<button class="btn btn-secondary" data-close>Close</button>`;
      return h`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="col-save">${I('check')} <span id="col-save-l">Collect ${F.inr(d.amount)}</span></button>`;
    },
    mount: function (el, ctx) {
      var p = ctx.params;
      if (!p.kind) {
        var f = el.querySelector('#col-find');
        if (f) f.addEventListener('input', function () {
          var t = f.value.trim().toLowerCase(), any = false;
          el.querySelectorAll('.mn-pick').forEach(function (b) { var on = !t || b.getAttribute('data-find').indexOf(t) >= 0; b.hidden = !on; if (on) any = true; });
          el.querySelectorAll('.mn-pick-group').forEach(function (g) { g.hidden = !g.querySelector('.mn-pick:not([hidden])'); });
          el.querySelector('.mn-pick-none').hidden = any;
        });
        return;
      }
      var d = findDue(p.kind, p.id);
      if (!d) return;
      var c = dueContext(d);
      var input = el.querySelector('#col-amt'), hint = el.querySelector('#col-hint'), save = el.querySelector('#col-save'), saveL = el.querySelector('#col-save-l');
      var mode = wireSeg(el, 'mode');
      function sync() {
        var a = amt(input.value);
        hint.className = 'hint';
        if (!a) { hint.textContent = 'Enter the amount received'; hint.classList.add('is-warn'); }
        else if (a > d.amount) { hint.textContent = 'That is more than the balance'; hint.classList.add('is-warn'); }
        else if (a === d.amount) { hint.textContent = ''; } // the selected "Full balance" chip already says it
        else { hint.textContent = 'Part payment — ' + F.inr(d.amount - a) + ' will still be due'; }
        saveL.textContent = a ? 'Collect ' + F.inr(a) : 'Collect';
        save.disabled = !a || a > d.amount;
        el.querySelectorAll('[data-amt]').forEach(function (b) { b.classList.toggle('is-selected', +b.getAttribute('data-amt') === a); });
      }
      input.addEventListener('input', sync);
      input.addEventListener('focus', function () { input.select(); });
      el.querySelector('.mn-col-quick').addEventListener('click', function (e) {
        var b = e.target.closest('[data-amt]'); if (!b) return;
        input.value = b.getAttribute('data-amt'); sync(); input.focus();
      });
      sync();
      save.addEventListener('click', function () {
        var a = amt(input.value);
        if (!a || a > d.amount) { input.focus(); return; }
        var m = mode() || c.defMode;
        var date = el.querySelector('#col-date').value || today();
        var note = el.querySelector('#col-note').value.trim();
        if (d.kind === 'salon') collectVisitPart(d.id, a, m);
        else if (d.kind === 'booking') {
          q.addBookingPayment(d.id, a, m, note || (a >= d.amount ? 'Balance' : 'Part payment'));
          var bk = KM.data.bookings.filter(function (x) { return x.id === d.id; })[0];
          if (bk && patchLastPayment(bk.payments, date, null)) KM.emit('data:changed', 'booking');
        } else if (d.kind === 'academy') {
          q.addStudentPayment(d.id, a, m);
          var st = KM.data.students.filter(function (x) { return x.id === d.id; })[0];
          if (st && patchLastPayment(st.payments, date, note)) KM.emit('data:changed', 'student');
        }
        var left = d.amount - a;
        var title = el.querySelector('.ov-title'); if (title) title.textContent = 'Payment received';
        var sub = el.querySelector('.ov-sub'); if (sub) sub.textContent = d.name;
        // each fact once: amount, how/when, what's left — WhatsApp shows the receipt text itself before sending
        el.querySelector('.ov-body').innerHTML = String(h`<div class="mn-success" role="status">
          <span class="mn-success-icon">${I('check')}</span>
          <div class="mn-success-amt num">${F.inr(a)}</div>
          <div class="subtle small">${m === 'cash' ? 'Cash' : 'UPI'} · ${F.date(date, 'long')} · ${c.title}</div>
          <div class="mn-success-left ${left > 0 && !d.upcoming ? 'is-due' : ''}">${left > 0 ? F.inr(left) + ' still due' : 'Fully paid'}</div>
        </div>`);
        el.querySelector('.ov-foot').innerHTML = String(h`<button class="btn btn-secondary" data-close>Done</button>
          <a class="btn btn-wa" href="${KM.wa(d.phone, receiptText(d, c, a, m, date, left))}" target="_blank" rel="noopener">${I('brand-whatsapp')} Send receipt on WhatsApp</a>`);
        KM.toast(F.inr(a) + ' collected from ' + firstOf(d.name), { kind: 'success' });
      });
    }
  });

  /* ================================================================ OVERLAY: expense (one form for everything) */
  function itemRow(it, i) {

  KM.overlay('expense', {
    title: 'Add expense', kind: 'sheet', role: 'any',
    render: function (ctx) {
      var sel = ctx.params.cat || '';
      return h`<div class="mn-exf">
        <div class="field"><span class="label" id="ex-cat-l">Category</span>

          <span class="hint" id="ex-amt-hint"></span></label>
        <div class="field"><span class="label">Paid by</span>${seg('mode', [['cash', 'Cash'], ['upi', 'UPI / GPay']], 'cash', 'Paid by')}</div>
        <div class="form-grid cols-2">
          <label class="field"><span class="label">Date</span><input class="input" type="date" id="ex-date" value="${today()}" max="${today()}"></label>
          <label class="field"><span class="label">Vendor or note</span><input class="input" id="ex-note" placeholder="e.g. Ritchie St Wholesale" autocomplete="off"></label>
        </div>
        <div class="mn-split">
          <label class="mn-split-toggle"><span class="switch"><input type="checkbox" id="ex-split"><span></span></span>
            <span class="small">Split into items</span></label>
          <div class="mn-items" id="ex-items" hidden>
            <div class="mn-items-rows">${[0, 1].map(function (i) { return itemRow(null, i); })}</div>
            <button type="button" class="btn btn-ghost btn-sm" id="ex-add-item">${I('plus')} Add item</button>
          </div>
        </div>
        <p class="hint is-warn mn-err" id="ex-err" role="alert"></p>
      </div>`;
    },
    footer: function () {
      return h`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="ex-save">${I('check')} <span id="ex-save-l">Save expense</span></button>`;
    },
    mount: function (el, ctx) {
      var cat = ctx.params.cat || '';
      var amtIn = el.querySelector('#ex-amt'), err = el.querySelector('#ex-err'), saveL = el.querySelector('#ex-save-l');
      var split = el.querySelector('#ex-split'), box = el.querySelector('#ex-items'), rows = el.querySelector('.mn-items-rows');
      var hintA = el.querySelector('#ex-amt-hint');
      var mode = wireSeg(el, 'mode');
      function items() {
        return Array.prototype.map.call(rows.querySelectorAll('.mn-item-row'), function (r) {
          return { name: r.querySelector('[data-item="name"]').value.trim(), amount: amt(r.querySelector('[data-item="amount"]').value) };
        }).filter(function (x) { return x.name || x.amount; });
      }
      function sync() {
        if (split.checked) {
          var its = items(), s = q.sum(its, function (x) { return x.amount; });
          amtIn.value = s ? String(s) : '';
          hintA.textContent = its.length ? 'Total of ' + F.plural(its.length, 'item') : 'Add the items below';
        } else hintA.textContent = '';
        var a = amt(amtIn.value);
        saveL.textContent = a ? 'Save ' + F.inr(a) + (cat ? ' · ' + cat : '') : 'Save expense';
      }
      el.querySelector('.mn-cats').addEventListener('click', function (e) {
        var b = e.target.closest('[data-cat]'); if (!b) return;
        cat = b.getAttribute('data-cat');
        el.querySelectorAll('.mn-cat').forEach(function (x) { var on = x === b; x.classList.toggle('is-selected', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
        err.textContent = '';
        if (!amtIn.value) setTimeout(function () { amtIn.focus(); }, 0);
        sync();
      });
      amtIn.addEventListener('input', function () { err.textContent = ''; sync(); });
      split.addEventListener('change', function () {
        box.hidden = !split.checked; amtIn.readOnly = split.checked;
        amtIn.classList.toggle('is-locked', split.checked);
        if (split.checked) { var first = rows.querySelector('input'); if (first) first.focus(); }
        sync();
      });
      rows.addEventListener('input', sync);
      rows.addEventListener('click', function (e) {
        var del = e.target.closest('[data-item-del]'); if (!del) return;
        var r = del.closest('.mn-item-row');
        if (rows.querySelectorAll('.mn-item-row').length > 1) r.remove(); else r.querySelectorAll('input').forEach(function (i) { i.value = ''; });
        sync();
      });
      el.querySelector('#ex-add-item').addEventListener('click', function () {
        var n = rows.querySelectorAll('.mn-item-row').length;
        rows.insertAdjacentHTML('beforeend', String(itemRow(null, n)));
        var ins = rows.querySelectorAll('.mn-item-row'); ins[ins.length - 1].querySelector('input').focus();
      });
      sync();
      el.querySelector('#ex-save').addEventListener('click', function () {
        var a = amt(amtIn.value);
        if (!cat) { err.textContent = 'Pick a category first.'; el.querySelector('.mn-cat').focus(); return; }
        if (!a) { err.textContent = split.checked ? 'Add at least one item with an amount.' : 'Enter the amount.'; amtIn.focus(); return; }
        var date = el.querySelector('#ex-date').value || today();
        var note = el.querySelector('#ex-note').value.trim();
        var e = { date: date, cat: cat, amount: a, mode: mode() || 'cash', note: note || cat, addedBy: KM.state.role === 'staff' && KM.state.user ? KM.state.user.id : null, bill: null };
        if (split.checked) e.items = items();
        q.addExpense(e);
        var other = date.slice(0, 7) !== today().slice(0, 7);
        KM.close();
        KM.toast('Saved ' + F.inr(a) + ' · ' + cat + (other ? ' (in ' + D.monthName(date.slice(0, 7)) + ')' : ''), {
          kind: 'success', action: KM.state.role === 'owner' ? { label: 'View', fn: function () { KM.go('/money?tab=expenses'); } } : null });
      });
    }
  });

  /* ================================================================ OVERLAY: scan (pick → reading → review) */
  var scanTimer = null;
  function sampleBill() {
    var b = KM.data.bills.filter(function (x) { return x.id === 'scan1'; })[0] || KM.data.bills[0];
    return { store: b.store, date: today(), items: b.items.map(function (i) { return { name: i.name, amount: i.amount }; }), total: b.total };
  }
  KM.overlay('scan', {
    kind: 'sheet', size: 'lg', role: 'owner',
    title: function (ctx) { return ctx.params.state === 'review' ? 'Check the bill' : 'Scan a bill'; },
    render: function (ctx) {
      var s = ctx.params.state || 'pick';
      if (s === 'reading') {
        return h`<div class="mn-reading" aria-busy="true">
          <div class="mn-reading-paper" aria-hidden="true">
            <span class="mn-scanline"></span>
            <div class="skeleton mn-sk w60"></div><div class="skeleton mn-sk w40 sm"></div>
            <div class="mn-sk-gap"></div>
            ${[80, 65, 70, 50].map(function (w) { return h`<div class="mn-sk-row"><div class="skeleton mn-sk w${w}"></div><div class="skeleton mn-sk w15"></div></div>`; })}
            <div class="mn-sk-gap"></div><div class="mn-sk-row"><div class="skeleton mn-sk w30"></div><div class="skeleton mn-sk w20"></div></div>
          </div>
          <div class="mn-reading-text">
            <div class="h3">Reading the bill…</div>
            <ol class="mn-steps">
              <li class="is-done">${I('circle-check')} Shop name and date</li>
              <li class="is-now">${I('loader-2', { cls: 'mn-spin' })} Each item and price</li>
              <li>${I('circle-dashed')} Checking the total</li>
            </ol>
          </div>
        </div>`;
      }
      if (s === 'review') {
        var b = sampleBill();
        return h`<div class="mn-review">
          <div class="mn-review-photo"><span class="mn-photo-tag">Your photo</span>${receipt({ id: 'preview', store: b.store, date: b.date, items: b.items, total: b.total }, { mini: true })}</div>
          <div class="mn-review-form">
            <div class="form-grid cols-2">
              <label class="field"><span class="label">Shop</span><input class="input" id="sc-store" value="${b.store}" autocomplete="off"></label>
              <label class="field"><span class="label">Bill date</span><input class="input" type="date" id="sc-date" value="${b.date}" max="${today()}"></label>
            </div>
            <div class="field"><span class="label">Items</span>
              <div class="mn-items-rows" id="sc-rows">${b.items.map(function (it, i) { return itemRow(it, i); })}</div>
              <button type="button" class="btn btn-ghost btn-sm mn-add-line" id="sc-add">${I('plus')} Add a missed item</button></div>
            <label class="field mn-printed"><span class="label">Total printed on the bill</span>
              <span class="input-group"><span class="input-prefix">₹</span><input class="input num" id="sc-total" value="${b.total}" inputmode="numeric" autocomplete="off" aria-describedby="sc-check"></span>
              <span class="hint is-good" id="sc-check" role="status">Items add up</span></label>
            <div class="field"><span class="label">Save under</span>${seg('cat', [['Salon products', 'Salon products'], ['Makeup products', 'Makeup products']], 'Salon products', 'Category')}</div>
            <div class="field"><span class="label">Paid by</span>${seg('mode', [['cash', 'Cash'], ['upi', 'UPI / GPay']], 'cash', 'Paid by')}</div>
          </div>
        </div>`;
      }
      return h`<div class="mn-drop">
          <span class="mn-drop-icon">${I('receipt')}</span>
          <p class="subtle small">Printed or handwritten, Tamil or English — keep the total in the frame.</p>
          <div class="cluster mn-drop-actions">
            <label class="btn btn-primary">${I('camera')} Open camera<input type="file" accept="image/*" capture="environment" class="sr-only" data-scan-file></label>
            <label class="btn btn-secondary">${I('photo')} Choose from gallery<input type="file" accept="image/*" class="sr-only" data-scan-file></label>
          </div>
          <button type="button" class="link mn-sample" id="sc-sample">No bill handy? Use a sample photo</button>
        </div>`;
    },
    footer: function (ctx) {
      var s = ctx.params.state || 'pick';
      if (s === 'review') return h`<button class="btn btn-secondary" data-open="scan">${I('camera-rotate')} Retake</button><button class="btn btn-primary" id="sc-save">${I('check')} <span id="sc-save-l">Save as expense</span></button>`;
      if (s === 'reading') return h`<button class="btn btn-secondary" data-close>Cancel</button>`;
      return '';
    },
    mount: function (el, ctx) {
      var s = ctx.params.state || 'pick';
      if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
      if (s === 'pick') {
        el.querySelector('#sc-sample').addEventListener('click', function () { KM.open('scan', { state: 'reading' }); });
        el.querySelectorAll('[data-scan-file]').forEach(function (f) { f.addEventListener('change', function () { if (f.files && f.files.length) KM.open('scan', { state: 'reading' }); }); });
        return;
      }
      if (s === 'reading') { scanTimer = setTimeout(function () { scanTimer = null; KM.open('scan', { state: 'review' }); }, 1200); return; }
      var rows = el.querySelector('#sc-rows'), totalIn = el.querySelector('#sc-total'), check = el.querySelector('#sc-check'), saveL = el.querySelector('#sc-save-l');
      var cat = wireSeg(el, 'cat'), mode = wireSeg(el, 'mode');
      function items() {
        return Array.prototype.map.call(rows.querySelectorAll('.mn-item-row'), function (r) {
          return { name: r.querySelector('[data-item="name"]').value.trim(), amount: amt(r.querySelector('[data-item="amount"]').value) };
        }).filter(function (x) { return x.name || x.amount; });
      }
      function sync() {
        var its = items(), s2 = q.sum(its, function (x) { return x.amount; }), t = amt(totalIn.value);
        var ok = s2 === t && s2 > 0;
        check.className = 'hint ' + (ok ? 'is-good' : 'is-warn');
        check.textContent = ok ? 'Items add up' : 'Items add up to ' + F.inr(s2) + ' — ' + (s2 < t ? F.inr(t - s2) + ' missing' : F.inr(s2 - t) + ' too much');
        saveL.textContent = s2 ? 'Save ' + F.inr(s2) + ' as expense' : 'Save as expense';
      }
      rows.addEventListener('input', sync);
      totalIn.addEventListener('input', sync);
      rows.addEventListener('click', function (e) {
        var del = e.target.closest('[data-item-del]'); if (!del) return;
        del.closest('.mn-item-row').remove(); sync();
      });
      el.querySelector('#sc-add').addEventListener('click', function () {
        rows.insertAdjacentHTML('beforeend', String(itemRow(null, rows.querySelectorAll('.mn-item-row').length)));
        var all = rows.querySelectorAll('.mn-item-row'); all[all.length - 1].querySelector('input').focus(); sync();
      });
      sync();
      el.querySelector('#sc-save').addEventListener('click', function () {
        var its = items().filter(function (x) { return x.amount > 0; });
        var s2 = q.sum(its, function (x) { return x.amount; });
        if (!s2) { rows.querySelector('input') && rows.querySelector('input').focus(); return; }
        var store = el.querySelector('#sc-store').value.trim() || 'Shop bill';
        var date = el.querySelector('#sc-date').value || today();
        var id = 'scan' + Date.now().toString(36);
        KM.data.bills.unshift({ id: id, store: store, date: date, items: its.map(function (x) { return { name: x.name || 'Item', amount: x.amount }; }), total: amt(totalIn.value) || s2 });
        q.addExpense({ date: date, cat: cat() || 'Salon products', amount: s2, mode: mode() || 'cash', note: store, addedBy: null, bill: id, items: its });
        KM.close();
        KM.toast('Bill saved as a ' + F.inr(s2) + ' expense', { kind: 'success', action: { label: 'See bill', fn: function () { KM.go('/money?tab=bills&bill=' + id); } } });
      });
    },
    unmount: function () { if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; } }
  });

  /* ================================================================ OVERLAY: drawer (count cash + UPI) */
  var NOTES = [500, 200, 100, 50, 20, 10];
  function prefillCount(target) {
    // demo pre-fill: a believable drawer close to (but not exactly) the books — a realistic note mix, then greedy top-up
    var total = Math.max(0, Math.round((target - 525) / 5) * 5), left = total, out = {};
    var mix = { 500: 0.6, 200: 0.14, 100: 0.12, 50: 0.06, 20: 0.03, 10: 0.02 };
    NOTES.forEach(function (n) { out[n] = Math.floor(total * mix[n] / n); left -= out[n] * n; });
    NOTES.forEach(function (n) { var k = Math.floor(left / n); out[n] += k; left -= k * n; });
    return { notes: out, coins: left };
  }
  KM.overlay('drawer', {
    title: 'Count the drawer', kind: 'modal', role: 'owner',
    render: function () {
      var c = drawerCalc(today().slice(0, 7), today());
      if (!c) return h`<div class="empty"><div class="empty-title">No opening balance for this month</div></div>`;
      var pf = prefillCount(c.expCash);
      return h`<div class="mn-count">
        <div class="mn-count-h"><span class="eyebrow">Notes in the drawer</span><span class="eyebrow">Amount</span></div>
        <div class="mn-notes">${NOTES.map(function (n) {
          return h`<div class="mn-note-row" data-note="${n}">
            <span class="mn-note-chip">₹${n}</span>
            <span class="stepper"><button type="button" data-step="-1" aria-label="One less ₹${n} note">${I('minus')}</button><input class="mn-step-in num" value="${pf.notes[n]}" inputmode="numeric" aria-label="Number of ₹${n} notes"><button type="button" data-step="1" aria-label="One more ₹${n} note">${I('plus')}</button></span>
            <span class="mn-note-sum num">${F.inr(pf.notes[n] * n)}</span>
          </div>`;
        })}
          <div class="mn-note-row"><span class="mn-note-chip">Coins</span>
            <span class="input-group mn-coins"><span class="input-prefix">₹</span><input class="input num" id="dr-coins" value="${pf.coins}" inputmode="numeric" aria-label="Coins total in rupees"></span>
            <span class="mn-note-sum num" id="dr-coins-sum">${F.inr(pf.coins)}</span></div>
        </div>
        <label class="field mn-upi-field"><span class="label">UPI / bank balance <span class="subtle">(GPay business app)</span></span>
          <span class="input-group"><span class="input-prefix">₹</span><input class="input num" id="dr-upi" value="${c.expUpi}" inputmode="numeric" autocomplete="off"></span></label>
        <div class="mn-count-res" id="dr-res" aria-live="polite"></div>
      </div>`;
    },
    footer: function () { return h`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="dr-save">${I('check')} Save count</button>`; },
    mount: function (el) {
      var ym = today().slice(0, 7);
      var c = drawerCalc(ym, today());
      if (!c) return;
      var res = el.querySelector('#dr-res'), coins = el.querySelector('#dr-coins'), upi = el.querySelector('#dr-upi');
      function counted() {
        var t = 0;
        el.querySelectorAll('.mn-note-row[data-note]').forEach(function (r) {
          var n = +r.getAttribute('data-note'), k = amt(r.querySelector('.mn-step-in').value);
          r.querySelector('.mn-note-sum').textContent = F.inr(n * k); t += n * k;
        });
        var co = amt(coins.value); el.querySelector('#dr-coins-sum').textContent = F.inr(co);
        return t + co;
      }
      // the UPI figure is the field right above, so only the cash total (summed from the notes) gets a "Counted" row
      function line(label, exp, got, showGot) {
        return h`<div class="mn-res-col"><div class="mn-res-h">${label}</div>
          <div class="kv"><div class="kv-row"><span>Should be</span><span class="num">${F.inr(exp)}</span></div>${showGot ? h`<div class="kv-row"><span>Counted</span><span class="num">${F.inr(got)}</span></div>` : ''}
          <div class="kv-row"><span>Difference</span><span>${diffText(got - exp)}</span></div></div></div>`;
      }
      function sync() {
        var cash = counted(), u = amt(upi.value);
        res.innerHTML = String(h`${line('Cash drawer', c.expCash, cash, true)}${line('UPI / bank', c.expUpi, u, false)}`);
        return { cash: cash, upi: u };
      }
      el.querySelector('.mn-notes').addEventListener('click', function (e) {
        var b = e.target.closest('[data-step]'); if (!b) return;
        var inp = b.parentNode.querySelector('.mn-step-in');
        inp.value = Math.max(0, amt(inp.value) + (+b.getAttribute('data-step'))); sync();
      });
      el.querySelector('.mn-notes').addEventListener('input', sync);
      upi.addEventListener('input', sync);
      sync();
      el.querySelector('#dr-save').addEventListener('click', function () {
        var v = sync();
        var bal = balanceFor(ym);
        bal.countedCash = v.cash; bal.countedUpi = v.upi; bal.countedOn = today();
        var d = v.cash - c.expCash;
        KM.emit('data:changed', 'balance');
        KM.close();
        KM.toast('Drawer count saved' + (Math.abs(d) < 1 ? ' · matches the books' : ' · ' + F.inr(Math.abs(d)) + (d < 0 ? ' short' : ' extra') + ' noted'), { kind: Math.abs(d) < 1 ? 'success' : 'warn' });
      });
    }
  });
})();

</script>
<script data-screen="settings">
/* ===== screens/settings.js ===== */
/* Settings (owner) — studio profile, services & prices, staff access & PINs, attendance (WiFi binding),
   WhatsApp templates with live preview, appearance + AI language, data export/backup.
   One section at a time: desktop shows a plain section list beside it; phones show the list first (#/settings)
   and one section per page (#/settings?section=templates) with a back link.
   Clean pass: headings are words, no helper sentences, one control per row, one Save per form.
   Prices and staff PINs are edited in small sheets opened by tapping the row (st-price, st-staff). */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q;
  var T = KM.state.today;
  var SET = KM.data.settings;
  if (!SET.aiLang) SET.aiLang = 'tanglish';
  if (SET.aiMirror == null) SET.aiMirror = true;
  if (SET.studio.instagram == null) SET.studio.instagram = '@kalai_makeover';
  if (SET.studio.footer == null) SET.studio.footer = 'Thank you for choosing Kalai Makeover ✨ Follow us on Instagram for bridal looks.';
  var ac = null, themeObs = null, selfTheme = false;
  var DEFAULT_TPL = JSON.parse(JSON.stringify(SET.templates));
  var local = {   // settings that have no home in KM.data yet (prototype-only state)
    themeMode: null, pinOn: true, autoLock: true, lockMin: 5, bio: true, gps: true, halfDay: 4, open: '09:30', close: '20:30',
    autoBackup: true, lastBackup: T + 'T06:00', pinChanged: '2026-08-12', pinForm: false, revealed: {}, staffOn: { meena: true, lavanya: true, divya: true, saranya: true },
    speak: false, newSvc: {}, tpl: null
  };

  var SECTIONS = [
    { id: 'profile', label: 'Studio profile' },
    { id: 'services', label: 'Services & prices' },
    { id: 'security', label: 'Staff access' },
    { id: 'attendance', label: 'Attendance' },
    { id: 'templates', label: 'WhatsApp templates' },
    { id: 'appearance', label: 'Appearance & language' },
    { id: 'data', label: 'Data & backup' }
  ];
  function secOf(ctx) { var s = ctx.query.section; return SECTIONS.some(function (x) { return x.id === s; }) ? s : 'profile'; }
  function labelOf(id) { return SECTIONS.filter(function (x) { return x.id === id; })[0].label; }

  // sans .section-title under the serif page H1; on phones it becomes the page title (serif) — see settings.css
  function head(id) { return h`<h2 class="section-title st-sec-title" id="st-h-${id}">${labelOf(id)}</h2>`; }
  function saveFoot(what, label) {
    return h`<div class="card-foot st-foot"><span class="spacer"></span><button type="button" class="btn btn-primary btn-sm" data-st-save="${what}">${label || 'Save changes'}</button></div>`;
  }
  function sw(key, on, label) { return h`<label class="switch"><input type="checkbox" data-st-switch="${key}" ${on ? KM.raw('checked') : ''} aria-label="${label}"><span></span></label>`; }
  function setRow(title, sub, control) {
    return h`<div class="st-row"><span class="li-body"><span class="st-row-title">${title}</span>${sub ? h`<span class="st-row-sub">${sub}</span>` : ''}</span><span class="st-row-ctl">${control}</span></div>`;
  }

  /* ---------------- 1. Studio profile ---------------- */
  function profile() {
    var s = SET.studio;
    return h`${head('profile')}
      <div class="card">
        <div class="card-body">
          <div class="st-logo">
            <span class="sb-mark st-mark" aria-hidden="true">K</span>
            <span class="li-body"><span class="st-row-title">Logo</span></span>
            <button type="button" class="btn btn-secondary btn-sm" data-toast="Pick a square logo — until then your K monogram is used" data-kind="info">Change</button>
          </div>
          <div class="form-grid cols-2">
            <label class="field"><span class="label">Studio name</span><input class="input" data-st-profile="name" value="${s.name}"></label>
            <label class="field"><span class="label">Tagline</span><input class="input" data-st-profile="tagline" value="${s.tagline}"></label>
            <label class="field"><span class="label">Phone (WhatsApp)</span><input class="input" type="tel" inputmode="tel" data-st-profile="phone" value="${s.phone}"></label>
            <label class="field"><span class="label">UPI ID</span><input class="input" data-st-profile="upi" value="${s.upi}" autocapitalize="off" spellcheck="false"></label>
            <label class="field span-all"><span class="label">Address</span><textarea class="textarea" rows="2" data-st-profile="address">${s.address}</textarea></label>
            <label class="field"><span class="label">Instagram</span><input class="input" data-st-profile="instagram" value="${s.instagram}" autocapitalize="off" spellcheck="false"></label>
            <label class="field"><span class="label">Bill footer</span><textarea class="textarea st-footer" rows="2" data-st-profile="footer">${s.footer}</textarea></label>
          </div>
        </div>
        ${saveFoot('Studio profile')}
      </div>`;
  }

  /* ---------------- 2. Services & prices (tap a row → st-price sheet; "Add service" is the page's primary) ---------------- */
  var CATS = ['Face', 'Skin', 'Hair', 'Hands & Feet', 'Body', 'Draping'];
  function priceRow(kind, i, title, meta) {
    var list = kind === 'svc' ? KM.data.services : kind === 'pkg' ? KM.data.makeupTypes : KM.data.addonTypes;
    return h`<button type="button" class="list-item" data-open="st-price" data-p-kind="${kind}" data-p-i="${i}">
      <span class="li-body"><span class="li-title">${title}</span>${meta ? h`<span class="li-meta">${meta}</span>` : ''}</span>
      <span class="li-trail num st-price-v">${F.inr(list[i].price)}</span></button>`;
  }
  function services() {
    return h`${head('services')}
      <section class="card" aria-labelledby="st-h-menu">
        <div class="card-head"><h3 class="card-title" id="st-h-menu">Salon menu</h3></div>
        <div class="list st-plist">${KM.data.services.map(function (s, i) { return priceRow('svc', i, s.name || 'New service', s.cat + ' · ' + s.mins + ' min'); })}</div>
      </section>
      <div class="grid-2 st-gap">

  var RENDER = { profile: profile, services: services, security: security, attendance: attendance, templates: templates, appearance: appearance, data: dataSec };
  function repaint(id) {
    var el = document.querySelector('.page.scr-settings [data-sec="' + id + '"]');
    if (el) { el.innerHTML = String(RENDER[id]()); }
  }

  KM.screen('settings', {
    title: 'Settings', icon: 'settings', role: 'owner',
    // the only thing you create here is a salon service — shown while you're on that section
    primary: function (r) { return r && r.query && r.query.section === 'services' ? { label: 'Add service', open: 'st-price', icon: 'plus', params: { kind: 'svc' } } : null; },
    render: function (ctx) {
      var active = secOf(ctx), index = !ctx.query.section;
      if (ctx.query.tpl && TPL.some(function (t) { return t.key === ctx.query.tpl; })) local.tpl = ctx.query.tpl;
      return h`<div class="st-wrap ${index ? 'is-index' : ''}">
        <header class="page-head st-head">
          <div class="page-head-text">
            ${KM.backLink('/settings', 'Settings', 'st-back')}
            <h1 class="page-title">Settings</h1>
          </div>
        </header>
        <div class="st-layout">
          <nav class="st-nav" aria-label="Settings sections">
            ${SECTIONS.map(function (s) {
              var cur = s.id === active;
              return h`<a class="st-nav-item ${cur ? 'is-active' : ''}" href="#/settings?section=${s.id}" ${cur ? KM.raw('aria-current="true"') : ''}>
                <span class="st-nav-label">${s.label}</span>${I('chevron-right', { cls: 'st-nav-chev' })}</a>`;
            })}
          </nav>
          <div class="st-content"><section class="st-sec" id="st-${active}" data-sec="${active}" aria-labelledby="st-h-${active}">${RENDER[active]()}</section></div>
        </div>
      </div>`;
    },
    mount: function (root, ctx) {
      if (ac) ac.abort();
      ac = new AbortController();
      var sig = ac.signal;
      if (ctx.query.section) setTimeout(function () { window.scrollTo(0, 0); }, 0);   // a new section starts at the top

      // keep the theme picker honest when the theme changes elsewhere (prototype bar, More sheet)
      if (themeObs) themeObs.disconnect();
      themeObs = new MutationObserver(function () { if (!selfTheme) local.themeMode = null; selfTheme = false; repaint('appearance'); });
      themeObs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

      root.addEventListener('click', function (e) {
        var t = e.target, b;
        if ((b = t.closest('[data-st-save]'))) { KM.toast(b.getAttribute('data-st-save') + ' saved', { kind: 'success' }); return; }
        if (t.closest('[data-st-pin-toggle]')) { local.pinForm = !local.pinForm; repaint('security'); var p = root.querySelector('[data-st-pin="a"]'); if (p) p.focus(); return; }
        if (t.closest('[data-st-pin-save]')) {
          var a = root.querySelector('[data-st-pin="a"]').value, c = root.querySelector('[data-st-pin="b"]').value;
          if (!/^\d{4}$/.test(a)) { KM.toast('PIN must be 4 digits', { kind: 'warn' }); return; }
          if (a !== c) { KM.toast('The two PINs don’t match', { kind: 'warn' }); return; }
          local.pinForm = false; local.pinChanged = T; repaint('security'); KM.toast('Owner PIN changed', { kind: 'success' }); return;
        }
        if (t.closest('[data-st-recapture]')) {
          KM.confirm({ title: 'Re-capture the studio WiFi?', body: 'Connect this phone to the studio WiFi first. Do this after changing your internet plan or router.', confirmLabel: 'Re-capture' }).then(function (ok) {
            if (!ok) return;
            SET.wifi.captured = T; SET.wifi.ip = '203.0.113.' + (10 + Math.floor(Math.random() * 40)); repaint('attendance');
            KM.toast('Studio WiFi captured · IP ' + SET.wifi.ip, { kind: 'success' });
          });
          return;
        }
        if ((b = t.closest('[data-st-tpl-pick]'))) { local.tpl = b.getAttribute('data-st-tpl-pick'); repaint('templates'); var sel = root.querySelector('[data-st-tpl-pick="' + local.tpl + '"]'); if (sel) sel.focus(); return; }
        if ((b = t.closest('[data-st-var]'))) {
          var key = b.getAttribute('data-st-for'), ta = root.querySelector('[data-st-tpl="' + key + '"]');
          var ins2 = '{' + b.getAttribute('data-st-var') + '}';
          var s0 = ta.selectionStart != null ? ta.selectionStart : ta.value.length, s1 = ta.selectionEnd != null ? ta.selectionEnd : s0;
          ta.value = ta.value.slice(0, s0) + ins2 + ta.value.slice(s1);
          ta.focus(); ta.setSelectionRange(s0 + ins2.length, s0 + ins2.length);
          ta.dispatchEvent(new Event('input', { bubbles: true })); return;
        }
        if ((b = t.closest('[data-st-tpl-reset]'))) {
          var k = b.getAttribute('data-st-tpl-reset'); SET.templates[k] = DEFAULT_TPL[k];
          var ta2 = root.querySelector('[data-st-tpl="' + k + '"]'); ta2.value = DEFAULT_TPL[k]; ta2.dispatchEvent(new Event('input', { bubbles: true }));
          KM.toast('Template reset to default', { kind: 'info' }); return;
        }
        if ((b = t.closest('[data-st-theme]'))) {
          var mode = b.getAttribute('data-st-theme');
          local.themeMode = mode; selfTheme = true;
          var th = mode === 'auto' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : mode;
          KM.setTheme(th);
          repaint('appearance');
          KM.toast(mode === 'auto' ? 'Theme follows your device' : (th === 'dark' ? 'Dark theme on' : 'Light theme on'), { kind: 'success' }); return;
        }
        if ((b = t.closest('[data-st-lang]'))) { SET.aiLang = b.getAttribute('data-st-lang'); repaint('appearance'); KM.toast('Kalai AI will reply in ' + b.textContent.trim(), { kind: 'success' }); return; }
        if (t.closest('[data-st-export]')) { KM.toast('Kalai_Makeover_' + F.date(T, 'dmy').replace(/ /g, '-') + '.xlsx downloaded · 7 sheets', { kind: 'success' }); return; }
        if (t.closest('[data-st-backup]')) { local.lastBackup = T + 'T' + KM.state.now.slice(11, 16); repaint('data'); KM.toast('Backed up to Google Drive', { kind: 'success' }); return; }
        if (t.closest('[data-st-signout]')) {
          KM.confirm({ title: 'Sign out everywhere?', body: 'All staff phones and your other devices will ask for a PIN again.', confirmLabel: 'Sign out all', danger: true }).then(function (ok) { if (ok) KM.toast('Signed out on 5 devices', { kind: 'success' }); });
        }
      }, { signal: sig });

      root.addEventListener('input', function (e) {
        var t = e.target, k;
        if ((k = t.getAttribute('data-st-profile'))) { SET.studio[k] = t.value; return; }
        if ((k = t.getAttribute('data-st-tpl'))) {
          SET.templates[k] = t.value;
          var prev = root.querySelector('[data-st-prev="' + k + '"]');
          if (prev) prev.innerHTML = String(h`${fill(t.value, samples()[k])}`);
        }
      }, { signal: sig });

      root.addEventListener('change', function (e) {
        var t = e.target, k;
        if ((k = t.getAttribute('data-st-switch'))) {
          var on = t.checked;
          if (k === 'wifi') SET.wifi.enforce = on;
          else if (k === 'aiMirror') { SET.aiMirror = on; repaint('appearance'); }
          else local[k] = on;
          var LBL = { pinOn: 'PIN on open', autoLock: 'Auto-lock', bio: 'Fingerprint unlock', gps: 'GPS check-in for events', wifi: 'WiFi-only punch-in', autoBackup: 'Daily backup', speak: 'Read answers aloud', aiMirror: 'Mirror my language' };
          KM.toast((LBL[k] || 'Setting') + (on ? ' on' : ' off'), { kind: on ? 'success' : 'info' });
          return;
        }
        if (t.hasAttribute('data-st-lockmin')) { local.lockMin = +t.value; KM.toast('Auto-lock after ' + t.value + ' min', { kind: 'success' }); return; }
        if (t.hasAttribute('data-st-late')) { SET.lateAfterMin = +t.value; KM.toast('Late after ' + t.value + ' minutes', { kind: 'success' }); return; }
        if (t.hasAttribute('data-st-half')) { local.halfDay = +t.value; KM.toast('Half day under ' + t.value + ' hours', { kind: 'success' }); return; }
        if ((k = t.getAttribute('data-st-shift'))) { var s = q.staff(k); if (s && t.value) s.shift = t.value; return; }
        if ((k = t.getAttribute('data-st-hours'))) { local[k] = t.value; }
      }, { signal: sig });
    },
    unmount: function () { if (ac) ac.abort(); ac = null; if (themeObs) themeObs.disconnect(); themeObs = null; }
  });

  /* =====================================================================================
     Sheet: st-price — add a salon service, or change a service / package / add-on price.
     params: kind ('svc' | 'pkg' | 'addon'), i (index; none = new service)
     ===================================================================================== */
  function priceTarget(p) {
    var kind = p.kind === 'pkg' || p.kind === 'addon' ? p.kind : 'svc';
    var list = kind === 'svc' ? KM.data.services : kind === 'pkg' ? KM.data.makeupTypes : KM.data.addonTypes;
    var i = p.i != null && p.i !== '' ? +p.i : -1;
    return { kind: kind, list: list, i: i, item: i >= 0 ? list[i] : null };
  }
  KM.overlay('st-price', {
    title: function (ctx) { var t = priceTarget(ctx.params); return t.item ? KM.esc(t.item.name.split(': ').pop() || 'Service') : 'New service'; },
    sub: function (ctx) { var t = priceTarget(ctx.params); if (!t.item || t.kind === 'svc') return ''; return t.kind === 'pkg' ? 'Makeup package' : KM.esc(t.item.name.split(': ')[0]) + ' add-on'; },
    kind: 'sheet', size: 'sm', role: 'owner',
    render: function (ctx) {
      var t = priceTarget(ctx.params), it = t.item || { name: '', cat: 'Skin', price: '', mins: 30 };
      if (t.kind !== 'svc') {
        return h`<label class="field"><span class="label">Price</span><span class="input-group"><span class="input-prefix">₹</span><input class="input num" inputmode="numeric" id="stp-price" value="${it.price}" autocomplete="off" autofocus></span></label>
          <p class="hint is-warn stp-err" id="stp-err" role="alert"></p>`;
      }
      return h`<div class="form-grid cols-2">
          <label class="field span-all"><span class="label">Service name</span><input class="input" id="stp-name" value="${it.name}" placeholder="e.g. Fruit Facial" autocomplete="off" ${t.item ? '' : KM.raw('autofocus')}></label>
          <label class="field span-all"><span class="label">Category</span><select class="select" id="stp-cat">${CATS.map(function (c) { return h`<option ${c === it.cat ? KM.raw('selected') : ''}>${c}</option>`; })}</select></label>
          <label class="field"><span class="label">Price</span><span class="input-group"><span class="input-prefix">₹</span><input class="input num" inputmode="numeric" id="stp-price" value="${it.price}" placeholder="0" autocomplete="off" ${t.item ? KM.raw('autofocus') : ''}></span></label>
          <label class="field"><span class="label">Time (minutes)</span><input class="input num" inputmode="numeric" id="stp-mins" value="${it.mins}" autocomplete="off"></label>
        </div>
        <p class="hint is-warn stp-err" id="stp-err" role="alert"></p>`;
    },
    footer: function (ctx) {
      var t = priceTarget(ctx.params);
      var removable = t.kind === 'svc' && t.item && local.newSvc[t.item.id];
      return h`${removable ? h`<button type="button" class="btn btn-secondary" data-stp-remove>Remove</button>` : h`<button type="button" class="btn btn-secondary" data-close>Cancel</button>`}
        <button type="button" class="btn btn-primary" data-stp-save>${t.item ? 'Save' : 'Add service'}</button>`;
    },
    mount: function (el, ctx) {
      var t = priceTarget(ctx.params);
      var err = el.querySelector('#stp-err');
      function val(id) { var n = el.querySelector('#' + id); return n ? n.value.trim() : ''; }
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-stp-remove]')) {
          KM.data.services.splice(KM.data.services.indexOf(t.item), 1); delete local.newSvc[t.item.id];
          KM.close(); repaint('services'); KM.toast('Service removed', { kind: 'info' }); return;
        }
        if (!e.target.closest('[data-stp-save]')) return;
        var price = +val('stp-price').replace(/\D/g, '');
        if (t.kind === 'svc' && !val('stp-name')) { err.textContent = 'Add the service name'; return; }
        if (!(price > 0)) { err.textContent = 'Add the price'; return; }
        if (t.kind === 'svc') {
          var mins = +val('stp-mins').replace(/\D/g, '') || 30;
          if (t.item) { t.item.name = val('stp-name'); t.item.cat = val('stp-cat'); t.item.price = price; t.item.mins = mins; }
          else {
            var id = 'svc' + Date.now().toString(36);
            KM.data.services.push({ id: id, name: val('stp-name'), cat: val('stp-cat'), price: price, mins: mins });
            local.newSvc[id] = true;
          }
        } else t.item.price = price;
        var name = t.kind === 'svc' ? val('stp-name') : t.item.name.split(': ').pop();
        KM.close(); repaint('services');
        KM.toast((t.item ? name + ' · ' : 'Added ' + name + ' · ') + F.inr(price), { kind: 'success' });
      });
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); var s = el.querySelector('[data-stp-save]'); if (s) s.click(); } });
    }
  });

  /* =====================================================================================
     Sheet: st-staff — one person's PIN: show / reset, and whether they can sign in.
     ===================================================================================== */
  function staffBody(s) {
    var shown = local.revealed[s.id], on = local.staffOn[s.id] !== false;
    return h`<div class="st-rows">
      <div class="st-row"><span class="li-body"><span class="st-row-title">PIN</span><span class="st-row-sub num st-pin-val">${shown ? s.pin : '••••'}</span></span>
        <span class="st-row-ctl"><button type="button" class="btn btn-ghost btn-sm" data-sts-reveal aria-pressed="${shown ? 'true' : 'false'}">${shown ? 'Hide' : 'Show'}</button></span></div>
      <div class="st-row"><span class="li-body"><span class="st-row-title">Can sign in</span></span>
        <span class="st-row-ctl"><label class="switch"><input type="checkbox" data-sts-on ${on ? KM.raw('checked') : ''} aria-label="${s.name} can sign in"><span></span></label></span></div>
    </div>`;
  }
  KM.overlay('st-staff', {
    title: function (ctx) { var s = q.staff(ctx.params.staff); return s ? KM.esc(s.name) : 'Staff'; },
    sub: function (ctx) { var s = q.staff(ctx.params.staff); return s ? KM.esc(s.role) : ''; },
    kind: 'sheet', size: 'sm', role: 'owner',
    render: function (ctx) { var s = q.staff(ctx.params.staff); return s ? staffBody(s) : h`<p class="subtle">Not found.</p>`; },
    footer: function () { return h`<button type="button" class="btn btn-secondary" data-sts-reset>Reset PIN</button><button type="button" class="btn btn-primary" data-close>Done</button>`; },
    mount: function (el, ctx) {
      var s = q.staff(ctx.params.staff); if (!s) return;
      function paint() { el.querySelector('.ov-body').innerHTML = String(staffBody(s)); repaint('security'); }
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-sts-reveal]')) { local.revealed[s.id] = !local.revealed[s.id]; paint(); return; }
        if (e.target.closest('[data-sts-reset]')) {
          KM.confirm({ title: 'Reset ' + s.name.split(' ')[0] + '’s PIN?', body: 'Her old PIN stops working right away. The new PIN is sent to her on WhatsApp.', confirmLabel: 'Reset PIN' }).then(function (ok) {
            if (!ok) return;
            s.pin = String(1000 + Math.floor(Math.random() * 9000)); local.revealed[s.id] = false; paint();
            KM.toast('New PIN sent to ' + s.name.split(' ')[0] + ' on WhatsApp', { kind: 'success' });
          });
        }
      });
      el.addEventListener('change', function (e) {
        if (!e.target.matches('[data-sts-on]')) return;
        var on = e.target.checked; local.staffOn[s.id] = on; repaint('security');
        KM.toast(s.name.split(' ')[0] + (on ? ' can sign in again' : ' can’t sign in now'), { kind: on ? 'success' : 'info' });
      });
    }
  });
})();

</script>
<script data-screen="staff">
/* ===== screens/staff.js ===== */
/* Staff portal — #/staff (my day: one punch button), #/staff-schedule (my week + my bookings),
   #/staff-me (?tab=attendance|payslips|profile), overlays "punch" (Studio WiFi check → punch in/out, role any)
   and "leave-request" (the attendance tab's contextual button).
   Built for beauticians on the salon floor: big type, one obvious action, and strictly NO business totals,
   revenue, expenses, client spend or other people's pay. Clean pass: "Walk-in bill" is the shell's contextual
   button (not tiles on the page), each booking's venue/notes/team show once, badges only for exceptions. */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  /* ---------------- helpers ---------------- */
  function me() { return KM.state.user || q.staff('meena'); }
  function today() { return KM.state.today; }
  function thisMonth() { return KM.state.today.slice(0, 7); }
  function nowHM() { return KM.state.now.slice(11, 16); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function mins(t) { var p = String(t || '0:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function dur(m) { m = Math.max(0, Math.round(m)); var a = Math.floor(m / 60), b = m % 60; return a ? a + 'h' + (b ? ' ' + b + 'm' : '') : b + 'm'; }
  function first(name) { return String(name).split(' ')[0]; }
  function fmtDays(n) { return n % 1 ? n.toFixed(1) : String(n); }
  function mapUrl(v) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v + ', Chennai'); }
  function attRec(sid, date) { return KM.data.attendance.filter(function (a) { return a.staff === sid && a.date === date; })[0] || null; }
  function custName(cid) { var c = KM.data.customers.filter(function (x) { return x.id === cid; })[0]; return c ? c.name : 'Walk-in'; }
  function statusOf(sid, d) { var a = attRec(sid, d); return a ? a.status : (d === today() ? 'not-in' : (d < today() ? 'none' : 'future')); }

  /** Every function (event day) I'm on, from today on, sorted. No prices are exposed. */
  function assignments(sid, includePast) {
    var out = [];
    q.bookings().forEach(function (b) {
      if (b.state === 'cancelled' || b.state === 'enquiry' || b.team.indexOf(sid) < 0) return;
      b.fns.forEach(function (f) {
        if (includePast || f.date >= today()) {
          var mk = b.makeup.filter(function (m) { return m.fn === f.name; })[0];
          out.push({ b: b, f: f, look: mk ? mk.name : (b.makeup[0] && b.makeup[0].name) });
        }
      });
    });
    return out.sort(function (a, b) { return (a.f.date + a.f.call).localeCompare(b.f.date + b.f.call); });
  }

  function punchState(sid) {
    var a = attRec(sid, today());
    if (!a || !a.in || (a.status === 'event' && mins(a.in) > mins(nowHM()))) return { kind: 'none', a: a };
    if (!a.out) return { kind: 'in', a: a, since: mins(nowHM()) - mins(a.in) };
    return { kind: 'done', a: a };
  }
  function doPunch(sid, kind) {
    var before = attRec(sid, today()), snap = before ? Object.assign({}, before) : null;
    var s = q.staff(sid);
    var a = q.punch(sid, kind);
    var undo = { label: 'Undo', fn: function () {
      var cur = attRec(sid, today());
      if (snap && cur) { Object.keys(cur).forEach(function (k) { delete cur[k]; }); Object.assign(cur, snap); }
      else if (!snap && cur) KM.data.attendance.splice(KM.data.attendance.indexOf(cur), 1);
      KM.emit('data:changed', 'attendance');
    } };
    if (kind === 'in') {
      var late = mins(a.in) - mins(s.shift);
      KM.toast(a.status === 'late' ? 'Punched in at ' + F.time(a.in) + ' · ' + dur(late) + ' after shift start' : 'Punched in at ' + F.time(a.in) + ' · have a lovely day!', { kind: a.status === 'late' ? 'warn' : 'success', action: undo });
    } else {
      KM.toast('Punched out at ' + F.time(a.out) + ' · ' + dur(mins(a.out) - mins(a.in)) + ' today. Nandri!', { kind: 'success', action: undo });
    }
    return a;
  }

  var ATT = function (k) { return q.ATT[k] || { label: k === 'none' ? 'No record' : 'Upcoming', badge: 'neutral', short: '' }; };
  var CELL_ORDER = ['present', 'late', 'half', 'event', 'leave', 'absent'];
  function cellLabel(sid, d) {
    var a = attRec(sid, d), st = statusOf(sid, d), s = q.staff(sid);
    var label = ATT(st).label;
    if (a && a.status === 'late') label = 'Late by ' + (mins(a.in) - mins(s.shift)) + ' min';
    return F.date(d, 'dow') + ': ' + label + (a && a.in ? ' · in ' + F.time(a.in) + (a.out ? ', out ' + F.time(a.out) : '') : '');
  }
  function monthCal(sid, ym) {
    var dim = D.daysInMonth(ym), lead = (D.parse(ym + '-01').getDay() + 6) % 7, cells = [], i;
    for (i = 0; i < lead; i++) cells.push(h`<span class="st-mc-blank" aria-hidden="true"></span>`);
    for (i = 1; i <= dim; i++) {
      var d = ym + '-' + pad(i), st = statusOf(sid, d);
      var txt = cellText(st);
      cells.push(h`<span class="st-mc-day is-${st} ${d === today() ? 'is-today' : ''}" role="img" aria-label="${cellLabel(sid, d)}" title="${cellLabel(sid, d)}"><i>${i}</i><b>${txt}</b></span>`);
    }
    return h`<div class="st-mc">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (x) { return h`<span class="st-mc-dow" aria-hidden="true">${x}</span>`; })}${cells}</div>`;
  }
  // a normal day is a quiet tile with no letter; only the exceptions carry a letter and a tone
  function cellText(st) { return st === 'none' ? '·' : st === 'future' || st === 'present' ? '' : ATT(st).short; }
  function legend() {
    return h`<div class="st-legend">${CELL_ORDER.map(function (k) { return h`<span><b class="st-key is-${k}" aria-hidden="true">${cellText(k)}</b>${q.ATT[k].label}</span>`; })}</div>`;
  }

  /* ================= #/staff — my day ================= */
  var wifiState = 'on'; // last result of the studio-WiFi check (the punch overlay updates it)
  function punchCard(s) {
    var p = punchState(s.id), a = p.a, w = KM.data.settings.wifi;
    var past = mins(nowHM()) - mins(s.shift);
    var off = wifiState === 'off';
    var act = function (kind) { return off ? KM.raw('data-open="punch"') : KM.raw('data-st-punch="' + kind + '"'); };
    var btn, status, meta;
    if (p.kind === 'none') {
      btn = h`<button class="st-punch-btn do-in ${off ? 'is-blocked' : ''}" ${act('in')} aria-describedby="st-punch-status">${I('fingerprint')}<span>Punch in</span></button>`;
      status = h`<b>Not punched in yet</b>`;
      meta = a && a.status === 'event' ? 'Event duty · check in at the venue from ' + F.time(a.in)
        : past > 0 ? 'Shift started ' + F.time(s.shift) + ', ' + dur(past) + ' ago' : 'Shift starts ' + F.time(s.shift);
    } else if (p.kind === 'in') {
      btn = h`<button class="st-punch-btn do-out ${off ? 'is-blocked' : ''}" ${act('out')} aria-describedby="st-punch-status">${I('fingerprint')}<span>Punch out</span></button>`;
      status = h`<b>In since ${F.time(a.in)}</b> · ${dur(p.since)}`;
      var late = mins(a.in) - mins(s.shift);
      meta = a.status === 'late' ? 'Shift ' + F.time(s.shift) + ' · ' + late + ' min late today' : a.status === 'event' ? 'Checked in for event duty' : 'Shift ' + F.time(s.shift);
    } else {
      btn = h`<div class="st-punch-btn is-done" role="img" aria-label="Punched out for today">${I('check')}<span>Done</span></div>`;
      status = h`<b>${F.time(a.in)} – ${F.time(a.out)}</b> · ${dur(mins(a.out) - mins(a.in))}`;
      meta = 'See you tomorrow';
    }
    return h`<section class="card st-punch is-${p.kind}" aria-labelledby="st-punch-h">
      <div class="card-body">
        <h2 class="sr-only" id="st-punch-h">Attendance</h2>
        <div class="st-punch-stage">${btn}</div>
        <div class="st-punch-status" id="st-punch-status">${status}</div>
        <div class="st-punch-meta">${meta}</div>
        ${p.kind === 'done' ? '' : h`<div class="st-wifi ${off ? 'is-off' : ''}" role="status">${I(off ? 'wifi-off' : 'wifi')}<span>${off ? h`Not on ${w.name}` : 'Studio WiFi'}</span><button class="link" data-open="punch">Check again</button></div>`}
      </div>
    </section>`;
  }

  function eventsCard(s) {
    var all = assignments(s.id);
    var soon = all.filter(function (x) { return x.f.date === today() || x.f.date === D.add(today(), 1); });
    var next = all.filter(function (x) { return x.f.date > D.add(today(), 1); })[0];
    // a venue (and its Map button) is shown once — the next function at the same place just says so
    var seenVenue = {};
    return h`<section class="card st-events" aria-labelledby="st-ev-h">
      <div class="card-head"><h2 class="card-title" id="st-ev-h">My events</h2><a class="link" href="#/staff-schedule">Schedule</a></div>
      ${soon.length ? h`<div class="list">${soon.map(function (x) {
        var firstAt = !seenVenue[x.b.venue]; seenVenue[x.b.venue] = true;
        return h`<div class="list-item">
          <span class="li-body"><span class="li-title">${x.b.client} · ${x.f.name}</span>
            <span class="li-meta">${F.rel(x.f.date)} · call ${F.time(x.f.call)} · ${firstAt ? x.b.venue : 'same venue'}</span></span>
          ${firstAt ? h`<a class="btn btn-secondary btn-sm" href="${mapUrl(x.b.venue)}" target="_blank" rel="noopener" aria-label="Map to ${x.b.venue}">Map</a>` : ''}</div>`;
      })}</div>`
        : h`<div class="card-body"><p class="subtle small">${next ? 'Nothing today or tomorrow. Next: ' + next.b.client + ' · ' + next.f.name + ', ' + F.date(next.f.date, 'dow') + '.' : 'No events assigned yet.'}</p></div>`}
    </section>`;
  }
  function clientsCard(s) {
    var visits = q.servicesBy(s.id, q.range('today')).sort(function (a, b) { return a.time.localeCompare(b.time); });
    return h`<section class="card st-clients" aria-labelledby="st-cl-h">
      <div class="card-head"><h2 class="card-title" id="st-cl-h">My clients today</h2></div>
      ${visits.length ? h`<div class="list">${visits.map(function (v) {
        return h`<div class="list-item">
          <div class="li-body"><div class="li-title">${custName(v.cust)}</div><div class="li-meta">${v.items.map(function (i) { return i.name; }).join(', ')}</div></div>
          <span class="li-trail subtle xsmall">${F.time(v.time)}</span></div>`;
      })}</div>` : h`<div class="card-body"><p class="subtle small">No clients yet today.</p></div>`}
    </section>`;
  }
  function noteCard(s) {
    var mine = assignments(s.id).filter(function (x) { return x.f.date === today(); })[0];
    var leave = Math.max(0, mins(mine ? mine.f.call : '00:00') - 30);
    var msg = mine
      ? first(mine.b.client) + '’s ' + mine.f.name.toLowerCase() + ' is today — please leave the studio by ' + F.time(pad(Math.floor(leave / 60)) + ':' + pad(leave % 60)) + '. Pack the airbrush kit and the kemp set. Lunch is on me 💛'
      : 'Diwali rush starts next week — please keep leave requests for after 10 Nov. Thank you for the lovely work this month! 💛';
    return h`<section class="card st-note" aria-labelledby="st-note-h">
      <div class="card-head"><h2 class="card-title" id="st-note-h">From Kalai</h2><span class="card-sub st-head-right">8:10 AM</span></div>
      <div class="card-body"><p class="st-note-text">${msg}</p></div>
    </section>`;
  }

  KM.screen('staff', {
    title: 'My day', icon: 'home-2', role: 'staff',
    // punching is this page's own job (the big button); the shell's contextual button is for adding a client
    primary: { label: 'Walk-in bill', open: 'walkin', icon: 'receipt' },
    render: function () {
      var s = me();
      return h`
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title">Vanakkam, ${first(s.name)}</h1>
            <p class="page-sub">${F.date(today(), 'full')}</p>
          </div>
        </header>
        <div class="st-home">
          <div class="st-col">${punchCard(s)}${noteCard(s)}</div>
          <div class="st-col">${eventsCard(s)}${clientsCard(s)}</div>
        </div>`;
    }
  });

  /* ================= #/staff-schedule ================= */
  function dayTile(d, s, all) {
    var a = attRec(s.id, d), isT = d === today(), past = d < today();
    var hasEv = all.some(function (x) { return x.f.date === d; });
    // past days only say something when the day was not a normal one
    var line = isT ? (a && a.in ? 'In ' + F.time(a.in) : 'Shift ' + F.time(s.shift)) : past ? (!a ? 'No record' : a.status === 'present' ? '' : ATT(a.status).label) : '';
    var tone = (past || isT) && a && (a.status === 'late' || a.status === 'absent') ? 'is-' + a.status : '';
    return h`<div class="st-day ${isT ? 'is-today' : ''}">
      <span class="st-day-dow">${isT ? 'Today' : D.dow(d)}</span>
      <span class="st-day-num">${+d.slice(8)}${hasEv ? h`<span class="st-day-dot" role="img" aria-label="Event day"></span>` : ''}</span>
      ${line ? h`<span class="st-day-line ${tone}">${line}</span>` : ''}
      ${q.isMuhurtham(d) ? h`<span class="st-day-muh">Muhurtham</span>` : ''}
    </div>`;
  }
  /** One card per booking: its function days as rows, then venue / team / extras / notes once. */
  function bookingCard(b, fns, s) {
    var mates = b.team.filter(function (id) { return id !== s.id; }).map(q.firstName);
    var extras = b.addons.map(function (a) { return a.name.replace(/^Misc: /, ''); });
    var isToday = fns.some(function (x) { return x.f.date === today(); });
    return h`<article class="card st-as" aria-labelledby="st-as-${b.id}">
      <div class="card-head"><h3 class="card-title" id="st-as-${b.id}">${b.client}</h3>${isToday ? h`<span class="badge badge-accent st-head-right">Today</span>` : ''}</div>
      <div class="list">${fns.map(function (x) {
        return h`<div class="list-item">
          <span class="st-date" aria-hidden="true"><span>${D.dow(x.f.date)}</span><b>${+x.f.date.slice(8)}</b><span>${F.date(x.f.date, 'mon')}</span></span>
          <span class="li-body"><span class="li-title">${x.f.name}<span class="sr-only"> · ${F.date(x.f.date, 'long')}</span></span>
            <span class="li-meta">Call ${F.time(x.f.call)} · starts ${F.time(x.f.time)} · ${x.look}</span></span></div>`;
      })}</div>
      <div class="card-body st-as-more">
        <div class="kv">
          <div class="kv-row"><span>Venue</span><span>${b.venue} · <a class="link" href="${mapUrl(b.venue)}" target="_blank" rel="noopener">Map</a></span></div>
          <div class="kv-row"><span>With</span><span>${mates.length ? mates.join(', ') : 'Just you'}</span></div>
          ${extras.length ? h`<div class="kv-row"><span>Also</span><span>${extras.join(' · ')}</span></div>` : ''}
        </div>
        ${b.notes ? h`<p class="st-as-note">${b.notes}</p>` : ''}
      </div>
    </article>`;
  }
  KM.screen('staff-schedule', {
    title: 'My schedule', icon: 'calendar-event', role: 'staff',
    // nothing to create on a schedule: the top bar keeps the staff app's everyday action, same as My day
    primary: { label: 'Walk-in bill', open: 'walkin', icon: 'receipt' },
    render: function () {
      var s = me(), all = assignments(s.id), T = today();
      var mon = D.add(T, -((D.parse(T).getDay() + 6) % 7)), week = [], i;
      for (i = 0; i < 7; i++) week.push(D.add(mon, i));
      var books = [], by = {};
      all.forEach(function (x) { if (!by[x.b.id]) { by[x.b.id] = []; books.push(x.b); } by[x.b.id].push(x); });
      return h`
        <header class="page-head">
          <div class="page-head-text"><h1 class="page-title">My schedule</h1></div>
        </header>
        <section class="section" aria-labelledby="st-week-h">
          <div class="section-head"><h2 class="section-title" id="st-week-h">This week</h2></div>
          <div class="hscroll st-week">${week.map(function (d) { return dayTile(d, s, all); })}</div>
        </section>
        <section class="section" aria-labelledby="st-up-h">
          <div class="section-head"><h2 class="section-title" id="st-up-h">My bookings</h2></div>
          ${books.length ? h`<div class="st-as-list">${books.map(function (b) { return bookingCard(b, by[b.id], s); })}</div>`
            : h`<div class="card"><div class="empty"><div class="empty-title">No events assigned yet</div><div class="empty-body">When Kalai adds you to a booking it shows up here with the call time and venue.</div></div></div>`}
        </section>`;
    }
  });

  /* ================= #/staff-me ================= */
  var ME_TABS = [['attendance', 'Attendance'], ['payslips', 'Payslips'], ['profile', 'Profile']];
  var leaveReqs = [];
  var REASONS = ['Personal', 'Health', 'Family function', 'Other'];

  /* The month: one calendar with its totals in one line (no KPI boxes repeating it), my pending leave requests,
     and the last few punches with their exact times. "Request leave" is the page's contextual button (a sheet). */
  function meAttendance(s) {
    var ym = thisMonth(), m = q.attendanceMonth(s.id, ym), c = m.counts;
    var recent = KM.data.attendance.filter(function (a) { return a.staff === s.id && a.date <= today(); })
      .sort(function (a, b) { return b.date.localeCompare(a.date); }).slice(0, 5);
    var mine = leaveReqs.filter(function (r) { return r.staff === s.id; });
    var sum = [fmtDays(m.worked) + ' days worked', c.late ? c.late + ' late' : '', c.absent ? c.absent + ' absent' : '', s.leave + ' leave left'].filter(Boolean).join(' · ');
    var usual = 'Studio WiFi'; // the normal way in — only other ways (event check-in, corrected by Kalai…) are worth a mention
    return h`
      <div class="st-me-grid">
        <section class="card" aria-labelledby="st-cal-h">
          <div class="card-head st-cal-head"><h2 class="card-title" id="st-cal-h">${D.monthName(ym, true)}</h2><span class="card-sub st-head-right">${sum}</span></div>
          <div class="card-body">${monthCal(s.id, ym)}${legend()}</div>
        </section>
        <div class="st-me-col">
          ${mine.length ? h`<section class="card" aria-labelledby="st-req-h">
            <div class="card-head"><h2 class="card-title" id="st-req-h">Leave requests</h2></div>
            <div class="list">${mine.map(function (r) {
              return h`<div class="list-item">
                <span class="li-body"><span class="li-title">${F.date(r.date, 'long')}</span><span class="li-meta">${r.reason}${r.note ? ' · ' + r.note : ''}</span></span>
                <span class="status is-warning">Waiting for Kalai</span></div>`;
            })}</div>
          </section>` : ''}
          <section class="card" aria-labelledby="st-rec-h">
            <div class="card-head"><h2 class="card-title" id="st-rec-h">Recent punches</h2></div>
            <div class="list">${recent.map(function (a) {
              var ex = a.status === 'late' ? 'warning' : a.status === 'absent' ? 'danger' : '';
              var times = a.in ? F.time(a.in) + ' – ' + (a.out ? F.time(a.out) : 'still in') : ex ? 'No punch' : ATT(a.status).label;
              return h`<div class="list-item">
                <span class="li-body"><span class="li-title">${F.date(a.date, 'dow')}</span><span class="li-meta">${times}${a.via && a.via !== usual ? ' · ' + a.via : ''}</span></span>
                ${ex ? h`<span class="status is-${ex}">${ATT(a.status).label}</span>` : ''}</div>`;
            })}</div>
          </section>
        </div>
      </div>`;
  }

  function mePayslips(s) {
    var list = KM.data.payslips.filter(function (p) { return p.staff === s.id; }).sort(function (a, b) { return b.month.localeCompare(a.month); });
    var cur = thisMonth(), hasCur = list.some(function (p) { return p.month === cur; });
    var lastDay = cur + '-' + D.daysInMonth(cur);
    return h`<section class="card st-slips" aria-label="My payslips">
      <div class="list">
        ${!hasCur ? h`<div class="list-item"><span class="li-body"><span class="li-title">${D.monthName(cur, true)}</span><span class="li-meta">In progress · ready after ${F.date(lastDay)}</span></span></div>` : ''}
        ${list.map(function (p) {
          var paid = p.status === 'paid';
          return h`<button class="list-item" data-open="payslip" data-p-staff="${s.id}" data-p-month="${p.month}">
            <span class="li-body"><span class="li-title">${D.monthName(p.month, true)}</span>
              <span class="li-meta">${paid ? 'Paid ' + F.date(p.paidOn) + ' · ' + (p.mode === 'cash' ? 'Cash' : 'UPI') : 'Ready · Kalai will pay soon'}</span></span>
            <span class="money num">${F.inr(p.net)}</span></button>`;
        })}
      </div>
    </section>`;
  }

  function meProfile(s) {
    return h`<div class="st-me-grid">
      <section class="card" aria-labelledby="st-pf-h">
        <div class="card-head"><h2 class="card-title" id="st-pf-h">My details</h2></div>
        <div class="card-body">
          <div class="kv">
            <div class="kv-row"><span>Name</span><span>${s.name}</span></div>
            <div class="kv-row"><span>Role</span><span>${s.role} · ${s.type}</span></div>
            <div class="kv-row"><span>Phone</span><span>${F.phone(s.phone)}</span></div>
            <div class="kv-row"><span>Joined</span><span>${F.date(s.joined, 'dmy')}</span></div>
            <div class="kv-row"><span>Shift starts</span><span>${F.time(s.shift)}</span></div>
            <div class="kv-row"><span>Aadhaar</span><span class="num">${s.kyc}</span></div>
            <div class="kv-row"><span>Bank</span><span class="num">${s.bank}</span></div>
          </div>
        </div>
        <div class="card-foot"><a class="link" href="#/login">Lock app</a></div>
      </section>
      <section class="card" aria-labelledby="st-pin-h">
        <div class="card-head"><h2 class="card-title" id="st-pin-h">Change PIN</h2></div>
        <form class="card-body stack" data-st-pin novalidate>
          <label class="field"><span class="label">Current PIN</span><input class="input st-pin-input" name="cur" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="••••"></label>
          <label class="field"><span class="label">New PIN</span><input class="input st-pin-input" name="new" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4 digits"></label>
          <label class="field"><span class="label">Repeat new PIN</span><input class="input st-pin-input" name="rep" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password" placeholder="4 digits"></label>
          <div class="hint" data-st-pin-msg role="status"></div>
          <button class="btn btn-primary btn-block" type="submit">Save new PIN</button>
        </form>
      </section>
    </div>`;
  }

  KM.screen('staff-me', {
    // one name everywhere (tab title, H1, sidebar): "Attendance & pay"
    title: 'Attendance & pay', icon: 'clock-hour-4', role: 'staff',
    // asking for a day off belongs with the attendance month; payslips & profile keep the everyday Walk-in bill
    // (never the generic "+ New")
    primary: function (r) {
      var tab = (r && r.query && r.query.tab) || 'attendance';
      return tab === 'attendance' ? { label: 'Request leave', open: 'leave-request', icon: 'calendar-off' } : { label: 'Walk-in bill', open: 'walkin', icon: 'receipt' };
    },
    render: function (ctx) {
      var s = me();
      var tab = ME_TABS.some(function (t) { return t[0] === ctx.query.tab; }) ? ctx.query.tab : 'attendance';
      var body = tab === 'payslips' ? mePayslips(s) : tab === 'profile' ? meProfile(s) : meAttendance(s);
      return h`
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title">Attendance & pay</h1>
            <p class="page-sub">Private to you and Kalai</p>
          </div>
        </header>
        <nav class="tabs" aria-label="Attendance & pay sections">${ME_TABS.map(function (t) {
          return h`<a class="tab ${t[0] === tab ? 'is-active' : ''}" href="#/staff-me?tab=${t[0]}" ${t[0] === tab ? KM.raw('aria-current="page"') : ''}>${t[1]}</a>`;
        })}</nav>
        ${body}`;
    }
  });

  /* ---------------- delegated events (registered once; scoped to my screens) ---------------- */
  document.addEventListener('click', function (e) {
    var root = e.target.closest('.scr-staff, .scr-staff-me');
    if (!root) return;
    var t;
    if ((t = e.target.closest('[data-st-punch]'))) { doPunch(me().id, t.getAttribute('data-st-punch')); return; }
  });
  document.addEventListener('input', function (e) {
    if (e.target.classList && e.target.classList.contains('st-pin-input')) e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.matches('.scr-staff-me [data-st-pin]')) {
      e.preventDefault();
      var s = me(), msg = f.querySelector('[data-st-pin-msg]');
      var cur = f.elements.cur.value, nw = f.elements['new'].value, rep = f.elements.rep.value;
      var err = cur !== s.pin ? 'Current PIN doesn’t match.' : !/^\d{4}$/.test(nw) ? 'New PIN must be 4 digits.' : nw !== rep ? 'The two new PINs don’t match.' : nw === cur ? 'Pick a PIN different from the current one.' : /^(\d)\1{3}$|^1234$|^0000$/.test(nw) ? 'Too easy to guess — avoid 1234 or repeated digits.' : '';
      msg.className = 'hint ' + (err ? 'is-warn' : 'is-good');
      msg.textContent = err || '';
      if (err) return;
      s.pin = nw;
      f.reset();
      KM.toast('PIN changed · use it next time you open the app', { kind: 'success' });
    }
  });
  KM.on('data:changed', function () { var id = KM.parse().id; if (id === 'staff' || id === 'staff-me' || id === 'staff-schedule') KM.refresh(); });

  /* ================= overlay: leave-request (staff asks Kalai for a day off) ================= */
  KM.overlay('leave-request', {
    title: 'Request leave', kind: 'sheet', size: 'sm', role: 'staff',
    render: function () {
      return h`<form class="stack st-leave" data-st-leave novalidate>
        <label class="field"><span class="label">Date</span><input class="input" type="date" name="date" min="${D.add(today(), 1)}" value="${D.add(today(), 2)}" required></label>
