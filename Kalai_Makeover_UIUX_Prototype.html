<!DOCTYPE html>
<!--
  Kalai Makeover — clickable UI/UX prototype (mock data, no backend).
  Open this file in Chrome / Edge. Click the small PROTOTYPE pill (bottom-right) to switch Owner/Staff, Light/Dark,
  preview at phone size, or jump to any screen. URL params: ?theme=light|dark&role=owner|staff  ·  routes: #/home, #/bookings, …
-->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kalai Makeover · Prototype</title>
<meta name="description" content="Clickable UI/UX prototype of the Kalai Makeover studio app — bookings, customers, money, academy, jewel rental, team and staff portal (mock data).">
<meta name="theme-color" content="#f7f6f3">
<script>
  (function () {
    try {
      var p = new URLSearchParams(location.search).get('theme') || localStorage.getItem('km-theme');
      document.documentElement.setAttribute('data-theme', p === 'dark' ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
/* ===== core/00-tokens.css ===== */
/* Design tokens — "Atelier" system, clean edition. Light (warm white, one gold accent) is the default; dark is warm noir.
   Flat surfaces: hairline borders, no glows, no gradients on controls. Screens use these tokens only — never raw hex. */
:root {
  --font-display: 'Cormorant Garamond', 'Playfair Display', Georgia, serif;
  --font-ui: 'Plus Jakarta Sans', 'Noto Sans Tamil', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-ta: 'Noto Sans Tamil', 'Plus Jakarta Sans', system-ui, sans-serif;

  --fs-2xs: 10.5px;
  --fs-xs: 11.5px;
  --fs-sm: 12.5px;
  --fs-md: 14px;
  --fs-lg: 16px;
  --fs-xl: 19px;
  --fs-2xl: 24px;
  --fs-3xl: 32px;
  --fs-hero: 44px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-7: 32px;
  --space-8: 48px;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 22px;
  --radius-pill: 999px;

  --sidebar-w: 252px;
  --sidebar-rail: 76px;
  --topbar-h: 64px;
  --bottomnav-h: 68px;
  --page-max: 1320px;

  --z-sidebar: 40;
  --z-topbar: 30;
  --z-bottomnav: 45;
  --z-overlay: 80;
  --z-confirm: 90;
  --z-toast: 100;
  --z-proto: 110;

  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur-1: 120ms;
  --dur-2: 220ms;
  --dur-3: 360ms;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0b08;
  --bg-elev: #14100b;
  --surface-1: #1a150f;
  --surface-2: #221b13;
  --surface-3: #2c2319;
  --border: rgba(232, 200, 140, 0.11);
  --border-strong: rgba(232, 200, 140, 0.22);
  --text-1: #f5eee3;
  --text-2: #cdbfab;
  --text-3: #968a78;
  --text-on-accent: #1d1406;

  --accent: #e2b65c;
  --accent-strong: #f1cc78;
  --accent-soft: rgba(226, 182, 92, 0.13);
  --accent-ink: #edc87a;
  --accent-grad: linear-gradient(135deg, #f3d48c 0%, #e2b65c 45%, #c8953a 100%);
  --rose: #ec8fa6;
  --rose-soft: rgba(236, 143, 166, 0.13);

  --success: #5ccf97;
  --success-soft: rgba(92, 207, 151, 0.13);
  --warning: #f3bb4a;
  --warning-soft: rgba(243, 187, 74, 0.14);
  --danger: #f27474;
  --danger-soft: rgba(242, 116, 116, 0.14);
  --info: #7cb0f2;
  --info-soft: rgba(124, 176, 242, 0.14);

  --chart-1: #3987e5;
  --chart-2: #d95926;
  --chart-3: #199e70;
  --chart-4: #c98500;
  --chart-5: #d55181;
  --chart-6: #9085e9;
  --chart-accent: #e2b65c;
  --chart-muted: #4a4134;
  --chart-grid: rgba(232, 200, 140, 0.08);
  --chart-axis: rgba(232, 200, 140, 0.18);

  --shadow-1: none;
  --shadow-2: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-3: 0 24px 60px rgba(0, 0, 0, 0.55);
  --ring: 0 0 0 3px rgba(226, 182, 92, 0.45);
  --glow: none;
  --scrim: rgba(6, 4, 2, 0.62);
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #f7f6f3;
  --bg-elev: #ffffff;
  --surface-1: #ffffff;
  --surface-2: #f5f3ef;
  --surface-3: #ebe7e0;
  --border: rgba(30, 24, 14, 0.09);
  --border-strong: rgba(30, 24, 14, 0.17);
  --text-1: #1c1813;
  --text-2: #57504a;
  --text-3: #8a8279;
  --text-on-accent: #1d1406;

  --accent: #d4a54a;
  --accent-strong: #c4932f;
  --accent-soft: rgba(212, 165, 74, 0.14);
  --accent-ink: #855b0e;
  --accent-grad: linear-gradient(135deg, #e9c477 0%, #d4a54a 55%, #bf8e33 100%);
  --rose: #b8456a;
  --rose-soft: rgba(184, 69, 106, 0.10);

  --success: #1d8a55;
  --success-soft: rgba(29, 138, 85, 0.10);
  --warning: #a86d08;
  --warning-soft: rgba(214, 150, 20, 0.14);
  --danger: #c43b3b;
  --danger-soft: rgba(196, 59, 59, 0.09);
  --info: #2c68b8;
  --info-soft: rgba(44, 104, 184, 0.09);

  --chart-1: #2a78d6;
  --chart-2: #eb6834;
  --chart-3: #1baf7a;
  --chart-4: #eda100;
  --chart-5: #e87ba4;
  --chart-6: #6250d6;
  --chart-accent: #b8862b;
  --chart-muted: #ddd3c4;
  --chart-grid: rgba(70, 48, 16, 0.08);
  --chart-axis: rgba(70, 48, 16, 0.20);

  --shadow-1: none;
  --shadow-2: 0 8px 24px rgba(40, 30, 14, 0.08);
  --shadow-3: 0 24px 60px rgba(40, 30, 14, 0.16);
  --ring: 0 0 0 3px rgba(196, 147, 47, 0.35);
  --glow: none;
  --scrim: rgba(28, 24, 19, 0.38);
}


/* ===== core/10-base.css ===== */
/* Base: reset, type, app shell (sidebar / topbar / bottom nav / page), overlays, toasts, prototype bar. Mobile-first. */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + 12px); }
body {
  font-family: var(--font-ui);
  font-size: var(--fs-md);
  line-height: 1.5;
  color: var(--text-1);
  background: var(--bg);
  background-image: var(--glow);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: var(--radius-sm); }
::selection { background: var(--accent-soft); }
[hidden] { display: none !important; }
.ti { line-height: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ---------- App frame ---------- */
.app { min-height: 100vh; }
.main { min-width: 0; }

/* ---------- Sidebar (tablet rail / desktop full) ---------- */
.sidebar { display: none; }
@media (min-width: 640px) {
  .sidebar {
    display: flex; flex-direction: column;
    position: fixed; inset: 0 auto 0 0; width: var(--sidebar-rail);
    background: var(--bg-elev);
    border-right: 1px solid var(--border);
    z-index: var(--z-sidebar);
    transition: width var(--dur-2) var(--ease);
  }
  .main { margin-left: var(--sidebar-rail); }
}
@media (min-width: 1024px) {
  .sidebar { width: var(--sidebar-w); }
  .main { margin-left: var(--sidebar-w); transition: margin-left var(--dur-2) var(--ease); }
  .app.is-collapsed .sidebar { width: var(--sidebar-rail); }
  .app.is-collapsed .main { margin-left: var(--sidebar-rail); }
}
.sb-brand { display: flex; align-items: center; gap: 12px; padding: 18px 18px 14px; min-height: var(--topbar-h); }
.sb-mark {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--accent-grad); color: var(--text-on-accent);
  font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1;
}
.sb-brand-text { min-width: 0; display: flex; flex-direction: column; }
.sb-brand-name, .sb-brand-sub { display: block; }
.sb-brand-name { font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: .2px; line-height: 1.1; white-space: nowrap; }
.sb-brand-sub { font-size: var(--fs-2xs); color: var(--text-3); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; margin-top: 3px; }
.sb-nav { flex: 1; overflow-y: auto; padding: 6px 12px 12px; scrollbar-width: none; }
.sb-nav::-webkit-scrollbar { display: none; }
.sb-group + .sb-group { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.sb-group-label { display: none; }
.sb-item {
  display: flex; align-items: center; gap: 12px;
  min-height: 40px; padding: 0 10px; margin: 1px 0;
  border-radius: var(--radius-md);
  color: var(--text-2); font-weight: 500; font-size: var(--fs-md);
  white-space: nowrap; position: relative;
  transition: background var(--dur-1), color var(--dur-1);
}
.sb-item .ti { font-size: 20px; width: 24px; text-align: center; flex: 0 0 auto; }
.sb-item:hover { background: var(--surface-2); color: var(--text-1); }
.sb-item.is-active { background: var(--surface-2); color: var(--text-1); font-weight: 600; }
.sb-item.is-active .ti { color: var(--accent-ink); }
.sb-badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--surface-3); color: var(--text-2); font-size: var(--fs-2xs); font-weight: 700; display: inline-grid; place-items: center; }
.sb-foot { padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.sb-user { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: var(--radius-md); }
.sb-user:hover { background: var(--surface-2); }
.sb-user-name { font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; }
.sb-user-role { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.sb-collapse { display: none; }
@media (min-width: 1024px) { .sb-collapse { display: flex; } }
/* rail mode: tablet always, desktop when collapsed */
@media (min-width: 640px) and (max-width: 1023.98px) {
  .sb-brand-text, .sb-group-label, .sb-item span, .sb-badge, .sb-user-text, .sb-collapse span { display: none; }
  .sb-brand { justify-content: center; padding: 14px 0; }
  .sb-item { justify-content: center; padding: 0; }
  .sb-nav { padding: 6px 10px; }
  .sb-user { justify-content: center; }
}
@media (min-width: 1024px) {
  .app.is-collapsed .sb-brand-text, .app.is-collapsed .sb-group-label, .app.is-collapsed .sb-item span,
  .app.is-collapsed .sb-badge, .app.is-collapsed .sb-user-text, .app.is-collapsed .sb-collapse span { display: none; }
  .app.is-collapsed .sb-brand { justify-content: center; padding: 14px 0; }
  .app.is-collapsed .sb-item, .app.is-collapsed .sb-collapse { justify-content: center; padding: 0; }
  .app.is-collapsed .sb-user { justify-content: center; }
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: var(--z-topbar);
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--border);
}
@media (min-width: 1024px) { .topbar { padding: 0 32px; } }
.tb-mobile-brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.tb-mobile-brand .sb-mark { width: 34px; height: 34px; border-radius: 10px; font-size: 20px; }
.tb-title { font-weight: 700; font-size: var(--fs-lg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title-sub { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
@media (min-width: 640px) { .tb-mobile-brand { display: none; } }
.tb-search {
  display: none; align-items: center; gap: 10px;
  flex: 1; max-width: 460px; height: 42px; padding: 0 12px 0 14px;
  border-radius: var(--radius-pill);
  background: var(--surface-1); border: 1px solid var(--border);
  color: var(--text-3); font-size: var(--fs-sm); text-align: left;
}
.tb-search:hover { border-color: var(--border-strong); color: var(--text-2); }
.tb-search .ti { font-size: 18px; }
.tb-search > span:not(.kbd) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tb-search .kbd { margin-left: auto; }
@media (min-width: 640px) { .tb-search { display: flex; } }
.tb-spacer { flex: 1; }
@media (max-width: 639.98px) { .tb-spacer { display: none; } }
/* the ONE create control on desktop/tablet: "+ <this page's main action>" + a chevron for everything else (mobile uses the FAB) */
.tb-new { display: none; }
@media (min-width: 640px) { .tb-new { display: inline-flex; align-items: stretch; height: 38px; border-radius: var(--radius-pill); background: var(--accent); color: var(--text-on-accent); flex: 0 0 auto; } }
.tb-new > button { display: inline-flex; align-items: center; gap: 6px; padding: 0 14px 0 12px; font-weight: 700; font-size: var(--fs-sm); color: inherit; border-radius: var(--radius-pill) 0 0 var(--radius-pill); white-space: nowrap; }
.tb-new > button:only-child { border-radius: var(--radius-pill); padding: 0 16px 0 12px; }
.tb-new > button + button { padding: 0 10px 0 8px; border-left: 1px solid color-mix(in srgb, var(--text-on-accent) 18%, transparent); border-radius: 0 var(--radius-pill) var(--radius-pill) 0; }
.tb-new > button:hover { background: var(--accent-strong); }
.tb-new .ti { font-size: 17px; }
.tb-icon {
  position: relative; width: 42px; height: 42px; border-radius: var(--radius-pill);
  display: inline-grid; place-items: center; color: var(--text-2); flex: 0 0 auto;
}
.tb-icon:hover { background: var(--surface-2); color: var(--text-1); }
.tb-icon .ti { font-size: 21px; }
.tb-icon .dot { position: absolute; top: 9px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.tb-search-m { display: inline-grid; }
@media (min-width: 640px) { .tb-search-m { display: none; } }

/* ---------- Page ---------- */
.page {
  max-width: var(--page-max); margin: 0 auto;
  padding: 16px 16px calc(var(--bottomnav-h) + 36px + env(safe-area-inset-bottom));
  outline: none;
  animation: pageIn var(--dur-3) var(--ease);
}
.page:focus, .page:focus-visible { box-shadow: none; } /* focused on navigation for screen readers; no visual ring around the whole page */
@media (min-width: 640px) { .page { padding: 24px 24px 56px; } }
@media (min-width: 1024px) { .page { padding: 28px 32px 64px; } }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-bottomnav);
  height: calc(var(--bottomnav-h) + env(safe-area-inset-bottom));
  padding: 6px 6px env(safe-area-inset-bottom);
  display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: color-mix(in srgb, var(--bg-elev) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(16px);
  -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--border);
}
@media (min-width: 640px) { .bottomnav { display: none; } }
.bn-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  height: 100%; min-height: 48px; color: var(--text-3); font-size: var(--fs-2xs); font-weight: 600; position: relative;
}
.bn-item .ti { font-size: 23px; }
.bn-item.is-active { color: var(--accent-ink); }
.bn-item .bn-badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px; background: var(--danger); color: #fff; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; }
.bn-fab {
  justify-self: center; width: 58px; height: 58px; margin-top: -26px;
  border-radius: 20px; display: grid; place-items: center;
  background: var(--accent); color: var(--text-on-accent);
  box-shadow: 0 0 0 5px var(--bg-elev);
  transition: transform var(--dur-1) var(--ease);
}
.bn-fab .ti { font-size: 28px; }
.bn-fab:active { transform: scale(.94); }

/* ---------- Overlays: sheet (mobile bottom sheet / desktop right drawer), modal, full ---------- */
.ov { position: fixed; inset: 0; z-index: var(--z-overlay); display: flex; }
.ov-backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fadeIn var(--dur-2) var(--ease); }
.ov-panel {
  position: relative; display: flex; flex-direction: column;
  background: var(--surface-1); color: var(--text-1);
  box-shadow: var(--shadow-3);
  max-height: 100%; width: 100%;
}
.ov-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--border); }
.ov-head-text { flex: 1; min-width: 0; }
.ov-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.15; }
.ov-sub { color: var(--text-3); font-size: var(--fs-sm); margin-top: 3px; }
.ov-x { width: 40px; height: 40px; border-radius: var(--radius-pill); display: grid; place-items: center; color: var(--text-2); flex: 0 0 auto; margin: -4px -6px 0 0; }
.ov-x:hover { background: var(--surface-2); color: var(--text-1); }
.ov-x .ti { font-size: 20px; }
.ov-body { flex: 1; overflow-y: auto; padding: 18px; overscroll-behavior: contain; }
.ov-foot { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; background: var(--surface-1); }
.ov-foot .btn { flex: 1; }
.ov-handle { display: none; }

/* mobile: everything except "full" is a bottom sheet */
@media (max-width: 639.98px) {
  .ov-sheet:not(.ov-panel), .ov-modal:not(.ov-panel), .ov-drawer:not(.ov-panel) { align-items: flex-end; }
  .ov-sheet .ov-panel, .ov-modal .ov-panel, .ov-drawer .ov-panel {
    max-height: 92vh; border-radius: 24px 24px 0 0;
    animation: sheetUp var(--dur-3) var(--ease);
  }
  .ov-sheet .ov-handle, .ov-modal .ov-handle, .ov-drawer .ov-handle { display: block; width: 40px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 8px auto 0; }
  .ov-full .ov-panel { height: 100%; animation: sheetUp var(--dur-3) var(--ease); }
}
@media (min-width: 640px) {
  .ov-sheet:not(.ov-panel), .ov-drawer:not(.ov-panel) { justify-content: flex-end; }
  .ov-sheet .ov-panel, .ov-drawer .ov-panel { width: 520px; height: 100%; border-left: 1px solid var(--border); animation: drawerIn var(--dur-3) var(--ease); }
  .ov-sheet .ov-panel.size-lg, .ov-drawer .ov-panel.size-lg { width: 680px; }
  .ov-sheet .ov-panel.size-sm, .ov-drawer .ov-panel.size-sm { width: 420px; }
  .ov-modal:not(.ov-panel), .ov-full:not(.ov-panel) { align-items: center; justify-content: center; padding: 24px; }
  .ov-modal .ov-panel { width: 560px; max-height: calc(100vh - 48px); border-radius: var(--radius-xl); border: 1px solid var(--border); animation: popIn var(--dur-2) var(--ease); }
  .ov-modal .ov-panel.size-sm { width: 420px; }
  .ov-modal .ov-panel.size-lg { width: 820px; }
  .ov-full .ov-panel { width: min(1080px, 100%); height: min(860px, 100%); border-radius: var(--radius-xl); border: 1px solid var(--border); animation: popIn var(--dur-2) var(--ease); }
}
@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: .4; } }
@keyframes drawerIn { from { transform: translateX(40px); opacity: .4; } }
@keyframes popIn { from { transform: scale(.97); opacity: 0; } }

/* confirm dialog (JS-only, not routed) */
.cf { position: fixed; inset: 0; z-index: var(--z-confirm); display: grid; place-items: center; padding: 20px; }
.cf .ov-backdrop { position: absolute; inset: 0; }
.cf-card { position: relative; width: min(400px, 100%); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 22px; box-shadow: var(--shadow-3); animation: popIn var(--dur-2) var(--ease); }
.cf-title { font-weight: 700; font-size: var(--fs-lg); }
.cf-body { color: var(--text-2); margin-top: 6px; font-size: var(--fs-sm); }
.cf-actions { display: flex; gap: 10px; margin-top: 18px; }
.cf-actions .btn { flex: 1; }

/* ---------- Toasts ---------- */
.toasts {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: var(--z-toast);
  bottom: calc(var(--bottomnav-h) + 16px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
  width: min(440px, calc(100% - 24px));
}
@media (min-width: 640px) { .toasts { bottom: 24px; } }
.toast {
  pointer-events: auto; width: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: var(--radius-md);
  background: var(--text-1); color: var(--bg);
  box-shadow: var(--shadow-2); font-size: var(--fs-sm); font-weight: 600;
  animation: toastIn var(--dur-2) var(--ease);
}
.toast .ti { font-size: 19px; }
.toast-success .ti { color: var(--success); }
.toast-warn .ti { color: var(--warning); }
.toast-error .ti { color: var(--danger); }
.toast-info .ti { color: var(--info); }
html[data-theme="dark"] .toast-success .ti { color: #1f8f5a; }
html[data-theme="dark"] .toast-error .ti { color: #c33d3d; }
html[data-theme="dark"] .toast-warn .ti { color: #a86d08; }
html[data-theme="dark"] .toast-info .ti { color: #2c68b8; }
.toast-msg { flex: 1; }
.toast-action { font-weight: 800; color: inherit; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }
.toast.is-leaving { opacity: 0; transform: translateY(8px); transition: all var(--dur-2) var(--ease); }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }

/* ---------- Prototype toolbar (not part of the product design) ---------- */
.proto {
  position: fixed; z-index: var(--z-proto); right: 16px; bottom: 16px;
  display: flex; align-items: center; gap: 4px; padding: 5px;
  border-radius: var(--radius-pill);
  background: #111; color: #f2f2f2;
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  font-size: 12px; font-family: var(--font-ui);
}
.proto-tag { padding: 0 8px 0 10px; font-weight: 800; letter-spacing: .12em; font-size: 10px; color: #f1cc78; }
.proto-btn { height: 32px; padding: 0 11px; border-radius: var(--radius-pill); color: #ddd; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.proto-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
.proto-btn.is-on { background: #f1cc78; color: #1d1406; }
.proto-btn .ti { font-size: 16px; }
.proto-seg { display: inline-flex; background: rgba(255, 255, 255, 0.07); border-radius: var(--radius-pill); padding: 2px; }
.proto-seg .proto-btn { height: 28px; }
/* collapsed to one small pill until clicked, so it never sits on top of the design */
.proto { padding: 3px; opacity: .92; }
.proto > :not(.proto-mini) { display: none; }
.proto.is-open { opacity: 1; padding: 5px; }
.proto.is-open > :not(.proto-mini) { display: inline-flex; }
.proto-mini { height: 30px; font-size: 11px; letter-spacing: .06em; }
.proto.is-open .proto-mini .proto-mini-label { display: none; }
@media (max-width: 639.98px) {
  .proto { bottom: calc(var(--bottomnav-h) + 14px + env(safe-area-inset-bottom)); right: 10px; }
  .proto-mini .proto-mini-label { display: none; }
  .proto.is-open { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 20px); border-radius: 18px; }
}
html.is-embed .proto, html.no-chrome .proto { display: none; }
/* while a panel is open, keep the prototype bar off its footer buttons */
body:has(.ov) .proto { display: none; }

.ov-phone .ov-body { display: grid; place-items: center; padding: 12px; }
.phone-frame { width: 390px; max-width: 100%; height: min(844px, calc(100vh - 170px)); border-radius: 44px; border: 10px solid #0a0a0a; box-shadow: 0 0 0 2px #333, var(--shadow-3); overflow: hidden; background: #000; margin: 0 auto; }
.phone-frame iframe { width: 100%; height: 100%; border: 0; display: block; }

/* A page with its own gold action (record action, Save, empty-state create) keeps the only gold button:
   the top-bar "+ New" goes quiet there. */
.app:has(#km-page .btn-primary) .tb-new { background: var(--surface-1); color: var(--text-1); box-shadow: inset 0 0 0 1px var(--border-strong); }
.app:has(#km-page .btn-primary) .tb-new > button:hover { background: var(--surface-2); }
.app:has(#km-page .btn-primary) .tb-new > button + button { border-left-color: var(--border-strong); }


/* ===== core/20-components.css ===== */
/* Shared components. Screens compose these; screen CSS is namespaced under .scr-<id>. */

/* ---------- Layout ---------- */
/* Page head = title + (optional) one plain line + (optional) ONE control such as a view switch.
   Create actions are never here — the shell's "+ New" (desktop) / FAB (mobile) owns them. */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin-bottom: 24px; }
.page-head-text { flex: 1 1 260px; min-width: 0; }
.page-eyebrow { display: none; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.08; letter-spacing: .2px; }
.page-sub { color: var(--text-3); font-size: var(--fs-sm); margin-top: 6px; }
.page-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (min-width: 1024px) { .page-title { font-size: 34px; } }
@media (max-width: 639.98px) {
  .page-head { margin-bottom: 18px; }
  .page-title { font-size: 28px; }
}

.section { margin-top: 32px; }
.section:first-child { margin-top: 0; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-title { font-size: var(--fs-lg); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-title > .ti, .card-title > .ti { display: none; } /* headings are words, not icon + words */
.section-head .link, .card-head .link { margin-left: auto; }

.grid { display: grid; gap: 16px; }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.span-2 { grid-column: span 1; }
@media (min-width: 760px) { .span-2 { grid-column: span 2; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.stack-lg { display: flex; flex-direction: column; gap: 20px; }
.row { display: flex; align-items: center; gap: 10px; }
.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.split { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.spacer { flex: 1; }
.hscroll { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px 4px; scroll-snap-type: x proximity; scroll-padding-inline: 16px; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; flex: 0 0 auto; }
@media (min-width: 640px) { .hscroll { margin: 0; padding: 2px 0 4px; scroll-padding-inline: 0; } }

/* ---------- Surfaces ---------- */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  min-width: 0;
}
.card-head { display: flex; align-items: center; gap: 10px; padding: 18px 20px 0; }
.card-title { font-weight: 700; font-size: var(--fs-md); display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: var(--fs-xs); color: var(--text-3); }
.card-body { padding: 14px 20px 20px; }
.card-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.card.is-flush .card-body { padding: 0; }
.card.is-accent { background: var(--surface-1); }
.card.is-interactive { cursor: pointer; transition: border-color var(--dur-1); }
.card.is-interactive:hover { border-color: var(--border-strong); }
.panel { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; }
.divider { height: 1px; background: var(--border); margin: 14px 0; border: 0; }

/* ---------- Text ---------- */
.display { font-family: var(--font-display); font-weight: 700; letter-spacing: .2px; }
.h1 { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1.1; }
.h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.15; }
.h3 { font-size: var(--fs-lg); font-weight: 700; }
.eyebrow { font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); }
.muted { color: var(--text-2); }
.subtle { color: var(--text-3); }
.small { font-size: var(--fs-sm); }
.xsmall { font-size: var(--fs-xs); }
.strong { font-weight: 700; }
.num { font-variant-numeric: tabular-nums; }
.money { font-weight: 700; white-space: nowrap; }
.money.is-due { color: var(--danger); }
.money.is-good { color: var(--success); }
.ta { font-family: var(--font-ta); }
.truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.link { color: var(--accent-ink); font-weight: 600; font-size: var(--fs-sm); display: inline-flex; align-items: center; gap: 4px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
.kbd { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--border-strong); font-size: var(--fs-2xs); font-weight: 700; color: var(--text-3); background: var(--surface-2); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 44px; padding: 0 18px; border-radius: var(--radius-pill);
  font-weight: 700; font-size: var(--fs-md); white-space: nowrap;
  border: 1px solid transparent;
  transition: background var(--dur-1), border-color var(--dur-1), transform var(--dur-1), color var(--dur-1);
  user-select: none;
}
.btn .ti { font-size: 19px; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: var(--text-on-accent); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-secondary { background: var(--surface-1); border-color: var(--border-strong); color: var(--text-1); }
.btn-secondary:hover { background: var(--surface-2); }
.btn-ghost { color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text-1); }
.btn-danger { background: var(--danger-soft); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.btn-success { background: var(--success-soft); color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, transparent); }
/* WhatsApp: a quiet outlined button with a green glyph; the solid green fill is kept for the one "Send on WhatsApp" step inside a sheet (.btn-wa.is-solid) */
.btn-wa { background: var(--surface-1); border-color: var(--border-strong); color: #1a9a4c; }
.btn-wa:hover { background: color-mix(in srgb, #1fae57 8%, var(--surface-1)); }
html[data-theme="dark"] .btn-wa { color: #4cc77f; }
.btn-wa.is-solid, .ov .ov-foot .btn-wa { background: #1fae57; border-color: transparent; color: #fff; }
.btn-wa.is-solid:hover, .ov .ov-foot .btn-wa:hover { background: #1a9a4c; }
.btn-sm { height: 34px; padding: 0 13px; font-size: var(--fs-sm); }
.btn-sm .ti { font-size: 16px; }
.btn-lg { height: 52px; padding: 0 24px; font-size: var(--fs-lg); }
.btn-icon { width: 44px; padding: 0; }
.btn-icon.btn-sm { width: 34px; }
.btn-block { width: 100%; }
.btn[disabled], .btn.is-disabled { opacity: .45; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: var(--radius-pill); display: inline-grid; place-items: center; color: var(--text-2); flex: 0 0 auto; }
.icon-btn:hover { background: var(--surface-2); color: var(--text-1); }
.icon-btn .ti { font-size: 20px; }
.fab { position: fixed; right: 20px; bottom: 24px; width: 60px; height: 60px; border-radius: 20px; background: var(--accent); color: var(--text-on-accent); display: grid; place-items: center; box-shadow: var(--shadow-2); }

/* ---------- Chips, badges, status ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border-radius: var(--radius-pill);
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap;
  transition: background var(--dur-1), border-color var(--dur-1), color var(--dur-1);
}
.chip:hover { border-color: var(--border-strong); color: var(--text-1); }
.chip .ti { font-size: 16px; }
.chip.is-selected { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent-ink); }
.chip.is-selected::before { content: '\2713'; font-weight: 800; font-size: 12px; }
.chip.no-check.is-selected::before { content: none; }
.chip-count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--surface-3); color: var(--text-2); font-size: var(--fs-2xs); font-weight: 700; display: inline-grid; place-items: center; }
.chip.is-selected .chip-count { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--accent-ink); }
.chip-price { color: var(--text-3); font-weight: 600; font-size: var(--fs-xs); }
.chip.is-selected .chip-price { color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px; border-radius: var(--radius-pill); font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.badge .ti { font-size: 13px; }
.badge-success { background: var(--success-soft); color: var(--success); }
.badge-warning { background: var(--warning-soft); color: var(--warning); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-info { background: var(--info-soft); color: var(--info); }
.badge-neutral { background: var(--surface-3); color: var(--text-2); }
.badge-accent { background: var(--accent-soft); color: var(--accent-ink); }
.badge-rose { background: var(--rose-soft); color: var(--rose); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); white-space: nowrap; }
.status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: 0 0 auto; }
.status.is-success::before { background: var(--success); }
.status.is-warning::before { background: var(--warning); }
.status.is-danger::before { background: var(--danger); }
.status.is-info::before { background: var(--info); }
.status.is-accent::before { background: var(--accent); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); font-size: var(--fs-2xs); font-weight: 700; }

/* ---------- Avatars & lists ---------- */
.avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; flex: 0 0 auto; font-weight: 700; font-size: 14px; color: var(--text-1); background: var(--surface-3); letter-spacing: .02em; }
.avatar-sm { width: 30px; height: 30px; font-size: 11px; }
.avatar-lg { width: 64px; height: 64px; font-size: 22px; }
.avatar-xl { width: 84px; height: 84px; font-size: 28px; }
.avatar.tone-1 { background: color-mix(in srgb, var(--chart-1) 22%, var(--surface-2)); color: color-mix(in srgb, var(--chart-1) 70%, var(--text-1)); }
.avatar.tone-2 { background: color-mix(in srgb, var(--chart-2) 22%, var(--surface-2)); color: color-mix(in srgb, var(--chart-2) 70%, var(--text-1)); }
.avatar.tone-3 { background: color-mix(in srgb, var(--chart-3) 22%, var(--surface-2)); color: color-mix(in srgb, var(--chart-3) 70%, var(--text-1)); }
.avatar.tone-4 { background: color-mix(in srgb, var(--chart-4) 22%, var(--surface-2)); color: color-mix(in srgb, var(--chart-4) 70%, var(--text-1)); }
.avatar.tone-5 { background: color-mix(in srgb, var(--chart-5) 22%, var(--surface-2)); color: color-mix(in srgb, var(--chart-5) 70%, var(--text-1)); }
.avatar.tone-6 { background: color-mix(in srgb, var(--chart-6) 22%, var(--surface-2)); color: color-mix(in srgb, var(--chart-6) 70%, var(--text-1)); }
.avatar.is-gold { background: var(--accent); color: var(--text-on-accent); }
.avatar-stack { display: inline-flex; }
.avatar-stack .avatar { border: 2px solid var(--surface-1); margin-left: -8px; }
.avatar-stack .avatar:first-child { margin-left: 0; }

.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); min-width: 0; }
.list-item:last-child { border-bottom: 0; }
a.list-item, button.list-item { width: 100%; text-align: left; border-radius: 0; }
a.list-item:hover .li-title, button.list-item:hover .li-title { color: var(--accent-ink); }
.card .list { padding: 0 18px; }
.li-lead { flex: 0 0 auto; }
.li-body { flex: 1; min-width: 0; }
.li-title { display: block; font-weight: 600; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-meta { display: block; font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-trail { flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.li-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); flex: 0 0 auto; }
.li-icon .ti { font-size: 18px; }

.kv { display: flex; flex-direction: column; }
.kv-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: var(--fs-sm); }
.kv-row:last-child { border-bottom: 0; }
.kv-row > :first-child { color: var(--text-2); }
.kv-row > :last-child { font-weight: 600; text-align: right; }
.kv-row.is-total { border-top: 1px solid var(--border-strong); border-bottom: 0; margin-top: 4px; padding-top: 10px; font-size: var(--fs-md); }
.kv-row.is-total > :last-child { font-weight: 800; }

/* ---------- Data ---------- */
/* KPI row = ONE panel split by hairlines (not a wall of separate boxes). Max 4 per page. */
.kpi-row {
  display: grid; gap: 1px; grid-template-columns: repeat(2, minmax(0, 1fr));
  background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden;
}
@media (min-width: 900px) { .kpi-row { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); } }
.kpi { background: var(--surface-1); padding: 16px 18px; min-width: 0; position: relative; border: 0; border-radius: 0; }
.kpi-row:has(> .kpi:nth-child(3):last-child) > .kpi:last-child { grid-column: 1 / -1; }
@media (min-width: 900px) { .kpi-row:has(> .kpi:nth-child(3):last-child) > .kpi:last-child { grid-column: auto; } }
.kpi-label { font-size: var(--fs-xs); color: var(--text-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi-label .ti { display: none; }
.kpi-value { font-size: 22px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 1100px) { .kpi-value { font-size: 25px; } }
.kpi-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: var(--fs-xs); color: var(--text-3); min-width: 0; }
.kpi-delta { font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.kpi-delta.up { color: var(--success); }
.kpi-delta.down { color: var(--danger); }
.kpi-delta.flat { color: var(--text-3); }
.kpi-spark { position: absolute; right: 12px; top: 14px; width: 70px; height: 26px; opacity: .9; }
a.kpi:hover, button.kpi:hover { background: var(--surface-2); }
button.kpi { text-align: left; width: 100%; }
.hero-figure { font-size: 36px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
@media (min-width: 1024px) { .hero-figure { font-size: 42px; } }

.progress { height: 8px; border-radius: 8px; background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; border-radius: 8px; background: var(--accent); }
.progress.is-success > span { background: var(--success); }

  q.students = function () { return KM.data.students.map(function (s) { return q.student(s.id); }); };
  /* One rule for academy fees everywhere (Academy, Money, Today, assistant): a balance falls due when the course ends
     or 31 days after the last instalment, whichever comes first. On hold = reminders paused: never late, not in dues. */
  q.studentDueBy = function (s) { var end = D.add(s.start, s.weeks * 7), next = D.add(s.lastPaid || s.start, 31); return end < next ? end : next; };
  q.studentLate = function (s) { return s.due > 0 && s.status !== 'on-hold' && s.status !== 'dropped' && D.diff(KM.state.today, q.studentDueBy(s)) > 0; };
  q.jewelStats = function (id) {
    var j = q.jewel(id);
    if (!j) return null;
    var rs = KM.data.rentals.filter(function (r) { return r.jewel === id; }).sort(function (a, b) { return b.from.localeCompare(a.from); });
    var income = sum(rs, function (r) { return r.fee + (r.damage || 0); });
    var active = rs.filter(function (r) { return r.status === 'out'; })[0] || null;
    var overdue = active && D.diff(T, active.due) > 0 ? D.diff(T, active.due) : 0;
    return Object.assign({}, j, { rentals: rs, income: income, roi: Math.round(income / j.cost * 100), active: active, overdueDays: overdue,
      status: active ? (overdue ? 'overdue' : 'out') : 'available', times: rs.length });
  };
  q.jewelList = function () { return KM.data.jewels.map(function (j) { return q.jewelStats(j.id); }).filter(Boolean); };

  /* ---- money ---- */
  q.expensesIn = function (r) { return KM.data.expenses.filter(function (e) { return inRange(e.date, r); }); };
  q.collections = function (r) {
    // every rupee received in the range, by stream and mode
    var rows = [];
    KM.data.visits.forEach(function (v) {
      if (!inRange(v.date, r) || !v.received) return;
      if (v.paid.cash) rows.push({ stream: 'salon', mode: 'cash', amount: v.paid.cash, date: v.date });
      if (v.paid.upi) rows.push({ stream: 'salon', mode: 'upi', amount: v.paid.upi, date: v.date });
    });
    KM.data.bookings.forEach(function (b) { b.payments.forEach(function (p) { if (inRange(p.date, r)) rows.push({ stream: 'bookings', mode: p.mode, amount: p.amount, date: p.date }); }); });
    KM.data.students.forEach(function (s) { s.payments.forEach(function (p) { if (inRange(p.date, r)) rows.push({ stream: 'academy', mode: p.mode, amount: p.amount, date: p.date }); }); });
    KM.data.rentals.forEach(function (x) { if (inRange(x.from, r)) rows.push({ stream: 'jewels', mode: x.mode === 'cash' ? 'cash' : 'upi', amount: x.fee + (x.damage || 0), date: x.from }); });
    return rows;
  };
  q.STREAMS = [
    { key: 'salon', label: 'Salon', slot: 1, icon: 'scissors' },
    { key: 'bookings', label: 'Bridal & events', slot: 2, icon: 'sparkles' },
    { key: 'academy', label: 'Academy', slot: 3, icon: 'school' },
    { key: 'jewels', label: 'Jewel rental', slot: 4, icon: 'diamond' }
  ];
  q.pnl = function (p) {
    var r = typeof p === 'object' ? p : q.range(p);
    var rows = q.collections(r);
    var by = {}; q.STREAMS.forEach(function (s) { by[s.key] = 0; });
    rows.forEach(function (x) { by[x.stream] += x.amount; });
    var income = sum(rows, function (x) { return x.amount; });
    var cash = sum(rows.filter(function (x) { return x.mode === 'cash'; }), function (x) { return x.amount; });
    var ex = q.expensesIn(r);
    var expense = sum(ex, function (e) { return e.amount; });
    var wages = sum(KM.data.bookings, function (b) { return sum(b.wages.filter(function () { return b.functions.some(function (f) { return inRange(f.date, r); }); }), function (w) { return w.amount; }); });
    var byCat = {};
    ex.forEach(function (e) { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
    if (wages) byCat['Event staff wages'] = (byCat['Event staff wages'] || 0) + wages;
    return { range: r, income: income, byStream: by, cash: cash, upi: income - cash, expense: expense + wages, expenseCats: byCat,
      profit: income - expense - wages, billCount: q.visitsIn(r).length, margin: income ? Math.round((income - expense - wages) / income * 100) : 0 };
  };
  /** Months with complete records (expenses, payroll and bills are tracked from Aug 2026). Trends never show earlier,
      half-recorded months — they would fake 100% margins. */
  q.TRACKED_FROM = '2026-08';
  q.monthly = function (n) {
    var out = [], ym = T.slice(0, 7);
    for (var i = n - 1; i >= 0; i--) {
      var m = D.addMonths(ym, -i);
      if (m < q.TRACKED_FROM) continue;
      var r = q.range(m);
      if (m === ym) r = q.range('month');
      var p = q.pnl(r);
      out.push({ month: m, label: D.monthName(m), income: p.income, expense: p.expense, profit: p.profit, byStream: p.byStream });
    }
    return out;
  };
  q.dues = function () {
    var out = [];
    KM.data.visits.forEach(function (v) {
      if (v.due > 0) { var c = KM.data.customers.filter(function (x) { return x.id === v.cust; })[0];
        out.push({ kind: 'salon', id: v.id, ref: c.id, name: c.name, phone: c.phone, amount: v.due, date: v.date, what: v.items.map(function (i) { return i.name; }).join(', '), age: D.diff(T, v.date), icon: 'scissors' }); }
    });
    q.bookings().forEach(function (b) {
      if (b.due > 0 && b.state !== 'enquiry' && b.state !== 'cancelled') out.push({ kind: 'booking', id: b.id, ref: b.id, name: b.client, phone: b.phone, amount: b.due, date: b.start,
        what: b.title + ' makeup', age: Math.max(0, D.diff(T, b.end)), upcoming: !b.isPast, icon: 'sparkles' });
    });
    q.students().forEach(function (s) {
      if (s.due <= 0 || s.status === 'dropped' || s.status === 'on-hold') return;
      var by = q.studentDueBy(s), late = q.studentLate(s);
      out.push({ kind: 'academy', id: s.id, ref: s.id, name: s.name, phone: s.phone, amount: s.due, date: by, what: s.courseName + ' fee', age: late ? D.diff(T, by) : 0, upcoming: !late, icon: 'school' });
    });
    return out.sort(function (a, b) { return (b.upcoming ? 0 : 1) - (a.upcoming ? 0 : 1) || b.age - a.age; });
  };
  q.overdueDues = function () { return q.dues().filter(function (d) { return !d.upcoming; }); };

  /* ---- services ---- */
  q.topServices = function (r) {
    var stats = {};
    q.visitsIn(r).forEach(function (v) { v.items.forEach(function (it) { var s = stats[it.name] = stats[it.name] || { name: it.name, count: 0, revenue: 0 }; s.count++; s.revenue += it.price; }); });
    return Object.keys(stats).map(function (k) { return stats[k]; }).sort(function (a, b) { return b.revenue - a.revenue; });
  };

  /* ---- staff ---- */
  q.attendanceOn = function (date) {
    return KM.data.staff.map(function (s) {
      var a = KM.data.attendance.filter(function (x) { return x.staff === s.id && x.date === date; })[0] || { staff: s.id, date: date, status: date === T ? 'not-in' : 'absent', in: null, out: null };
      return Object.assign({ person: s }, a);
    });
  };
  q.attendanceMonth = function (sid, ym) {
    var recs = KM.data.attendance.filter(function (a) { return a.staff === sid && a.date.slice(0, 7) === ym; });
    var c = { present: 0, late: 0, half: 0, absent: 0, leave: 0, event: 0 };
    recs.forEach(function (a) { c[a.status] = (c[a.status] || 0) + 1; });
    return { records: recs, counts: c, worked: c.present + c.late + c.event + c.half * 0.5 };
  };
  q.servicesBy = function (sid, r) { return q.visitsIn(r).filter(function (v) { return v.staff === sid; }); };
  q.ATT = {
    present: { label: 'Present', badge: 'success', short: 'P' }, late: { label: 'Late', badge: 'warning', short: 'L' },
    half: { label: 'Half day', badge: 'info', short: 'H' }, absent: { label: 'Absent', badge: 'danger', short: 'A' },
    leave: { label: 'On leave', badge: 'neutral', short: 'LV' }, event: { label: 'Event duty', badge: 'accent', short: 'E' },
    'not-in': { label: 'Not in yet', badge: 'neutral', short: '–' }
  };
  q.payslipDraft = function (sid, ym) {
    var s = q.staff(sid), m = q.attendanceMonth(sid, ym);
    // monthly pay is pro-rated for someone who joined during this month
    var dim = D.daysInMonth(ym), joinedHere = s.joined && s.joined.slice(0, 7) === ym;
    var base = s.pay.kind === 'daily' ? Math.round(s.pay.amount * m.worked)
      : joinedHere ? Math.round(s.pay.amount * (dim - (+s.joined.slice(8, 10)) + 1) / dim) : s.pay.amount;
    var eventWages = sum(KM.data.bookings.filter(function (b) { return b.functions.some(function (f) { return f.date.slice(0, 7) === ym; }); }), function (b) { return sum(b.wages.filter(function (w) { return w.staff === sid; }), function (w) { return w.amount; }); });
    var lop = s.pay.kind === 'monthly' ? Math.round(s.pay.amount / 26 * m.counts.absent) : 0;
    var advance = sum(KM.data.expenses.filter(function (e) { return e.advanceTo === sid && e.date.slice(0, 7) === ym; }), function (e) { return e.amount; });
    return { staff: s, month: ym, att: m, base: base, eventWages: eventWages, lop: lop, advance: advance, net: base + eventWages - lop - advance };
  };

  /* ---- habits ---- */
  q.streak = function () {
    var days = {};
    KM.data.visits.forEach(function (v) { days[v.date] = (days[v.date] || 0) + 1; });
    var n = 0, d = T;
    while (days[d]) { n++; d = D.add(d, -1); }
    var ym = T.slice(0, 7), dim = +T.slice(8, 10), logged = 0, list = [];
    for (var i = 1; i <= dim; i++) { var ds = ym + '-' + String(i).padStart(2, '0'); if (days[ds]) logged++; list.push({ date: ds, count: days[ds] || 0 }); }
    return { current: n, logged: logged, elapsed: dim, days: list };
  };

  /* ---- search ---- */
  q.search = function (text) {
    var t = String(text || '').trim().toLowerCase();
    if (!t) return [];
    var digits = t.replace(/\D/g, '');
    var out = [];
    KM.data.customers.forEach(function (c) { if (c.name.toLowerCase().indexOf(t) >= 0 || (digits.length >= 3 && c.phone.indexOf(digits) >= 0)) out.push({ kind: 'Customer', icon: 'user', title: c.name, meta: KM.fmt.phone(c.phone) + ' · ' + c.area, go: '/customers/' + c.id }); });
    KM.data.bookings.forEach(function (b) { if (b.client.toLowerCase().indexOf(t) >= 0 || b.venue.toLowerCase().indexOf(t) >= 0) { var x = q.booking(b.id); out.push({ kind: 'Booking', icon: 'sparkles', title: b.client + ' · ' + x.title, meta: KM.fmt.date(x.start, 'long') + ' · ' + b.venue, go: '/bookings/' + b.id }); } });
    KM.data.students.forEach(function (s) { if (s.name.toLowerCase().indexOf(t) >= 0) out.push({ kind: 'Student', icon: 'school', title: s.name, meta: q.course(s.course).name, go: '/academy/' + s.id }); });
    KM.data.jewels.forEach(function (j) { if (j.name.toLowerCase().indexOf(t) >= 0 || j.type.toLowerCase().indexOf(t) >= 0) out.push({ kind: 'Jewel', icon: 'diamond', title: j.name, meta: j.type, go: '/jewels/' + j.id }); });
    KM.data.staff.forEach(function (s) { if (s.name.toLowerCase().indexOf(t) >= 0) out.push({ kind: 'Staff', icon: 'id-badge-2', title: s.name, meta: s.role, go: '/team/' + s.id }); });
    return out.slice(0, 30);
  };

  /* =================================================================================
     Mutations (in memory; emit data:changed)
     ================================================================================= */
  function changed(what) { KM.emit('data:changed', what); }
  function uid(p) { return p + Math.random().toString(36).slice(2, 8); }
  q.addVisit = function (o) {
    // o: {customerId?, name, phone, area, items:[{name,price,svc}], cash, upi, staff, date, time}
    var cid = o.customerId;
    if (!cid) {
      var ex = q.findByPhone(o.phone);
      if (ex) cid = ex.id;
      else { cid = uid('c'); KM.data.customers.push({ id: cid, name: o.name, phone: String(o.phone).replace(/\D/g, '').slice(-10), area: o.area || '', addedBy: KM.state.role === 'staff' ? KM.state.user && KM.state.user.id : null, rating: 5, note: '' }); }
    }
    var total = sum(o.items, function (i) { return i.price; });
    var v = { id: uid('v'), cust: cid, date: o.date || T, time: o.time || '12:00', items: o.items, total: total, paid: { cash: o.cash || 0, upi: o.upi || 0 },
      staff: o.staff || null, addedBy: KM.state.role === 'staff' && KM.state.user ? KM.state.user.id : null };
    v.received = v.paid.cash + v.paid.upi; v.due = v.total - v.received;
    KM.data.visits.push(v);
    changed('visit');
    return { visit: v, customer: q.customer(cid) };
  };
  /** collectVisitDue(visitId, mode, amount?) — amount defaults to the full due (part payments allowed). */
  q.collectVisitDue = function (vid, mode, amount) {
    var v = KM.data.visits.filter(function (x) { return x.id === vid; })[0]; if (!v) return;
    var amt = Math.min(v.due, amount != null ? amount : v.due);
    v.paid[mode === 'cash' ? 'cash' : 'upi'] += amt; v.received += amt; v.due = v.total - v.received; changed('visit');
    return v;
  };
  /** addBookingPayment(bookingId, amount, mode, note?, date?) */
  q.addBookingPayment = function (bid, amount, mode, note, date) {
    var b = KM.data.bookings.filter(function (x) { return x.id === bid; })[0]; if (!b) return;
    b.payments.push({ date: date || T, amount: amount, mode: mode, note: note || (b.payments.length ? 'Balance' : 'Advance') });
    if (b.status === 'enquiry') b.status = 'confirmed';
    changed('booking');
  };
  /** addBill({store, date, items:[{name,amount}], total}) → saved scanned bill (pair with addExpense({..., bill: id})) */
  q.addBill = function (bill) { bill.id = bill.id || uid('scan'); bill.date = bill.date || T; KM.data.bills.unshift(bill); changed('bill'); return bill; };
  /** setDrawerCount('YYYY-MM', cash, upi) — record a cash-drawer / UPI count for the month. */
  q.setDrawerCount = function (ym, cash, upi) {
    var b = KM.data.balances.filter(function (x) { return x.month === ym; })[0];
    if (!b) { b = { month: ym }; KM.data.balances.push(b); }
    b.countedCash = cash; b.countedUpi = upi; b.countedOn = T; changed('balance'); return b;
  };
  q.addBooking = function (b) {
    b.id = b.id || uid('b');
    if (!b.cust && b.phone) { var ex = q.findByPhone(b.phone); if (ex) b.cust = ex.id; } // link returning customers
    KM.data.bookings.push(b); changed('booking'); return b;
  };
  q.setBookingStatus = function (bid, status) { var b = KM.data.bookings.filter(function (x) { return x.id === bid; })[0]; if (b) { b.status = status; changed('booking'); } };
  q.addExpense = function (e) { e.id = uid('x'); e.date = e.date || T; KM.data.expenses.unshift(e); changed('expense'); return e; };
  /** addStudentPayment(studentId, amount, mode, note?, date?) */
  q.addStudentPayment = function (sid, amount, mode, note, date) {
    var s = KM.data.students.filter(function (x) { return x.id === sid; })[0];
    if (s) { s.payments.push({ date: date || T, amount: amount, mode: mode, note: note || ('Instalment ' + (s.payments.length + 1)) }); changed('student'); }
  };
  q.addStudent = function (s) { s.id = uid('s'); s.payments = s.payments || []; s.status = 'active'; KM.data.students.push(s); changed('student'); return s; };
  q.rentJewel = function (jid, o) {
    var j = q.jewel(jid);
    var r = Object.assign({}, o, { id: uid('r'), jewel: jid, client: o.client, phone: o.phone, from: o.from || T, due: o.due, status: 'out', returned: null,
      fee: o.fee != null ? o.fee : j.fee, deposit: o.deposit != null ? o.deposit : j.deposit, refunded: 0, damage: 0 });
    KM.data.rentals.push(r); changed('rental'); return r;
  };
  /** returnJewel(rentalId, damage, extra?) — extra (e.g. {condition:[...], refundMode:'cash'}) is stored on the rental. */
  q.returnJewel = function (rid, damage, extra) {
    var r = KM.data.rentals.filter(function (x) { return x.id === rid; })[0]; if (!r) return;
    Object.assign(r, extra || {});
    r.status = 'returned'; r.returned = T; r.damage = Math.min(damage || 0, r.deposit); r.refunded = r.deposit - r.damage;
    changed('rental'); return r;
  };
  /** setStudentStatus(id, 'active'|'certified'|'on-hold'|'dropped') */
  q.setStudentStatus = function (sid, status) {
    var s = KM.data.students.filter(function (x) { return x.id === sid; })[0]; if (!s) return;
    s.status = status;
    if (status === 'certified') s.certifiedOn = T;
    if (status === 'on-hold') s.heldOn = T;
    changed('student'); return s;
  };
  q.punch = function (sid, kind) {
    var a = KM.data.attendance.filter(function (x) { return x.staff === sid && x.date === T; })[0];
    var now = KM.state.now.slice(11, 16);
    if (!a) { a = { staff: sid, date: T, status: 'present', in: null, out: null, via: 'Studio WiFi' }; KM.data.attendance.push(a); }
    if (kind === 'in') { a.in = now; var s = q.staff(sid); var sh = s.shift.split(':').map(Number), n = now.split(':').map(Number); a.status = (n[0] * 60 + n[1]) - (sh[0] * 60 + sh[1]) > KM.data.settings.lateAfterMin ? 'late' : 'present'; a.via = 'Studio WiFi'; }
    else a.out = now;
    changed('attendance');
    return a;
  };
})();

</script>
<script data-core="20-charts.js">
/* ===== core/20-charts.js ===== */
/* KM.chart — small SVG charts drawn at real pixel width (crisp text on phones).
   bars({series, rows, height, format, horizontal, stacked}) · line({labels, series, height, format, area}) · spark(values) · splitbar(parts)
   Rules: thin marks (bars ≤ 24px, 4px rounded data-end), 2px lines, hairline solid grid, legend for ≥ 2 series,
   labels in text tokens (never series colour), hover + keyboard tooltips, table view toggle. */
(function () {
  'use strict';
  var KM = window.KM;
  var NS = 'http://www.w3.org/2000/svg';
  var seq = 0;

  function color(s) { return s.color || ('var(--chart-' + (s.slot || 1) + ')'); }
  function fmt(v, f) {
    if (f === 'num') return KM.fmt.num(v);
    if (f === 'pct') return Math.round(v) + '%';
    return KM.fmt.inr(v);
  }
  function fmtTick(v, f) {
    if (f === 'num') return v >= 1000 ? (Math.round(v / 100) / 10) + 'K' : String(v);
    if (f === 'pct') return v + '%';
    var a = Math.abs(v);
    if (a >= 100000) return '₹' + (Math.round(v / 10000) / 10) + 'L';
    if (a >= 1000) return '₹' + (Math.round(v / 100) / 10) + 'K';
    return '₹' + v;
  }
  // Axis max = 4 × a round step, so every gridline label is a clean number (6K / 12K / 18K / 24K).
  function niceMax(m, integer) {
    if (m <= 0) return 4;
    var raw = m / 4;
    if (integer && raw <= 10) return Math.max(1, Math.ceil(raw)) * 4; // counts: whole-number ticks only
    var p = Math.pow(10, Math.floor(Math.log10(raw)));
    var n = raw / p;
    var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    var nice = steps.filter(function (s) { return s >= n - 1e-9; })[0] || 10;
    return nice * p * 4;
  }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }
  function legend(series, kind) {
    if (series.length < 2) return '';
    return '<div class="chart-legend">' + series.map(function (s) {
      return '<span><i class="' + (kind === 'line' ? 'is-line' : '') + '" style="background:' + color(s) + '"></i>' + KM.esc(s.label) + '</span>';
    }).join('') + '</div>';
  }
  function table(opts) {
    var s = opts.series;
    var head = '<tr><th>' + KM.esc(opts.xLabel || '') + '</th>' + s.map(function (x) { return '<th>' + KM.esc(x.label) + '</th>'; }).join('') + '</tr>';
    var rows = (opts.rows || opts.labels.map(function (l, i) { var v = {}; s.forEach(function (x) { v[x.key] = x.values[i]; }); return { label: l, values: v }; }))
      .map(function (r) { return '<tr><td>' + KM.esc(r.label) + '</td>' + s.map(function (x) { return '<td class="num">' + fmt(r.values[x.key] || 0, opts.format) + '</td>'; }).join('') + '</tr>'; }).join('');
    return '<table class="chart-table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table>';
  }
  function figure(kind, opts) {
    var id = 'ch' + (++seq);
    var data = KM.esc(JSON.stringify(opts));
    var h = opts.height || 220;
    return KM.raw(
      '<figure class="chart" id="' + id + '" data-kind="' + kind + '" data-opts="' + data + '">' +
        '<div class="chart-head">' + legend(opts.series, kind) +
          '<button type="button" class="chart-toggle" data-chart-toggle aria-pressed="false"><i class="ti ti-table" aria-hidden="true"></i><span>Table</span></button></div>' +
        '<div class="chart-plot" style="height:' + h + 'px" role="img" aria-label="' + KM.esc(opts.aria || opts.title || 'Chart') + '"></div>' +
        '<div class="chart-tablewrap" hidden>' + table(opts) + '</div>' +
      '</figure>');
  }

  var C = KM.chart = {};
  C.bars = function (opts) { return figure('bars', opts); };
  C.line = function (opts) { return figure('line', opts); };

  C.spark = function (values, o) {
    o = o || {};
    var w = o.w || 70, h = o.h || 26, max = Math.max.apply(null, values), min = Math.min.apply(null, values);
    var span = max - min || 1;
    var pts = values.map(function (v, i) { return [(i / (values.length - 1)) * (w - 4) + 2, h - 3 - ((v - min) / span) * (h - 6)]; });
    var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var last = pts[pts.length - 1];
    return KM.raw('<svg class="kpi-spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<path d="' + d + '" fill="none" style="stroke:var(--chart-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" style="fill:' + (o.color || 'var(--chart-accent)') + '"/></svg>');
  };

  C.splitbar = function (parts, o) {
    o = o || {};
    var total = parts.reduce(function (a, p) { return a + p.value; }, 0) || 1;
    return KM.raw('<div class="stack-sm">' +
      '<div class="splitbar" role="img" aria-label="' + KM.esc(parts.map(function (p) { return p.label + ' ' + fmt(p.value, o.format); }).join(', ')) + '">' +
      parts.filter(function (p) { return p.value > 0; }).map(function (p) { return '<span title="' + KM.esc(p.label + ': ' + fmt(p.value, o.format)) + '" style="width:' + (p.value / total * 100).toFixed(2) + '%;background:' + color(p) + '"></span>'; }).join('') +
      '</div><div class="chart-legend">' + parts.map(function (p) {
        return '<span><i style="background:' + color(p) + '"></i>' + KM.esc(p.label) + ' <b class="num" style="color:var(--text-1)">' + fmt(p.value, o.format) + '</b>' +
          (o.pct ? ' <span class="subtle">(' + Math.round(p.value / total * 100) + '%)</span>' : '') + '</span>';
      }).join('') + '</div></div>');
  };

  /* ---------------- drawing ---------------- */
  function tipEl(fig) {
    var t = fig.querySelector('.chart-tip');
    if (!t) { t = document.createElement('div'); t.className = 'chart-tip'; t.hidden = true; fig.querySelector('.chart-plot').appendChild(t); }
    return t;
  }
  function showTip(fig, x, y, title, rows, fmtName) {
    var t = tipEl(fig);
    t.innerHTML = '';
    var tt = document.createElement('div'); tt.className = 'tt-title'; tt.textContent = title; t.appendChild(tt);
    rows.forEach(function (r) {
      var row = document.createElement('div'); row.className = 'tt-row';
      var key = document.createElement('i'); key.style.background = r.color; row.appendChild(key);
      var b = document.createElement('b'); b.textContent = fmt(r.value, fmtName); row.appendChild(b);
      if (rows.length > 1 || r.label) { var s = document.createElement('span'); s.textContent = r.label; row.appendChild(s); }
      t.appendChild(row);
    });
    var plot = fig.querySelector('.chart-plot');
    var w = plot.clientWidth;
    t.hidden = false;
    var tw = t.offsetWidth;
    t.style.left = Math.min(Math.max(x, tw / 2 + 4), w - tw / 2 - 4) + 'px';
    t.style.top = Math.max(y, t.offsetHeight + 14) + 'px';
  }
  function hideTip(fig) { var t = fig.querySelector('.chart-tip'); if (t) t.hidden = true; }

  function drawBars(fig, o, plot) {
    var W = plot.clientWidth, H = plot.clientHeight;
    var svg = el('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
    var series = o.series, rows = o.rows;
    if (o.horizontal) {
      var labelW = Math.min(150, Math.max(90, W * 0.32)), valW = 76;
      var rowH = H / rows.length, bh = Math.min(16, rowH * 0.5);
      var max = niceMax(Math.max.apply(null, rows.map(function (r) { return series.reduce(function (a, s) { return a + (r.values[s.key] || 0); }, 0); })), o.format === 'num');
      var plotW = Math.max(40, W - labelW - valW);
      var maxChars = Math.max(6, Math.floor((labelW - 10) / 6.6));
      rows.forEach(function (r, i) {
        var y = i * rowH + rowH / 2;
        var tx = el('text', { x: 0, y: y + 4 }, svg); tx.setAttribute('class', 'lbl-strong');
        // measure before placing: a label that won't fit is shortened (full text stays in the tooltip + table)
        tx.textContent = r.label.length > maxChars ? r.label.slice(0, maxChars - 1).trim() + '…' : r.label;
        if (r.label.length > maxChars) { var tt = el('title', {}, tx); tt.textContent = r.label; }
        el('rect', { x: labelW, y: y - bh / 2, width: plotW, height: bh, rx: 4, style: 'fill:var(--surface-2)' }, svg);
        var x0 = labelW, total = 0;
        series.forEach(function (s, si) {
          var v = r.values[s.key] || 0; total += v;
          var w = Math.max(v > 0 ? 3 : 0, v / max * plotW - (si < series.length - 1 ? 2 : 0));
          var m = el('rect', { x: x0, y: y - bh / 2, width: w, height: bh, rx: si === series.length - 1 ? 4 : 0, class: 'mark', tabindex: '0', style: 'fill:' + color(s) }, svg);
          m.setAttribute('aria-label', r.label + ' ' + s.label + ' ' + fmt(v, o.format));
          var show = function () { showTip(fig, x0 + w / 2, y - bh / 2, r.label, [{ label: series.length > 1 ? s.label : '', value: v, color: color(s) }], o.format); };
          m.addEventListener('pointerenter', show); m.addEventListener('focus', show);
          m.addEventListener('pointerleave', function () { hideTip(fig); }); m.addEventListener('blur', function () { hideTip(fig); });
          x0 += w + 2;
        });
        // value label: per-row r.valueLabel or o.valueLabels[i] (plain strings — opts are JSON-serialised, so no functions)
        var vl = r.valueLabel != null ? r.valueLabel : (o.valueLabels && o.valueLabels[i] != null ? o.valueLabels[i] : fmt(total, o.format));
        var vt = el('text', { x: W, y: y + 4, 'text-anchor': 'end' }, svg); vt.textContent = vl; vt.setAttribute('class', 'lbl-strong');
      });
      plot.appendChild(svg);
      return;
    }
    var padL = 44, padR = 6, padT = 14, padB = 26;
    var pw = W - padL - padR, ph = H - padT - padB;
    var vals = rows.map(function (r) { return o.stacked ? series.reduce(function (a, s) { return a + (r.values[s.key] || 0); }, 0) : Math.max.apply(null, series.map(function (s) { return r.values[s.key] || 0; })); });
    var max = niceMax(Math.max.apply(null, vals.concat([1])), o.format === 'num');
    var g = el('g', { class: 'grid' }, svg);
    for (var t = 0; t <= 4; t++) {
      var yy = padT + ph - ph * t / 4;
      el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy }, g);
      var tx = el('text', { x: padL - 8, y: yy + 4, 'text-anchor': 'end' }, svg); tx.textContent = fmtTick(max * t / 4, o.format);
    }
    el('line', { x1: padL, x2: W - padR, y1: padT + ph, y2: padT + ph, class: 'axis' }, svg);
    var band = pw / rows.length;
    var groupN = o.stacked ? 1 : series.length;
    var bw = Math.min(24, (band * 0.62 - (groupN - 1) * 2) / groupN);
    rows.forEach(function (r, i) {
      var cx = padL + band * i + band / 2;
      var lx = el('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, svg); lx.textContent = r.label;
      var gx = cx - (groupN * bw + (groupN - 1) * 2) / 2;
      var base = padT + ph;
      series.forEach(function (s, si) {
        var v = r.values[s.key] || 0;
        var h = v / max * ph;
        var x = o.stacked ? gx : gx + si * (bw + 2);
        var y = base - h;
        var top = o.stacked ? si === series.length - 1 : true;
        var d = h <= 0 ? '' : top
          ? 'M' + x + ' ' + base + ' V' + (y + Math.min(4, h)) + ' Q' + x + ' ' + y + ' ' + (x + Math.min(4, bw / 2)) + ' ' + y + ' H' + (x + bw - Math.min(4, bw / 2)) + ' Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + Math.min(4, h)) + ' V' + base + ' Z'
          : 'M' + x + ' ' + base + ' V' + y + ' H' + (x + bw) + ' V' + base + ' Z';
        if (d) {
          var p = el('path', { d: d, class: 'mark', style: 'fill:' + color(s) }, svg);
          p.setAttribute('tabindex', '0');
          p.setAttribute('aria-label', r.label + ' ' + s.label + ' ' + fmt(v, o.format));
        }
        if (o.stacked) base = y - (h > 0 ? 2 : 0);
      });
      var hit = el('rect', { x: padL + band * i, y: padT, width: band, height: ph, class: 'hit' }, svg);
      var show = function () {
        showTip(fig, cx, padT + ph - (vals[i] / max) * ph, r.label, series.map(function (s) { return { label: s.label, value: r.values[s.key] || 0, color: color(s) }; }), o.format);
      };
      hit.addEventListener('pointerenter', show);
      hit.addEventListener('pointerleave', function () { hideTip(fig); });
      svg.querySelectorAll('.mark').forEach(function () {});
    });
    svg.querySelectorAll('path.mark').forEach(function (p) {
      p.addEventListener('focus', function () { var bb = p.getBBox(); var lbl = p.getAttribute('aria-label'); showTip(fig, bb.x + bb.width / 2, bb.y, lbl, [], o.format); });
      p.addEventListener('blur', function () { hideTip(fig); });
    });
    plot.appendChild(svg);
  }

  function drawLine(fig, o, plot) {
    var W = plot.clientWidth, H = plot.clientHeight;
    var svg = el('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H });
    var padL = 44, padR = 12, padT = 14, padB = 26;
    var pw = W - padL - padR, ph = H - padT - padB;
    var all = []; o.series.forEach(function (s) { all = all.concat(s.values); });
    var max = niceMax(Math.max.apply(null, all.concat([1])), o.format === 'num');
    var n = o.labels.length;
    var X = function (i) { return padL + (n === 1 ? pw / 2 : pw * i / (n - 1)); };
    var Y = function (v) { return padT + ph - v / max * ph; };
    var g = el('g', { class: 'grid' }, svg);
    for (var t = 0; t <= 4; t++) {
      var yy = padT + ph - ph * t / 4;
      el('line', { x1: padL, x2: W - padR, y1: yy, y2: yy }, g);
      var tx = el('text', { x: padL - 8, y: yy + 4, 'text-anchor': 'end' }, svg); tx.textContent = fmtTick(max * t / 4, o.format);
    }
    el('line', { x1: padL, x2: W - padR, y1: padT + ph, y2: padT + ph, class: 'axis' }, svg);
    var step = Math.ceil(n / Math.max(2, Math.floor(pw / 56)));
    o.labels.forEach(function (l, i) { if (i % step === 0 || i === n - 1) { var lx = el('text', { x: X(i), y: H - 8, 'text-anchor': 'middle' }, svg); lx.textContent = l; } });
    o.series.forEach(function (s) {
      var d = s.values.map(function (v, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); }).join(' ');
      if (o.area && o.series.length === 1) el('path', { d: d + ' L' + X(n - 1) + ' ' + (padT + ph) + ' L' + X(0) + ' ' + (padT + ph) + ' Z', style: 'fill:' + color(s) + ';opacity:.10' }, svg);
      el('path', { d: d, fill: 'none', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', style: 'stroke:' + color(s) }, svg);
      var li = s.values.length - 1;
      el('circle', { cx: X(li), cy: Y(s.values[li]), r: 4.5, 'stroke-width': 2, style: 'fill:' + color(s) + ';stroke:var(--surface-1)' }, svg);
    });
    var xh = el('line', { x1: 0, x2: 0, y1: padT, y2: padT + ph, class: 'xhair', visibility: 'hidden' }, svg);
    var dots = o.series.map(function (s) { return el('circle', { r: 4.5, 'stroke-width': 2, visibility: 'hidden', style: 'fill:' + color(s) + ';stroke:var(--surface-1)' }, svg); });
    var hit = el('rect', { x: padL, y: padT, width: pw, height: ph, class: 'hit', tabindex: '0' }, svg);
    hit.setAttribute('aria-label', 'Chart: use left and right arrow keys to read values');
    var idx = n - 1;
    function at(i) {
      idx = Math.max(0, Math.min(n - 1, i));
      var x = X(idx);
      xh.setAttribute('x1', x); xh.setAttribute('x2', x); xh.setAttribute('visibility', 'visible');
      dots.forEach(function (d, si) { d.setAttribute('cx', x); d.setAttribute('cy', Y(o.series[si].values[idx])); d.setAttribute('visibility', 'visible'); });
      var topY = Math.min.apply(null, o.series.map(function (s) { return Y(s.values[idx]); }));
      showTip(fig, x, topY, o.labels[idx], o.series.map(function (s) { return { label: o.series.length > 1 ? s.label : '', value: s.values[idx], color: color(s) }; }), o.format);
    }
    function off() { xh.setAttribute('visibility', 'hidden'); dots.forEach(function (d) { d.setAttribute('visibility', 'hidden'); }); hideTip(fig); }
    hit.addEventListener('pointermove', function (e) { var r = svg.getBoundingClientRect(); at(Math.round((e.clientX - r.left - padL) / (pw / Math.max(1, n - 1)))); });
    hit.addEventListener('pointerleave', off);
    hit.addEventListener('focus', function () { at(idx); });
    hit.addEventListener('blur', off);
    hit.addEventListener('keydown', function (e) { if (e.key === 'ArrowLeft') { e.preventDefault(); at(idx - 1); } if (e.key === 'ArrowRight') { e.preventDefault(); at(idx + 1); } });
    plot.appendChild(svg);
  }

  function draw(fig) {
    var plot = fig.querySelector('.chart-plot');
    if (!plot || !plot.clientWidth) return;
    var o = JSON.parse(fig.getAttribute('data-opts'));
    var tip = plot.querySelector('.chart-tip');
    plot.innerHTML = '';
    if (tip) { tip.hidden = true; plot.appendChild(tip); }
    if (fig.getAttribute('data-kind') === 'line') drawLine(fig, o, plot); else drawBars(fig, o, plot);
  }

  var ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(function (entries) {
    entries.forEach(function (en) { var fig = en.target.closest('.chart'); if (fig && en.contentRect.width !== +fig.dataset.w) { fig.dataset.w = en.contentRect.width; draw(fig); } });
  }) : null;

  C.hydrate = function (root) {
    (root || document).querySelectorAll('.chart[data-opts]').forEach(function (fig) {
      if (fig.dataset.hydrated) return;
      fig.dataset.hydrated = '1';
      var plot = fig.querySelector('.chart-plot');
      fig.dataset.w = plot.clientWidth;
      draw(fig);
      if (ro) ro.observe(plot);
      var tg = fig.querySelector('[data-chart-toggle]');
      if (tg) tg.addEventListener('click', function () {
        var tw = fig.querySelector('.chart-tablewrap');
        var on = tw.hidden;
        tw.hidden = !on; plot.hidden = on;
        tg.setAttribute('aria-pressed', on ? 'true' : 'false');
        tg.querySelector('span').textContent = on ? 'Chart' : 'Table';
        tg.querySelector('i').className = 'ti ' + (on ? 'ti-chart-bar' : 'ti-table');
        if (!on) draw(fig);
      });
    });
  };
})();

</script>

        <button class="sb-item sb-collapse" id="km-collapse" title="Collapse sidebar">${I(app.classList.contains('is-collapsed') ? 'layout-sidebar-left-expand' : 'layout-sidebar-left-collapse')}<span>Collapse</span></button>
