      });
      s += pearl(96, 142, 2.2) + pearl(104, 142, 2.2);
      return s + sparks([[142, 30, 5.2], [60, 98, 4], [150, 120, 3]]);
    },
    vanki: function () {
      var s = '', pts = [[22, 32], [100, 98], [178, 32]];
      s += path(poly(pts), 'jw-ms', 12) + path(poly(pts), 'jw-mds', 3) + path(poly([[24, 27.5], [100, 92], [176, 27.5]]), 'jw-hs', 1);
      for (var t = 0.12; t < 0.84; t += 0.13) {
        var l = lerp(pts[0], pts[1], t), r = lerp(pts[2], pts[1], t);
        s += gem(l[0], l[1], 3.3) + gem(r[0], r[1], 3.3);
      }
      s += gem(22, 32, 4.6, 'jw-g2') + gem(178, 32, 4.6, 'jw-g2');
      [-56, -28, 0, 28, 56].forEach(function (a) {
        s += '<g transform="rotate(' + a + ' 100 100)">' + E(100, 121, 6.8, 15, 'jw-m') + E(100, 124, 3.4, 7, 'jw-g') + C(100, 125, 1.6, 'jw-g2') + '</g>';
      });
      s += C(100, 100, 11, 'jw-m') + gem(100, 100, 6.4, 'jw-g2');
      return s + sparks([[150, 112, 4.6], [44, 70, 3.6], [160, 60, 3]]);
    },
    bangles: function () {
      var s = '', ys = [40, 62, 84, 106];
      ys.forEach(function (y) { s += path(poly(arc(100, y, 64, 15, 180, 360, 6)), 'jw-mds', 7); });
      ys.forEach(function (y) {
        var f = arc(100, y, 64, 15, 0, 180, 6);
        s += path(poly(f), 'jw-ms', 7) + path(poly(arc(100, y + 1.2, 64, 15, 8, 172, 6)), 'jw-mds', 1.2);
        for (var d = 18; d <= 162; d += 18) { var p = P(100, y, 64, 15, d); s += gem(p[0], p[1] - 0.6, 2.2); }
      });
      return s + sparks([[176, 30, 4.6], [28, 118, 3.4], [152, 136, 3]]);
    }
  };
  var ART_CACHE = {};
  function motif(j) {
    if (/haram|long/i.test(j.name)) return 'haram';
    return { 'Necklace': 'choker', 'Waist Chain': 'belt', 'Earrings': 'jhumka', 'Maang Tikka': 'tikka', 'Hair set': 'hair', 'Armlet': 'vanki', 'Bangles': 'bangles' }[j.type] || 'choker';
  }
  function svg(j) {
    var m = motif(j);
    var FIT = { hair: 'translate(14 12) scale(.86)', tikka: 'translate(6 6) scale(.94)' }; // keep tall pieces inside the tray
    if (!ART_CACHE[m]) ART_CACHE[m] = '<svg class="jw-art" viewBox="0 0 200 150" aria-hidden="true" focusable="false">' + E(100, 145, 60, 4.5, 'jw-shadow') +
      (FIT[m] ? '<g transform="' + FIT[m] + '">' + ART[m]() + '</g>' : ART[m]()) + '</svg>';
    return ART_CACHE[m];
  }
  /** Jewel photo tile. cls: extra classes (e.g. 'is-hero', 'is-thumb'). label → role=img for standalone use. */
  function photo(j, cls, label) {
    return h`<div class="jw-photo jw-hue-${j.hue || 'gold'} ${cls || ''}" ${label ? KM.raw('role="img" aria-label="' + KM.esc(label) + '"') : KM.raw('aria-hidden="true"')}>${KM.raw(svg(j))}</div>`;
  }
  KM.jewelPhoto = photo; // shared helper: other screens can show a piece (e.g. booking notes "Kemp set from our collection")

  /* ---------- status, ROI, copy ---------- */
  function lateText(j, r) {
    return 'Vanakkam ' + first(r.client) + '! 🙏 Hope the function went beautifully. A gentle reminder from Kalai Makeover — our ' + j.name +
      ' was due back on ' + F.date(r.due, 'dow') + '. Please return it at your earliest; your ' + F.inr(r.deposit) + ' deposit is refunded after a quick check. Nandri! ✨';
  }
  function dueText(j, r) {
    return 'Vanakkam ' + first(r.client) + '! ✨ Hope you are loving the ' + j.name + '. A small reminder to return it by ' + F.date(r.due, 'dow') +
      ' — your ' + F.inr(r.deposit) + ' deposit is refunded on return. Nandri!';
  }
  function offerText(j, b) {
    return 'Vanakkam ' + first(b.client) + '! 💛 For your ' + b.title + ' on ' + F.date(b.start, 'dow') + ', our ' + j.name + ' would look stunning with your look. ' +
      'Rent ' + F.inr(j.fee) + ' (deposit ' + F.inr(j.deposit) + ', refundable). Shall we keep it aside for you? — Kalai Makeover';
  }
  function receiptText(j, r) {
    return 'Vanakkam ' + first(r.client) + '! 💎 Thank you for renting our ' + j.name + ' from Kalai Makeover.\n' +
      '• Rent: ' + F.inr(r.fee) + ' (paid)\n• Deposit: ' + F.inr(r.deposit) + ' (refundable)\n• Return by: ' + F.date(r.due, 'long') + '\n' +
      'Please keep it in the velvet box, away from perfume and water. Your deposit is refunded after a quick check on return. ✨';
  }
  function bookingFor(r) {
    if (r.booking) return q.booking(r.booking);
    var b = KM.data.bookings.filter(function (x) {
      return x.phone === r.phone && x.functions.some(function (f) { return f.date >= r.from && f.date <= r.due; });
    })[0];
    return b ? q.booking(b.id) : null;
  }
  function relLower(d) { var t = F.rel(d); return /^(In|Today|Tomorrow|Yesterday)/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t; }

  /* =========================================================================
     Overview (owner): three money numbers, what's out (the only rows with an action), recent returns, the collection list.
     "Rent a jewel" is the shell's primary action; the overdue piece shows once (its row in "Out on rent").
     ========================================================================= */
  function summary(list) {
    var T = today(), ym = T.slice(0, 7);
    var income = q.sum(KM.data.rentals, function (r) { return r.fee + (r.damage || 0); });
    var month = q.sum(KM.data.rentals.filter(function (r) { return r.from.slice(0, 7) === ym; }), function (r) { return r.fee + (r.damage || 0); });
    var cost = q.sum(list, function (j) { return j.cost; });
    var out = KM.data.rentals.filter(function (r) { return r.status === 'out'; });
    var held = q.sum(out, function (r) { return r.deposit; });
    return h`<section class="kpi-row jw-kpis" aria-label="Rental money">
      <a class="kpi" href="#/insights"><div class="kpi-label">Rental income</div><div class="kpi-value">${F.inr(income)}</div>
        <div class="kpi-foot">${F.inr(month)} in ${F.date(T, 'month').split(' ')[0]}</div></a>
      <div class="kpi"><div class="kpi-label">Earned back</div><div class="kpi-value">${cost ? Math.round(income / cost * 100) : 0}%</div>
        <div class="kpi-foot">of ${F.inr(cost)} spent on pieces</div></div>
      <div class="kpi"><div class="kpi-label">Deposits held</div><div class="kpi-value">${F.inr(held)}</div>
        <div class="kpi-foot">${out.length ? F.plural(out.length, 'piece') + ' out' : 'Nothing out'}</div></div>
    </section>`;
  }

  function thumb(j) { return photo(j, 'is-thumb'); }

  function outNow() {
    var T = today();
    var rs = KM.data.rentals.filter(function (r) { return r.status === 'out'; }).sort(function (a, b) { return a.due.localeCompare(b.due); });
    return h`<section class="card jw-out" aria-labelledby="jw-h-out">
      <div class="card-head"><h2 class="card-title" id="jw-h-out">Out on rent</h2></div>
      ${rs.length ? h`<div class="list">${rs.map(function (r) {
        var j = q.jewel(r.jewel), late = D.diff(T, r.due);
        return h`<div class="list-item jw-li">
          <a class="li-body jw-li-link" href="#/jewels/${j.id}">${thumb(j)}
            <span class="jw-li-text"><span class="li-title">${short(j)}</span>
            <span class="li-meta">${r.client} · ${late > 0 ? 'was due ' + F.date(r.due, 'dow') : 'back ' + (late === 0 ? 'today' : F.date(r.due, 'dow'))}</span></span></a>
          <span class="li-trail jw-li-trail">${late > 0 ? h`<span class="badge badge-danger">${F.plural(late, 'day')} late</span>` : ''}
            <button class="btn btn-secondary btn-sm" data-open="return" data-p-rental="${r.id}">Return</button></span>
        </div>`;
      })}</div>` : h`<div class="card-body"><p class="subtle small">Every piece is in the studio.</p></div>`}
    </section>`;
  }

  function recentReturns() {
    var rs = KM.data.rentals.filter(function (r) { return r.status === 'returned'; })
      .sort(function (a, b) { return (b.returned || '').localeCompare(a.returned || ''); }).slice(0, 4);
    if (!rs.length) return '';
    return h`<section class="card jw-rets" aria-labelledby="jw-h-ret">
      <div class="card-head"><h2 class="card-title" id="jw-h-ret">Recent returns</h2></div>
      <div class="list">${rs.map(function (r) {
        var j = q.jewel(r.jewel), late = D.diff(r.returned, r.due);
        return h`<a class="list-item jw-li" href="#/jewels/${j.id}">
          <span class="li-body jw-li-link">${thumb(j)}<span class="jw-li-text"><span class="li-title">${short(j)}</span>
            <span class="li-meta">${r.client} · back ${F.date(r.returned)}${late > 0 ? ' · ' + F.plural(late, 'day') + ' late' : ''}</span></span></span>
          <span class="li-trail small">${r.damage ? h`<span class="jw-dmg">−${F.inr(r.damage)} damage</span>` : h`<span class="subtle num">${F.inr(r.refunded)}<span class="jw-ref-l"> refunded</span></span>`}</span>
        </a>`;
      })}</div>
    </section>`;
  }

  /* a compact row per piece (thumb + name + type, rent on the right); the big photo lives on the piece's page.
     No "On rent" flag: the pieces that are out are already listed (with their return date) in "Out on rent". */
  function pieceRow(j) {
    return h`<a class="list-item jw-li" href="#/jewels/${j.id}">
      <span class="li-body jw-li-link">${thumb(j)}<span class="jw-li-text"><span class="li-title">${j.name}</span><span class="li-meta">${j.type}</span></span></span>
      <span class="li-trail small"><span class="jw-fee"><span class="num">${F.inr(j.fee)}</span><span class="jw-unit"> a rental</span></span></span>
    </a>`;
  }

  function catalogue(list) {
    return h`<section class="card jw-cat" aria-labelledby="jw-h-cat">
      <div class="card-head"><h2 class="card-title" id="jw-h-cat">Collection</h2></div>
      <div class="list">${list.map(pieceRow)}</div>
      <div class="card-foot"><button class="btn btn-ghost btn-sm jw-add" data-toast="Adding a piece — photo, cost, rent and deposit — is not part of this prototype yet." data-kind="info">${I('plus')} Add a piece</button></div>
    </section>`;
  }

  function overview() {
    var list = q.jewelList();
    return h`
      <header class="page-head">
        <div class="page-head-text"><h1 class="page-title">Jewel rental</h1></div>
      </header>
      ${summary(list)}
      <div class="jw-cols">
        ${outNow()}
        ${recentReturns()}
        ${catalogue(list)}
      </div>`;
  }

  /* =========================================================================
     Piece detail — photo + details, then who has it (or who to offer it to), earnings, past rentals.
     Renting it is the shell's primary action ("Rent this piece" / "Book next rental").
     ========================================================================= */
  function roiCard(j) {
    var T = today();
    var done = j.roi >= 100, left = Math.max(0, j.cost - j.income), need = j.fee ? Math.ceil(left / j.fee) : 0;
    var months = Math.max(1, D.diff(T, j.bought) / 30.44), pace = j.times / months;
    var note;
    if (done) note = h`Paid for itself — ${F.inr(j.income - j.cost)} profit so far.`;
    else if (!j.times) note = h`Not rented yet — ${F.plural(need, 'rental')} pay it back.`;
    else {
      var eta = D.addMonths(T.slice(0, 7), Math.max(1, Math.ceil(need / pace)));
      note = h`${F.plural(need, 'more rental')} to break even — about ${D.monthName(eta, true)}.`;
    }
    var ms = [], ym = j.bought.slice(0, 7);
    while (ym <= T.slice(0, 7)) { ms.push(ym); ym = D.addMonths(ym, 1); }
    var cum = 0;
    var vals = ms.map(function (m) { cum += q.sum(j.rentals.filter(function (r) { return r.from.slice(0, 7) === m; }), function (r) { return r.fee + (r.damage || 0); }); return cum; });
    return h`<section class="card jw-roi-card" aria-labelledby="jw-h-roi">
      <div class="card-head"><h2 class="card-title" id="jw-h-roi">Return on investment</h2></div>
      <div class="card-body">
        <div class="jw-roi-hero"><span class="jw-roi-pct">${j.roi}%</span><span class="subtle small">earned back${j.income ? ' · ' + F.inr(j.income) + ' so far' : ''}</span></div>
        <p class="jw-roi-note">${note}</p>
        ${ms.length >= 2 ? KM.chart.line({ labels: ms.map(function (m) { return D.monthName(m); }),
          series: [{ key: 'e', label: 'Earned so far', values: vals, slot: 4 }, { key: 'c', label: 'Cost of the piece', values: ms.map(function () { return j.cost; }), color: 'var(--text-3)' }],
          height: 168, xLabel: 'Month', aria: 'Running rental income against the cost of the piece' }) : ''}
      </div>
    </section>`;
  }

  function currentCard(j) {
    var r = j.active;
    if (!r) return offerCard(j);
    var late = j.overdueDays, bk = bookingFor(r);
    return h`<section class="card jw-current" aria-labelledby="jw-h-cur">
      <div class="card-head"><h2 class="card-title" id="jw-h-cur">With ${r.client}</h2>${late ? h`<span class="badge badge-danger jw-push">${F.plural(late, 'day')} late</span>` : ''}</div>
      <div class="card-body"><div class="kv">
        <div class="kv-row"><span>Rented</span><span>${F.date(r.from, 'dow')}</span></div>
        <div class="kv-row"><span>Due back</span><span>${F.date(r.due, 'dow')}${late ? '' : ' · ' + relLower(r.due)}</span></div>
        ${r.deposit !== j.deposit ? h`<div class="kv-row"><span>Deposit held</span><span class="num">${F.inr(r.deposit)}</span></div>` : ''}
        <div class="kv-row"><span>Phone</span><a class="jw-tel num" href="tel:+91${r.phone}">${F.phone(r.phone)}</a></div>
        ${bk ? h`<div class="kv-row"><span>Booking</span><a class="link" href="#/bookings/${bk.id}">${first(bk.client)}'s ${bk.title} · ${F.date(bk.start)}</a></div>` : ''}
      </div></div>
      <div class="card-foot jw-foot">
        <a class="btn btn-wa btn-sm" href="${KM.wa(r.phone, late ? lateText(j, r) : dueText(j, r))}" target="_blank" rel="noopener">${I('brand-whatsapp')} ${late ? 'Send reminder' : 'Message'}</a>
        <button class="btn btn-primary btn-sm" data-open="return" data-p-rental="${r.id}">Return</button>
      </div>
    </section>`;
  }

  function offerCard(j) {
    var rentedPhones = KM.data.rentals.filter(function (r) { return r.status === 'out'; }).map(function (r) { return r.phone; });
    var brides = q.upcoming(30).filter(function (b) { return b.state !== 'cancelled' && b.daysTo >= 1 && rentedPhones.indexOf(b.phone) < 0; }).slice(0, 3);
    if (!brides.length) return '';
    return h`<section class="card jw-offer" aria-labelledby="jw-h-av">
      <div class="card-head"><h2 class="card-title" id="jw-h-av">Offer to a bride</h2></div>
      <div class="list">${brides.map(function (b) {
        return h`<div class="list-item">${KM.avatar(b.client, 'avatar-sm')}
          <a class="li-body" href="#/bookings/${b.id}"><span class="li-title">${b.client}</span><span class="li-meta">${b.title} · ${F.date(b.start, 'dow')}</span></a>
          <a class="btn btn-wa btn-sm btn-icon" href="${KM.wa(b.phone, offerText(j, b))}" target="_blank" rel="noopener" aria-label="Offer ${short(j)} to ${b.client} on WhatsApp">${I('brand-whatsapp')}</a>
        </div>`;
      })}</div>
    </section>`;
  }

  /* who had it and when. Rent and deposit are the piece's standard terms (Details card) and the total earned is in
     the ROI card, so a row only shows money when something was different: a damage deduction or a changed rent. */
  function historyCard(j) {
    var rs = j.rentals.filter(function (r) { return r.status !== 'out'; }) // the current rental is the card above
      .sort(function (a, b) { return b.from.localeCompare(a.from); });
    if (!rs.length) return ''; // "Not rented yet" is already the ROI card's line
    return h`<section class="card jw-hist-card" aria-labelledby="jw-h-hist">
      <div class="card-head"><h2 class="card-title" id="jw-h-hist">Past rentals</h2></div>
      <div class="list">${rs.map(function (r) {
          var late = r.returned ? D.diff(r.returned, r.due) : 0;
          var trail = r.damage ? h`<span class="jw-dmg num">−${F.inr(r.damage)} damage</span>`
            : r.fee !== j.fee ? h`<span class="subtle num">${F.inr(r.fee)} rent</span>` : '';
          return h`<div class="list-item">
            <span class="li-body"><span class="li-title">${r.client}</span>
              <span class="li-meta">${F.date(r.from)} → ${F.date(r.returned || r.due)}${late > 0 ? ' · ' + F.plural(late, 'day') + ' late' : ''}</span></span>
            ${trail ? h`<span class="li-trail small">${trail}</span>` : ''}
          </div>`;
        })}</div>
    </section>`;
  }

  function factsCard(j) {
    var age = D.diff(today(), j.bought);
    return h`<section class="card jw-facts" aria-labelledby="jw-h-spec">
      <div class="card-head"><h2 class="card-title" id="jw-h-spec">Details</h2></div>
      <div class="card-body"><div class="kv">
        <div class="kv-row"><span>Rent</span><span class="num">${F.inr(j.fee)}</span></div>
        <div class="kv-row"><span>Refundable deposit</span><span class="num">${F.inr(j.deposit)}</span></div>
        <div class="kv-row"><span>Cost</span><span class="num">${F.inr(j.cost)}</span></div>
        <div class="kv-row"><span>Bought</span><span>${F.date(j.bought, 'dmy')} <span class="subtle">· ${age > 60 ? Math.round(age / 30.44) + ' months ago' : F.plural(age, 'day') + ' ago'}</span></span></div>
        ${j.addedBy ? h`<div class="kv-row"><span>Added by</span><span>${q.staffName(j.addedBy)}</span></div>` : ''}
      </div></div>
    </section>`;
  }

  function detail(id) {
    if (!q.jewel(id)) {
      return h`${KM.backLink('/jewels', 'Jewel rental')}
        <div class="empty"><div class="empty-title">Piece not found</div><a class="btn btn-secondary btn-sm" href="#/jewels">Back to the collection</a></div>`;
    }
    var j = q.jewelStats(id);
    return h`
      ${KM.backLink('/jewels', 'Jewel rental')}
      <header class="page-head">
        <div class="page-head-text">
          <h1 class="page-title">${j.name}</h1>
          <p class="page-sub">${j.type}${j.status === 'available' ? ' · in the studio' : ''}</p>
        </div>
      </header>
      <div class="jw-detail">
        <div class="jw-detail-media">
          <div class="jw-d-photo">${photo(j, 'is-hero', j.name + ' — studio photo')}</div>
          ${factsCard(j)}
        </div>
        <div class="jw-detail-side">
          ${currentCard(j)}
          ${roiCard(j)}
          ${historyCard(j)}
        </div>
      </div>`;
  }

  /* the one create action per view: rent a piece — this piece on its detail page */
  function primaryFor(r) {
    var j = r.params[0] ? q.jewelStats(r.params[0]) : null;
    if (!j) return { label: 'Rent a jewel', open: 'rent', icon: 'diamond' };
    return j.active ? { label: 'Book next rental', open: 'rent', icon: 'calendar-plus', params: { jewel: j.id } }
      : { label: 'Rent this piece', open: 'rent', icon: 'diamond', params: { jewel: j.id } };
  }

  KM.screen('jewels', {
    title: 'Jewel rental', icon: 'diamond', role: 'owner',
    primary: primaryFor,
    render: function (ctx) { return ctx.params[0] ? detail(ctx.params[0]) : overview(); }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'jewels') KM.refresh(); });

  /* =========================================================================
     Overlay: rent
     ========================================================================= */
  function lookup(d) {
    var up = q.upcoming().filter(function (x) { return x.phone === d && x.state !== 'cancelled'; })[0];
    var c = q.findByPhone(d);
    if (c) return { name: c.name, src: up ? 'Bridal client' : 'Salon customer', area: c.area, booking: up ? up.id : null };
    var b = up || KM.data.bookings.filter(function (x) { return x.phone === d; })[0];
    if (b) return { name: b.client, src: 'Bridal client', area: b.area, booking: up ? up.id : null };
    var r = KM.data.rentals.filter(function (x) { return x.phone === d; })[0];
    if (r) return { name: r.client, src: 'Rented before' };
    return null;
  }

  function pickTile(j, sel) {
    var on = sel === j.id;
    return h`<button type="button" class="jw-pick-item ${on ? 'is-selected' : ''}" role="radio" aria-checked="${on ? 'true' : 'false'}" data-jewel="${j.id}">
      ${photo(j, 'is-pick')}
      <span class="jw-pick-name">${short(j)}</span>
      <span class="jw-pick-price"><span class="num">${F.inr(j.fee)}</span> · dep ${F.inr(j.deposit)}</span>
    </button>`;
  }
  function selectedPiece(j, canChange) {
    return h`<div class="jw-sel">
      ${photo(j, 'is-sel')}
      <div class="jw-sel-text"><div class="strong">${j.name}</div><div class="subtle xsmall">${j.type}</div></div>
      ${canChange ? h`<button type="button" class="btn btn-ghost btn-sm" data-change-piece>Change</button>` : ''}
    </div>`;
  }

  function rentBody(ctx) {
    var T = today();
    var pre = ctx.params.jewel && q.jewel(ctx.params.jewel) ? q.jewelStats(ctx.params.jewel) : null;
    var avail = q.jewelList().filter(function (j) { return j.status === 'available'; });
    var from = T;
    if (pre && pre.status === 'out') from = D.add(pre.active.due, 1);
    var due = D.add(from, 3);
    return h`<form class="jw-rent" novalidate autocomplete="off">
      <fieldset class="jw-fs">
        <legend class="jw-legend">Piece</legend>
        <div data-piece-sel>${pre ? selectedPiece(pre, true) : ''}</div>
        ${pre && pre.status === 'overdue' ? h`<div class="banner banner-danger">${I('alert-triangle')}<div>Not back yet — ${pre.active.client} is ${F.plural(pre.overdueDays, 'day')} late. <button type="button" class="link" data-open="return" data-p-rental="${pre.active.id}">Return it first</button></div></div>` : ''}
        ${pre && pre.status === 'out' ? h`<p class="hint">With ${pre.active.client} till ${F.date(pre.active.due, 'dow')}.</p>` : ''}
        <div class="jw-pick" data-piece-grid role="radiogroup" aria-label="Choose a piece" ${pre ? KM.raw('hidden') : ''}>${avail.map(function (j) { return pickTile(j, pre && pre.id); })}</div>
      </fieldset>

      <fieldset class="jw-fs">
        <legend class="jw-legend">Client</legend>
        <div class="form-grid cols-2">
          <label class="field"><span class="label">Mobile number <span class="req">*</span></span>
            <span class="input-group jw-tel-in"><span class="input-prefix">+91</span><input class="input" name="phone" type="tel" inputmode="numeric" maxlength="14" placeholder="98400 00000" ${pre ? KM.raw('autofocus') : ''} aria-describedby="jw-hint-phone"></span>
            <span class="hint" id="jw-hint-phone" data-hint="phone"></span></label>
          <label class="field"><span class="label">Name <span class="req">*</span></span><input class="input" name="client" placeholder="Bride's name" aria-describedby="jw-hint-client"><span class="hint" id="jw-hint-client" data-hint="client"></span></label>
        </div>
        <div class="field"><span class="label" id="jw-bk-l">Link to a booking <span class="subtle">(optional)</span></span>
          <div class="jw-bks" data-bks role="radiogroup" aria-labelledby="jw-bk-l"></div></div>
      </fieldset>

      <fieldset class="jw-fs">
        <legend class="jw-legend">Dates</legend>
        <div class="form-grid cols-2 jw-two">
          <label class="field"><span class="label">Hand over</span><input class="input" type="date" name="from" value="${from}" min="${T}"></label>
          <label class="field"><span class="label">Return by</span><input class="input" type="date" name="due" value="${due}" min="${T}" aria-describedby="jw-hint-due"><span class="hint" id="jw-hint-due" data-hint="due"></span></label>
        </div>
      </fieldset>

      <fieldset class="jw-fs">
        <legend class="jw-legend">Rent &amp; deposit</legend>
        <div class="form-grid cols-2 jw-two">
          <label class="field"><span class="label">Rent</span><span class="input-group"><span class="input-prefix">₹</span><input class="input num" name="fee" inputmode="numeric" value="${pre ? pre.fee : ''}"></span></label>
          <label class="field"><span class="label">Refundable deposit</span><span class="input-group"><span class="input-prefix">₹</span><input class="input num" name="deposit" inputmode="numeric" value="${pre ? pre.deposit : ''}"></span></label>
        </div>
        <div class="field"><span class="label" id="jw-mode-l">Collected by</span>
          <div class="seg is-block" role="radiogroup" aria-labelledby="jw-mode-l">
            <button type="button" class="seg-item" role="radio" data-mode="cash">${I('cash')} Cash</button>
            <button type="button" class="seg-item" role="radio" data-mode="upi">${I('device-mobile-dollar')} UPI / GPay</button>
          </div></div>
      </fieldset>
    </form>`;
  }
  function rentFoot() {
    return h`<button type="button" class="btn btn-secondary jw-foot-cancel" data-close>Cancel</button>
      <button type="button" class="btn btn-primary" data-rent-save><span data-save-label>Rent out</span></button>`;
  }

  function rentMount(el, ctx) {
    var body = el.querySelector('.ov-body'), foot = el.querySelector('.ov-foot');
    var form = body.querySelector('.jw-rent');
    if (!form) return;
    var T = today();
    var pre = ctx.params.jewel && q.jewel(ctx.params.jewel) ? ctx.params.jewel : null;
    var s = { jewel: pre, booking: null, mode: 'upi', autoName: false };
    var $ = function (sel) { return form.querySelector(sel); };
    function setHint(k, text, tone) { var x = form.querySelector('[data-hint="' + k + '"]'); if (!x) return; x.textContent = text || ''; x.className = 'hint' + (tone ? ' is-' + tone : ''); }

    function overlaps(b, from, due) { return b.start <= due && b.end >= from; }
    function renderBookings() {
      var from = $('[name=from]').value || T, due = $('[name=due]').value || from;
      var ups = q.upcoming().filter(function (b) { return b.state !== 'cancelled'; });
      ups.sort(function (a, b) { return (overlaps(b, from, due) ? 1 : 0) - (overlaps(a, from, due) ? 1 : 0) || a.start.localeCompare(b.start); });
      var shown = ups.slice(0, 4);
      if (s.booking && !shown.some(function (b) { return b.id === s.booking; })) { var sb = q.booking(s.booking); if (sb) shown.unshift(sb); }
      // bookings that overlap the rental dates come first; the date is in the meta line, the link is the selected border
      form.querySelector('[data-bks]').innerHTML = String(h`${shown.map(function (b) {
        var on = s.booking === b.id;
        return h`<button type="button" class="jw-bk ${on ? 'is-selected' : ''}" role="radio" aria-checked="${on ? 'true' : 'false'}" data-bk="${b.id}">
          ${KM.avatar(b.client, 'avatar-sm')}
          <span class="jw-bk-text"><span class="strong small">${b.client}</span><span class="subtle xsmall">${b.title} · ${F.date(b.start, 'dow')}</span></span>
          ${on ? I('check', { size: 16 }) : ''}
        </button>`;
      })}`);
    }

    function sync() {
      var j = s.jewel ? q.jewel(s.jewel) : null;
      form.querySelectorAll('[data-jewel]').forEach(function (b) { var on = b.getAttribute('data-jewel') === s.jewel; b.classList.toggle('is-selected', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
      form.querySelectorAll('[data-mode]').forEach(function (b) { var on = b.getAttribute('data-mode') === s.mode; b.classList.toggle('is-active', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
      var from = $('[name=from]').value, due = $('[name=due]').value;
      var days = from && due ? D.diff(due, from) : 0;
      if (from && due && days <= 0) setHint('due', 'Return date must be after the hand-over date', 'err');
      else if (from && due) setHint('due', F.plural(days, 'day'));
      renderBookings();
      // the total collected now lives on the save button — no separate summary box
      var fee = num($('[name=fee]').value), dep = num($('[name=deposit]').value);
      var lbl = foot && foot.querySelector('[data-save-label]');
      if (lbl) lbl.textContent = j ? 'Rent out · collect ' + F.inr(fee + dep) : 'Rent out';
    }

    function choose(id) {
      var j = q.jewel(id); if (!j) return;
      s.jewel = id;
      $('[name=fee]').value = String(j.fee);
      $('[name=deposit]').value = String(j.deposit);
      sync();
    }

    function onPhone() {
      var d = digits($('[name=phone]').value);
      if (d.length < 10) { setHint('phone', ''); return; }
      var f = lookup(d), nameEl = $('[name=client]');
      if (!f) { setHint('phone', 'New client — add her name.', 'good'); if (s.autoName) { nameEl.value = ''; s.autoName = false; } return; }
      if (!nameEl.value || s.autoName) { nameEl.value = f.name; s.autoName = true; }
      setHint('phone', f.src + ' · ' + f.name + (f.area ? ', ' + f.area : '') + ' — filled in.', 'good');
      if (f.booking && !s.booking) s.booking = f.booking;
      sync();
    }

    function pickBooking(id) {
      if (s.booking === id) { s.booking = null; sync(); return; }
      var b = q.booking(id); if (!b) return;
      s.booking = id;
      var nameEl = $('[name=client]'), phEl = $('[name=phone]');
      if (digits(phEl.value) !== b.phone) { phEl.value = F.phone(b.phone); nameEl.value = b.client; s.autoName = true; setHint('phone', 'Bridal client · ' + b.client + ' — filled in from the booking.', 'good'); }
      var from = D.diff(D.add(b.start, -1), T) >= 0 ? D.add(b.start, -1) : T;
      $('[name=from]').value = from;
      $('[name=due]').value = D.add(b.end, 1) > from ? D.add(b.end, 1) : D.add(from, 1);
      sync();
    }

    form.addEventListener('submit', function (e) { e.preventDefault(); save(); });
    form.addEventListener('click', function (e) {
      var t = e.target.closest('[data-jewel],[data-mode],[data-bk],[data-change-piece]');
      if (!t) return;
      e.preventDefault();
      if (t.hasAttribute('data-jewel')) choose(t.getAttribute('data-jewel'));
      else if (t.hasAttribute('data-mode')) { s.mode = t.getAttribute('data-mode'); sync(); }
      else if (t.hasAttribute('data-bk')) pickBooking(t.getAttribute('data-bk'));
      else if (t.hasAttribute('data-change-piece')) {
        var g = form.querySelector('[data-piece-grid]'); g.hidden = !g.hidden;
        t.textContent = g.hidden ? 'Change' : 'Done';
      }
    });
    form.addEventListener('input', function (e) {
      var n = e.target.name;
      if (n === 'phone') onPhone();
      else if (n === 'client') { s.autoName = false; setHint('client', ''); }
      else sync();
    });
    form.addEventListener('change', function (e) {
      var n = e.target.name;
      if (n === 'from') {
        var f = $('[name=from]').value, d = $('[name=due]').value;
        if (f && (!d || d <= f)) $('[name=due]').value = D.add(f, 3);
        sync();
      }
      if (n === 'due') sync();
    });
    form.querySelector('[data-piece-grid]').addEventListener('click', function (e) {
      var t = e.target.closest('[data-jewel]');
      if (t && pre) { form.querySelector('[data-piece-sel]').innerHTML = String(selectedPiece(q.jewelStats(t.getAttribute('data-jewel')), true)); }
    });

    function save() {
      var j = s.jewel ? q.jewel(s.jewel) : null;
      if (!j) { KM.toast('Choose a piece first', { kind: 'warn' }); var g = form.querySelector('[data-piece-grid]'); g.hidden = false; var f1 = g.querySelector('button'); if (f1) f1.focus(); return; }
      var phone = digits($('[name=phone]').value), client = $('[name=client]').value.trim();
      if (phone.length !== 10) { setHint('phone', 'Enter a 10-digit mobile number', 'err'); $('[name=phone]').focus(); return; }
      if (!client) { setHint('client', 'Add the client\'s name', 'err'); $('[name=client]').focus(); return; }
      var from = $('[name=from]').value || T, due = $('[name=due]').value;
      if (!due || due <= from) { setHint('due', 'Return date must be after the hand-over date', 'err'); $('[name=due]').focus(); return; }
      var fee = num($('[name=fee]').value), dep = num($('[name=deposit]').value);
      var r = q.rentJewel(j.id, { client: client, phone: phone, from: from, due: due, fee: fee || j.fee, deposit: dep || j.deposit });
      r.mode = s.mode;
      if (s.booking) r.booking = s.booking;
      KM.toast(short(j) + ' rented to ' + first(client) + ' · back by ' + F.date(due, 'dow'), { kind: 'success' });
      done(j, r);
    }

    function done(j, r) {
      var title = el.querySelector('.ov-title'); if (title) title.textContent = 'Handed over';
      var bk = r.booking ? q.booking(r.booking) : null;
      body.innerHTML = String(h`<div class="jw-done">
        <div class="jw-done-top">${photo(j, 'is-sel')}<div><div class="strong">With ${first(r.client)} till ${F.date(r.due, 'dow')}</div>
          <div class="subtle small">${F.inr(r.fee)} rent + ${F.inr(r.deposit)} deposit by ${r.mode === 'cash' ? 'cash' : 'UPI'}${bk ? h` · for ${first(bk.client)}'s ${bk.title}` : ''}</div></div></div>
        <div class="wa-preview">${receiptText(j, r)}</div>
        <a class="btn btn-wa btn-block" href="${KM.wa(r.phone, receiptText(j, r))}" target="_blank" rel="noopener">${I('brand-whatsapp')} Send receipt to ${first(r.client)}</a>
      </div>`);
      if (foot) foot.innerHTML = String(h`<button type="button" class="btn btn-secondary" data-close-go="/jewels/${j.id}">View piece</button><button type="button" class="btn btn-primary" data-close>Done</button>`);
    }

    if (foot) { var sv = foot.querySelector('[data-rent-save]'); if (sv) sv.addEventListener('click', save); }
    sync();
  }

  KM.overlay('rent', {
    title: function (ctx) { return ctx.params.jewel && q.jewel(ctx.params.jewel) ? 'Rent this piece' : 'Rent a jewel'; },
    kind: 'sheet', role: 'owner',
    render: rentBody, footer: rentFoot, mount: rentMount
  });

  /* =========================================================================
     Overlay: return (inspection → deposit refund)
     ========================================================================= */
  var CHECKS = [['stones', 'All stones intact'], ['clasp', 'Clasp OK'], ['clean', 'Cleaned'], ['polish', 'Needs polish'], ['damaged', 'Damaged']];

  function returnPicker() {
    var rs = KM.data.rentals.filter(function (r) { return r.status === 'out'; }).sort(function (a, b) { return a.due.localeCompare(b.due); });
    if (!rs.length) return h`<div class="empty"><div class="empty-title">Nothing is out on rent</div><div class="empty-body">Every piece is back in the studio.</div></div>`;
    return h`<div class="stack-sm">${rs.map(function (r) {
      var j = q.jewel(r.jewel), late = D.diff(today(), r.due);
      return h`<button type="button" class="jw-bk" data-open="return" data-p-rental="${r.id}">
        ${photo(j, 'is-mini')}
        <span class="jw-bk-text"><span class="strong small">${short(j)}</span><span class="subtle xsmall">${r.client} · due ${F.date(r.due, 'dow')}</span></span>
        ${late > 0 ? h`<span class="badge badge-danger">${F.plural(late, 'day')} late</span>` : ''}
      </button>`;
    })}</div>`;
  }

  function returnBody(ctx) {
    var r = rental(ctx.params.rental);
    if (!r || r.status !== 'out') {
      return h`${r ? h`<p class="small muted jw-gap">That rental was already returned on ${F.date(r.returned, 'dow')}. Which piece came back?</p>` : ''}${returnPicker()}`;
    }
    var j = q.jewel(r.jewel), late = Math.max(0, D.diff(today(), r.due));
    return h`<form class="jw-ret" novalidate autocomplete="off">
      <div class="jw-ret-top">${photo(j, 'is-sel')}
        <div class="jw-ret-who"><div class="small">Rented ${F.date(r.from, 'dow')} · due ${F.date(r.due, 'dow')}</div>
          ${late ? h`<div class="small jw-late-text">${F.plural(late, 'day')} late</div>` : h`<div class="small subtle">Back on time</div>`}</div></div>

      <fieldset class="jw-fs">
        <legend class="jw-legend">Condition check</legend>
        <div class="chips" role="group" aria-label="Condition">${CHECKS.map(function (c) {
          return h`<button type="button" class="chip jw-check ${c[0] === 'damaged' ? 'is-danger' : ''}" data-check="${c[0]}" aria-pressed="false">${c[1]}</button>`;
        })}</div>
        <span class="hint" data-hint="checks"></span>
      </fieldset>

      <fieldset class="jw-fs" data-damage hidden>
        <legend class="jw-legend">Damage deduction</legend>
        <div class="form-grid cols-2">
          <label class="field"><span class="label">Deduct from deposit</span><span class="input-group"><span class="input-prefix">₹</span><input class="input num" name="damage" inputmode="numeric" value="0" aria-describedby="jw-hint-dmg"></span>
            <span class="hint" id="jw-hint-dmg" data-hint="damage"></span></label>
          <label class="field"><span class="label">What's damaged?</span><input class="input" name="note" placeholder="e.g. 2 kemp stones missing"></label>
        </div>
        <div class="chips">${[200, 500, 1000, 2000].filter(function (a) { return a <= r.deposit; }).map(function (a) {
          return h`<button type="button" class="chip no-check" data-dmg="${a}">${F.inr(a)}</button>`;
        })}</div>
        <div class="kv jw-refund" data-refund aria-live="polite"></div>
      </fieldset>

      <div class="field"><span class="label" id="jw-rmode-l">Refund by</span>
        <div class="seg is-block" role="radiogroup" aria-labelledby="jw-rmode-l">
          <button type="button" class="seg-item" role="radio" data-mode="cash">${I('cash')} Cash</button>
          <button type="button" class="seg-item" role="radio" data-mode="upi">${I('device-mobile-dollar')} UPI / GPay</button>
        </div></div>
    </form>`;
  }
  function returnFoot(ctx) {
    var r = rental(ctx.params.rental);
    if (!r || r.status !== 'out') return '';
    return h`<button type="button" class="btn btn-secondary jw-foot-cancel" data-close>Cancel</button>
      <button type="button" class="btn btn-primary" data-ret-save><span data-save-label>Return</span></button>`;
  }
  function returnMount(el, ctx) {
    var r = rental(ctx.params.rental);
    var form = el.querySelector('.jw-ret'), foot = el.querySelector('.ov-foot');
    if (!r || !form) return;
    var j = q.jewel(r.jewel);
    var s = { checks: {}, mode: 'cash' };
    var $ = function (sel) { return form.querySelector(sel); };
    function setHint(k, text, tone) { var x = form.querySelector('[data-hint="' + k + '"]'); if (!x) return; x.textContent = text || ''; x.className = 'hint' + (tone ? ' is-' + tone : ''); }
    function deduction() { return s.checks.damaged ? Math.min(r.deposit, num($('[name=damage]').value)) : 0; }
    function sync() {
      form.querySelectorAll('[data-check]').forEach(function (b) { var on = !!s.checks[b.getAttribute('data-check')]; b.classList.toggle('is-selected', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
      form.querySelectorAll('[data-mode]').forEach(function (b) { var on = b.getAttribute('data-mode') === s.mode; b.classList.toggle('is-active', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
      $('[data-damage]').hidden = !s.checks.damaged;
      var typed = num($('[name=damage]').value);
      setHint('damage', s.checks.damaged && typed > r.deposit ? 'Capped at the ' + F.inr(r.deposit) + ' deposit' : '', 'warn');
      form.querySelectorAll('[data-dmg]').forEach(function (b) { b.classList.toggle('is-selected', +b.getAttribute('data-dmg') === typed); });
      var ded = deduction(), refund = r.deposit - ded;
      // the breakdown only matters when something is deducted; the refund itself is on the save button
      $('[data-refund]').innerHTML = String(s.checks.damaged ? h`
        <div class="kv-row"><span>Deposit held</span><span class="num">${F.inr(r.deposit)}</span></div>
        <div class="kv-row"><span>Damage</span><span class="num ${ded ? 'jw-dmg' : ''}">${ded ? '−' + F.inr(ded) : F.inr(0)}</span></div>` : '');
      var lbl = foot && foot.querySelector('[data-save-label]');
      if (lbl) lbl.textContent = 'Return · refund ' + F.inr(refund);
    }
    form.addEventListener('submit', function (e) { e.preventDefault(); save(); });
    form.addEventListener('click', function (e) {
      var t = e.target.closest('[data-check],[data-mode],[data-dmg]');
      if (!t) return;
      e.preventDefault();
      if (t.hasAttribute('data-check')) {
        var k = t.getAttribute('data-check');
        s.checks[k] = !s.checks[k];
        setHint('checks', '');
        if (k === 'damaged' && s.checks[k]) setTimeout(function () { var d = $('[name=damage]'); if (d) { d.focus(); d.select(); } }, 30);
      }
      if (t.hasAttribute('data-mode')) s.mode = t.getAttribute('data-mode');
      if (t.hasAttribute('data-dmg')) $('[name=damage]').value = t.getAttribute('data-dmg');
      sync();
    });
    form.addEventListener('input', sync);
    function save() {
      var picked = Object.keys(s.checks).filter(function (k) { return s.checks[k]; });
      if (!picked.length) { setHint('checks', 'Tick at least one condition check before returning the deposit', 'err'); var c1 = form.querySelector('[data-check]'); if (c1) c1.focus(); return; }
      var ded = deduction();
      var late = Math.max(0, D.diff(today(), r.due));
      var res = q.returnJewel(r.id, ded);
      if (res) {
        res.condition = picked; res.refundMode = s.mode; res.lateDays = late;
        var note = $('[name=note]').value.trim(); if (note && s.checks.damaged) res.damageNote = note;
      }
      KM.toast(short(j) + ' is back ✓ · ' + F.inr(r.deposit - ded) + ' refunded to ' + first(r.client) + (ded ? ' (−' + F.inr(ded) + ' damage)' : ''), { kind: 'success' });
      KM.close();
    }
    if (foot) { var sv = foot.querySelector('[data-ret-save]'); if (sv) sv.addEventListener('click', save); }
    sync();
  }

  KM.overlay('return', {
    title: 'Return check-in',
    sub: function (ctx) { var r = rental(ctx.params.rental); return r && r.status === 'out' ? KM.esc(short(q.jewel(r.jewel)) + ' · ' + r.client) : ''; },
    kind: 'sheet', role: 'owner',
    render: returnBody, footer: returnFoot, mount: returnMount
  });
})();

</script>
<script data-screen="login">
/* ===== screens/login.js ===== */
/* #/login — the app's entry screen: brand panel + "who's opening the app?" + 4-digit PIN keypad.
   Owner PIN unlocks the full studio app; staff PINs open the staff portal only (the old app let staff
   wander into owner menus). Covers the shell with a fixed full-viewport panel on this screen only. */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, q = KM.q;
  var OWNER_PIN = '1610';
  var st = { who: null, pin: '', tries: 0, busy: false, err: '' };

  function people() {
    return [{ id: 'owner', name: 'Kalai', role: 'Owner', pin: OWNER_PIN, owner: true }].concat(KM.data.staff.map(function (s) {
      return { id: s.id, name: s.name, role: s.role, pin: s.pin };
    }));
  }
  function person(id) { return people().filter(function (p) { return p.id === id; })[0] || null; }
  function avatar(p, cls) { return p.owner ? h`<span class="avatar is-gold ${cls || ''}" aria-hidden="true">K</span>` : KM.avatar(p.name, cls); }

  /* lotus kolam: two rings of pointed petals, a scalloped band and a dotted outer ring */
  function mandala() {
    var s = '', i, a, dots = '', scallop = '';
    var big = 'M200 152 C 226 120 230 78 200 30 C 170 78 174 120 200 152 Z';
    var mid = 'M200 152 C 214 132 216 104 200 78 C 184 104 186 132 200 152 Z';
    var small = 'M200 160 C 210 146 211 128 200 112 C 189 128 190 146 200 160 Z';
    for (i = 0; i < 12; i++) s += '<path d="' + big + '" transform="rotate(' + (i * 30) + ' 200 200)"/><path d="' + mid + '" transform="rotate(' + (i * 30) + ' 200 200)"/>';
    for (i = 0; i < 12; i++) s += '<path d="' + small + '" transform="rotate(' + (i * 30 + 15) + ' 200 200)"/>';
    for (i = 0; i < 36; i++) { a = (i * 10) * Math.PI / 180; var b = ((i + 1) * 10) * Math.PI / 180, m = (i * 10 + 5) * Math.PI / 180;
      scallop += (i ? ' Q ' : 'M ' + (200 + 172 * Math.sin(a)).toFixed(1) + ' ' + (200 - 172 * Math.cos(a)).toFixed(1) + ' Q ') +
        (200 + 184 * Math.sin(m)).toFixed(1) + ' ' + (200 - 184 * Math.cos(m)).toFixed(1) + ' ' + (200 + 172 * Math.sin(b)).toFixed(1) + ' ' + (200 - 172 * Math.cos(b)).toFixed(1); }
    for (i = 0; i < 36; i++) { a = (i * 10 + 5) * Math.PI / 180; dots += '<circle cx="' + (200 + 194 * Math.sin(a)).toFixed(1) + '" cy="' + (200 - 194 * Math.cos(a)).toFixed(1) + '" r="2.2"/>'; }
    for (i = 0; i < 12; i++) { a = (i * 30 + 15) * Math.PI / 180; dots += '<circle cx="' + (200 + 150 * Math.sin(a)).toFixed(1) + '" cy="' + (200 - 150 * Math.cos(a)).toFixed(1) + '" r="3"/>'; }
    return KM.raw('<svg class="lg-mandala" viewBox="0 0 400 400" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round">' + s +
      '<circle cx="200" cy="200" r="30"/><circle cx="200" cy="200" r="44"/><circle cx="200" cy="200" r="166"/><path d="' + scallop + '"/></g><g fill="currentColor">' + dots +
      '<circle cx="200" cy="200" r="9"/></g></svg>');
  }

  function stageWho() {
    var ps = people(), owner = ps[0], staff = ps.slice(1);
    return h`<div class="lg-step" data-lg-step="who" tabindex="-1">
      <h2 class="lg-h">Who’s opening the app?</h2>
      <button class="lg-owner" data-lg-who="owner">${avatar(owner, 'avatar-lg')}<span class="lg-owner-text"><b>Kalai</b><span>Owner</span></span>${I('chevron-right')}</button>
      <div class="lg-divider"><span>Team</span></div>
      <div class="lg-staff">${staff.map(function (p) {
        return h`<button class="lg-person" data-lg-who="${p.id}">${avatar(p, 'avatar-lg')}<b>${p.name.split(' ')[0]}</b><span class="lg-role">${p.role}</span></button>`;
      })}</div>
    </div>`;
  }
  function dots() {
    return h`${[0, 1, 2, 3].map(function (i) { return h`<span class="pin-dot ${i < st.pin.length ? 'is-filled' : ''}"></span>`; })}`;
  }
  function stagePin() {
    var p = person(st.who);
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
    return h`<div class="lg-step" data-lg-step="pin" tabindex="-1">
      <button class="lg-back" data-lg-back>${I('arrow-left')} Not ${p.name.split(' ')[0]}?</button>
      <div class="lg-sel">${avatar(p, 'avatar-lg')}<div><div class="lg-sel-name">${p.owner ? 'Kalai' : p.name}</div><div class="subtle small">${p.owner ? 'Owner' : p.role}</div></div></div>
      <div class="lg-pin-label" id="lg-pin-l">Enter your 4-digit PIN</div>
      <div class="pin lg-pin" role="status" aria-labelledby="lg-pin-l" aria-label="${st.pin.length} of 4 digits entered">${dots()}</div>
      <div class="lg-err" role="alert">${st.err}</div>
      <div class="keypad lg-keypad">
        ${keys.map(function (k) { return h`<button class="key" data-lg-key="${k}">${k}</button>`; })}
        <button class="key is-ghost" data-lg-key="clear">Clear</button>
        <button class="key" data-lg-key="0">0</button>
        <button class="key is-ghost" data-lg-key="back" aria-label="Delete last digit">${I('backspace')}</button>
      </div>
      <p class="lg-hint">Prototype PINs: <b>1610</b> owner · <b>1111</b> Meena</p>
    </div>`;
  }

  function paint() {
    var card = document.querySelector('.scr-login [data-lg-card]');
    if (!card) return;
    card.innerHTML = String(st.who ? stagePin() : stageWho());
    // the button that was pressed is gone: move focus to the new step itself (no ring on a tile that wasn't chosen)
    var f = card.querySelector('.lg-step');
    if (f) try { f.focus({ preventScroll: true }); } catch (e) {}
  }
  function paintPin() {
    var pin = document.querySelector('.scr-login .lg-pin'), err = document.querySelector('.scr-login .lg-err');
    if (pin) { pin.innerHTML = String(dots()); pin.setAttribute('aria-label', st.pin.length + ' of 4 digits entered'); }
    if (err) err.textContent = st.err;
  }

  function press(k) {
    if (st.busy || !st.who) return;
    if (k === 'back') st.pin = st.pin.slice(0, -1);
    else if (k === 'clear') st.pin = '';
    else if (/^\d$/.test(k) && st.pin.length < 4) st.pin += k;
    st.err = '';
    paintPin();
    if (st.pin.length === 4) verify();
  }
  function verify() {
    var p = person(st.who), pinEl = document.querySelector('.scr-login .lg-pin');
    st.busy = true;
    if (st.pin === p.pin) {
      if (pinEl) pinEl.classList.add('is-ok');
      setTimeout(function () {
        var who = st.who;
        st = { who: null, pin: '', tries: 0, busy: false, err: '' };
        if (who === 'owner') { KM.setRole('owner'); KM.toast('Welcome back, Kalai 👑', { kind: 'success' }); }
        else { KM.setRole('staff', who); KM.toast('Vanakkam, ' + q.firstName(who) + '! Have a lovely day ✨', { kind: 'success' }); }
      }, 380);
      return;
    }
    st.tries++;
    if (pinEl) { pinEl.classList.remove('is-shake'); void pinEl.offsetWidth; pinEl.classList.add('is-shake'); }
    setTimeout(function () {
      st.pin = '';
      st.busy = false;
      st.err = st.tries >= 3 ? (p.owner ? 'Still not right. Use the demo PIN 1610.' : 'Forgot your PIN? Ask Kalai to reset it from Team.') : 'That PIN didn’t match. Try again.';
      paintPin();
    }, 420);
  }

  KM.screen('login', {
    title: 'Sign in', icon: 'lock', role: 'any',
    render: function (ctx) {
      var pre = ctx.query.who && person(ctx.query.who) ? ctx.query.who : null;
      st = { who: pre, pin: '', tries: 0, busy: false, err: '' };
      var studio = KM.data.settings.studio;
      return h`<section class="lg" aria-label="Sign in to ${studio.name}">
        <div class="lg-art">
          ${mandala()}
          <div class="lg-art-inner">
            <span class="lg-mark" aria-hidden="true">K</span>
            <h1 class="lg-brand">${studio.name}</h1>
            <p class="lg-tag">${studio.tagline}</p>
          </div>
        </div>
        <div class="lg-panel">
          <div class="lg-card" data-lg-card>${pre ? stagePin() : stageWho()}</div>
        </div>
      </section>`;
    },
    mount: function (root) {
      // land on the step (not on the owner tile, which looked pre-selected with a focus ring)
      var f = root.querySelector('.lg-step');
      if (f) setTimeout(function () { try { f.focus({ preventScroll: true }); } catch (e) {} }, 80);
    }
  });

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.scr-login')) return;
    var t;
    if ((t = e.target.closest('[data-lg-who]'))) { st = { who: t.getAttribute('data-lg-who'), pin: '', tries: 0, busy: false, err: '' }; paint(); return; }
    if (e.target.closest('[data-lg-back]')) { st = { who: null, pin: '', tries: 0, busy: false, err: '' }; paint(); return; }
    if ((t = e.target.closest('[data-lg-key]'))) press(t.getAttribute('data-lg-key'));
  });
  document.addEventListener('keydown', function (e) {
    if (!st.who || !document.querySelector('.scr-login [data-lg-step="pin"]') || document.querySelector('.ov, .cf')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^\d$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Escape') { st = { who: null, pin: '', tries: 0, busy: false, err: '' }; paint(); }
  });
})();

</script>
<script data-screen="money">
/* ===== screens/money.js ===== */
/* Money — who owes you, what you spent, whether the drawer matches the books, and every scanned bill.
   Each fact once: the KPI row holds the totals, the tabs hold the lists. The one create action per tab is
   `primary` (top-bar button / first item in the + menu): Collect payment · Add expense · Count drawer · Scan a bill.
   Screen: #/money?tab=dues|expenses|drawer|bills   Overlays: collect · expense · scan · drawer */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  /* ================================================================ helpers */
  function today() { return KM.state.today; }
  var CAT_ICON = {};
  KM.data.expenseCats.forEach(function (c) { CAT_ICON[c.name] = c.icon; });
  function catIcon(n) { return CAT_ICON[n] || 'receipt-2'; }
  function firstOf(name) { return String(name || '').split(' ')[0]; }
  function amt(v) { var n = parseFloat(String(v == null ? '' : v).replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : Math.round(n); }
  function byDateDesc(a, b) { return b.date.localeCompare(a.date); }
  function modeText(m) { return m === 'cash' ? 'Cash' : 'UPI'; }
  function link(query) {
    var s = new URLSearchParams();
    Object.keys(query).forEach(function (k) { if (query[k]) s.set(k, query[k]); });
    var t = s.toString();
    return '#/money' + (t ? '?' + t : '');
  }
  function seg(name, options, value, label) {
    return h`<div class="seg is-block" role="radiogroup" aria-label="${label}" data-seg="${name}">${options.map(function (o) {
      var on = o[0] === value;
      return h`<button type="button" class="seg-item ${on ? 'is-active' : ''}" role="radio" aria-checked="${on ? 'true' : 'false'}" data-val="${o[0]}">${o[1]}</button>`;
    })}</div>`;
  }
  function wireSeg(root, name, onChange) {
    var s = root.querySelector('[data-seg="' + name + '"]');
    if (!s) return function () { return null; };
    s.addEventListener('click', function (e) {
      var b = e.target.closest('[data-val]'); if (!b) return;
      s.querySelectorAll('[data-val]').forEach(function (x) { var on = x === b; x.classList.toggle('is-active', on); x.setAttribute('aria-checked', on ? 'true' : 'false'); });
      if (onChange) onChange(b.getAttribute('data-val'));
    });
    return function () { var a = s.querySelector('.is-active'); return a ? a.getAttribute('data-val') : null; };
  }
  function remindText(d) {
    return KM.data.settings.templates.reminder.replace('{name}', firstOf(d.name)).replace('{amount}', F.inr(d.amount)).replace('{what}', d.what);
  }
  function profileHref(d) {
    return d.kind === 'booking' ? '#/bookings/' + d.ref : d.kind === 'academy' ? '#/academy/' + d.ref : '#/customers/' + d.ref;
  }

  /* ---------- dues: two groups by urgency (same "overdue" as Today's KPI and Needs attention) ---------- */
  function duesSplit() {
    var all = q.dues();
    return {
      all: all,
      // largest first, the same order as Today's "Needs attention", so "See all" doesn't reshuffle the rows just seen
      late: all.filter(function (d) { return !d.upcoming; }).sort(function (a, b) { return b.amount - a.amount; }),
      ahead: all.filter(function (d) { return d.upcoming; }).sort(function (a, b) { return a.date.localeCompare(b.date); })
    };
  }
  function daysTo(d) { return D.diff(d.date, today()); }
  function dueMeta(d, badged) {
    if (d.upcoming) {
      var n = daysTo(d), ev = d.kind === 'academy' ? 'instalment' : 'function';
      if (n <= 0) return badged ? d.what : d.what + ' · ' + ev + ' today'; // the row's "Today" badge already says it
      return d.what + ' · ' + (n === 1 ? ev + ' tomorrow' : (d.kind === 'academy' ? 'due ' : '') + F.date(d.date) + ' · in ' + n + ' days');
    }
    return d.what + ' · ' + (d.age > 0 ? F.plural(d.age, 'day') + ' late' : 'due today');
  }
  function findDue(kind, id) { return q.dues().filter(function (d) { return d.kind === kind && d.id === id; })[0] || null; }

  /* ---------- cash drawer maths (opening + collections − expenses = expected) ---------- */
  function balanceFor(ym) { return KM.data.balances.filter(function (b) { return b.month === ym; })[0] || null; }
  function drawerCalc(ym, to) {
    var bal = balanceFor(ym);
    if (!bal) return null;
    var r = { from: ym + '-01', to: to };
    var p = q.pnl(r);
    var ex = q.expensesIn(r);
    var cashEx = q.sum(ex.filter(function (e) { return e.mode === 'cash'; }), function (e) { return e.amount; });
    var upiEx = q.sum(ex.filter(function (e) { return e.mode !== 'cash'; }), function (e) { return e.amount; });
    var wages = p.expenseCats['Event staff wages'] || 0; // event-day wages are handed over in cash
    return { bal: bal, to: to, cashIn: p.cash, upiIn: p.upi, cashEx: cashEx, upiEx: upiEx, wages: wages,
      expCash: bal.openCash + p.cash - cashEx - wages, expUpi: bal.openUpi + p.upi - upiEx };
  }
  /** difference as one short, quiet phrase: only a gap gets colour */
  function diffText(diff) {
    if (Math.abs(diff) < 1) return h`<span class="subtle">Matches</span>`;
    return h`<span class="mn-dtag ${diff < 0 ? 'is-short' : 'is-extra'}">${F.inr(Math.abs(diff))} ${diff < 0 ? 'short' : 'extra'}</span>`;
  }
  function bigGap(diff, expected) { return Math.abs(diff) > Math.max(2000, Math.abs(expected) * 0.1); }

  /* ---------- local mutations (core has no helper for these) ---------- */
  function collectVisitPart(vid, amount, mode) {
    var v = KM.data.visits.filter(function (x) { return x.id === vid; })[0];
    if (!v) return;
    if (amount >= v.due) { q.collectVisitDue(vid, mode); return; }
    v.paid[mode === 'cash' ? 'cash' : 'upi'] += amount; v.received += amount; v.due -= amount;
    KM.emit('data:changed', 'visit');
  }
  function patchLastPayment(list, date, note) {
    var p = list[list.length - 1]; if (!p) return false;
    var ch = false;
    if (date && p.date !== date) { p.date = date; ch = true; }
    if (note && p.note !== note) { p.note = note; ch = true; }
    return ch;
  }

  /* ================================================================ receipt card (bills tab + scan overlay) */
  function receipt(b, o) {
    o = o || {};
    var sum = q.sum(b.items, function (i) { return i.amount; });
    var exp = KM.data.expenses.filter(function (e) { return e.bill === b.id; })[0];
    return h`<article class="mn-receipt ${o.focus ? 'is-focus' : ''} ${o.mini ? 'is-mini' : ''}" id="bill-${b.id}" aria-label="Bill from ${b.store}, ${F.date(b.date, 'dmy')}, ${F.inr(b.total)}">
      <div class="mn-rc-paper">
        <div class="mn-rc-store">${b.store}</div>
        <div class="mn-rc-date">${F.date(b.date, 'long')}</div>
        <ul class="mn-rc-items">${b.items.map(function (it) {
          return h`<li><span class="mn-rc-name">${it.name}</span><span class="mn-rc-lead" aria-hidden="true"></span><span class="num">${F.inr(it.amount)}</span></li>`;
        })}</ul>
        <div class="mn-rc-total"><span>Total</span><span class="num">${F.inr(b.total)}</span></div>
      </div>
      ${o.mini ? '' : h`<div class="mn-rc-foot">
        <span>${exp ? exp.cat + ' · ' + modeText(exp.mode) : 'Not saved as an expense'}</span>
        ${sum !== b.total ? h`<span class="mn-rc-warn">Items ${F.inr(sum)} ≠ total</span>` : ''}
      </div>`}
    </article>`;
  }

  /* ================================================================ MONEY SCREEN */
  function kpis() {
    var ym = today().slice(0, 7);
    var m = q.pnl('month'), lm = q.pnl('last-month');
    var g = duesSplit();
    var dc = drawerCalc(ym, today());
    var wages = m.expenseCats['Event staff wages'] || 0;
    var lateSum = q.sum(g.late, function (d) { return d.amount; });
    return h`<section class="kpi-row mn-kpis" aria-label="This month at a glance">
      <a class="kpi" href="#/insights"><div class="kpi-label">Collected</div>
        <div class="kpi-value num">${F.inr(m.income)}</div>
        <div class="kpi-foot">${D.monthName(lm.range.from.slice(0, 7))} ${F.inr(lm.income)}</div></a>
      <a class="kpi" href="${link({ tab: 'expenses' })}"><div class="kpi-label">Spent</div>
        <div class="kpi-value num">${F.inr(m.expense)}</div>
        <div class="kpi-foot">${wages ? 'incl. ' + F.inr(wages) + ' event wages' : ''}</div></a>
      <a class="kpi" href="${link({})}"><div class="kpi-label">To collect</div>
        <div class="kpi-value num">${F.inr(q.sum(g.all, function (d) { return d.amount; }))}</div>
        <div class="kpi-foot">${lateSum ? h`<span class="money is-due">${F.inr(lateSum)}</span> overdue` : 'Nothing overdue'}</div></a>
      <a class="kpi" href="${link({ tab: 'drawer' })}"><div class="kpi-label">Cash in drawer</div>
        <div class="kpi-value num">${dc ? F.inr(dc.expCash) : '—'}</div>
        <div class="kpi-foot">${dc ? 'UPI ' + F.inr(dc.expUpi) + ' · by the books' : 'No opening balance yet'}</div></a>
    </section>`;
  }

  var TABS = [['dues', 'Dues', 'Dues'], ['expenses', 'Expenses', 'Expenses'], ['drawer', 'Cash drawer', 'Drawer'], ['bills', 'Scanned bills', 'Bills']];
  function tabOf(query) {
    var t = (query && query.tab) || 'dues';
    return TABS.some(function (x) { return x[0] === t; }) ? t : 'dues';
  }
  function tabsNav(tab) {
    return h`<nav class="tabs mn-tabs" aria-label="Money sections">${TABS.map(function (x) {
      var on = x[0] === tab;
      return h`<a class="tab ${on ? 'is-active' : ''}" href="${link({ tab: x[0] === 'dues' ? '' : x[0] })}" ${on ? KM.raw('aria-current="page"') : ''}><span class="mn-tab-l">${x[1]}</span><span class="mn-tab-s" aria-hidden="true">${x[2]}</span></a>`;
    })}</nav>`;
  }

  /* ---------- tab: dues ---------- */
  function dueRow(d) {
    var today0 = d.upcoming && daysTo(d) <= 0;
    return h`<div class="list-item mn-due">
      <a class="li-body" href="${profileHref(d)}">
        <span class="li-title">${d.name}${today0 ? h` <span class="badge badge-warning">Today</span>` : ''}</span>
        <span class="li-meta">${dueMeta(d, today0)}</span>
      </a>
      <span class="li-trail">
        <span class="money num ${d.upcoming ? '' : 'is-due'}">${F.inr(d.amount)}</span>
        <button class="btn btn-secondary btn-sm" data-open="collect" data-p-kind="${d.kind}" data-p-id="${d.id}" aria-label="Collect ${F.inr(d.amount)} from ${d.name}">Collect</button>
      </span>
    </div>`;
  }
  function duesTab() {
    var g = duesSplit();
    if (!g.all.length) {
      return h`<div class="card"><div class="empty">
        <div class="empty-icon">${I('circle-check')}</div><div class="empty-title">All dues cleared</div>
        <div class="empty-body">Nobody owes the studio anything right now.</div></div></div>`;
    }
    var group = function (key, title, rows) {
      if (!rows.length) return '';
      return h`<section class="card mn-group" aria-labelledby="mn-gh-${key}">
        <div class="card-head"><h2 class="card-title" id="mn-gh-${key}">${title}</h2></div>
        <div class="list">${rows.map(dueRow)}</div>
      </section>`;
    };
    return h`<div class="mn-dues">${group('late', 'Overdue', g.late)}${group('ahead', 'Coming up', g.ahead)}</div>`;
  }

  /* ---------- tab: expenses ---------- */
  function monthChoices() {
    var ym = today().slice(0, 7), m2 = D.addMonths(ym, -2);
    return [
      { key: 'month', label: 'This month' },
      { key: 'last-month', label: D.monthName(D.addMonths(ym, -1), true).split(' ')[0] },
      { key: m2, label: D.monthName(m2, true).split(' ')[0] }
    ];
  }
  function expRow(e) {
    var hasNote = e.note && e.note !== e.cat;
    var meta = [hasNote ? e.cat : null, modeText(e.mode),
      e.items && e.items.length ? F.plural(e.items.length, 'item') : null,
      e.addedBy ? 'added by ' + q.firstName(e.addedBy) : null].filter(Boolean).join(' · ');
    return h`<div class="list-item mn-exp-item">
      <span class="li-body">
        <span class="li-title">${hasNote ? e.note : e.cat}</span>
        <span class="li-meta">${meta}${e.bill ? h` · <a class="link" href="${link({ tab: 'bills', bill: e.bill })}">Scanned bill</a>` : ''}</span>
      </span>
      <span class="li-trail"><span class="money num">${F.inr(e.amount)}</span></span>
    </div>`;
  }
  function expensesTab(ctx) {
    var months = monthChoices();
    var mk = ctx.query.month || 'month';
    if (!months.some(function (m) { return m.key === mk; })) mk = 'month';
    var r = q.range(mk);
    var inMonth = q.expensesIn(r).slice().sort(byDateDesc);
    var cat = ctx.query.cat || '';
    var list = cat ? inMonth.filter(function (e) { return e.cat === cat; }) : inMonth;
    var count = {};
    inMonth.forEach(function (e) { count[e.cat] = (count[e.cat] || 0) + 1; });
    var cats = Object.keys(count).sort();
    if (cat && cats.indexOf(cat) < 0) cats.push(cat);
    var days = [], map = {};
    list.forEach(function (e) { if (!map[e.date]) { map[e.date] = { date: e.date, items: [] }; days.push(map[e.date]); } map[e.date].items.push(e); });
    // the month total already sits in the KPI row; show a total only for a view the KPI doesn't cover
    var filtered = cat || mk !== 'month';
    var mParam = mk === 'month' ? '' : mk;

    return h`
      <div class="mn-toolbar">
        <nav class="seg mn-months" aria-label="Month">${months.map(function (m) {
          var on = m.key === mk;
          return h`<a class="seg-item ${on ? 'is-active' : ''}" href="${link({ tab: 'expenses', month: m.key === 'month' ? '' : m.key, cat: cat })}" ${on ? KM.raw('aria-current="true"') : ''}>${m.label}</a>`;
        })}</nav>
        <label class="mn-catpick"><span class="sr-only">Category</span>
          <select class="select" id="mn-cat" data-month="${mParam}">
            <option value="" ${!cat ? KM.raw('selected') : ''}>All categories</option>
            ${cats.map(function (c) { return h`<option value="${c}" ${c === cat ? KM.raw('selected') : ''}>${c} (${count[c] || 0})</option>`; })}
          </select></label>
        ${filtered && list.length ? h`<span class="mn-sum">${F.plural(list.length, 'entry', 'entries')} · <b class="num">${F.inr(q.sum(list, function (e) { return e.amount; }))}</b></span>` : ''}
      </div>
      <section class="card mn-exp-list" aria-label="Expenses by date">
        ${days.length ? days.map(function (d) {
          var rel = d.date === today() ? ' · Today' : D.diff(today(), d.date) === 1 ? ' · Yesterday' : '';
          return h`<div class="mn-day"><h3 class="mn-day-head">${F.date(d.date, 'dow')}${rel}</h3>
            <div class="list">${d.items.map(expRow)}</div></div>`;
        }) : h`<div class="empty"><div class="empty-icon">${I(cat ? catIcon(cat) : 'receipt-2')}</div><div class="empty-title">No ${cat ? cat.toLowerCase() + ' ' : ''}expenses in ${mk === 'month' ? 'this month' : r.label}</div>
          <button class="btn btn-secondary btn-sm" data-open="expense" ${cat ? KM.raw('data-p-cat="' + KM.esc(cat) + '"') : ''}>${I('plus')} Add expense</button></div>`}
      </section>`;
  }

  /* ---------- tab: cash drawer ---------- */
  function reconCol(title, rows, expected, counted, countedLabel, diff) {
    return h`<div class="mn-recon-col">
      <h3 class="mn-recon-h">${title}</h3>
      <div class="kv">
        ${rows.map(function (r) { return h`<div class="kv-row"><span>${r[0]}</span><span class="num">${r[1]}</span></div>`; })}
        <div class="kv-row is-total"><span>Should be there</span><span class="num">${F.inr(expected)}</span></div>
        <div class="kv-row"><span>${countedLabel}</span><span class="num">${counted == null ? '—' : F.inr(counted)}</span></div>
        <div class="kv-row"><span>Difference</span><span>${counted == null ? h`<span class="subtle">Not counted yet</span>` : diffText(diff)}</span></div>
      </div>
    </div>`;
  }
  /** what "+ Collected in cash" / "+ Received by UPI" above are made of — same range, so the columns add up to those rows */
  function streamSplit(ym, to) {
    var by = {};
    q.STREAMS.forEach(function (s) { by[s.key] = { cash: 0, upi: 0 }; });
    q.collections({ from: ym + '-01', to: to }).forEach(function (x) { by[x.stream][x.mode === 'cash' ? 'cash' : 'upi'] += x.amount; });
    var rows = q.STREAMS.filter(function (s) { return by[s.key].cash + by[s.key].upi; });
    if (!rows.length) return '';
    return h`<section class="card" aria-labelledby="mn-str-h">
      <div class="card-head"><h2 class="card-title" id="mn-str-h">Collected by stream</h2></div>
      <div class="card-body">
        <table class="table mn-hist">
          <thead><tr><th>Stream</th><th class="r">Cash</th><th class="r">UPI</th></tr></thead>
          <tbody>${rows.map(function (s) {
            return h`<tr><td>${s.label}</td><td class="r num">${F.inr(by[s.key].cash)}</td><td class="r num">${F.inr(by[s.key].upi)}</td></tr>`;
          })}</tbody></table>
      </div>
    </section>`;
  }
  function drawerTab() {
    var T = today(), ym = T.slice(0, 7);
    var bal = balanceFor(ym);
    if (!bal) return h`<div class="card"><div class="empty"><div class="empty-icon">${I('cash-register')}</div><div class="empty-title">No opening balance for this month</div></div></div>`;
    var to = bal.countedOn || T;
    var c = drawerCalc(ym, to);
    var counted = bal.countedCash != null;
    var cashDiff = counted ? bal.countedCash - c.expCash : 0;
    var upiDiff = bal.countedUpi == null ? 0 : bal.countedUpi - c.expUpi;
    var gap = counted && (bigGap(cashDiff, c.expCash) || bigGap(upiDiff, c.expUpi));
    var past = KM.data.balances.filter(function (b) { return b.month < ym && b.closeCash != null; }).sort(function (a, b) { return b.month.localeCompare(a.month); });
    var opening = 'Opening · 1 ' + D.monthName(ym);
    // the card title carries the count date once; the rows don't repeat it
    return h`<div class="mn-drawer">
      <section class="card mn-recon" aria-labelledby="mn-recon-h">
        <div class="card-head"><h2 class="card-title" id="mn-recon-h">${counted ? 'Last count · ' + F.date(to, 'dow') : 'This month so far'}</h2></div>
        <div class="card-body mn-recon-grid">
          ${reconCol('Cash drawer', [
            [opening, F.inr(bal.openCash)], ['+ Collected in cash', F.inr(c.cashIn, { sign: true })],
            ['− Expenses paid in cash', F.inr(-c.cashEx)]
          ].concat(c.wages ? [['− Event staff wages', F.inr(-c.wages)]] : []), c.expCash, bal.countedCash, 'Counted', cashDiff)}
          ${reconCol('UPI / bank', [
            [opening, F.inr(bal.openUpi)], ['+ Received by UPI', F.inr(c.upiIn, { sign: true })],
            ['− Expenses paid by UPI', F.inr(-c.upiEx)]
          ], c.expUpi, bal.countedUpi, 'In GPay business', upiDiff)}
        </div>
        ${gap ? h`<div class="mn-gap"><div class="banner banner-warn">${I('alert-triangle')}<div class="mn-gap-text">
            <b>${F.inr(Math.abs(cashDiff + upiDiff))} ${cashDiff + upiDiff < 0 ? 'less' : 'more'} than the books.</b>
            Usually a bank deposit or money taken out that wasn't written down.
            <div class="cluster mn-gap-actions">
              <button class="btn btn-secondary btn-sm" data-toast="Recording bank deposits isn't part of this prototype yet" data-kind="info">Record bank deposit</button>
              <button class="btn btn-secondary btn-sm" data-toast="Recording owner withdrawals isn't part of this prototype yet" data-kind="info">Record money taken out</button>
            </div></div></div></div>` : ''}
      </section>
      <div class="mn-drawer-more">
      ${streamSplit(ym, to)}
      ${past.length ? h`<section class="card" aria-labelledby="mn-hist-h">
        <div class="card-head"><h2 class="card-title" id="mn-hist-h">Past months</h2></div>
        <div class="card-body">
          <table class="table mn-hist">
            <thead><tr><th>Month</th><th class="r">Cash closed</th><th class="r">UPI closed</th></tr></thead>
            <tbody>${past.map(function (b) {
              var x = drawerCalc(b.month, b.month + '-' + String(D.daysInMonth(b.month)).padStart(2, '0'));
              var cd = b.closeCash - x.expCash, ud = b.closeUpi - x.expUpi;
              // closing amount with its difference against the books underneath — one cell per drawer
              return h`<tr>
                <td class="strong">${D.monthName(b.month, true)}</td>
                <td class="r"><span class="num">${F.inr(b.closeCash)}</span><span class="mn-hist-d">${diffText(cd)}</span></td>
                <td class="r"><span class="num">${F.inr(b.closeUpi)}</span><span class="mn-hist-d">${diffText(ud)}</span></td>
              </tr>`;
            })}</tbody></table>
        </div>
      </section>` : ''}
      </div>
    </div>`;
  }

  /* ---------- tab: scanned bills ---------- */
  function billsTab(ctx) {
    var bills = KM.data.bills.slice().sort(byDateDesc);
    if (!bills.length) {
      return h`<div class="card"><div class="empty"><div class="empty-icon">${I('scan')}</div><div class="empty-title">No scanned bills yet</div>
        <button class="btn btn-secondary btn-sm" data-open="scan">${I('camera')} Scan a bill</button></div></div>`;
    }
    return h`<div class="mn-bills">${bills.map(function (b) { return receipt(b, { focus: ctx.query.bill === b.id }); })}</div>`;
  }

  KM.screen('money', {
    title: 'Money', icon: 'wallet', role: 'owner',
    // the one create action follows the tab (top-bar button on desktop, first item in the + menu on phones)
    primary: function (r) {
      var t = tabOf(r && r.query);
      if (t === 'expenses') return { label: 'Add expense', open: 'expense', icon: 'receipt-2', params: r.query.cat ? { cat: r.query.cat } : {} };
      if (t === 'drawer') return { label: 'Count drawer', open: 'drawer', icon: 'calculator' };
      if (t === 'bills') return { label: 'Scan a bill', open: 'scan', icon: 'scan' };
