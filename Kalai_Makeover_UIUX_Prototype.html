  function isMonthKey(k) { return /^\d{4}-\d{2}$/.test(k); }
  function periodKey(ctx) {
    var p = ctx.query.period || 'month';
    if (PERIODS.some(function (x) { return x[0] === p; }) || isMonthKey(p)) return p;
    return 'month';
  }
  function firstRecord() {
    return q.collections({ from: null, to: today() }).reduce(function (m, r) { return !m || r.date < m ? r.date : m; }, null);
  }
  function rangeText(key, r) {
    var T = today();
    if (key === 'month') return '1–' + (+T.slice(8)) + ' ' + monthWord(T.slice(0, 7)) + ' ' + T.slice(0, 4);
    if (key === 'week') return F.date(r.from) + ' – ' + F.date(r.to) + ' ' + T.slice(0, 4);
    if (key === 'all') { var f = firstRecord(); return 'Since ' + (f ? F.date(f, 'dmy') : 'records began'); }
    return r.label;
  }
  /** the calendar month the selected period is (so the month-by-month strip doesn't repeat its profit) */
  function periodMonth(key) {
    var cur = today().slice(0, 7);
    if (key === 'month') return cur;
    if (key === 'last-month') return D.addMonths(cur, -1);
    return isMonthKey(key) ? key : null;
  }
  /** months with real books: expense tracking started later than the first salon visits, so earlier months would show fake 100% margins */
  function trackedMonths() { return q.monthly(6).filter(function (m) { return m.expense > 0; }); }

  /* ---------- comparison with the previous like-for-like period (shown once, in the KPI feet) ---------- */
  function previous(key, r) {
    var T = today();
    if (key === 'month') {
      var lm = D.addMonths(T.slice(0, 7), -1), day = Math.min(+T.slice(8), D.daysInMonth(lm));
      return { p: q.pnl({ from: lm + '-01', to: lm + '-' + String(day).padStart(2, '0') }), label: '1–' + day + ' ' + monthWord(lm) };
    }
    if (key === 'week') return { p: q.pnl({ from: D.add(T, -13), to: D.add(T, -7) }), label: 'the week before' };
    if (key === 'last-month' || isMonthKey(key)) { var pm = D.addMonths(r.from.slice(0, 7), -1); return { p: q.pnl(pm), label: monthWord(pm) }; }
    return null;
  }
  function delta(now, before, label, goodWhenUp) {
    if (!before) return '';
    var d = Math.round((now - before) / before * 100);
    var good = goodWhenUp ? d >= 0 : d <= 0;
    // green when it's good news, quiet grey otherwise (red is kept for overdue money)
    return h`<span class="kpi-delta ${good ? 'up' : 'flat'}">${d >= 0 ? '↑' : '↓'} ${Math.abs(d)}%</span><span class="truncate">vs ${label}</span>`;
  }
  function kpis(p, key) {
    var prev = previous(key, p.range);
    var loss = p.profit < 0;
    return h`<section class="kpi-row ins-kpis" aria-label="Totals for the period">
      <div class="kpi"><div class="kpi-label">Income</div><div class="kpi-value num">${F.inr(p.income)}</div>
        <div class="kpi-foot">${prev ? delta(p.income, prev.p.income, prev.label, true) : ''}</div></div>
      <div class="kpi"><div class="kpi-label">Expenses</div><div class="kpi-value num">${F.inr(p.expense)}</div>
        <div class="kpi-foot">${prev ? delta(p.expense, prev.p.expense, prev.label, false) : ''}</div></div>
      <div class="kpi"><div class="kpi-label">${loss ? 'Net loss' : 'Net profit'}</div><div class="kpi-value num ${loss ? 'money is-due' : ''}">${F.inr(p.profit)}</div>
        <div class="kpi-foot">${p.margin}% margin</div></div>
    </section>`;
  }

  /* ---------- P&L breakdown (the totals are the KPI row above) ---------- */
  function statement(p) {
    var cats = Object.keys(p.expenseCats).sort(function (a, b) { return p.expenseCats[b] - p.expenseCats[a]; });
    // no colour keys: no stream-coloured chart is left on the page for them to point at
    var row = function (label, v, total) {
      return h`<div class="kv-row"><span class="ins-st-l">${label}</span>
        <span class="ins-st-r"><span class="ins-share">${pct(v, total)}%</span><span class="num">${F.inr(v)}</span></span></div>`;
    };
    return h`<section class="card ins-pnl" aria-labelledby="ins-pnl-h">
      <div class="card-head"><h2 class="card-title" id="ins-pnl-h">Profit &amp; loss</h2>
        <button type="button" class="link ins-pdf" id="ins-pdf">Download PDF</button></div>
      <div class="card-body">
        <h3 class="ins-st-h">Income</h3>
        <div class="kv">${q.STREAMS.map(function (s) { return row(s.label, p.byStream[s.key], p.income); })}</div>
        <h3 class="ins-st-h">Expenses</h3>
        <div class="kv">${cats.length ? cats.map(function (c) { return row(c, p.expenseCats[c], p.expense); })
          : h`<div class="kv-row"><span>No expenses recorded</span><span></span></div>`}</div>
        <p class="ins-foot">Cash basis: income counts the day it is received; event wages count in the function's month.</p>
      </div>
    </section>`;
  }

  /* ---------- only what the numbers on this page can't say by themselves ---------- */
  function callouts(p, key) {
    var out = [], T = today();
    if (key === 'all') {
      // honest caveat: income records go back further than expense records, so the all-time margin reads high
      var firstExp = KM.data.expenses.reduce(function (m, e) { return !m || e.date < m ? e.date : m; }, null);
      var firstInc = firstRecord();
      if (firstExp && firstInc && firstInc < firstExp) {
        var early = q.pnl({ from: null, to: D.add(firstExp, -1) }).income;
        if (early) out.push({ warn: true, html: h`Expenses are only recorded from <b>${F.date(firstExp, 'dmy')}</b>, so <b>${F.inr(early)}</b> of earlier income has no costs against it — the all-time margin reads high.` });
      }
    }
    if (key === 'month') {
      var lm = q.pnl('last-month');
      var lastSal = lm.expenseCats.Salary || 0, thisSal = p.expenseCats.Salary || 0;
      if (lastSal && thisSal < lastSal / 2) {
        var after = p.profit - lastSal;
        out.push({ warn: true, html: h`Salaries (<b>${F.inr(lastSal)}</b> last month) are paid at month end and aren't in yet — after payroll, profit would be about <b>${F.inr(after)}</b> (${pct(after, p.income)}% margin).` });
      }
    }
    var nm = D.addMonths(T.slice(0, 7), 1);
    var mdays = KM.data.muhurtham.filter(function (d) { return d.slice(0, 7) === nm; }).length;
    if (mdays) {
      var bks = q.bookings().filter(function (b) { return b.state !== 'cancelled' && b.fns.some(function (f) { return f.date.slice(0, 7) === nm; }); });
      var conf = bks.filter(function (b) { return b.state !== 'enquiry'; }).length, enq = bks.length - conf;
      // the Muhurtham days open that month's booking calendar (the page's only way into Bookings)
      out.push({ html: h`<b>${monthWord(nm)}</b> has <a class="link" href="#/bookings?view=calendar&month=${nm}">${mdays} Muhurtham days</a> and ${F.plural(conf, 'confirmed booking')}${enq ? ' + ' + F.plural(enq, 'open enquiry', 'open enquiries') : ''} — a good time to follow up.` });
    }
    return out;
  }
  function calloutCard(p, key) {
    var list = callouts(p, key);
    if (!list.length) return '';
    return h`<section class="card ins-tips" aria-labelledby="ins-tips-h">
      <div class="card-head"><h2 class="card-title" id="ins-tips-h">Worth knowing</h2></div>
      <div class="card-body"><ul class="ins-tip-list">${list.map(function (c) {
        return h`<li class="ins-tip ${c.warn ? 'is-warn' : ''}">${c.html}</li>`;
      })}</ul></div>
    </section>`;
  }

  /* ---------- cash vs UPI: just the split (the per-stream cash/UPI table is in Money › Cash drawer) ---------- */
  function cashUpi(p) {
    return h`<section class="card ins-mode" aria-labelledby="ins-mode-h">
      <div class="card-head"><h2 class="card-title" id="ins-mode-h">Cash vs UPI</h2><a class="link" href="#/money?tab=drawer">Cash drawer</a></div>
      <div class="card-body">
        ${p.income ? KM.chart.splitbar([{ label: 'Cash', value: p.cash, color: 'var(--chart-accent)' }, { label: 'UPI / GPay', value: p.upi, color: 'var(--text-3)' }], { pct: true }) : h`<p class="subtle small">No money received in this period.</p>`}
      </div>
    </section>`;
  }

  /* ---------- month trends (fixed window, independent of the period): one chart — the P&L already splits income by stream ---------- */
  function trendCard(key) {
    var ms = trackedMonths();
    var cur = today().slice(0, 7);
    var labels = ms.map(function (m) { return m.label + (m.month === cur ? ' (so far)' : ''); });
    var line = ms.length >= 2 ? KM.chart.line({
      labels: labels, height: 230, xLabel: 'Month', aria: 'Income and expenses by month',
      series: [{ key: 'income', label: 'Income', slot: 6, values: ms.map(function (m) { return m.income; }) },
               { key: 'expense', label: 'Expenses', slot: 5, values: ms.map(function (m) { return m.expense; }) }]
    }) : h`<p class="subtle small">Not enough months yet.</p>`;
    // the selected month's profit is already the KPI above — list the other months, each opening its own P&L
    var sel = periodMonth(key);
    var others = ms.filter(function (m) { return m.month !== sel; });
    var profits = others.length ? h`<p class="ins-profit"><span class="subtle">${sel ? 'Profit in other months' : 'Profit by month'}</span>
      ${others.map(function (m, i) {
        return h`${i ? ' · ' : ''}<a class="link" href="#/insights${m.month === cur ? '' : '?period=' + m.month}">${m.label}${m.month === cur ? ' so far' : ''}</a> <b class="num ${m.profit < 0 ? 'is-neg' : ''}">${F.inr(m.profit)}</b>`;
      })}</p>` : '';
    return h`<section class="card ins-trend" aria-labelledby="ins-trend-h">
        <div class="card-head"><h2 class="card-title" id="ins-trend-h">Month by month</h2></div>
        <div class="card-body">${line}${profits}</div>
      </section>`;
  }

  /* ---------- salon services (bridal economics live on each booking; functions by month in Bookings) ---------- */
  function services(p) {
    var top = q.topServices(p.range).slice(0, 6);
    return h`<section class="card ins-svc" aria-labelledby="ins-svc-h">
      <div class="card-head"><h2 class="card-title" id="ins-svc-h">Top salon services</h2></div>
      <div class="card-body">
        ${top.length ? KM.chart.bars({
          horizontal: true, height: top.length * 36, xLabel: 'Service', aria: 'Salon revenue by service',
          series: [{ key: 'rev', label: 'Revenue', slot: 1 }],
          rows: top.map(function (t) { return { label: t.name, values: { rev: t.revenue } }; })
        }) : h`<p class="subtle small">No salon bills in this period.</p>`}
      </div>
    </section>`;
  }

  KM.screen('insights', {
    title: 'Insights & P&L', icon: 'chart-line', role: 'owner',
    render: function (ctx) {
      var key = periodKey(ctx);
      var p = q.pnl(key);
      var segs = PERIODS.slice();
      if (isMonthKey(key)) segs.push([key, D.monthName(key, true)]);
      return h`
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title">Insights &amp; P&amp;L</h1>
            <p class="page-sub">${rangeText(key, p.range)}</p>
          </div>
        </header>
        <nav class="seg ins-periods" aria-label="Period">${segs.map(function (c) {
          var on = c[0] === key;
          return h`<a class="seg-item ${on ? 'is-active' : ''}" href="#/insights${c[0] === 'month' ? '' : '?period=' + c[0]}" ${on ? KM.raw('aria-current="true"') : ''}>${c[1]}</a>`;
        })}</nav>
        ${kpis(p, key)}
        <div class="ins-top">
          <div class="ins-col">${statement(p)}</div>
          <div class="ins-col">${calloutCard(p, key)}${cashUpi(p)}${services(p)}</div>
        </div>
        ${trendCard(key)}`;
    },
    mount: function (root) {
      var b = root.querySelector('#ins-pdf');
      if (b) b.addEventListener('click', function () {
        KM.toast('PDF export is out of scope for the prototype', { kind: 'info', action: { label: 'Print instead', fn: function () { window.print(); } } });
      });
    }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'insights') KM.refresh(); });
})();

</script>
<script data-screen="jewels">
/* ===== screens/jewels.js ===== */
/* Jewel rental — bridal ornaments rented to brides: a catalogue with generated "product photography",
   ROI per piece, overdue returns, rental history. Owner screen `jewels` (+ `jewels/<id>`), overlays `rent` and `return`. */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  function first(n) { return String(n || '').split(' ')[0]; }
  function digits(v) { return String(v || '').replace(/\D/g, '').slice(-10); }
  function num(v) { return parseInt(String(v || '').replace(/\D/g, ''), 10) || 0; }
  function short(j) { return j.name.replace(/\s*\(.*\)\s*$/, ''); }
  function rental(id) { return KM.data.rentals.filter(function (r) { return r.id === id; })[0]; }
  function today() { return KM.state.today; }

  /* =========================================================================
     Generated jewel "photography" — inline SVG ornaments on a velvet tray.
     Colours come from tokens via CSS classes (jw-m metal, jw-g gem, jw-p pearl…), so they work in both themes.
     ========================================================================= */
  function n1(x) { return Math.round(x * 10) / 10; }
  function C(x, y, r, cls) { return '<circle cx="' + n1(x) + '" cy="' + n1(y) + '" r="' + n1(r) + '" class="' + cls + '"/>'; }
  function E(x, y, rx, ry, cls) { return '<ellipse cx="' + n1(x) + '" cy="' + n1(y) + '" rx="' + n1(rx) + '" ry="' + n1(ry) + '" class="' + cls + '"/>'; }
  function gem(x, y, r, cls) { return C(x, y, r + 1.6, 'jw-m') + C(x, y, r, cls || 'jw-g') + C(x - r * 0.34, y - r * 0.38, Math.max(0.7, r * 0.3), 'jw-hi'); }
  function pearl(x, y, r) { return C(x, y, r, 'jw-p') + C(x - r * 0.32, y - r * 0.36, Math.max(0.6, r * 0.34), 'jw-hi'); }
  function bead(x, y, r) { return C(x, y, r, 'jw-m') + C(x - r * 0.3, y - r * 0.38, Math.max(0.5, r * 0.38), 'jw-mh'); }
  function P(cx, cy, rx, ry, deg) { var t = deg * Math.PI / 180; return [cx + rx * Math.cos(t), cy + ry * Math.sin(t)]; }
  function arc(cx, cy, rx, ry, a0, a1, step) { var o = []; for (var t = a0; t <= a1 + 0.001; t += (step || 3)) o.push(P(cx, cy, rx, ry, t)); return o; }
  function poly(pts) { return pts.map(function (p, i) { return (i ? 'L' : 'M') + n1(p[0]) + ' ' + n1(p[1]); }).join(' '); }
  function path(d, cls, w) { return '<path d="' + d + '" class="' + cls + '"' + (w ? ' stroke-width="' + w + '"' : '') + '/>'; }
  function seg(x1, y1, x2, y2, cls, w) { return path('M' + n1(x1) + ' ' + n1(y1) + ' L' + n1(x2) + ' ' + n1(y2), cls, w); }
  function qb(a, b, c, t) { var u = 1 - t; return [u * u * a[0] + 2 * u * t * b[0] + t * t * c[0], u * u * a[1] + 2 * u * t * b[1] + t * t * c[1]]; }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; }
  function spark(x, y, s) {
    var k = s * 0.16;
    return '<path class="jw-spark" d="M' + n1(x) + ' ' + n1(y - s) + ' Q' + n1(x + k) + ' ' + n1(y - k) + ' ' + n1(x + s) + ' ' + n1(y) + ' Q' + n1(x + k) + ' ' + n1(y + k) + ' ' +
      n1(x) + ' ' + n1(y + s) + ' Q' + n1(x - k) + ' ' + n1(y + k) + ' ' + n1(x - s) + ' ' + n1(y) + ' Q' + n1(x - k) + ' ' + n1(y - k) + ' ' + n1(x) + ' ' + n1(y - s) + 'Z"/>';
  }
  function sparks(list) { return list.map(function (s) { return spark(s[0], s[1], s[2]); }).join(''); }

  var ART = {
    choker: function () {
      var s = '', band = arc(100, 20, 64, 62, 14, 166, 3), a = band[0], b = band[band.length - 1];
      s += seg(a[0], a[1], 186, 4, 'jw-cord') + seg(b[0], b[1], 14, 4, 'jw-cord');
      s += path(poly(band), 'jw-ms', 11) + path(poly(band), 'jw-mds', 3) + path(poly(arc(100, 16.5, 64, 62, 20, 160, 4)), 'jw-hs', 1);
      for (var d = 26; d <= 154.1; d += 12.8) {
        var p = P(100, 20, 64, 62, d);
        if (Math.abs(d - 90) < 1) continue;
        s += seg(p[0], p[1], p[0], p[1] + 11, 'jw-mds', 1.2) + pearl(p[0], p[1] + 13.5, 2.5) + gem(p[0], p[1], 4.2);
      }
      s += path('M100 84 C86 96 88 118 100 124 C112 118 114 96 100 84 Z', 'jw-m');
      s += path('M100 92 C92 100 93 112 100 116.5 C107 112 108 100 100 92 Z', 'jw-g');
      s += C(96.5, 100, 1.8, 'jw-hi') + gem(100, 82, 6) + pearl(100, 130.5, 3.4);
      return s + sparks([[158, 70, 5.5], [42, 102, 3.8], [130, 122, 3]]);
    },
    haram: function () {
      var s = '', band = arc(100, -2, 58, 104, 12, 168, 3);
      s += path(poly(band), 'jw-mds', 1.4);
      var i = 0;
      for (var d = 14; d <= 166.1; d += 5.2) {
        if (Math.abs(d - 90) < 5) continue;
        var p = P(100, -2, 58, 104, d);
        s += (i++ % 4 === 2) ? gem(p[0], p[1], 2.8) : bead(p[0], p[1], 3);
      }
      s += bead(100, 104, 3.4);
      for (var k = 0; k < 12; k++) { var q2 = P(100, 122, 15.5, 15.5, k * 30); s += bead(q2[0], q2[1], 3.3); }
      s += C(100, 122, 13.5, 'jw-m') + C(100, 122, 10.5, 'jw-md') + C(100, 122, 9, 'jw-m') + gem(100, 122, 6);
      s += seg(92, 136, 90, 139, 'jw-mds', 1) + pearl(89.5, 141.5, 2.6) + pearl(100, 143, 3) + seg(108, 136, 110, 139, 'jw-mds', 1) + pearl(110.5, 141.5, 2.6);
      return s + sparks([[38, 74, 4.6], [160, 98, 5.2], [136, 136, 3]]);
    },
    belt: function () {
      var s = '';
      s += path('M6 56 Q100 96 194 56 L194 80 Q100 120 6 80 Z', 'jw-m');
      s += path('M6 59.5 Q100 99.5 194 59.5', 'jw-mds', 1.3) + path('M6 76.5 Q100 116.5 194 76.5', 'jw-mds', 1.3) + path('M6 57.6 Q100 97.6 194 57.6', 'jw-hs', 0.9);
      var k = 0;
      for (var t = 0.05; t <= 0.951; t += 0.06) {
        if (Math.abs(t - 0.5) < 0.17) continue;
        var p = qb([6, 68], [100, 108], [194, 68], t);
        s += gem(p[0], p[1], 2.6, (k++ % 2) ? 'jw-g2' : 'jw-g');
      }
      s += E(100, 88, 31, 26, 'jw-m') + E(100, 88, 26.5, 21.5, 'jw-md') + E(100, 88, 23, 18, 'jw-m');
      for (var a = 0; a < 10; a++) { var r = P(100, 87, 17, 13.2, a * 36 + 18); s += C(r[0], r[1], 2, a % 2 ? 'jw-g2' : 'jw-p'); }
      s += gem(100, 87, 7.5);
      for (var j = -2; j <= 2; j++) { var x = 100 + j * 9, y = 116 - Math.abs(j) * 1.6; s += seg(x, y - 4, x, y, 'jw-mds', 1) + pearl(x, y + 3, 2.8); }
      return s + sparks([[40, 40, 4.6], [166, 106, 4], [150, 34, 3]]);
    },
    jhumka: function () {
      var s = '';
      [62, 138].forEach(function (x) {
        for (var k = 0; k < 6; k++) { var p = P(x, 22, 9, 9, k * 60 + 30); s += bead(p[0], p[1], 3.3); }
        s += gem(x, 22, 5.4);
        s += seg(x, 33, x, 47, 'jw-mds', 1.6) + bead(x, 40, 2.6);
        s += path('M' + (x - 25) + ' 92 C' + (x - 25) + ' 64 ' + (x - 13) + ' 48 ' + x + ' 48 C' + (x + 13) + ' 48 ' + (x + 25) + ' 64 ' + (x + 25) + ' 92 Z', 'jw-m');
        s += path('M' + (x - 21) + ' 72 Q' + x + ' 64 ' + (x + 21) + ' 72', 'jw-mds', 1.2) + path('M' + (x - 24) + ' 85 Q' + x + ' 78 ' + (x + 24) + ' 85', 'jw-mds', 1.2);
        s += path('M' + (x - 16) + ' 84 C' + (x - 18) + ' 68 ' + (x - 11) + ' 56 ' + (x - 3) + ' 52', 'jw-hs', 1.8);
        s += gem(x, 60, 3.2) + gem(x - 9.5, 79, 2.3) + gem(x, 77, 2.5) + gem(x + 9.5, 79, 2.3);
        s += E(x, 92, 26.5, 4.6, 'jw-md') + E(x, 91, 25, 2, 'jw-m');
        for (var i = -3; i <= 3; i++) { var px = x + i * 7.6; s += seg(px, 95, px, 101, 'jw-mds', 1) + pearl(px, 104, 2.7); }
      });
      return s + sparks([[100, 36, 5.2], [24, 116, 3.4], [178, 62, 3.4]]);
    },
    tikka: function () {
      var s = '';
      [-1, 1].forEach(function (sd) {
        for (var t = 0.12; t <= 1.001; t += 0.088) { var p = qb([100, 10], [100 + sd * 40, 6], [100 + sd * 76, 42], t); s += pearl(p[0], p[1], 2.1); }
      });
      for (var y = 13; y <= 60; y += 6.2) s += pearl(100, y, 2.3);
      s += C(100, 7, 3.4, 'jw-m') + bead(100, 66, 3.2);
      for (var k = 0; k < 14; k++) { var p2 = P(100, 94, 23, 23, k * (360 / 14)); s += pearl(p2[0], p2[1], 3); }
      s += C(100, 94, 18.5, 'jw-m') + C(100, 94, 15, 'jw-md') + C(100, 94, 12.5, 'jw-m') + gem(100, 94, 7.5);
      s += seg(100, 118, 100, 123, 'jw-mds', 1.2);
      s += path('M100 122 C94 128 94 136 100 138.5 C106 136 106 128 100 122 Z', 'jw-p') + C(98, 129, 1.6, 'jw-hi');
      return s + sparks([[152, 92, 4.6], [46, 112, 4], [162, 22, 3]]);
    },
    hair: function () {
      var s = '';
      s += path('M93 46 L107 46 L104 146 L96 146 Z', 'jw-md') + path('M100 48 L100 144', 'jw-hs', 0.8);
      for (var k = 0; k < 12; k++) { var p = P(100, 27, 17.5, 17.5, k * 30); s += gem(p[0], p[1], 3); }
      s += C(100, 27, 13.5, 'jw-m') + C(100, 27, 10.5, 'jw-md') + C(100, 27, 8.6, 'jw-m') + gem(100, 27, 5.4, 'jw-g2');
      [[62, 11.5], [86, 10], [108, 8.8], [128, 7.6]].forEach(function (b) {
        s += C(100, b[0], b[1], 'jw-m') + C(100, b[0], b[1] * 0.76, 'jw-md') + gem(100, b[0], b[1] * 0.42);
