          <span class="cal-num">${+dt.slice(8)}</span>${n ? h`<span class="bkw-dots">${(ev[dt] || []).slice(0, 3).map(function () { return KM.raw('<i></i>'); })}</span>` : ''}</button>`;
      })}</div>
      <div class="bkw-legend"><span><i class="lg-muh"></i>Muhurtham</span><span><i class="lg-bk"></i>Booked</span></div>`;
  }
  function wStep2() {
    return h`${wHead('Functions & dates')}
      <div class="field">
        <span class="label" id="bkw-fn-l">Functions <span class="req">*</span></span>
        <div class="chips" role="group" aria-labelledby="bkw-fn-l">${KM.data.functionTypes.map(function (n) {
          var on = W.fns.some(function (f) { return f.name === n; });
          return h`<button type="button" class="chip ${on ? 'is-selected' : ''}" data-fn-toggle="${n}" aria-pressed="${on ? 'true' : 'false'}">${n}</button>`;
        })}</div>
        ${wErr('fns')}
      </div>
      <div class="bkw-split is-cal">
        <div class="stack">
          ${W.fns.map(wFnCard)}
          <div class="field"><label class="label" for="bkw-venue">Venue</label>
            <input class="input" id="bkw-venue" data-w="venue" autocomplete="off" placeholder="Mandapam, hall or home — blank if not fixed" value="${W.venue}"></div>
        </div>
        <aside class="bkw-cal" id="bkw-cal" aria-label="Date picker">${wCal()}</aside>
      </div>`;
  }

  /* ---------- step 3: makeup & add-ons ---------- */
  function wStep3() {
    var groups = [['Groom', 'Groom'], ['Bridesmaid', 'Bridesmaids'], ['Misc', 'Other']];
    return h`${wHead('Makeup & add-ons')}
      <div class="bkw-narrow stack-lg">
        <section class="bkw-sec" aria-labelledby="bkw-s-mk">
          <h4 class="bkw-sec-title" id="bkw-s-mk">Makeup</h4>
          ${W.fns.map(function (f, i) {
            return h`<div class="bkw-mk">
              <div class="bkw-mk-head"><span class="strong">${f.name}</span><span class="subtle xsmall">${f.date ? F.date(f.date, 'dow') : ''}</span></div>
              <div class="chips" role="group" aria-label="Makeup for ${f.name}">${KM.data.makeupTypes.map(function (m) {
                var on = f.mk === m.name;
                return h`<button type="button" class="chip ${on ? 'is-selected' : ''}" data-mk="${i}" data-mk-name="${m.name}" aria-pressed="${on ? 'true' : 'false'}" aria-label="${m.name}, ${F.inr(m.price)}">${m.name.replace(/ Makeup$/, '')}<span class="chip-price">${F.inr(m.price)}</span></button>`;
              })}</div>
              <div class="bkw-mk-price"><label class="label" for="bkw-mkp-${i}">Price quoted</label>
                <div class="input-group"><span class="input-prefix">₹</span><input class="input" id="bkw-mkp-${i}" inputmode="numeric" data-mk-price="${i}" placeholder="0" value="${f.price}" ${inv('mk' + i)}></div></div>
              ${wErr('mk' + i)}
            </div>`;
          })}
        </section>
        <section class="bkw-sec" aria-labelledby="bkw-s-ad">
          <h4 class="bkw-sec-title" id="bkw-s-ad">Add-ons</h4>
          <div class="bkw-addons">${groups.map(function (g) {
            return h`<div class="bkw-addon-group"><span class="label">${g[1]}</span><div class="chips">${KM.data.addonTypes.filter(function (a) { return a.name.indexOf(g[0] + ':') === 0; }).map(function (a) {
              var on = W.addons.indexOf(a.name) >= 0;
              return h`<button type="button" class="chip ${on ? 'is-selected' : ''}" data-addon="${a.name}" aria-pressed="${on ? 'true' : 'false'}">${a.name.split(': ')[1]}<span class="chip-price">${F.inr(a.price)}</span></button>`;
            })}</div></div>`;
          })}</div>
        </section>
        <section class="bkw-sec">
          <label class="field bkw-travel"><span class="bkw-sec-title">Travel</span>
            <div class="input-group"><span class="input-prefix">₹</span><input class="input" id="bkw-travel" inputmode="numeric" data-w="travel" placeholder="0" value="${W.travel}"></div></label>
        </section>
        <section class="bkw-sec" aria-labelledby="bkw-s-tm">
          <h4 class="bkw-sec-title" id="bkw-s-tm">Team & wages</h4>
          <div class="chips">${KM.data.staff.map(function (s) {
            var on = !!teamOf(s.id);
            return h`<button type="button" class="chip no-check bkw-staff ${on ? 'is-selected' : ''}" data-staff="${s.id}" aria-pressed="${on ? 'true' : 'false'}">${KM.avatar(s.name)}${first(s.name)}</button>`;
          })}</div>
          ${W.team.length ? h`<div class="bkw-wages">${W.team.map(function (t) {
            var s = q.staff(t.id);
            return h`<label class="bkw-wage"><span class="bkw-wage-name">${s.name} <span class="subtle xsmall">${s.role}</span></span>
              <span class="input-group bkw-wage-in"><span class="input-prefix">₹</span><input class="input" inputmode="numeric" data-wage="${t.id}" value="${t.wage}" aria-label="Wage for ${s.name}"></span></label>`;
          })}</div>` : ''}
        </section>
      </div>`;
  }

  /* ---------- step 4: payment & review ---------- */
  function wBal() {
    var t = wTotals();
    if (t.adv > 0) return '';
    return h`<label class="bkw-switch"><span class="switch"><input type="checkbox" data-w="confirmNoAdv" ${attr(W.confirmNoAdv, 'checked')}><span></span></span>
      <span><b class="small" style="display:block">Confirmed — advance to follow</b><span class="subtle xsmall" style="display:block">Turn off to save it as an enquiry</span></span></label>`;
  }
  function wReview() {
    var t = wTotals();
    var fns = W.fns.slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
    return h`<div class="bkw-rv-who"><div class="strong">${W.name || '—'}</div><div class="subtle xsmall">+91 ${F.phone(W.phone)}${W.area ? ' · ' + W.area : ''} · ${W.venue.trim() || 'Venue to confirm'}</div></div>
      <div class="kv">
        ${fns.map(function (x) {
          return h`<div class="kv-row"><span>${x.name}<span class="bkw-rv-sub">${x.date ? F.date(x.date, 'dow') : 'No date'} · ${F.time(x.time)} · ${x.mk || 'Makeup not chosen'}</span></span><span class="num">${F.inr(+x.price || 0)}</span></div>`;
        })}
        ${W.addons.map(function (n) { return h`<div class="kv-row"><span>${n}</span><span class="num">${F.inr(addonPrice(n))}</span></div>`; })}
        ${t.tr ? h`<div class="kv-row"><span>Travel</span><span class="num">${F.inr(t.tr)}</span></div>` : ''}
        <div class="kv-row is-total"><span>Total</span><span class="num">${F.inr(t.total)}</span></div>
        ${t.adv ? h`<div class="kv-row"><span>Advance · ${W.mode === 'cash' ? 'Cash' : 'UPI / GPay'}</span><span class="num">−${F.inr(t.adv)}</span></div>
          <div class="kv-row is-total"><span>Balance</span><span class="num">${F.inr(Math.max(0, t.due))}</span></div>` : ''}
      </div>
      ${W.team.length ? h`<p class="subtle xsmall">Team ${W.team.map(function (x) { return first(q.staff(x.id).name) + ' ' + F.inr(+x.wage || 0); }).join(', ')} · studio keeps ${F.inr(t.net)}</p>` : h`<p class="subtle xsmall">No team yet</p>`}`;
  }
  function wStep4() {
    var t = wTotals();
    var quick = [[25, '25%'], [50, '50%'], [100, 'Full']];
    return h`${wHead('Payment & review')}
      <div class="bkw-split is-review">
        <div class="stack-lg">
          <div class="field">
            <label class="label" for="bkw-adv">Advance received</label>
            <div class="input-group"><span class="input-prefix">₹</span><input class="input is-big" id="bkw-adv" data-w="adv" inputmode="numeric" placeholder="0" value="${W.adv}" ${inv('adv')}></div>
            <div class="chips bkw-quick">${quick.map(function (x) {
              var v = x[0] === 100 ? t.total : Math.round(t.total * x[0] / 100 / 100) * 100;
              return h`<button type="button" class="chip no-check ${v && +W.adv === v ? 'is-selected' : ''}" data-adv="${v}" aria-label="${x[1]}, ${F.inr(v)}">${x[1]}</button>`;
            })}<button type="button" class="chip no-check ${W.adv !== '' && +W.adv === 0 ? 'is-selected' : ''}" data-adv="0">None yet</button></div>
            ${wErr('adv')}
          </div>
          <div class="field"><span class="label" id="bkw-mode-l">Paid by</span>
            <div class="seg is-block" role="group" aria-labelledby="bkw-mode-l">
              <button type="button" class="seg-item ${W.mode === 'cash' ? 'is-active' : ''}" data-mode="cash" aria-pressed="${W.mode === 'cash' ? 'true' : 'false'}">Cash</button>
              <button type="button" class="seg-item ${W.mode === 'upi' ? 'is-active' : ''}" data-mode="upi" aria-pressed="${W.mode === 'upi' ? 'true' : 'false'}">UPI / GPay</button>
            </div></div>
          <div id="bkw-bal">${wBal()}</div>
          <label class="field"><span class="label">Notes for the team</span>
            <textarea class="textarea" data-w="notes" rows="3" placeholder="Look references, saree colours, flowers for the jadai…">${W.notes}</textarea></label>
          <label class="bkw-switch"><span class="switch"><input type="checkbox" data-w="sendWa" ${attr(W.sendWa, 'checked')}><span></span></span>
            <b class="small">Send WhatsApp confirmation after saving</b></label>
        </div>
        <aside class="bkw-review" id="bkw-review" aria-label="Review">${wReview()}</aside>
      </div>`;
  }

  function wPane() { return [wStep1, wStep2, wStep3, wStep4][W.step - 1](); }
  function wFoot() {
    var t = wTotals(), s = W.step;
    // the running total sits here on steps 2–3; step 4 has the full review under the form
    return h`${s === 1 ? h`<button type="button" class="btn btn-secondary bkw-back" data-close>Cancel</button>` : h`<button type="button" class="btn btn-secondary bkw-back" data-w-back>${I('arrow-left')}<span>Back</span></button>`}
      <div class="bkw-foot-total">${(s === 2 || s === 3) && t.total > 0 ? h`<span>Total</span><b>${F.inr(t.total)}</b>` : ''}</div>
      ${s < 4 ? h`<button type="button" class="btn btn-primary bkw-next" data-w-next><span>Next</span>${I('arrow-right')}</button>`
        : h`<button type="button" class="btn btn-primary bkw-next" data-w-save><span>Save booking</span></button>`}`;
  }

  function wPaint(o) {
    o = o || {};
    var el = W && W.el; if (!el) return;
    var body = el.querySelector('.ov-body'), y = body ? body.scrollTop : 0;
    var st = el.querySelector('.bkw-steps'); if (st) st.outerHTML = String(wSteps());
    el.querySelector('#bkw-pane').innerHTML = String(wPane());
    var ft = el.querySelector('.ov-foot'); if (ft) ft.innerHTML = String(wFoot());
    if (body) body.scrollTop = o.top ? 0 : y;
    if (o.focus) { var f = el.querySelector(o.focus); if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} } }
    else if (o.top) { var t = el.querySelector('.bkw-title'); if (t) { try { t.focus({ preventScroll: true }); } catch (e) {} } }
  }
  function wPaintMoney() {
    var el = W.el;
    var rv = el.querySelector('#bkw-review'); if (rv) rv.innerHTML = String(wReview());
    var bl = el.querySelector('#bkw-bal'); if (bl) bl.innerHTML = String(wBal());
    var ft = el.querySelector('.ov-foot'); if (ft) ft.innerHTML = String(wFoot());
    el.querySelectorAll('[data-adv]').forEach(function (b) { var v = +b.getAttribute('data-adv'); b.classList.toggle('is-selected', W.adv !== '' && +W.adv === v && (v > 0 || +W.adv === 0)); });
  }
  function clearErr(key) {
    if (!W.errors[key]) return;
    delete W.errors[key];
    var e = W.el.querySelector('[data-err="' + key + '"]'); if (e) e.remove();
    W.el.querySelectorAll('[aria-invalid="true"]').forEach(function (x) {
      var k = x.id === 'bkw-phone' ? 'phone' : x.id === 'bkw-name' ? 'name' : x.id === 'bkw-adv' ? 'adv' : x.hasAttribute('data-fn') ? 'fn' + x.getAttribute('data-fn') : x.hasAttribute('data-mk-price') ? 'mk' + x.getAttribute('data-mk-price') : null;
      if (k === key) x.removeAttribute('aria-invalid');
    });
  }

  function wValidate(step) {
    var e = {}, T = today();
    if (step === 1) {
      if (W.phone.length !== 10) e.phone = W.phone.length ? 'That number has ' + W.phone.length + ' digits — mobile numbers have 10' : 'Enter the client’s 10-digit mobile number';
      if (!W.name.trim()) e.name = 'Add the client’s name';
    }
    if (step === 2) {
      if (!W.fns.length) e.fns = 'Pick at least one function';
      W.fns.forEach(function (f, i) {
        if (!f.date) e['fn' + i] = 'Choose a date for the ' + f.name;
        else if (f.date < T) e['fn' + i] = 'That date has already passed';
        else if (!f.time) e['fn' + i] = 'Add the ceremony time';
      });
    }
    if (step === 3) {
      W.fns.forEach(function (f, i) {
        if (!f.mk) e['mk' + i] = 'Choose the makeup for the ' + f.name;
        else if (!(+f.price > 0)) e['mk' + i] = 'Enter the price you quoted';
      });
    }
    if (step === 4) {
      var t = wTotals();
      if (t.adv > t.total) e.adv = 'Advance can’t be more than the total (' + F.inr(t.total) + ')';
    }
    return e;
  }
  function focusFirstError() {
    var x = W.el.querySelector('.bkw-err');
    if (!x) return;
    var box = x.closest('.bkw-fn, .bkw-mk, .field');
    var inp = box && box.querySelector('input[aria-invalid="true"], input');
    (box || x).scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
  }
  function wGo(n) {
    if (n === W.step) return;
    if (n > W.step) {
      for (var s = W.step; s < n; s++) {
        var e = wValidate(s);
        if (Object.keys(e).length) { var moved = s !== W.step; W.errors = e; W.step = s; wPaint({ top: moved }); focusFirstError(); return; }
      }
    }
    W.errors = {};
    W.step = n; W.maxStep = Math.max(W.maxStep, n);
    if (n === 2 && W.fns.length && !W.fns[W.active]) W.active = 0;
    wPaint({ top: true });
  }

  function makeId(name) {
    var base = first(name).toLowerCase().replace(/[^a-z]/g, '') || 'booking';
    var id = base, n = 2;
    while (KM.data.bookings.some(function (b) { return b.id === id; })) id = base + '-' + (n++);
    return id;
  }
  function wSave() {
    for (var s = 1; s <= 4; s++) {
      var e = wValidate(s);
      if (Object.keys(e).length) { W.errors = e; W.step = s; wPaint({ top: true }); focusFirstError(); return; }
    }
    var t = wTotals();
    var fns = W.fns.slice().sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
    var id = makeId(W.name);
    var bk = {
      id: id, client: W.name.trim(), phone: W.phone, area: W.area.trim(), venue: W.venue.trim() || 'Venue to confirm',
      functions: fns.map(function (f) { return { name: f.name, date: f.date, time: f.time, call: f.call }; }),
      makeup: fns.map(function (f) { return { name: f.mk, fn: f.name, price: +f.price }; }),
      addons: W.addons.map(function (n) { return { name: n, price: addonPrice(n) }; }),
      travel: t.tr, payments: [], wages: W.team.map(function (x) { return { staff: x.id, amount: +x.wage || 0 }; }),
      status: t.adv > 0 || W.confirmNoAdv ? 'confirmed' : 'enquiry'
    };
    if (W.cust) bk.cust = W.cust;
    if (W.notes.trim()) bk.notes = W.notes.trim();
    q.addBooking(bk);
    if (t.adv > 0) q.addBookingPayment(id, t.adv, W.mode, 'Advance');
    var saved = q.booking(id);
    var sendWa = W.sendWa;
    KM.toast(saved.state === 'enquiry' ? 'Enquiry saved · ' + saved.client : 'Booking saved · ' + first(saved.client) + ' · ' + saved.title, { kind: 'success' });
    KM.goClose('/bookings/' + id);
    if (sendWa && saved.state !== 'enquiry') setTimeout(function () { KM.open('booking-message', { id: id, kind: 'confirm' }); }, 120);
  }

  function setActive(i) {
    W.active = i;
    W.el.querySelectorAll('[data-fn-card]').forEach(function (c) {
      var on = +c.getAttribute('data-fn-card') === i;
      c.classList.toggle('is-active', on);
      var p = c.querySelector('[data-fn-activate]');
      if (p) p.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var cal = W.el.querySelector('#bkw-cal'); if (cal) cal.innerHTML = String(wCal());
  }

  KM.overlay('booking-new', {
    /* the same 680px side sheet as Walk-in bill (bottom sheet on phones); the steps stack in one column inside it */
    title: 'New booking', kind: 'sheet', size: 'lg', role: 'owner',
    render: function (ctx) { wInit(ctx); return h`<div class="bkw">${wSteps()}<div class="bkw-pane" id="bkw-pane">${wPane()}</div></div>`; },
    footer: function () { return wFoot(); },
    mount: function (el) {
      W.el = el;
      el.addEventListener('click', function (e) {
        var t = e.target.closest('button, a');
        if (!t || !el.contains(t)) return;
        var v;
        if (t.hasAttribute('data-w-next')) return wGo(W.step + 1);
        if (t.hasAttribute('data-w-back')) return wGo(W.step - 1);
        if (t.hasAttribute('data-w-save')) return wSave();
        if ((v = t.getAttribute('data-step-go'))) return wGo(+v);
        if ((v = t.getAttribute('data-fn-toggle'))) {
          var idx = W.fns.map(function (f) { return f.name; }).indexOf(v);
          if (idx >= 0) { W.fns.splice(idx, 1); if (W.active >= W.fns.length) W.active = Math.max(0, W.fns.length - 1); }
          else { W.fns.push(newFn(v, !W.fns.length ? W.prefDate : '')); W.active = W.fns.length - 1; delete W.errors.fns; }
          var re = {}; Object.keys(W.errors).forEach(function (k) { if (!/^fn\d/.test(k)) re[k] = W.errors[k]; }); W.errors = re;
          return wPaint({ focus: '.chips [data-fn-toggle="' + v + '"]' });
        }
        if ((v = t.getAttribute('data-fn-activate')) !== null) {
          setActive(+v);
          var cal = el.querySelector('#bkw-cal'); if (cal) cal.scrollIntoView({ behavior: 'smooth', block: 'nearest' });   // the date picker sits below the cards
          return;
        }
        if ((v = t.getAttribute('data-cal-nav'))) { W.calMonth = D.addMonths(W.calMonth, +v); var c2 = el.querySelector('#bkw-cal'); if (c2) c2.innerHTML = String(wCal()); return; }
        if ((v = t.getAttribute('data-cal-pick'))) {
          if (!W.fns.length) { W.errors.fns = 'Pick a function first, then its date'; return wPaint({ focus: '.chips [data-fn-toggle]' }); }
          var f = W.fns[W.active] || W.fns[0];
          f.date = v; delete W.errors['fn' + W.fns.indexOf(f)];
          W.calMonth = v.slice(0, 7);
          var nx = -1; W.fns.forEach(function (x, i) { if (nx < 0 && !x.date) nx = i; });
          if (nx >= 0) W.active = nx;
          return wPaint({ focus: '#bkw-cal [data-cal-pick="' + v + '"]' });
        }
        if ((v = t.getAttribute('data-mk')) !== null) {
          var fn = W.fns[+v], name = t.getAttribute('data-mk-name'), prev = fn.mk && mkType(fn.mk);
          if (!fn.price || (prev && +fn.price === prev.price)) fn.price = String(mkType(name).price);
          fn.mk = name; delete W.errors['mk' + v];
          return wPaint({ focus: '[data-mk="' + v + '"][data-mk-name="' + name + '"]' });
        }
        if ((v = t.getAttribute('data-addon'))) {
          var ai = W.addons.indexOf(v);
          if (ai >= 0) W.addons.splice(ai, 1); else W.addons.push(v);
          t.classList.toggle('is-selected', ai < 0); t.setAttribute('aria-pressed', ai < 0 ? 'true' : 'false');
          return wPaintMoney();
        }
        if ((v = t.getAttribute('data-staff'))) {
          var tm = teamOf(v);
          if (tm) W.team.splice(W.team.indexOf(tm), 1); else W.team.push({ id: v, wage: WAGE[v] || 500 });
          return wPaint({ focus: '[data-staff="' + v + '"]' });
        }
        if ((v = t.getAttribute('data-adv')) !== null) { W.adv = v; clearErr('adv'); var ai2 = el.querySelector('#bkw-adv'); if (ai2) ai2.value = v; return wPaintMoney(); }
        if ((v = t.getAttribute('data-mode'))) {
          W.mode = v;
          el.querySelectorAll('[data-mode]').forEach(function (b) { var on = b.getAttribute('data-mode') === v; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); });
          return wPaintMoney();
        }
      });
      el.addEventListener('input', function (e) {
        var t = e.target, k = t.getAttribute('data-w'), i;
        if (k === 'phone') {
          var d = t.value.replace(/\D/g, '').slice(0, 10);
          if (t.value !== d) t.value = d;
          W.phone = d;
          var before = W.look;
          applyLookup(lookup(d));
          if (W.look !== before) {
            var n = el.querySelector('#bkw-name'), a = el.querySelector('#bkw-area');
            if (n) n.value = W.name; if (a) a.value = W.area;
            if (W.name) clearErr('name');
          }
          el.querySelector('#bkw-lookup').innerHTML = String(wLookup());
          if (d.length === 10) clearErr('phone');
          return;
        }
        if (k === 'name') { W.name = t.value; W.autoName = false; if (t.value.trim()) clearErr('name'); return; }
        if (k === 'area') { W.area = t.value; W.autoArea = false; return; }
        if (k === 'venue' || k === 'notes') { W[k] = t.value; return; }
        if (k === 'travel' || k === 'adv') {
          var clean = t.value.replace(/[^\d]/g, ''); if (clean !== t.value) t.value = clean;
          W[k] = clean; if (k === 'adv') clearErr('adv');
          return wPaintMoney();
        }
        if ((i = t.getAttribute('data-fn')) !== null) {
          var f = W.fns[+i], key = t.getAttribute('data-k');
          if (!f) return;
          f[key] = t.value;
          if (key === 'time' && f.callAuto && toMin(t.value) !== null) {
            var def = FN_TIMES[f.name] || ['10:00', '08:00'];
            f.call = fromMin(toMin(t.value) - (toMin(def[0]) - toMin(def[1])));
            var ci = el.querySelector('[data-fn="' + i + '"][data-k="call"]'); if (ci) ci.value = f.call;
          }
          if (key === 'call') f.callAuto = false;
          if (key === 'date') {
            if (f.date) { clearErr('fn' + i); W.calMonth = f.date.slice(0, 7); }
            var nt = el.querySelector('#bkw-fn-note-' + i); if (nt) nt.innerHTML = String(wFnNote(f));
            var cal = el.querySelector('#bkw-cal'); if (cal) cal.innerHTML = String(wCal());
          }
          return;
        }
        if ((i = t.getAttribute('data-mk-price')) !== null) {
          var cl = t.value.replace(/[^\d]/g, ''); if (cl !== t.value) t.value = cl;
          W.fns[+i].price = cl; if (+cl > 0) clearErr('mk' + i);
          return wPaintMoney();
        }
        if ((i = t.getAttribute('data-wage')) !== null) {
          var cw = t.value.replace(/[^\d]/g, ''); if (cw !== t.value) t.value = cw;
          var tm = teamOf(i); if (tm) tm.wage = cw;
          return wPaintMoney();
        }
      });
      el.addEventListener('change', function (e) {
        var k = e.target.getAttribute('data-w');
        if (k === 'sendWa' || k === 'confirmNoAdv') W[k] = e.target.checked;
      });
      el.addEventListener('focusin', function (e) {
        var i = e.target.getAttribute && e.target.getAttribute('data-fn');
        if (i !== null && i !== undefined && +i !== W.active) setActive(+i);
      });
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
          e.preventDefault();
          if (W.step < 4) wGo(W.step + 1); else wSave();
        }
      });
    },
    unmount: function () { if (W) W.el = null; }
  });
})();

</script>
<script data-screen="customers">
/* ===== screens/customers.js ===== */
/* Customers — the salon client book + the walk-in POS (replaces the old 2,948-line customers page).
   #/customers            tabs (query seg), live search (in place, keeps focus), sort select (query sort).
                          One row per customer: name, one meta line (led by the sort: spend / visits / last visit).
                          Right side only on Unpaid (the due + "Collect") and Lapsed ("We miss you").
   #/customers/<id>       profile: contact line + one WhatsApp action, 3 numbers (repeat customers only), visits (tap to see the bill), note, events.
   overlay "walkin"       phone-first bill: customer, services, served by, payment, optional "came from & rating";
                          save → receipt + "Send on WhatsApp". Staff never see lifetime spend.
                          Creating a bill lives in the shell (def.primary): "+ Walk-in bill" on the list, "+ New bill" (prefilled) on a profile.
                          Debug fills for screenshots: ?open=walkin&_demo=filled|success|new|partial */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  /* ------------------------------------------------------------------ helpers */
  function today() { return KM.state.today; }
  function nowTime() { return KM.state.now.slice(11, 16); }
  function first(name) { return String(name || '').split(' ')[0]; }
  function isOwner() { return KM.state.role === 'owner'; }
  function rawCustomer(id) { return KM.data.customers.filter(function (c) { return c.id === id; })[0]; }
  function fill(tpl, map) { return String(tpl).replace(/\{(\w+)\}/g, function (m, k) { return map[k] != null ? map[k] : m; }); }
  function missYouText(c) { return fill(KM.data.settings.templates.missYou, { name: first(c.name) }); }
  function reminderText(c, v) {
    return fill(KM.data.settings.templates.reminder, { name: first(c.name), amount: F.inr(v.due), what: 'your salon visit on ' + F.date(v.date) });
  }
  function names(v) { return v ? v.items.map(function (i) { return i.name; }).join(', ') : ''; }
  // A ₹0 line is part of a combined price (e.g. threading thrown in with wax) — never print "₹0".
  function priceLabel(p) { return p > 0 ? F.inr(p) : 'incl.'; }
  function invitedToday(c) { return c.invitedOn === today(); }
  function dueVisits(c) { return c.visits.filter(function (v) { return v.due > 0; }); }
  function payWord(v) { return v.paid.cash && v.paid.upi ? 'Cash + UPI' : v.paid.cash ? 'Cash' : v.paid.upi ? 'UPI' : ''; }
  // "today" / "3 days ago" read well mid-sentence; a plain date needs "on" ("last came on 19 Sep")
  function relLower(d) { var r = F.rel(d); return /^(Today|Yesterday|\d+ days ago)$/.test(r) ? r.toLowerCase() : 'on ' + r; }
  function dateTile(d) { return h`<span class="cu-date" aria-hidden="true"><span>${F.date(d, 'mon')}</span><b>${+d.slice(8, 10)}</b></span>`; }

  /* ------------------------------------------------------------------ segments & sorting */
  // Five tabs, the two that need action first. "today" and "vip" stay as deep links (the assistant links to ?seg=today)
  // and show as a tab only while selected.
  var SEGS = [
    { key: 'all', label: 'All', desc: 'Everyone who has visited the salon', test: function () { return true; } },
    { key: 'unpaid', label: 'Unpaid', desc: 'Have a salon bill to collect', test: function (c) { return c.due > 0; } },
    { key: 'lapsed', label: 'Lapsed', desc: 'No visit in the last 30 days', test: function (c) { return c.isLapsed; } },
    { key: 'repeat', label: 'Regulars', desc: 'Came back 2 or more times', test: function (c) { return c.isRepeat; } },
    { key: 'new', label: 'New', desc: 'First visit in the last 30 days', test: function (c) { return c.isNew; } },
    { key: 'today', label: 'Today', extra: true, desc: 'Billed today', test: function (c) { return c.lastVisit === today(); } },
    { key: 'vip', label: 'VIP', extra: true, desc: 'Spent ₹4,000+ or 5+ visits', test: function (c) { return c.isVip; } }
  ];
  var SORTS = [
    { key: 'recent', label: 'Recent' },
    { key: 'spend', label: 'Top spend' },
    { key: 'visits', label: 'Most visits' }
  ];
  function segOf(k) { return SEGS.filter(function (s) { return s.key === k; })[0] || SEGS[0]; }
  function sortOf(k) { return SORTS.filter(function (s) { return s.key === k; })[0] || SORTS[0]; }
  function href(seg, sort) {
    var p = [];
    if (seg && seg !== 'all') p.push('seg=' + seg);
    if (sort && sort !== 'recent') p.push('sort=' + sort);
    return '#/customers' + (p.length ? '?' + p.join('&') : '');
  }
  function lastKey(c) { var v = c.visits[0]; return v ? v.date + v.time : ''; }
  function sortList(list, sortKey) {
    var cmp = {
      recent: function (a, b) { return lastKey(b).localeCompare(lastKey(a)); },
      spend: function (a, b) { return b.lifetime - a.lifetime || lastKey(b).localeCompare(lastKey(a)); },
      visits: function (a, b) { return b.visitCount - a.visitCount || b.lifetime - a.lifetime; }
    }[sortKey] || function () { return 0; };
    return list.slice().sort(cmp);
  }
  function matches(c, text) {
    var t = String(text || '').trim().toLowerCase();
    if (!t) return true;
    var digits = t.replace(/\D/g, '');
    return c.name.toLowerCase().indexOf(t) >= 0 || (c.area || '').toLowerCase().indexOf(t) >= 0 || (digits.length >= 3 && c.phone.indexOf(digits) >= 0);
  }

  // screen-local UI state (search lives here, not in the URL, so typing never re-renders the input)
  var ui = { search: '', appliedQ: null, seg: 'all', sort: 'recent' };

  /* ------------------------------------------------------------------ list rows */
  function inviteBtn(c) {
    if (invitedToday(c)) return h`<span class="status is-success">Invited today</span>`;
    return h`<a class="btn btn-wa btn-sm" href="${KM.wa(c.phone, missYouText(c))}" target="_blank" rel="noopener" data-invite="${c.id}" aria-label="Send a We miss you message to ${c.name} on WhatsApp">${I('brand-whatsapp')}We miss you</a>`;
  }
  function row(c, segKey) {
    var last = c.visits[0];
    if (segKey === 'unpaid' && c.due > 0) {
      var dv = dueVisits(c), d0 = dv[0];
      return h`<div class="list-item cu-row">
        ${KM.avatar(c.name, 'cu-av')}
        <a class="li-body" href="#/customers/${c.id}"><span class="li-title">${c.name}</span>
          <span class="li-meta">${names(d0)} · ${F.rel(d0.date)}${dv.length > 1 ? ' · +' + (dv.length - 1) + ' more' : ''}</span></a>
        <span class="li-trail cu-act"><span class="money is-due">${F.inr(d0.due)}</span>
          <button class="btn btn-secondary btn-sm" data-open="collect" data-p-kind="salon" data-p-id="${d0.id}">Collect</button></span>
      </div>`;
    }
    if (segKey === 'lapsed') {
      return h`<div class="list-item cu-row">
        ${KM.avatar(c.name, 'cu-av')}
        <a class="li-body" href="#/customers/${c.id}"><span class="li-title">${c.name}</span>
          <span class="li-meta">${F.plural(c.daysSince, 'day')} ago · ${names(last)}</span></a>
        <span class="li-trail cu-act">${inviteBtn(c)}</span>
      </div>`;
    }
    // No right-side value here: a ₹ at the row's end means money owed (Unpaid tab). The meta leads with what the list is sorted by.
    var lead = ui.sort === 'spend' ? F.inr(c.lifetime) + ' spent' : ui.sort === 'visits' ? F.plural(c.visitCount, 'visit') : '';
    var meta = [lead, last ? F.rel(last.date) : '', names(last), c.area].filter(Boolean).join(' · ');
    return h`<a class="list-item cu-row" href="#/customers/${c.id}">
      ${KM.avatar(c.name, 'cu-av')}
      <span class="li-body"><span class="cu-title"><span class="li-title">${c.name}</span>${c.due > 0 ? h`<span class="badge badge-danger">Unpaid</span>` : ''}</span>
        <span class="li-meta">${meta}</span></span>
    </a>`;
  }

  // Unpaid and Lapsed rows show a due / an invite, not spend or visits — so they keep their natural order and no sort control
  function sortable(segKey) { return segKey !== 'unpaid' && segKey !== 'lapsed'; }
  function effSort(segKey) { return sortable(segKey) ? ui.sort : 'recent'; }
  function resultsHTML(all) {
    var seg = segOf(ui.seg);
    var list = sortList(all.filter(seg.test).filter(function (c) { return matches(c, ui.search); }), effSort(seg.key));
    var term = ui.search.trim();
    var elsewhere = term && seg.key !== 'all' ? all.filter(function (c) { return matches(c, ui.search); }).length : 0;
    // the count only appears while searching — the tab already carries the group's size
    var count = term && list.length ? h`${F.plural(list.length, 'match', 'matches')} for “${term}”${elsewhere > list.length ? h` · <a class="link" href="${href('all', ui.sort)}">${elsewhere} in all customers</a>` : ''}` : '';
    var body;
    if (list.length) body = list.map(function (c) { return row(c, seg.key); });
    else if (term) {
      var digits = ui.search.replace(/\D/g, '');
      body = h`<div class="empty cu-empty">
        <div class="empty-title">No one matches “${term}”</div>
        <div class="empty-body">Try a first name, the area, or the last 4 digits of the phone.</div>
        ${elsewhere ? h`<a class="link" href="${href('all', ui.sort)}">${elsewhere} in all customers</a>` : ''}
        ${digits.length === 10 ? h`<button class="btn btn-secondary btn-sm" data-open="walkin" data-p-phone="${digits}">New bill for ${F.phone(digits)}</button>` : ''}</div>`;
    } else {
      body = h`<div class="empty cu-empty"><div class="empty-title">${seg.key === 'unpaid' ? 'Every salon bill is paid' : 'Nobody here yet'}</div>
        <div class="empty-body">${seg.desc}.</div></div>`;
    }
    return { count: count, body: body };
  }

  /* ------------------------------------------------------------------ list page */
  function listPage(ctx) {
    var all = q.customers();
    ui.seg = segOf(ctx.query.seg).key;
    ui.sort = sortOf(ctx.query.sort).key;
    if (ctx.query.q != null && ctx.query.q !== ui.appliedQ) { ui.search = ctx.query.q; ui.appliedQ = ctx.query.q; }
    var res = resultsHTML(all);
    var tabs = SEGS.filter(function (s) {
      if (s.key === ui.seg || s.key === 'all') return true;
      return !s.extra && all.filter(s.test).length > 0;
    });
    // search only where the group is long enough to need it (or a search is already running, so it can be cleared)
    var showTools = !!ui.search || all.filter(segOf(ui.seg).test).length > 10;
    return h`
      <header class="page-head">
        <div class="page-head-text"><h1 class="page-title">Customers</h1></div>
      </header>
      <nav class="tabs cu-tabs" aria-label="Customer groups">${tabs.map(function (s) {
        var on = s.key === ui.seg;
        return h`<a class="tab ${on ? 'is-active' : ''}" href="${href(s.key, ui.sort)}" title="${s.desc}" ${on ? KM.raw('aria-current="page"') : ''}>${s.label}<span class="chip-count">${all.filter(s.test).length}</span></a>`;
      })}</nav>
      ${showTools ? h`<div class="cu-tools">
        <div class="search cu-search ${ui.search ? 'has-text' : ''}" role="search">
          ${I('search')}
          <input class="input" id="cu-search" type="search" enterkeyhint="search" autocomplete="off" placeholder="Name, phone or area" aria-label="Search customers by name, phone or area" value="${ui.search}">
          <button type="button" class="cu-clear" data-cu-clear aria-label="Clear search">${I('x')}</button>
        </div>
        ${sortable(ui.seg) ? h`<select class="select cu-sort" id="cu-sort" aria-label="Sort customers">${SORTS.map(function (s) {
          return h`<option value="${s.key}" ${s.key === ui.sort ? KM.raw('selected') : ''}>${s.label}</option>`;
        })}</select>` : ''}
      </div>` : ''}
      <p class="cu-count" id="cu-count" aria-live="polite">${res.count}</p>
      <section class="card cu-card" aria-label="Customer list"><div class="list" id="cu-list">${res.body}</div></section>`;
  }

  /* ------------------------------------------------------------------ profile */
  function visitRow(v) {
    var meta = [F.time(v.time), v.staff ? first(q.staffName(v.staff)) : ''];
    if (v.due > 0) {
      if (v.received) meta.push('paid ' + F.inr(v.received) + ' of ' + F.inr(v.total));
      return h`<li class="list-item cu-v is-due">${dateTile(v.date)}
        <span class="li-body"><span class="li-title">${names(v)}</span><span class="li-meta">${meta.filter(Boolean).join(' · ')}</span></span>
        <span class="li-trail cu-act"><span class="money is-due">${F.inr(v.due)} due</span>
          <button class="btn btn-secondary btn-sm" data-open="collect" data-p-kind="salon" data-p-id="${v.id}">Collect</button></span></li>`;
    }
    meta.push(payWord(v));
    var head = h`${dateTile(v.date)}
      <span class="li-body"><span class="li-title">${names(v)}</span><span class="li-meta">${meta.filter(Boolean).join(' · ')}</span></span>
      <span class="li-trail"><span class="cu-val num">${F.inr(v.total)}</span></span>`;
    var split = v.paid.cash && v.paid.upi;
    if (v.items.length < 2 && !split) return h`<li class="list-item cu-v">${head}</li>`;
    // a bill with several lines (or a split payment) opens in place to show the lines
    return h`<li class="cu-v cu-vx"><details><summary class="list-item" aria-label="${F.date(v.date, 'dow')} · ${names(v)} · ${F.inr(v.total)}">${head}</summary>
      <div class="kv cu-vlines">${v.items.map(function (it) { return h`<div class="kv-row"><span>${it.name}</span><span class="num">${priceLabel(it.price)}</span></div>`; })}
        ${split ? h`<div class="kv-row"><span>Paid</span><span class="num">Cash ${F.inr(v.paid.cash)} · UPI ${F.inr(v.paid.upi)}</span></div>` : ''}</div>
    </details></li>`;
  }
  function bookingRow(b) {
    var trail = b.state === 'enquiry' ? h`<span class="badge badge-info">Enquiry</span>`
      : b.state === 'today' ? h`<span class="badge badge-accent">Today</span>`
      : b.state === 'cancelled' ? h`<span class="subtle small">Cancelled</span>`
      : b.state === 'balance-due' ? h`<span class="money is-due small">${F.inr(b.due)} due</span>`
      : b.due > 0 ? h`<span class="subtle small">${F.inr(b.due)} due</span>` : h`<span class="subtle small">Paid</span>`;
    return h`<a class="list-item" href="#/bookings/${b.id}">${dateTile(b.start)}
      <span class="li-body"><span class="li-title">${b.title}</span><span class="li-meta">${b.venue}</span></span>
      <span class="li-trail">${trail}</span></a>`;
  }
  // one WhatsApp action per profile; its message follows what matters most: a due → reminder, lapsed → "We miss you"
  function waAction(c) {
    var dv = dueVisits(c)[0];
    if (dv) return h`<a class="btn btn-wa" href="${KM.wa(c.phone, reminderText(c, dv))}" target="_blank" rel="noopener" aria-label="Send ${c.name} a payment reminder on WhatsApp">${I('brand-whatsapp')}Send reminder</a>`;
    if (c.isLapsed && !invitedToday(c)) return h`<a class="btn btn-wa" href="${KM.wa(c.phone, missYouText(c))}" target="_blank" rel="noopener" data-invite="${c.id}" aria-label="Send ${c.name} a We miss you message on WhatsApp">${I('brand-whatsapp')}We miss you</a>`;
    return h`<a class="btn btn-wa" href="${KM.wa(c.phone, 'Vanakkam ' + first(c.name) + '! ')}" target="_blank" rel="noopener" aria-label="Message ${c.name} on WhatsApp">${I('brand-whatsapp')}WhatsApp</a>`;
  }

  function profile(id) {
    var c = q.customer(id);
    if (!c) {
      return h`${KM.backLink('/customers', 'Customers')}
        <div class="empty"><div class="empty-title">Customer not found</div>
        <div class="empty-body">This customer may have been removed. Search by phone instead.</div>
        <a class="btn btn-secondary btn-sm" href="#/customers">Back to customers</a></div>`;
    }
    var all = q.customers();
    var rank = all.slice().sort(function (a, b) { return b.lifetime - a.lifetime; }).map(function (x) { return x.id; }).indexOf(c.id) + 1;
    var allVisits = KM.data.visits;
    var salonAvg = allVisits.length ? q.sum(allVisits, function (v) { return v.total; }) / allVisits.length : 0;
    var gap = c.visitCount > 1 ? Math.round(D.diff(c.lastVisit, c.firstVisit) / (c.visitCount - 1)) : 0;
    var bks = c.bookings.map(function (b) { return q.booking(b.id); }).filter(Boolean);
    var addedBy = c.addedBy ? q.staff(c.addedBy) : null;

    // Numbers, shown once. A one-visit customer gets no strip: her single visit row already says the amount and the date.
    // (No "usually takes / usually with / customer since" panel either — the visit list right beside it shows exactly that.)
    var kpis = c.visitCount > 1 ? [
      ['Spent', F.inr(c.lifetime), '#' + rank + ' of ' + all.length + ' customers'],
      ['Visits', F.num(c.visitCount), gap ? 'Every ~' + gap + ' days' : 'Since ' + F.date(c.firstVisit, 'month')],
      ['Average bill', F.inr(c.avg), 'Salon average ' + F.inr(salonAvg)]
    ] : [];

    return h`
      ${KM.backLink('/customers', 'Customers')}
      <header class="page-head cu-phead">
        ${KM.avatar(c.name, 'avatar-lg cu-phead-av')}
        <div class="page-head-text">
          <h1 class="page-title">${c.name}</h1>
          <p class="page-sub"><a class="cu-tel num" href="tel:+91${c.phone}" aria-label="Call ${c.name} on ${F.phone(c.phone)}">${F.phone(c.phone)}</a>${c.area ? ' · ' + c.area : ''}${addedBy ? ' · added by ' + first(addedBy.name) : ''}</p>
        </div>
        <div class="page-actions">${waAction(c)}</div>
      </header>

      ${kpis.length ? h`<section class="kpi-row cu-kpis" aria-label="${first(c.name)} at a glance">${kpis.map(function (k) {
        return h`<div class="kpi"><div class="kpi-label">${k[0]}</div><div class="kpi-value num">${k[1]}</div><div class="kpi-foot"><span class="truncate">${k[2]}</span></div></div>`;
      })}</section>` : ''}

      <div class="cu-pcols">
        <section class="card cu-visits" aria-labelledby="cu-v-h">
          <div class="card-head"><h2 class="card-title" id="cu-v-h">Visits</h2></div>
          <ol class="list cu-vlist">${c.visits.map(visitRow)}</ol>
        </section>
        <div class="cu-pside">
          <section class="card cu-prefs" aria-labelledby="cu-p-h">
            <div class="card-head"><h2 class="card-title" id="cu-p-h">Note</h2></div>
            <div class="card-body">
              <label class="field cu-note"><span class="sr-only">Note about ${first(c.name)}</span>
                <textarea class="textarea" id="cu-note" rows="3" placeholder="Skin type, allergies, family events coming up…">${c.note || ''}</textarea></label>
              <div class="cu-note-foot"><span class="subtle xsmall" id="cu-note-state"></span>
                <button class="btn btn-secondary btn-sm" data-cu-note="${c.id}">Save note</button></div>
            </div>
          </section>
          <section class="card cu-events" aria-labelledby="cu-e-h">
            <div class="card-head"><h2 class="card-title" id="cu-e-h">Events</h2>${bks.length ? h`<button type="button" class="link" data-open="booking-new" data-p-customer="${c.id}">Book another</button>` : ''}</div>
            ${bks.length ? h`<div class="list">${bks.map(bookingRow)}</div>`
              : h`<div class="card-body cu-noev"><p class="subtle small">No events booked yet.</p>
                <button class="btn btn-secondary btn-sm" data-open="booking-new" data-p-customer="${c.id}">Book an event</button></div>`}
          </section>
        </div>
      </div>`;
  }

  /* ------------------------------------------------------------------ screen */
  function markInvited(id) {
    var c = rawCustomer(id);
    if (!c) return;
    c.invitedOn = today();
    KM.toast('“We miss you” sent to ' + first(c.name) + ' · marked as invited', { kind: 'success' });
    setTimeout(function () { if (KM.parse().id === 'customers') KM.refresh(); }, 80);
  }

  KM.screen('customers', {
    title: 'Customers', icon: 'users', role: 'owner',
    // the page's one create action (shell top bar + first in the Add menu); on a profile it is prefilled with her number
    primary: function (r) {
      var c = r && r.params && r.params[0] ? rawCustomer(r.params[0]) : null;
      return c ? { label: 'New bill', open: 'walkin', icon: 'receipt', params: { customer: c.id } }
        : { label: 'Walk-in bill', open: 'walkin', icon: 'receipt' };
    },
    render: function (ctx) { return ctx.params[0] ? profile(ctx.params[0]) : listPage(ctx); },
    mount: function (root, ctx) {
      var input = root.querySelector('#cu-search');
      if (input) {
        var all = null;
        var update = function () {
          all = all || q.customers();
          var res = resultsHTML(all);
          root.querySelector('#cu-list').innerHTML = String(h`${res.body}`);
          root.querySelector('#cu-count').innerHTML = String(h`${res.count}`);
          input.parentNode.classList.toggle('has-text', !!ui.search);
        };
        input.addEventListener('input', function () { ui.search = input.value; update(); });
        input.addEventListener('keydown', function (e) { if (e.key === 'Escape' && input.value) { e.stopPropagation(); input.value = ''; ui.search = ''; update(); } });
        root.querySelector('[data-cu-clear]').addEventListener('click', function () { input.value = ''; ui.search = ''; update(); input.focus(); });
      }
      var sort = root.querySelector('#cu-sort');
      if (sort) sort.addEventListener('change', function () { location.hash = href(ui.seg, sort.value); });
      // phones: the tab strip scrolls sideways — keep the selected tab in view (without scrolling the page)
      var tabs = root.querySelector('.cu-tabs'), on = tabs && tabs.querySelector('.tab.is-active');
      if (on) {
        var tr = tabs.getBoundingClientRect(), or = on.getBoundingClientRect();
        if (or.right > tr.right - 8) tabs.scrollLeft += or.right - tr.right + 24;
      }
      // #km-page persists across renders: a named handler is only ever registered once (addEventListener dedupes)
      root.addEventListener('click', onPageClick);
      var ta = root.querySelector('#cu-note');
      if (ta) ta.addEventListener('input', function () { root.querySelector('#cu-note-state').textContent = 'Unsaved changes'; });
    },
    unmount: function () { var p = document.getElementById('km-page'); if (p) p.removeEventListener('click', onPageClick); }
  });
  function onPageClick(e) {
    var root = e.currentTarget;
    var inv = e.target.closest('[data-invite]');
    if (inv) { markInvited(inv.getAttribute('data-invite')); return; }
    var nb = e.target.closest('[data-cu-note]');
    if (nb) {
      var c = rawCustomer(nb.getAttribute('data-cu-note'));
      var ta = root.querySelector('#cu-note');
      if (c && ta) { c.note = ta.value.trim(); root.querySelector('#cu-note-state').textContent = 'Saved'; KM.toast('Note saved for ' + first(c.name), { kind: 'success' }); }
    }
  }
  KM.on('data:changed', function () { if (KM.parse().id === 'customers') KM.refresh(); });

  /* =================================================================== walk-in POS overlay */
  var W = null;     // live state of the open walk-in sheet
  var lineSeq = 0;
  var REFS = ['Instagram', 'Friend', 'Walk-by', 'Returning'];

  function fmtPhone(d) { return d.length > 5 ? d.slice(0, 5) + ' ' + d.slice(5) : d; }
  function cleanPhone(v) { var d = String(v || '').replace(/\D/g, ''); if (d.length > 10 && /^(91|0)/.test(d)) d = d.slice(-10); return d.slice(0, 10); }
  function defaultStaffId() {
    if (KM.state.role === 'staff' && KM.state.user) return KM.state.user.id;
    var p = q.attendanceOn(today()).filter(function (a) { return a.status === 'present' || a.status === 'late'; })[0];
    return p ? p.person.id : KM.data.staff[0].id;
  }
  function svcByUsage() {
    var n = {};
    KM.data.visits.forEach(function (v) { v.items.forEach(function (it) { if (it.svc) n[it.svc] = (n[it.svc] || 0) + 1; }); });
    return KM.data.services.slice().sort(function (a, b) { return (n[b.id] || 0) - (n[a.id] || 0) || a.price - b.price; });
  }
  function blank() {
    return { phone: '', name: '', area: '', match: null, auto: false, items: [], staff: defaultStaffId(), pay: 'cash', cash: '',
      referral: '', rating: 0, touched: {}, saved: null };
  }
  function hasSvc(id) { return W.items.some(function (it) { return it.svc === id; }); }
  function addSvc(id) { var s = q.svc(id); if (s && !hasSvc(id)) W.items.push({ key: 'l' + (++lineSeq), svc: id, name: s.name, price: s.price }); }
  function total() { return q.sum(W.items, function (it) { return +it.price || 0; }); }
  function cashPart() { var t = total(); return W.pay === 'cash' ? t : W.pay === 'split' ? Math.min(+W.cash || 0, t) : 0; }
  function upiPart() { var t = total(); return W.pay === 'upi' ? t : W.pay === 'split' ? t - Math.min(+W.cash || 0, t) : 0; }
  function setPhone(d) {
    W.phone = d;
    var m = d.length === 10 ? q.findByPhone(d) : null;
    if ((m ? m.id : null) === (W.match ? W.match.id : null)) return false;
    if (m) { W.name = m.name; W.area = m.area; W.auto = true; if (!W.referral) W.referral = 'Returning'; }
    else if (W.auto) { W.name = ''; W.area = ''; W.auto = false; if (W.referral === 'Returning') W.referral = ''; }
    W.match = m;
    return true;
  }
  function problems() {
    var p = [];
    if (W.phone.length !== 10 || !/^[6-9]/.test(W.phone)) p.push('phone');
    if (!W.name.trim()) p.push('name');
    if (!W.items.length) p.push('service');
    else if (W.items.some(function (it) { return !String(it.name).trim(); })) p.push('service name');
    return p;
  }
  function suggestions() {
    var d = W.phone;
    if (d.length < 4 || d.length > 9) return [];
    var hits = KM.data.customers.filter(function (c) { return c.phone.indexOf(d) >= 0; });
    return hits.length <= 4 ? hits : [];
  }

  /* ---- walk-in: pieces ---- */
  function lastItems() { var l = W.match && W.match.visits[0]; return l ? l.items.filter(function (it) { return it.svc; }) : []; }
  // "Repeat last visit" only while it would add something
  function canRepeat() { var li = lastItems(); return li.length > 0 && li.some(function (it) { return !hasSvc(it.svc); }); }
  function syncRepeat(el) { var b = el.querySelector('.wk-again'); if (b) b.hidden = !canRepeat(); }
  function matchHTML() {
    if (W.match) {
      // her name is already in the Name field below — this line only adds what the field can't say
      var c = W.match;
      var dueV = c.visits.filter(function (v) { return v.due > 0; })[0];
      var lastSvcs = lastItems().map(function (it) { return it.name; });
      return h`<div class="wk-match">
        <p class="wk-match-line"><span class="status is-success">Returning</span><span>${F.ordinal(c.visitCount + 1)} visit · last came ${relLower(c.lastVisit)}</span></p>
        ${dueV ? h`<p class="wk-match-due">${F.inr(c.due)} unpaid from ${F.date(dueV.date)}</p>` : ''}
        ${lastSvcs.length ? h`<button type="button" class="btn btn-secondary btn-sm wk-again" data-wk="repeat" ${canRepeat() ? '' : KM.raw('hidden')}>Repeat last visit · ${lastSvcs.join(' + ')}</button>` : ''}
      </div>`;
    }
    if (W.phone.length === 10) {
      if (!/^[6-9]/.test(W.phone)) return h`<p class="hint wk-bad">Indian mobile numbers start with 6, 7, 8 or 9.</p>`;
      return h`<p class="hint">New customer — add her name.</p>`;
    }
    var sug = suggestions();
    if (sug.length) {
      return h`<div class="wk-sug"><span class="hint">Regulars matching “${W.phone}”</span><div class="wk-sug-list">${sug.map(function (c) {
        return h`<button type="button" class="wk-sug-item" data-pick="${c.phone}">${KM.avatar(c.name, 'avatar-sm')}<span><b>${c.name}</b><span class="num">${F.phone(c.phone)}</span></span></button>`;
      })}</div></div>`;
    }
    if (W.touched.phone && W.phone.length) return h`<p class="hint wk-bad">Enter all 10 digits of the mobile number.</p>`;
    return '';
  }
  function phoneState() {
    if (!W.phone.length || W.phone.length === 10) return '';
    return h`<span class="wk-pcount num" aria-hidden="true">${W.phone.length}/10</span>`;
  }
  function tilesHTML() {
    return h`${svcByUsage().map(function (s) {
      var on = hasSvc(s.id);
      return h`<button type="button" class="wk-svc ${on ? 'is-on' : ''}" data-svc="${s.id}" aria-pressed="${on ? 'true' : 'false'}">
        <span class="wk-svc-name">${s.name}</span><span class="wk-svc-price num">${F.inr(s.price)}</span></button>`;
    })}<button type="button" class="wk-svc is-other" data-wk="other"><span class="wk-svc-name">Other…</span><span class="wk-svc-price">Your price</span></button>`;
  }
  function billHTML() {
    // the total lives once, in the sticky footer
    if (!W.items.length) return W.touched.svc ? h`<p class="hint wk-bad">Pick at least one service.</p>` : '';
    return h`<div class="wk-lines">${W.items.map(function (it) {
      var label = it.name || 'custom service';
      return h`<div class="wk-line" data-key="${it.key}">
        ${it.svc ? h`<span class="wk-line-name">${it.name}</span>`
          : h`<input class="input wk-line-input" data-cname="${it.key}" placeholder="Service name, e.g. Eyebrow tint" value="${it.name}" aria-label="Custom service name" autocomplete="off">`}
        <label class="wk-price"><span aria-hidden="true">₹</span><input class="wk-price-input num" data-price="${it.key}" type="text" inputmode="numeric" pattern="[0-9]*" value="${it.price}" aria-label="Price for ${label}" autocomplete="off"></label>
        <button type="button" class="wk-rm" data-rm="${it.key}" aria-label="Remove ${label}">${I('x')}</button>
      </div>`;
    })}</div>`;
  }
  function staffHTML() {
    var order = { present: 0, late: 0, event: 2, half: 1, 'not-in': 3, leave: 4, absent: 4 };
    var rows = q.attendanceOn(today()).slice().sort(function (a, b) { return (order[a.status] || 0) - (order[b.status] || 0); });
    return h`${rows.map(function (a) {
      var on = W.staff === a.person.id;
      var st = a.status === 'present' || a.status === 'late' ? 'In ' + F.time(a.in) : a.status === 'event' ? 'On event duty' : (q.ATT[a.status] || {}).label || '';
      var away = !(a.status === 'present' || a.status === 'late' || a.status === 'half');
      return h`<button type="button" class="wk-person ${on ? 'is-on' : ''} ${away ? 'is-away' : ''}" data-staff="${a.person.id}" aria-pressed="${on ? 'true' : 'false'}">
        ${KM.avatar(a.person.name, 'avatar-sm')}<span class="wk-person-text"><span class="wk-person-name">${first(a.person.name)}</span><span class="wk-person-st">${st}</span></span></button>`;
    })}`;
  }
  function splitHint() { return +W.cash > total() ? 'Cash is more than the bill — UPI set to ₹0.' : ''; }
  function payDetailHTML() {
    if (W.pay === 'split') {
      return h`<div class="wk-split">
        <label class="field"><span class="label">Cash received</span>
          <span class="input-group"><span class="input-prefix">₹</span><input class="input num" id="wk-cash" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" value="${W.cash}"></span></label>
        <div class="field"><span class="label">UPI / GPay</span><div class="wk-upi num" id="wk-upi">${F.inr(upiPart())}</div></div>
        <p class="hint wk-bad wk-split-hint" id="wk-split-hint">${splitHint()}</p>
      </div>`;
    }
    if (W.pay === 'unpaid') return h`<p class="hint">Saved as due — collect it later from Money → Dues or her profile.</p>`;
    if (W.pay === 'upi') return h`<p class="hint">Pay to <b class="wk-upi-id">${KM.data.settings.studio.upi}</b></p>`;
    return '';
  }
  function payHTML() {
    var opts = [['cash', 'Cash'], ['upi', 'UPI / GPay'], ['split', 'Split'], ['unpaid', 'Unpaid']];
    return h`${opts.map(function (o) {
      var on = W.pay === o[0];
      return h`<button type="button" class="seg-item ${on ? 'is-active' : ''}" data-pay="${o[0]}" aria-pressed="${on ? 'true' : 'false'}">${o[1]}</button>`;
    })}`;
  }
  function extrasHTML() {
    return h`<div class="wk-opt">
      <div class="wk-opt-row"><span class="label" id="wk-ref-l">Came from</span>
        <div class="chips" role="group" aria-labelledby="wk-ref-l">${REFS.map(function (r) {
          var on = W.referral === r;
          return h`<button type="button" class="chip no-check wk-ref ${on ? 'is-selected' : ''}" data-ref="${r}" aria-pressed="${on ? 'true' : 'false'}">${r}</button>`;
        })}</div></div>
      ${isOwner() ? h`<div class="wk-opt-row"><span class="label" id="wk-rate-l">Your rating</span>
        <div class="wk-stars" role="group" aria-labelledby="wk-rate-l">${[1, 2, 3, 4, 5].map(function (n) {
          return h`<button type="button" class="wk-star ${n <= W.rating ? 'is-on' : ''}" data-star="${n}" aria-pressed="${n <= W.rating ? 'true' : 'false'}" aria-label="${F.plural(n, 'star')}">${I(n <= W.rating ? 'star-filled' : 'star')}</button>`;
        })}</div></div>` : ''}
    </div>`;
  }
  function sec(id, title, body) {
    return h`<section class="wk-sec" aria-labelledby="${id}"><h3 class="wk-sec-title" id="${id}">${title}</h3>${body}</section>`;
  }
  function formHTML() {
    var focusPhone = !W.phone;
    var moreOpen = (W.referral && W.referral !== 'Returning') || W.rating;
    // prefilled sheet: focus the form itself (no keyboard pop-up on phones, no focus ring parked on the close button)
    return h`<div class="wk" tabindex="-1" ${focusPhone ? '' : KM.raw('autofocus')}>
      ${sec('wk-h-cust', 'Customer', h`
        <label class="field wk-phone-field"><span class="sr-only">Mobile number</span>
          <span class="input-group">
            <span class="input-prefix wk-cc">+91</span>
            <input class="input is-big wk-phone num" id="wk-phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="Mobile number" value="${fmtPhone(W.phone)}" aria-describedby="wk-match" ${focusPhone ? KM.raw('autofocus') : ''}>
            <span class="wk-pstate-slot" id="wk-pstate">${phoneState()}</span>
          </span>
        </label>
        <div class="wk-match-slot" id="wk-match" aria-live="polite">${matchHTML()}</div>
        <div class="wk-who">
          <label class="field"><span class="label">Name <span class="req">*</span></span>
            <input class="input" id="wk-name" autocomplete="off" autocapitalize="words" placeholder="Customer name" value="${W.name}">
            <span class="hint wk-bad" id="wk-name-err">${W.touched.name && !W.name.trim() ? "Add the customer's name" : ''}</span></label>
          <label class="field"><span class="label">Area</span>
            <input class="input" id="wk-area" autocomplete="off" placeholder="e.g. Velachery" value="${W.area}"></label>
        </div>`)}
      ${sec('wk-h-svc', 'Services', h`
        <div class="wk-svcs" id="wk-svcs" role="group" aria-labelledby="wk-h-svc">${tilesHTML()}</div>
        <div class="wk-bill" id="wk-bill">${billHTML()}</div>`)}
      ${sec('wk-h-staff', 'Served by', h`<div class="wk-people" id="wk-people" role="group" aria-labelledby="wk-h-staff">${staffHTML()}</div>`)}
      ${sec('wk-h-pay', 'Payment', h`<div class="seg is-block wk-pay" id="wk-pay" role="group" aria-labelledby="wk-h-pay">${payHTML()}</div>
        <div class="wk-pay-detail" id="wk-pay-detail">${payDetailHTML()}</div>`)}
      <details class="wk-sec wk-more" ${moreOpen ? KM.raw('open') : ''}>
        <summary class="wk-more-sum"><span class="wk-sec-title">${isOwner() ? 'Came from & rating' : 'Came from'}</span>${I('chevron-down')}</summary>
        <div id="wk-extras">${extrasHTML()}</div>
      </details>
    </div>`;
  }
  function footHTML() {
    if (W.saved) {
      var c = W.saved.customer, v = W.saved.visit;
      return h`<button type="button" class="btn btn-secondary" data-wk="done">Done</button>
        <a class="btn btn-wa" href="${KM.wa(c.phone, billText(c, v))}" target="_blank" rel="noopener" data-wk="sent">${I('brand-whatsapp')}Send on WhatsApp</a>`;
    }
    var p = problems();
    var word = { cash: 'Cash', upi: 'UPI / GPay', split: 'Split', unpaid: 'Unpaid — due' }[W.pay];
    return h`<div class="wk-foot-total">
        <span class="wk-foot-label ${p.length ? 'is-missing' : ''}">${p.length ? 'Add ' + p.join(', ') : F.plural(W.items.length, 'service') + ' · ' + word}</span>
        <span class="wk-foot-amt num">${F.inr(total())}</span>
      </div>
      <button type="button" class="btn btn-primary btn-lg wk-save" data-wk="save" ${p.length ? KM.raw('disabled aria-disabled="true"') : ''}>Save bill</button>`;
  }
  function payLabel(v) {
    if (v.due > 0 && !v.received) return 'Unpaid — ' + F.inr(v.due) + ' due';
    var parts = [];
    if (v.paid.cash) parts.push('Cash ' + F.inr(v.paid.cash));
    if (v.paid.upi) parts.push('UPI ' + F.inr(v.paid.upi));
    var s = parts.length === 2 ? parts.join(' + ') : (v.paid.cash ? 'Paid in cash' : 'Paid by UPI');
    return s + (v.due > 0 ? ' · ' + F.inr(v.due) + ' due' : '');
  }
  function billText(c, v) {
    var lines = v.items.map(function (it) { return '• ' + it.name + ' — ' + priceLabel(it.price); }).join('\n');
    var tot = F.inr(v.total) + (v.due > 0 ? (v.received ? ' (paid ' + F.inr(v.received) + ', balance ' + F.inr(v.due) + ')' : ' (to be paid)') : ' · paid, thank you!');
    return fill(KM.data.settings.templates.bill, { name: first(c.name), lines: lines, total: tot });
  }
  function successHTML() {
    var v = W.saved.visit, c = W.saved.customer;
    var st = v.staff ? q.staff(v.staff) : null;
    return h`<div class="wk-done">
      <div class="wk-done-hero">
        <span class="wk-check" aria-hidden="true">${I('check')}</span>
        <h3 class="wk-done-title">Bill saved</h3>
        <p class="wk-done-sub">${c.name} · ${F.ordinal(c.visitCount)} visit${W.saved.isNew ? ' · new customer' : ''}</p>
      </div>
      <div class="kv wk-receipt">${v.items.map(function (it) { return h`<div class="kv-row"><span>${it.name}</span><span class="num">${priceLabel(it.price)}</span></div>`; })}
        <div class="kv-row is-total"><span>Total</span><span class="num">${F.inr(v.total)}</span></div></div>
      <p class="wk-done-pay">${payLabel(v)}${st ? ' · served by ' + first(st.name) : ''}</p>
      <p class="wk-done-links"><button type="button" class="link" data-wk="again">Start another bill</button>${isOwner() ? h`<span aria-hidden="true">·</span><a class="link" href="#/customers/${c.id}" data-close-go="/customers/${c.id}">Open ${first(c.name)}'s profile</a>` : ''}</p>
    </div>`;
  }

  /* ---- walk-in: behaviour ---- */
  function initState(params) {
    W = blank();
    var demo = params.demo;
    if (params.customer) { var c = q.customer(params.customer); if (c) setPhone(c.phone); }
    if (params.phone) setPhone(cleanPhone(params.phone));
    if (demo === 'filled' || demo === 'success') {
      setPhone('9840002004'); addSvc('hairspa'); addSvc('layercut');
      W.staff = KM.state.role === 'staff' && KM.state.user ? KM.state.user.id : 'meena';
      W.pay = 'split'; W.cash = '500'; if (isOwner()) W.rating = 5;
    } else if (demo === 'new') {
      setPhone('9840012345'); W.name = 'Priya Lakshmi'; W.area = 'Velachery'; addSvc('threading'); addSvc('facial');
      W.pay = 'upi'; W.referral = 'Instagram';
    } else if (demo === 'partial') {
      setPhone('2005'); W.touched.phone = true;
    } else if (demo === 'invalid') {
      setPhone('98400'); W.touched.phone = true; W.touched.name = true; W.touched.svc = true;
    }
  }
  function save(el) {
    if (problems().length) return;
    var isNew = !W.match;
    var items = W.items.map(function (it) { return { svc: it.svc, name: String(it.name).trim(), price: +it.price || 0 }; });
    var res = q.addVisit({ customerId: W.match ? W.match.id : null, name: W.name.trim(), phone: W.phone, area: W.area.trim(), items: items,
      cash: cashPart(), upi: upiPart(), staff: W.staff, date: today(), time: nowTime() });
    var raw = rawCustomer(res.customer.id);
    if (raw && W.match) { raw.name = W.name.trim() || raw.name; raw.area = W.area.trim() || raw.area; }
    if (raw && W.rating && isOwner()) raw.rating = W.rating;
    if (W.referral) res.visit.referral = W.referral;
    if (W.rating && isOwner()) res.visit.rating = W.rating;
    W.saved = { visit: res.visit, customer: q.customer(res.customer.id), isNew: isNew };
    paintAll(el);
    var body = el.querySelector('.ov-body'); if (body) body.scrollTop = 0;
    var t = el.querySelector('.wk-done-title'); if (t) { t.setAttribute('tabindex', '-1'); try { t.focus({ preventScroll: true }); } catch (e) {} }
  }
  function paintAll(el) {
    el.querySelector('.ov-body').innerHTML = String(W.saved ? successHTML() : formHTML());
    paintFoot(el);
  }
  function paintFoot(el) { var f = el.querySelector('.ov-foot'); if (f) f.innerHTML = String(footHTML()); markInvalid(el); }
  function markInvalid(el) {
    if (!W || W.saved) return;
    var ph = el.querySelector('#wk-phone'), nm = el.querySelector('#wk-name');
    var badPhone = W.touched.phone && W.phone.length > 0 && !suggestions().length && (W.phone.length !== 10 || !/^[6-9]/.test(W.phone));
    if (ph) ph.setAttribute('aria-invalid', badPhone ? 'true' : 'false');
    if (nm) nm.setAttribute('aria-invalid', W.touched.name && !W.name.trim() ? 'true' : 'false');
  }
  function paint(el, sel, html) { var n = el.querySelector(sel); if (n) n.innerHTML = String(html); }
  function paintTotals(el) {
    syncRepeat(el);
    var up = el.querySelector('#wk-upi'); if (up) up.textContent = F.inr(upiPart());
    var sh = el.querySelector('#wk-split-hint'); if (sh) sh.textContent = splitHint();
    paintFoot(el);
  }
  function paintCustomer(el) {
    paint(el, '#wk-match', matchHTML());
    paint(el, '#wk-pstate', phoneState());
    var n = el.querySelector('#wk-name'), a = el.querySelector('#wk-area');
    if (n && n.value !== W.name) n.value = W.name;
    if (a && a.value !== W.area) a.value = W.area;
    paint(el, '#wk-extras', extrasHTML());
    paintFoot(el);
  }
  function lineByKey(k) { return W.items.filter(function (it) { return it.key === k; })[0]; }

  function wire(el) {
    el.addEventListener('input', function (e) {
      if (!W || W.saved) return;
      var t = e.target;
      if (t.id === 'wk-phone') {
        var prevLen = W.phone.length, d = cleanPhone(t.value), changed = setPhone(d), shown = fmtPhone(d);
        if (t.value !== shown) { t.value = shown; try { t.setSelectionRange(shown.length, shown.length); } catch (x) {} }
        if (changed) paintCustomer(el);
        else { paint(el, '#wk-match', matchHTML()); paint(el, '#wk-pstate', phoneState()); paintFoot(el); }
        if (d.length === 10 && prevLen !== 10) {
          // speed: returning → hide the keyboard so the service tiles show; new → jump to the name field
          if (W.match) t.blur(); else if (/^[6-9]/.test(d)) { var nm = el.querySelector('#wk-name'); if (nm) nm.focus(); }
        }
      } else if (t.id === 'wk-name') {
        W.name = t.value; if (W.name.trim()) { var er = el.querySelector('#wk-name-err'); if (er) er.textContent = ''; }
        paintFoot(el);
      } else if (t.id === 'wk-area') {
        W.area = t.value;
      } else if (t.hasAttribute('data-price')) {
        var ln = lineByKey(t.getAttribute('data-price'));
        var v = t.value.replace(/\D/g, '').slice(0, 6);
        if (t.value !== v) t.value = v;
        if (ln) ln.price = v === '' ? '' : +v;
        paintTotals(el);
      } else if (t.hasAttribute('data-cname')) {
        var ln2 = lineByKey(t.getAttribute('data-cname'));
        if (ln2) ln2.name = t.value;
        paintFoot(el);
      } else if (t.id === 'wk-cash') {
        var cv = t.value.replace(/\D/g, '').slice(0, 6);
        if (t.value !== cv) t.value = cv;
        W.cash = cv;
        paintTotals(el);
      }
    });
    el.addEventListener('focusout', function (e) {
      if (!W || W.saved) return;
      var t = e.target;
      if (t.id === 'wk-phone') { W.touched.phone = true; paint(el, '#wk-match', matchHTML()); markInvalid(el); }
      if (t.id === 'wk-name') { W.touched.name = true; var er = el.querySelector('#wk-name-err'); if (er) er.textContent = W.name.trim() ? '' : "Add the customer's name"; markInvalid(el); }
    });
    el.addEventListener('keydown', function (e) {
      if (!W || W.saved || e.key !== 'Enter') return;
      var t = e.target;
      if (t.id === 'wk-phone') { e.preventDefault(); var nx = W.match ? el.querySelector('.wk-svc') : el.querySelector('#wk-name'); if (nx) nx.focus(); }
      else if (t.id === 'wk-name' || t.id === 'wk-area') { e.preventDefault(); var s = el.querySelector('.wk-svc'); if (s) s.focus(); }
      else if (t.hasAttribute('data-price') || t.hasAttribute('data-cname') || t.id === 'wk-cash') { e.preventDefault(); if (!problems().length) save(el); }
    });
    el.addEventListener('click', function (e) {
      if (!W) return;
      var t = e.target.closest('[data-wk],[data-svc],[data-rm],[data-staff],[data-pay],[data-ref],[data-star],[data-pick]');
      if (!t) return;
      var act = t.getAttribute('data-wk');
      if (act === 'done') { KM.close(); return; }
      if (act === 'again') { var keep = W.staff; W = blank(); W.staff = keep; paintAll(el); var ph = el.querySelector('#wk-phone'); if (ph) ph.focus(); return; }
      if (act === 'sent') { KM.toast('Bill sent to ' + first(W.saved.customer.name) + ' on WhatsApp', { kind: 'success' }); return; }
      if (W.saved) return;
      if (act === 'save') { save(el); return; }
      if (act === 'repeat' && W.match && W.match.visits[0]) {
        W.match.visits[0].items.forEach(function (it) { if (it.svc) addSvc(it.svc); });
        paint(el, '#wk-svcs', tilesHTML()); paint(el, '#wk-bill', billHTML()); paintTotals(el);
        KM.toast('Added ' + W.match.visits[0].items.filter(function (it) { return it.svc; }).map(function (it) { return it.name; }).join(' + '), { kind: 'info', duration: 1800 });
        return;
      }
      if (act === 'other') {
        W.items.push({ key: 'l' + (++lineSeq), svc: null, name: '', price: '' });
        paint(el, '#wk-bill', billHTML()); paintTotals(el);
        var ins = el.querySelectorAll('[data-cname]'); if (ins.length) ins[ins.length - 1].focus();
        return;
      }
      if (t.hasAttribute('data-svc')) {
        var id = t.getAttribute('data-svc');
        if (hasSvc(id)) W.items = W.items.filter(function (it) { return it.svc !== id; }); else addSvc(id);
        W.touched.svc = true;
        var on = hasSvc(id);
        t.classList.toggle('is-on', on); t.setAttribute('aria-pressed', on ? 'true' : 'false');
        paint(el, '#wk-bill', billHTML()); paintTotals(el);
        return;
      }
      if (t.hasAttribute('data-rm')) {
        var k = t.getAttribute('data-rm');
        W.items = W.items.filter(function (it) { return it.key !== k; });
        W.touched.svc = true;
        paint(el, '#wk-svcs', tilesHTML()); paint(el, '#wk-bill', billHTML()); paintTotals(el);
        return;
      }
      if (t.hasAttribute('data-staff')) { W.staff = t.getAttribute('data-staff'); paint(el, '#wk-people', staffHTML()); return; }
      if (t.hasAttribute('data-pay')) {
        W.pay = t.getAttribute('data-pay');
        paint(el, '#wk-pay', payHTML()); paint(el, '#wk-pay-detail', payDetailHTML()); paintFoot(el);
        if (W.pay === 'split') { var cin = el.querySelector('#wk-cash'); if (cin) cin.focus(); }
        return;
      }
      if (t.hasAttribute('data-ref')) { var r = t.getAttribute('data-ref'); W.referral = W.referral === r ? '' : r; paint(el, '#wk-extras', extrasHTML()); return; }
      if (t.hasAttribute('data-star')) { var n = +t.getAttribute('data-star'); W.rating = W.rating === n ? 0 : n; paint(el, '#wk-extras', extrasHTML()); return; }
      if (t.hasAttribute('data-pick')) {
        setPhone(cleanPhone(t.getAttribute('data-pick')));
        var pin = el.querySelector('#wk-phone'); if (pin) pin.value = fmtPhone(W.phone);
        paintCustomer(el);
      }
    });
  }

  KM.overlay('walkin', {
    title: 'Walk-in bill',
    sub: function () {
      var who = KM.state.role === 'staff' && KM.state.user ? ' · billing as ' + KM.esc(first(KM.state.user.name)) : '';
      return F.date(today(), 'dow') + ' · ' + F.time(nowTime()) + who;
    },
    kind: 'sheet', size: 'lg', role: 'any',
    render: function (ctx) { initState(ctx.params || {}); return formHTML(); },
    footer: function () { return footHTML(); },
    mount: function (el, ctx) {
      el.querySelector('.ov-foot').classList.add('wk-foot');
      wire(el);
      markInvalid(el);
      // core records the overlay key only after mount returns; saving synchronously here would re-mount via data:changed
      if ((ctx.params || {}).demo === 'success') setTimeout(function () { if (W && document.contains(el)) save(el); }, 0);
    },
    unmount: function () { W = null; }
  });
})();

</script>
<script data-screen="home">
/* ===== screens/home.js ===== */
/* Owner "Today" — four answers, each shown once: how much came in, what's happening today,
   what needs a decision, who's in. Creating things lives in the shell ("+ Walk-in bill" / FAB), month analysis in Insights. */
(function () {
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  function stats() {
    var today = q.pnl('today'), month = q.pnl('month');
    var dues = q.dues(), overdue = q.overdueDues();
    return h`
      <section class="kpi-row home-stats" aria-label="Money at a glance">
        <a class="kpi" href="#/money?tab=drawer"><div class="kpi-label">Collected today</div><div class="kpi-value">${F.inr(today.income)}</div>
          <div class="kpi-foot">Cash ${F.inr(today.cash)} · UPI ${F.inr(today.upi)}</div></a>
        <a class="kpi" href="#/money?tab=dues"><div class="kpi-label">To collect</div><div class="kpi-value">${F.inr(q.sum(dues, function (d) { return d.amount; }))}</div>
          <div class="kpi-foot"><span class="money is-due">${F.inr(q.sum(overdue, function (d) { return d.amount; }))}</span> overdue</div></a>
        <a class="kpi" href="#/insights"><div class="kpi-label">${F.date(KM.state.today, 'month').split(' ')[0]} so far</div><div class="kpi-value">${F.inr(month.income)}</div>
          <div class="kpi-foot">${F.inr(month.profit)} profit</div></a>
      </section>`;
  }

  function schedule() {
    var T = KM.state.today, items = [];
    q.visitsIn(q.range('today')).forEach(function (v) {
      var c = KM.data.customers.filter(function (x) { return x.id === v.cust; })[0];
      items.push({ time: v.time, done: true, title: c.name, meta: v.items.map(function (i) { return i.name; }).join(', ') + ' · ' + q.firstName(v.staff), due: v.due, go: '/customers/' + c.id });
    });
    // one line per function: the team's call time is when the work starts; the function time is detail
    q.bookingsOn(T).forEach(function (b) {
      b.fns.filter(function (f) { return f.date === T; }).forEach(function (f) {
        items.push({ time: f.call, event: true, title: b.client + ' · ' + f.name,
          meta: 'Team leaves ' + F.time(f.call) + ', starts ' + F.time(f.time) + ' · ' + b.venue + ' · ' + b.team.map(q.firstName).join(', '), go: '/bookings/' + b.id });
      });
    });
    items.sort(function (a, b) { return a.time.localeCompare(b.time); });
    var nowT = KM.state.now.slice(11, 16);
    return h`
      <section class="card home-today" aria-labelledby="h-sched">
        <div class="card-head"><h2 class="card-title" id="h-sched">Today</h2><a class="link" href="#/bookings?view=calendar">Calendar</a></div>
        <div class="card-body"><div class="timeline">
          ${items.length ? items.map(function (it) {
            var state = it.done ? 'is-done' : (it.time <= nowT ? 'is-now' : '');
            return h`<a class="tl-item ${state} ${it.event ? 'is-event' : ''}" href="#${it.go}">
              <span class="tl-time">${F.time(it.time)}</span><span class="tl-dot"></span>
              <span class="tl-body"><span class="tl-title">${it.title}</span>
              <span class="tl-meta">${it.meta}${it.due ? h` · <span class="money is-due">${F.inr(it.due)} unpaid</span>` : ''}</span></span></a>`;
          }) : h`<p class="subtle small">Nothing scheduled today.</p>`}
        </div></div>
      </section>`;
  }

  function comingUp() {
    var T = KM.state.today;
    var list = q.upcoming(7).filter(function (b) { return b.state !== 'enquiry' && !b.fns.some(function (f) { return f.date === T; }); }).slice(0, 4);
    if (!list.length) return '';
    return h`
      <section class="card home-next" aria-labelledby="h-next">
        <div class="card-head"><h2 class="card-title" id="h-next">Coming up</h2><a class="link" href="#/bookings">All bookings</a></div>
        <div class="list">${list.map(function (b) {
          var f = b.fns.filter(function (x) { return D.diff(x.date, T) >= 0; })[0] || b.fns[0];
          return h`<a class="list-item" href="#/bookings/${b.id}">
            <span class="home-date"><span>${D.dow(f.date)}</span><b>${+f.date.slice(8, 10)}</b></span>
            <span class="li-body"><span class="li-title">${b.client}</span><span class="li-meta">${f.name} · ${F.time(f.time)} · ${b.venue}</span></span>
            <span class="li-trail small">${b.due > 0 ? h`<span class="subtle">${F.inr(b.due)} due</span>` : h`<span class="subtle">Paid</span>`}</span></a>`;
        })}</div>
      </section>`;
  }

  function attention() {
    // the same list as the bell, so the counts always agree; the bell's drawer is the "see all"
    var rows = KM.attention(), shown = rows.slice(0, 5);
    return h`
      <section class="card home-attn" aria-labelledby="h-attn">
        <div class="card-head"><h2 class="card-title" id="h-attn">Needs attention</h2>${rows.length > shown.length ? h`<button class="link" data-open="alerts">See all</button>` : ''}</div>
        ${rows.length ? h`<div class="list">${shown.map(KM.attentionRow)}</div>` : h`<div class="card-body"><p class="subtle small">All clear — nothing is overdue.</p></div>`}
      </section>`;
  }

  function team() {
    var rows = q.attendanceOn(KM.state.today);
    var line = function (a) {
      if (a.status === 'present') return { tone: 'success', text: 'In at ' + F.time(a.in) };
      if (a.status === 'late') return { tone: 'warning', text: 'Late · in at ' + F.time(a.in) };
      if (a.status === 'not-in') return { tone: 'neutral', text: 'Not in yet · shift ' + F.time(a.person.shift) };
      var st = q.ATT[a.status] || { label: a.status, badge: 'neutral' };
      return { tone: st.badge, text: st.label };
    };
    return h`
      <section class="card home-team" aria-labelledby="h-team">
        <div class="card-head"><h2 class="card-title" id="h-team">Team</h2><a class="link" href="#/team?tab=attendance">Attendance</a></div>
        <div class="list">${rows.map(function (a) {
          var l = line(a);
          return h`<a class="list-item" href="#/team/${a.person.id}">${KM.avatar(a.person.name, 'avatar-sm')}
            <span class="li-body"><span class="li-title">${a.person.name}</span></span>
            <span class="status is-${l.tone}">${l.text}</span></a>`;
        })}</div>
      </section>`;
  }

  KM.screen('home', {
    title: 'Today', icon: 'home-2', role: 'owner',
    primary: { label: 'Walk-in bill', open: 'walkin', icon: 'receipt' },
    render: function () {
      return h`
        <header class="page-head">
          <div class="page-head-text">
            <h1 class="page-title">Vanakkam, Kalai</h1>
            <p class="page-sub">${F.date(KM.state.today, 'full')}</p>
          </div>
        </header>
        ${stats()}
        <div class="home-cols">
          <div class="home-col">${schedule()}${comingUp()}</div>
          <div class="home-col">${attention()}${team()}</div>
        </div>`;
    }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'home') KM.refresh(); });
})();

</script>
<script data-screen="insights">
/* ===== screens/insights.js ===== */
/* Insights & P&L — one period selector drives the KPI row (income · expenses · profit), the P&L breakdown,
   the cash/UPI split and top salon services; one month-by-month chart sits below. Each number appears once:
   totals live in the KPI row, the P&L is the only per-stream split (cash/UPI per stream lives in Money › Cash drawer,
   functions by month in Bookings). */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;
  var PERIODS = [['month', 'This month'], ['last-month', 'Last month'], ['week', 'Last 7 days'], ['all', 'All time']];

  function today() { return KM.state.today; }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function monthWord(ym) { return D.monthName(ym, true).split(' ')[0]; }
