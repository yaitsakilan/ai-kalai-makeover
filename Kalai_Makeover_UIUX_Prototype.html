        <div class="field"><span class="label" id="st-reason-l">Reason</span>
          <div class="chips" role="radiogroup" aria-labelledby="st-reason-l">${REASONS.map(function (r, i) { return h`<button type="button" class="chip no-check ${i === 0 ? 'is-selected' : ''}" role="radio" aria-checked="${i === 0 ? 'true' : 'false'}" data-st-reason="${r}">${r}</button>`; })}</div></div>
        <label class="field"><span class="label">Note for Kalai <span class="subtle">(optional)</span></span><textarea class="textarea" name="note" rows="2" placeholder="e.g. Cousin’s wedding in Madurai"></textarea></label>
        <div class="hint is-warn st-leave-warn" data-st-leave-warn role="status" hidden></div>
      </form>`;
    },
    footer: function () {
      return h`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" data-st-leave-send>Send to Kalai</button>`;
    },
    mount: function (el) {
      var f = el.querySelector('[data-st-leave]');
      function conflict() {
        var d = f.elements.date.value, warn = el.querySelector('[data-st-leave-warn]');
        var hit = assignments(me().id).filter(function (x) { return x.f.date === d; })[0];
        warn.hidden = !hit;
        warn.textContent = hit ? 'You’re on ' + hit.b.client + '’s ' + hit.f.name + ' that day (call ' + F.time(hit.f.call) + '). Kalai will need cover.' : '';
      }
      function send() {
        var d = f.elements.date.value;
        if (!d || d <= today()) { KM.toast('Pick a date from tomorrow onwards', { kind: 'warn' }); return; }
        var r = f.querySelector('[data-st-reason].is-selected');
        leaveReqs.push({ staff: me().id, date: d, reason: r ? r.getAttribute('data-st-reason') : 'Personal', note: f.elements.note.value.trim() });
        KM.close();
        KM.toast('Leave request for ' + F.date(d, 'dow') + ' sent to Kalai', { kind: 'success' });
        if (KM.parse().id === 'staff-me') KM.refresh();
      }
      conflict();
      f.addEventListener('input', function (e) { if (e.target.name === 'date') conflict(); });
      f.addEventListener('submit', function (e) { e.preventDefault(); send(); });
      el.addEventListener('click', function (e) {
        var t = e.target.closest('[data-st-reason]');
        if (t) {
          t.parentElement.querySelectorAll('[data-st-reason]').forEach(function (b) { b.classList.toggle('is-selected', b === t); b.setAttribute('aria-checked', b === t ? 'true' : 'false'); });
          return;
        }
        if (e.target.closest('[data-st-leave-send]')) { e.preventDefault(); send(); }
      });
    }
  });

  /* ================= overlay: punch (WiFi check → punch in/out) ================= */
  var checkTimer = null;
  KM.overlay('punch', {
    // the title says which punch this is; the time is on the button, so the sub-line is just the date
    title: function () { var k = punchState(me().id).kind; return k === 'in' ? 'Punch out' : k === 'done' ? 'Attendance' : 'Punch in'; },
    sub: function () { return KM.esc(F.date(today(), 'long')); },
    render: function () {
      var s = me(), p = punchState(s.id), w = KM.data.settings.wifi;
      var state = p.kind === 'in' ? 'In since ' + F.time(p.a.in) + ' · ' + dur(p.since) : p.kind === 'done' ? 'Punched out at ' + F.time(p.a.out) : 'Shift starts ' + F.time(s.shift);
      return h`<div class="pn" data-pn-state="checking" aria-live="polite">
        <div class="pn-radar" aria-hidden="true"><span class="pn-wave"></span><span class="pn-wave"></span><span class="pn-core">${I('wifi', { cls: 'pn-i-wifi' })}${I('wifi-off', { cls: 'pn-i-off' })}</span></div>
        <div class="pn-msg pn-checking"><div class="pn-title">Checking studio WiFi…</div><div class="pn-text">Looking for ${w.name}</div></div>
        <div class="pn-msg pn-on"><div class="pn-title">On studio WiFi</div></div>
        <div class="pn-msg pn-off"><div class="pn-title">You’re off-site</div><div class="pn-text">Join <b>${w.name}</b> to punch in.</div>
          <ul class="pn-help">
            <li>On event duty? You check in at the venue — Kalai sees it automatically.</li>
            <li>Still stuck? Call Kalai — she can mark you present.</li>
          </ul>
          ${w.enforce ? '' : h`<p class="pn-soft">Studio WiFi isn’t required right now, so you can still punch in. Kalai will see it was off-site.</p>`}
        </div>
        <p class="pn-state">${state}</p>
      </div>`;
    },
    footer: function () {
      var p = punchState(me().id);
      var kind = p.kind === 'in' ? 'out' : 'in';
      if (p.kind === 'done') return h`<button class="btn btn-secondary" data-close>Close</button>`;
      return h`<button class="btn btn-secondary" data-pn-retry hidden>${I('refresh')} Try again</button>
        <button class="btn btn-primary btn-lg" data-pn-go="${kind}" disabled>${I('fingerprint')} Punch ${kind} · ${F.time(nowHM())}</button>`;
    },
    mount: function (el, ctx) {
      var off = (ctx.params || {}).wifi === 'off';
      var box = el.querySelector('.pn'), go = el.querySelector('[data-pn-go]'), retry = el.querySelector('[data-pn-retry]');
      function settle() {
        box.setAttribute('data-pn-state', off ? 'off' : 'on');
        var was = wifiState; wifiState = off ? 'off' : 'on';
        if (was !== wifiState && KM.parse().id === 'staff') KM.refresh();
        var allowed = !off || !KM.data.settings.wifi.enforce;
        if (go) go.disabled = !allowed;
        if (retry) retry.hidden = !off;
      }
      function check() {
        box.setAttribute('data-pn-state', 'checking');
        if (go) go.disabled = true;
        if (retry) retry.hidden = true;
        clearTimeout(checkTimer);
        checkTimer = setTimeout(settle, 650);
      }
      check();
      el.addEventListener('click', function (e) {
        if (e.target.closest('[data-pn-retry]')) { check(); return; }
        var b = e.target.closest('[data-pn-go]');
        if (!b || b.disabled) return;
        var a = doPunch(me().id, b.getAttribute('data-pn-go'));
        if (off && a) { a.via = 'Off-site (WiFi not required)'; KM.emit('data:changed', 'attendance'); }
        KM.close();
      });
    },
    unmount: function () { clearTimeout(checkTimer); }
  });
})();

</script>
<script data-screen="team">
/* ===== screens/team.js ===== */
/* Owner · Team & payroll — #/team (?tab=team|attendance|payroll), #/team/<staffId> profile,
   overlays "payslip" (printable, role any) and "staff-new" (add a team member).
   Clean pass: every fact once. Today's status lives in the Team list, the month in the Attendance grid,
   money in the Payroll table, everything about one person on their profile. "Add staff" is the shell's
   contextual button (def.primary); studio WiFi rules live in Settings › Attendance.
   Kept from v1: Aadhaar & bank masked (owner reveal behind a confirm, auto-hides), PINs never shown,
   attendance corrections with undo, payslips that show how every rupee is made up. */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  /* ---------------- helpers ---------------- */
  function today() { return KM.state.today; }
  function thisMonth() { return KM.state.today.slice(0, 7); }
  function nowHM() { return KM.state.now.slice(11, 16); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function mins(t) { var p = String(t || '0:00').split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
  function hm(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function first(s) { return s.name.split(' ')[0]; }
  function fmtDays(n) { return n % 1 ? n.toFixed(1) : String(n); }
  function payRule(s) { return F.inr(s.pay.amount) + (s.pay.kind === 'monthly' ? ' / month' : ' / day'); }
  function tel(p) { return 'tel:+91' + String(p).replace(/\D/g, '').slice(-10); }
  function staffIdx(sid) { return KM.data.staff.map(function (s) { return s.id; }).indexOf(sid); }
  function empId(sid) { return 'KM-S' + pad(staffIdx(sid) + 1); }
  function hasIds(s) { return /\d{4}$/.test(s.kyc || '') && /\d{4}$/.test(s.bank || ''); }
  function tenure(joined) {
    var a = D.parse(joined), b = D.parse(today());
    var months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) - (b.getDate() < a.getDate() ? 1 : 0);
    var y = Math.floor(months / 12), m = months % 12;
    if (months < 1) return 'joined this month';
    return [y ? F.plural(y, 'yr') : '', m ? m + ' mo' : ''].filter(Boolean).join(' ');
  }
  function attRec(sid, date) { return KM.data.attendance.filter(function (a) { return a.staff === sid && a.date === date; })[0] || null; }
  function lateBy(a) { var s = q.staff(a.staff); return a.in && s ? Math.max(0, mins(a.in) - mins(s.shift)) : 0; }
  function custName(cid) { var c = KM.data.customers.filter(function (x) { return x.id === cid; })[0]; return c ? c.name : 'Walk-in'; }
  function statusOf(sid, date) { var a = attRec(sid, date); return a ? a.status : (date === today() ? 'not-in' : (date < today() ? 'none' : 'future')); }
  /** Today's state as one quiet status line (dot + text). Only "late" carries a warning tone ("not in yet" is neutral, as on Today). */
  function todayLine(a) {
    if (a.status === 'present') return { tone: 'success', text: 'In ' + F.time(a.in) };
    if (a.status === 'late') return { tone: 'warning', text: 'Late · in ' + F.time(a.in) };
    if (a.status === 'half') return { tone: 'info', text: 'Half day' + (a.in ? ' · in ' + F.time(a.in) : '') };
    if (a.status === 'event') return { tone: 'accent', text: 'Event duty' + (a.in ? ' · ' + F.time(a.in) : '') };
    if (a.status === 'not-in') return { tone: 'neutral', text: 'Not in yet' };
    var st = q.ATT[a.status] || { label: a.status, badge: 'neutral' };
    return { tone: st.badge === 'danger' ? 'danger' : 'neutral', text: st.label };
  }

  /** A month in one plain line — zero counts are left out ("19 days worked · 1 late · 9 leave left"). */
  function monthLine(t) {
    return [fmtDays(t.worked) + ' days worked', t.late ? t.late + ' late' : '', t.absent ? t.absent + ' absent' : '',
      t.leave != null ? t.leave + ' leave left' : ''].filter(Boolean).join(' · ');
  }

  /* ---------------- attendance mutations (screen-local; emit data:changed) ---------------- */
  function snapshot(sid, date) {
    var a = attRec(sid, date), s = q.staff(sid);
    return { sid: sid, date: date, rec: a ? Object.assign({}, a) : null, leave: s.leave };
  }
  function restore(snap) {
    var cur = attRec(snap.sid, snap.date), s = q.staff(snap.sid);
    if (snap.rec && cur) { Object.keys(cur).forEach(function (k) { delete cur[k]; }); Object.assign(cur, snap.rec); }
    else if (!snap.rec && cur) KM.data.attendance.splice(KM.data.attendance.indexOf(cur), 1);
    s.leave = snap.leave;
    KM.emit('data:changed', 'attendance');
  }
  function setAttendance(sid, date, status, via) {
    var s = q.staff(sid), a = attRec(sid, date);
    if (!a) { a = { staff: sid, date: date, status: status, in: null, out: null, via: null }; KM.data.attendance.push(a); }
    var was = a.status;
    if (was === 'leave' && status !== 'leave') s.leave += 1;
    if (status === 'leave' && was !== 'leave') s.leave = Math.max(0, s.leave - 1);
    a.status = status;
    if (status === 'absent' || status === 'leave') { a.in = null; a.out = null; a.via = null; }
    else {
      var start = mins(s.shift);
      if (status === 'late' && (!a.in || mins(a.in) - start <= KM.data.settings.lateAfterMin)) a.in = hm(start + 15);
      if (!a.in) a.in = date === today() ? nowHM() : hm(start - 5);
      if (!a.out && date !== today()) a.out = hm(mins(a.in) + (status === 'half' ? 240 : 540));
      a.via = via || 'Corrected by Kalai';
    }
    a.edited = true;
    KM.emit('data:changed', 'attendance');
    return a;
  }

  /* ---------------- payroll (screen-local records in KM.data.payslips) ---------------- */
  var paying = null; // staff id whose "Mark paid" choice is open
  function slipRec(sid, ym) { return KM.data.payslips.filter(function (p) { return p.staff === sid && p.month === ym; })[0] || null; }
  function eventList(sid, ym) {
    var out = [];
    KM.data.bookings.forEach(function (b) {
      var fns = b.functions.filter(function (f) { return f.date.slice(0, 7) === ym; });
      var w = q.sum(b.wages.filter(function (x) { return x.staff === sid; }), function (x) { return x.amount; });
      if (fns.length && w) out.push({ client: b.client, what: fns.map(function (f) { return f.name; }).join(' + '), date: fns[0].date, amount: w });
    });
    return out.sort(function (a, b) { return a.date.localeCompare(b.date); });
  }
  /** One normalised payslip view: saved record (paid / ready) or the live draft. */
  function slip(sid, ym) {
    var s = q.staff(sid); if (!s) return null;
    var r = slipRec(sid, ym);
    if (r) return { s: s, month: ym, status: r.status, days: r.days, base: r.base, events: r.allow || 0, lop: r.lop || 0,
      advance: r.advance != null ? r.advance : (r.ded || 0), net: r.net, paidOn: r.paidOn, mode: r.mode, eventList: r.eventList || null };
    var d = q.payslipDraft(sid, ym);
    return { s: s, month: ym, status: 'draft', days: d.att.worked, base: d.base, events: d.eventWages, lop: d.lop, advance: d.advance, net: d.net,
      eventList: eventList(sid, ym), draft: true };
  }
  function generate(ym) {
    var n = 0;
    KM.data.staff.forEach(function (s) {
      if (slipRec(s.id, ym)) return;
      var d = q.payslipDraft(s.id, ym);
      KM.data.payslips.push({ id: 'ps-' + ym + '-' + s.id, staff: s.id, month: ym, days: d.att.worked, base: d.base, allow: d.eventWages, lop: d.lop,
        advance: d.advance, ded: d.lop + d.advance, net: d.net, status: 'ready', paidOn: null, mode: null, eventList: eventList(s.id, ym), generatedOn: today() });
      n++;
    });
    KM.emit('data:changed', 'payslip');
    return n;
  }
  function markPaid(sid, ym, mode) {
    var r = slipRec(sid, ym); if (!r) return null;
    r.status = 'paid'; r.paidOn = today(); r.mode = mode;
    KM.emit('data:changed', 'payslip');
    return r;
  }

  /* Indian-English amount in words: 19500 → "Rupees Nineteen Thousand Five Hundred only" */
  var ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  var TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  function two(n) { return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : ''); }
  function three(n) { return (n >= 100 ? ONES[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' : '') : '') + (n % 100 ? two(n % 100) : ''); }
  function words(n) {
    n = Math.round(Math.abs(n));
    var parts = [], cr = Math.floor(n / 1e7), lk = Math.floor(n / 1e5) % 100, th = Math.floor(n / 1000) % 100, rest = n % 1000;
    if (cr) parts.push(two(cr) + ' Crore'); if (lk) parts.push(two(lk) + ' Lakh'); if (th) parts.push(two(th) + ' Thousand'); if (rest) parts.push(three(rest));
    return 'Rupees ' + (parts.join(' ') || 'Zero') + ' only';
  }

  /* fictional full numbers for the owner-only reveal (last digits match the masked value in KM.data) */
  function fakeDigits(seed, n) { var x = 0, out = ''; String(seed).split('').forEach(function (c) { x = (x * 31 + c.charCodeAt(0)) >>> 0; }); for (var i = 0; i < n; i++) { x = (x * 1103515245 + 12345) >>> 0; out += String((x >>> 16) % 10); } return out; }
  function fullAadhaar(s) { var d = fakeDigits(s.id + 'a', 8); return d.slice(0, 4).replace(/^0/, '5') + ' ' + d.slice(4) + ' ' + s.kyc.slice(-4); }
  function fullBank(s) { var p = s.bank.split(' '); return p[0] + ' A/c ' + fakeDigits(s.id + 'b', 4).replace(/^0/, '3') + ' ' + fakeDigits(s.id + 'c', 4) + ' ' + p[p.length - 1]; }

  /* ---------------- attendance cells (grid, month calendar, legend) ---------------- */
  var CELL_ORDER = ['present', 'late', 'half', 'event', 'leave', 'absent'];
  function legend() {
    return h`<div class="tm-legend" aria-label="Legend">${CELL_ORDER.map(function (k) {
      return h`<span class="tm-legend-item"><b class="tm-cell is-${k}" aria-hidden="true">${cellText(k)}</b>${q.ATT[k].label}</span>`;
    })}</div>`;
  }
  function cellLabel(s, d) {
    var a = attRec(s.id, d), st = statusOf(s.id, d);
    var label = st === 'none' ? 'No record' : st === 'future' ? 'Upcoming' : q.ATT[st].label;
    if (a && a.status === 'late') label = 'Late by ' + lateBy(a) + ' min';
    var detail = a && a.in ? ' · in ' + F.time(a.in) + (a.out ? ', out ' + F.time(a.out) : '') : '';
    return F.date(d, 'dow') + ': ' + label + detail + (a && a.edited ? ' (edited)' : '');
  }
  // a normal day is a quiet tile (no letter); only the exceptions carry a letter and a tone
  function cellText(st) { return st === 'none' ? '·' : st === 'future' || st === 'present' ? '' : q.ATT[st].short; }
  function cellBtn(s, d, sel) {
    var st = statusOf(s.id, d), a = attRec(s.id, d);
    var isSel = !!(sel && sel.sid === s.id && sel.date === d);
    return h`<button type="button" class="tm-cell is-${st} ${isSel ? 'is-selected' : ''} ${a && a.edited ? 'is-edited' : ''} ${d === today() ? 'is-today' : ''}"
      data-tm-day="${s.id}.${d}" aria-pressed="${isSel ? 'true' : 'false'}" aria-label="${first(s)}, ${cellLabel(s, d)}" title="${cellLabel(s, d)}">${cellText(st)}</button>`;
  }
  /** Month calendar (Mon-first) for one person; past days are buttons that open the correction panel. */
  function monthCal(s, ym, sel) {
    var dim = D.daysInMonth(ym), lead = (D.parse(ym + '-01').getDay() + 6) % 7, cells = [], i;
    for (i = 0; i < lead; i++) cells.push(h`<span class="tm-mc-blank" aria-hidden="true"></span>`);
    for (i = 1; i <= dim; i++) {
      var d = ym + '-' + pad(i), st = statusOf(s.id, d);
      if (st !== 'future') cells.push(h`<span class="tm-mc-day">${cellBtn(s, d, sel)}<i aria-hidden="true">${i}</i></span>`);
      else cells.push(h`<span class="tm-mc-day"><span class="tm-cell is-future" title="${cellLabel(s, d)}" aria-label="${cellLabel(s, d)}" role="img"></span><i aria-hidden="true">${i}</i></span>`);
    }
    return h`<div class="tm-mc">
      ${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (x) { return h`<span class="tm-mc-dow" aria-hidden="true">${x}</span>`; })}
      ${cells}
    </div>`;
  }
  function parseSel(v) { var m = /^([a-z0-9-]+)\.(\d{4}-\d{2}-\d{2})$/.exec(v || ''); return m && q.staff(m[1]) ? { sid: m[1], date: m[2] } : null; }
  /** Correction panel for one day: who/when, what was recorded, six status chips. */
  function dayDetail(sel) {
    var s = q.staff(sel.sid), a = attRec(sel.sid, sel.date), st = statusOf(sel.sid, sel.date);
    var opts = [['present', 'Present'], ['late', 'Late'], ['half', 'Half day'], ['event', 'Event duty'], ['leave', 'Leave'], ['absent', 'Absent']];
    // the selected chip already says the status — the line only adds what the chips can't (lateness, times, how, edits)
    var line = [st === 'none' ? 'No record' : st === 'late' && a ? 'Late by ' + lateBy(a) + ' min' : ''];
    if (a && a.in) line.push('in ' + F.time(a.in) + (a.out ? ' – out ' + F.time(a.out) : ''));
    if (a && a.via) line.push(a.via);
    if (a && a.edited) line.push('edited');
    line = line.filter(Boolean);
    return h`<div class="tm-day" role="region" aria-label="Correct attendance for ${s.name}, ${F.date(sel.date, 'dow')}">
      <div class="tm-day-head">
        <div class="li-body"><div class="strong small">${first(s)} · ${F.date(sel.date, 'dow')}</div>${line.length ? h`<div class="subtle xsmall">${line.join(' · ')}</div>` : ''}</div>
        <button class="icon-btn" data-tm-day-close aria-label="Close">${I('x')}</button>
      </div>
      <div class="tm-day-opts" role="group" aria-label="Set status">${opts.map(function (o) {
        return h`<button type="button" class="chip no-check ${st === o[0] ? 'is-selected' : ''}" data-tm-set="${o[0]}" aria-pressed="${st === o[0] ? 'true' : 'false'}">${o[1]}</button>`;
      })}</div>
    </div>`;
  }

  /* ================= #/team — Team tab (today) ================= */
  var TABS = [['team', 'Team'], ['attendance', 'Attendance'], ['payroll', 'Payroll']];

  function teamRow(a) {
    var s = a.person, l = todayLine(a);
    var body = h`${KM.avatar(s.name)}<span class="li-body"><span class="li-title">${s.name}</span><span class="li-meta">${s.role} · shift ${F.time(s.shift)}</span></span>`;
    // the one exception that needs a decision gets the row's only button
    if (a.status === 'not-in') return h`<div class="list-item tm-row-act">
      <a class="tm-row-link" href="#/team/${s.id}">${body}</a>
      <span class="li-trail"><span class="status is-neutral">Not in yet</span><button class="btn btn-secondary btn-sm" data-tm-present="${s.id}">Mark present</button></span>
    </div>`;
    return h`<a class="list-item" href="#/team/${s.id}">${body}<span class="status is-${l.tone}">${l.text}</span></a>`;
  }
  function eventDuty() {
    var T = today(), out = [];
    q.bookings().forEach(function (b) {
      if (b.state === 'cancelled' || b.state === 'enquiry') return;
      b.fns.forEach(function (f) { var n = D.diff(f.date, T); if (n >= 0 && n <= 7) out.push({ b: b, f: f }); });
    });
    out.sort(function (x, y) { return (x.f.date + x.f.call).localeCompare(y.f.date + y.f.call); });
    out = out.slice(0, 5);
    return h`<section class="card tm-duty" aria-labelledby="tm-duty-h">
      <div class="card-head"><h2 class="card-title" id="tm-duty-h">Event duty</h2><a class="link" href="#/bookings">Bookings</a></div>
      ${out.length ? h`<div class="list">${out.map(function (x) {
        return h`<a class="list-item" href="#/bookings/${x.b.id}">
          <span class="tm-date" aria-hidden="true"><span>${D.dow(x.f.date)}</span><b>${+x.f.date.slice(8, 10)}</b></span>
          <span class="li-body"><span class="li-title">${x.b.client} · ${x.f.name}</span>
          <span class="li-meta"><span class="sr-only">${F.date(x.f.date, 'dow')} · </span>Call ${F.time(x.f.call)} · ${x.b.team.length ? x.b.team.map(q.firstName).join(', ') : 'no team yet'}</span></span></a>`;
      })}</div>` : h`<div class="card-body"><p class="subtle small">No events this week.</p></div>`}
    </section>`;
  }
  function tabTeam() {
    var rows = q.attendanceOn(today());
    return h`<div class="tm-cols">
      <section class="card tm-today" aria-labelledby="tm-today-h">
        <div class="card-head"><h2 class="card-title" id="tm-today-h">Today</h2></div>
        <div class="list">${rows.map(teamRow)}</div>
      </section>
      ${eventDuty()}
    </div>`;
  }

  /* ================= #/team?tab=attendance ================= */
  function tabAttendance(ctx) {
    var ym = thisMonth(), last = +today().slice(8, 10), days = [], i;
    for (i = 1; i <= last; i++) days.push(ym + '-' + pad(i));
    var sel = parseSel(ctx.query.day);
    var who = q.staff(ctx.query.who) ? ctx.query.who : (sel ? sel.sid : KM.data.staff[0].id);
    var totals = function (s) { var m = q.attendanceMonth(s.id, ym); return { worked: m.worked, late: m.counts.late, absent: m.counts.absent, leave: s.leave }; };
    var grid = h`
      <div class="tm-grid-wrap" role="region" aria-label="Attendance grid, ${D.monthName(ym, true)}" tabindex="0">
        <table class="tm-grid">
          <thead><tr>
            <th scope="col" class="tm-g-name"><span class="sr-only">Staff</span></th>
            ${days.map(function (d) { var w = D.dow(d); return h`<th scope="col" class="tm-g-day ${d === today() ? 'is-today' : ''}"><span>${w.slice(0, 2)}</span>${+d.slice(8)}</th>`; })}
            <th scope="col" class="tm-g-tot">Worked</th><th scope="col" class="tm-g-tot">Late</th><th scope="col" class="tm-g-tot">Absent</th><th scope="col" class="tm-g-tot">Leave left</th>
          </tr></thead>
          <tbody>${KM.data.staff.map(function (s) {
            var t = totals(s);
            return h`<tr>
              <th scope="row" class="tm-g-name"><a href="#/team/${s.id}" class="tm-g-person"><span class="truncate">${first(s)}</span></a></th>
              ${days.map(function (d) { return h`<td class="tm-g-c">${cellBtn(s, d, sel)}</td>`; })}
              <td class="tm-g-tot num strong">${fmtDays(t.worked)}</td>
              <td class="tm-g-tot num ${t.late ? '' : 'is-zero'}">${t.late}</td>
              <td class="tm-g-tot num ${t.absent ? '' : 'is-zero'}">${t.absent}</td>
              <td class="tm-g-tot num">${t.leave}</td>
            </tr>`;
          })}</tbody>
        </table>
      </div>`;
    // phones: one person at a time (a picker + their month), instead of four stacked calendars
    var p = q.staff(who), pt = totals(p);
    var mobile = h`<div class="tm-att-m">
      <div class="seg is-block tm-who" role="tablist" aria-label="Choose a person">${KM.data.staff.map(function (s) {
        return h`<a class="seg-item ${s.id === who ? 'is-active' : ''}" role="tab" aria-selected="${s.id === who ? 'true' : 'false'}" href="#/team?tab=attendance&who=${s.id}">${first(s)}</a>`;
      })}</div>
      <p class="tm-att-sum small"><span class="subtle">${monthLine(pt)}</span><a class="link" href="#/team/${p.id}" aria-label="${p.name}’s profile">Profile</a></p>
      ${monthCal(p, ym, sel)}
      ${sel && sel.sid === p.id ? dayDetail(sel) : ''}
    </div>`;
    return h`
      <section class="card tm-att" aria-labelledby="tm-att-h">
        <div class="card-head"><h2 class="card-title" id="tm-att-h">${D.monthName(ym, true)}</h2><a class="link" href="#/settings?section=attendance">Punch-in settings</a></div>
        <div class="card-body">
          <div class="tm-att-d">${grid}${sel ? dayDetail(sel) : ''}</div>
          ${mobile}
          ${legend()}
        </div>
      </section>`;
  }

  /* ================= #/team?tab=payroll ================= */
  function payCell(r) {
    // "paid" is the normal end state: plain text, no badge
    if (r.status === 'paid') return h`<span class="subtle xsmall">Paid ${F.date(r.paidOn)} · ${r.mode === 'cash' ? 'Cash' : 'UPI'}</span>`;
    if (r.status !== 'ready') return '';
    if (paying === r.s.id) return h`<span class="tm-paywith" role="group" aria-label="Paid with">
      <button class="btn btn-secondary btn-sm" data-tm-pay="cash">Cash</button>
      <button class="btn btn-secondary btn-sm" data-tm-pay="upi">UPI</button>
      <button class="btn btn-ghost btn-sm btn-icon" data-tm-pay-cancel aria-label="Cancel">${I('x')}</button></span>`;
    return h`<button class="btn btn-secondary btn-sm" data-tm-markpaid="${r.s.id}">Mark paid</button>`;
  }
  function tabPayroll(ctx) {
    var cur = thisMonth();
    var months = [cur, D.addMonths(cur, -1), D.addMonths(cur, -2)];
    var ym = months.indexOf(ctx.query.month) >= 0 ? ctx.query.month : cur;
    var rows = KM.data.staff.map(function (s) { return slip(s.id, ym); });
    var sum = function (k) { return q.sum(rows, function (r) { return r[k]; }); };
    var total = sum('net'), base = sum('base'), ev = sum('events'), ded = sum('lop') + sum('advance');
    var paid = rows.filter(function (r) { return r.status === 'paid'; });
    var drafts = rows.filter(function (r) { return r.status === 'draft'; }).length;
    var toPay = total - q.sum(paid, function (r) { return r.net; });
    var isCur = ym === cur;
    var hasPay = drafts < rows.length; // a payment column only once there is something to pay or that was paid
    var state = drafts ? (isCur ? 'Draft · attendance till ' + F.date(today()) : F.plural(drafts, 'payslip') + ' not generated')
      : paid.length < rows.length ? paid.length + ' of ' + rows.length + ' paid · ' + F.inr(toPay) + ' to pay' : '';
    var openAttrs = function (r) { return h`data-open="payslip" data-p-staff="${r.s.id}" data-p-month="${r.month}" aria-label="${r.s.name}, open ${D.monthName(r.month, true)} payslip"`; };
    // desktop: one comparable table (month picker sits in the card head, so the month is named once)
    var table = h`<table class="table tm-pay-table">
      <thead><tr><th scope="col">Staff</th><th scope="col" class="r">Base</th><th scope="col" class="r">Event wages</th><th scope="col" class="r">Deductions</th><th scope="col" class="r">Net pay</th>${hasPay ? h`<th scope="col" class="r"><span class="sr-only">Payment</span></th>` : ''}</tr></thead>
      <tbody>${rows.map(function (r) {
        var s = r.s, d = r.lop + r.advance;
        var dWhat = r.lop && r.advance ? 'loss of pay + advance' : r.lop ? 'loss of pay' : 'advance';
        return h`<tr>
          <td class="tm-pay-who"><button class="tm-pay-open" ${openAttrs(r)}>
            <span class="strong small tm-block truncate">${s.name}</span><span class="subtle xsmall tm-block">${s.type}</span></button></td>
          <td class="r num"><span class="tm-block">${F.inr(r.base)}</span>${s.pay.kind === 'daily' ? h`<span class="subtle xsmall tm-block">${fmtDays(r.days)} days × ${F.inr(s.pay.amount)}</span>` : ''}</td>
          <td class="r num">${r.events ? F.inr(r.events) : h`<span class="subtle">—</span>`}</td>
          <td class="r num">${d ? h`<span class="tm-block">−${F.inr(d)}</span><span class="subtle xsmall tm-block">${dWhat}</span>` : h`<span class="subtle">—</span>`}</td>
          <td class="r num"><b class="tm-net">${F.inr(r.net)}</b></td>
          ${hasPay ? h`<td class="r tm-pay-act">${payCell(r)}</td>` : ''}
        </tr>`;
      })}</tbody>
      <tfoot><tr class="tm-pay-total"><th scope="row">Total</th><td class="r num">${F.inr(base)}</td><td class="r num">${ev ? F.inr(ev) : '—'}</td><td class="r num">${ded ? '−' + F.inr(ded) : '—'}</td><td class="r num"><b>${F.inr(total)}</b></td>${hasPay ? h`<td></td>` : ''}</tr></tfoot>
    </table>`;
    // phones: one row per person — name, how the net is made up in one line, the net on the right
    var list = h`<div class="list tm-pay-list">${rows.map(function (r) {
      var s = r.s, parts = [F.inr(r.base) + ' base' + (s.pay.kind === 'daily' ? ' (' + fmtDays(r.days) + ' days)' : '')];
      if (r.events) parts.push('+' + F.inr(r.events) + ' events');
      if (r.lop) parts.push('−' + F.inr(r.lop) + ' loss of pay');
      if (r.advance) parts.push('−' + F.inr(r.advance) + ' advance');
      return h`<div class="list-item">
        <button class="tm-pay-open tm-pay-open-m" ${openAttrs(r)}><span class="li-title">${s.name}</span><span class="li-meta">${parts.join(' · ')}</span></button>
        <span class="li-trail"><b class="tm-net num">${F.inr(r.net)}</b>${hasPay ? payCell(r) : ''}</span>
      </div>`;
    })}
      <div class="list-item tm-pay-sum"><span class="li-body strong">Total</span><b class="tm-net num">${F.inr(total)}</b></div>
    </div>`;
    return h`
      <section class="card tm-pay" aria-labelledby="tm-pay-h">
        <h2 class="sr-only" id="tm-pay-h">Payroll · ${D.monthName(ym, true)}</h2>
        <div class="card-head tm-pay-head">
          <div class="seg tm-months" role="tablist" aria-label="Payroll month">${months.map(function (m) {
            return h`<a class="seg-item ${m === ym ? 'is-active' : ''}" role="tab" aria-selected="${m === ym ? 'true' : 'false'}" href="#/team?tab=payroll&month=${m}">${D.monthName(m)}</a>`;
          })}</div>
          ${state ? h`<span class="card-sub tm-pay-state">${state}</span>` : ''}
          ${isCur && drafts ? h`<button class="btn btn-secondary btn-sm tm-head-right tm-pay-d" data-tm-generate="${ym}">Generate payslips</button>` : ''}
        </div>
        <div class="card-body tm-pay-body tm-pay-d">${table}</div>
        <div class="tm-pay-m">${list}
          ${isCur && drafts ? h`<div class="tm-pay-mfoot"><button class="btn btn-secondary btn-block" data-tm-generate="${ym}">Generate payslips</button></div>` : ''}
        </div>
      </section>`;
  }

  function renderList(ctx) {
    var tab = ctx.query.tab === 'attendance' || ctx.query.tab === 'payroll' ? ctx.query.tab : 'team';
    var body = tab === 'attendance' ? tabAttendance(ctx) : tab === 'payroll' ? tabPayroll(ctx) : tabTeam();
    return h`
      <header class="page-head">
        <div class="page-head-text"><h1 class="page-title">Team & payroll</h1></div>
      </header>
      <nav class="tabs" aria-label="Team sections">${TABS.map(function (t) {
        var on = t[0] === tab;
        return h`<a class="tab ${on ? 'is-active' : ''}" href="#/team${t[0] === 'team' ? '' : '?tab=' + t[0]}" ${on ? KM.raw('aria-current="page"') : ''}>${t[1]}</a>`;
      })}</nav>
      <div class="tm-tab tm-tab-${tab}">${body}</div>`;
  }

  /* ================= #/team/<id> profile ================= */
  function renderProfile(ctx) {
    var sid = ctx.params[0], s = q.staff(sid);
    if (!s) return h`<div class="empty"><div class="empty-icon">${I('user-question')}</div><div class="empty-title">No one called “${sid}” on the team</div><a class="btn btn-secondary" href="#/team">Back to team</a></div>`;
    var ym = thisMonth();
    var m = q.attendanceMonth(sid, ym);
    var draft = slip(sid, ym);
    var clients = q.servicesBy(sid, q.range('month'));
    var sel = parseSel(ctx.query.day); if (sel && sel.sid !== sid) sel = null;
    var recent = KM.data.visits.filter(function (v) { return v.staff === sid && v.date <= today(); })
      .sort(function (a, b) { return (b.date + b.time).localeCompare(a.date + a.time); }).slice(0, 5);
    var slips = [draft].concat(KM.data.payslips.filter(function (p) { return p.staff === sid && p.month !== ym; })
      .sort(function (a, b) { return b.month.localeCompare(a.month); }).map(function (p) { return slip(sid, p.month); }));
    var wa = KM.wa(s.phone, 'Vanakkam ' + first(s) + '! ');
    return h`
      ${KM.backLink('/team', 'Team')}
      <header class="page-head tm-prof-head">
        ${KM.avatar(s.name, 'avatar-lg')}
        <div class="page-head-text">
          <h1 class="page-title">${s.name}</h1>
          <p class="page-sub">${s.role} · ${s.type}</p>
        </div>
        <div class="page-actions"><a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">${I('brand-whatsapp')} WhatsApp</a></div>
      </header>

      <div class="tm-prof-grid">
        <div class="tm-prof-col">
          <section class="card" aria-labelledby="tm-cal-h">
            <div class="card-head tm-cal-head"><h2 class="card-title" id="tm-cal-h">${D.monthName(ym, true)}</h2>
              <span class="card-sub tm-head-right">${monthLine({ worked: m.worked, late: m.counts.late, absent: m.counts.absent })}</span></div>
            <div class="card-body">
              ${monthCal(s, ym, sel)}
              ${sel ? dayDetail(sel) : ''}
              ${legend()}
            </div>
          </section>
          <section class="card" aria-labelledby="tm-svc-h">
            <div class="card-head"><h2 class="card-title" id="tm-svc-h">Recent services</h2>${clients.length ? h`<span class="card-sub tm-head-right">${clients.length} this month</span>` : ''}</div>
            ${recent.length ? h`<div class="list">${recent.map(function (v) {
              return h`<a class="list-item" href="#/customers/${v.cust}">
                <span class="li-body"><span class="li-title">${custName(v.cust)}</span><span class="li-meta">${v.items.map(function (i) { return i.name; }).join(', ')} · ${F.rel(v.date)}, ${F.time(v.time)}</span></span>
                <span class="money num small">${F.inr(v.total)}</span></a>`;
            })}</div>` : h`<div class="card-body"><p class="subtle small">No services yet.</p></div>`}
          </section>
        </div>
        <div class="tm-prof-col">
          <section class="card" aria-labelledby="tm-slips-h">
            <div class="card-head"><h2 class="card-title" id="tm-slips-h">Payslips</h2></div>
            <div class="list">${slips.map(function (x) {
              return h`<button class="list-item" data-open="payslip" data-p-staff="${s.id}" data-p-month="${x.month}">
                <span class="li-body"><span class="li-title">${D.monthName(x.month, true)}</span><span class="li-meta">${x.status === 'paid' ? 'Paid ' + F.date(x.paidOn) + ' · ' + (x.mode === 'cash' ? 'Cash' : 'UPI') : x.status === 'ready' ? 'Ready to pay' : 'Draft · till ' + F.date(today())}</span></span>
                <span class="money num small">${F.inr(x.net)}</span></button>`;
            })}</div>
          </section>
          <section class="card" aria-labelledby="tm-det-h">
            <div class="card-head"><h2 class="card-title" id="tm-det-h">Details</h2></div>
            <div class="card-body"><div class="kv">
              <div class="kv-row"><span>Phone</span><a class="link" href="${tel(s.phone)}">${F.phone(s.phone)}</a></div>
              <div class="kv-row"><span>Employee ID</span><span>${empId(s.id)}</span></div>
              <div class="kv-row"><span>Joined</span><span>${F.date(s.joined, 'dmy')} · ${tenure(s.joined)}</span></div>
              <div class="kv-row"><span>Shift</span><span>${F.time(s.shift)} · late after ${KM.data.settings.lateAfterMin} min</span></div>
              <div class="kv-row"><span>Pay</span><span class="num">${payRule(s)} · ${s.pay.kind === 'monthly' ? 'UPI' : 'cash'}</span></div>
              <div class="kv-row"><span>Leave left</span><span>${F.plural(s.leave, 'day')}</span></div>
              <div class="kv-row"><span>Aadhaar</span><span class="num tm-secret" data-tm-secret="aadhaar">${s.kyc}</span></div>
              <div class="kv-row"><span>Bank</span><span class="num tm-secret" data-tm-secret="bank">${s.bank}</span></div>
            </div></div>
            <div class="card-foot tm-det-foot">
              ${hasIds(s) ? h`<button class="btn btn-ghost btn-sm" data-tm-reveal="${s.id}">Show ID & bank</button>` : ''}
              <button class="btn btn-ghost btn-sm" data-tm-pin="${s.id}">Reset PIN</button>
            </div>
          </section>
        </div>
      </div>`;
  }

  /* ================= screen ================= */
  KM.screen('team', {
    title: 'Team & payroll', icon: 'id-badge-2', role: 'owner',
    // the one create action for the team pages, the profile included (its own record actions stay on the page)
    primary: { label: 'Add staff', open: 'staff-new', icon: 'user-plus' },
    render: function (ctx) { return ctx.params[0] ? renderProfile(ctx) : renderList(ctx); },
    unmount: function () { paying = null; }
  });

  var revealTimer = null;
  document.addEventListener('click', function (e) {
    var root = e.target.closest('.scr-team');
    if (!root) return;
    var t;
    if ((t = e.target.closest('[data-tm-present]'))) {
      var sid = t.getAttribute('data-tm-present'), snap = snapshot(sid, today());
      var a = setAttendance(sid, today(), 'present', 'Marked present by Kalai');
      KM.toast(q.firstName(sid) + ' marked present · ' + F.time(a.in), { kind: 'success', action: { label: 'Undo', fn: function () { restore(snap); } } });
      return;
    }
    if ((t = e.target.closest('[data-tm-day]'))) {
      var v = t.getAttribute('data-tm-day');
      KM.setQuery({ day: KM.parse().query.day === v ? '' : v }, true);
      var panel = Array.prototype.filter.call(document.querySelectorAll('.scr-team .tm-day'), function (x) { return x.offsetParent; })[0];
      if (panel) try { panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (err) {}
      return;
    }
    if (e.target.closest('[data-tm-day-close]')) { KM.setQuery({ day: '' }, true); return; }
    if ((t = e.target.closest('[data-tm-set]'))) {
      var sel = parseSel(KM.parse().query.day); if (!sel) return;
      var st = t.getAttribute('data-tm-set');
      if (statusOf(sel.sid, sel.date) === st) return;
      var sn = snapshot(sel.sid, sel.date);
      setAttendance(sel.sid, sel.date, st);
      KM.toast(q.firstName(sel.sid) + ' · ' + F.date(sel.date, 'dow') + ' set to ' + q.ATT[st].label, { kind: 'success', action: { label: 'Undo', fn: function () { restore(sn); } } });
      return;
    }
    if ((t = e.target.closest('[data-tm-generate]'))) {
      var ym = t.getAttribute('data-tm-generate');
      var n = generate(ym);
      KM.toast(F.plural(n, 'payslip') + ' ready for ' + D.monthName(ym, true), { kind: 'success' });
      return;
    }
    if ((t = e.target.closest('[data-tm-markpaid]'))) { paying = t.getAttribute('data-tm-markpaid'); KM.refresh(); return; }
    if (e.target.closest('[data-tm-pay-cancel]')) { paying = null; KM.refresh(); return; }
    if ((t = e.target.closest('[data-tm-pay]'))) {
      var who = paying, mode = t.getAttribute('data-tm-pay');
      paying = null;
      var r = markPaid(who, thisMonth(), mode);
      if (r) KM.toast(q.firstName(who) + ' paid ' + F.inr(r.net) + ' by ' + (mode === 'cash' ? 'cash' : 'UPI'), { kind: 'success', action: { label: 'Share slip', fn: function () { KM.open('payslip', { staff: who, month: r.month }); } } });
      return;
    }
    if ((t = e.target.closest('[data-tm-reveal]'))) {
      var s = q.staff(t.getAttribute('data-tm-reveal'));
      KM.confirm({ title: 'Show ' + first(s) + '’s full Aadhaar & bank number?', body: 'Make sure no one else can see your screen. The numbers hide again after 30 seconds.', confirmLabel: 'Show numbers' }).then(function (ok) {
        if (!ok) return;
        var box = document.querySelector('.scr-team');
        if (!box) return;
        var ad = box.querySelector('[data-tm-secret="aadhaar"]'), bk = box.querySelector('[data-tm-secret="bank"]'), btn = box.querySelector('[data-tm-reveal]');
        if (ad) { ad.textContent = fullAadhaar(s); ad.classList.add('is-revealed'); }
        if (bk) { bk.textContent = fullBank(s); bk.classList.add('is-revealed'); }
        if (btn) { btn.disabled = true; btn.textContent = 'Hides in 30 sec'; }
        clearTimeout(revealTimer);
        revealTimer = setTimeout(function () {
          if (ad && document.contains(ad)) { ad.textContent = s.kyc; ad.classList.remove('is-revealed'); }
          if (bk && document.contains(bk)) { bk.textContent = s.bank; bk.classList.remove('is-revealed'); }
          if (btn && document.contains(btn)) { btn.disabled = false; btn.textContent = 'Show ID & bank'; }
        }, 30000);
      });
      return;
    }
    if ((t = e.target.closest('[data-tm-pin]'))) {
      var ps = q.staff(t.getAttribute('data-tm-pin'));
      KM.confirm({ title: 'Reset ' + first(ps) + '’s PIN?', body: first(ps) + ' sets a new 4-digit PIN the next time she opens the app. Her old PIN stops working now. PINs are never shown, not even to you.', confirmLabel: 'Reset PIN', danger: true }).then(function (ok) {
        if (ok) KM.toast(first(ps) + '’s PIN was reset', { kind: 'success' });
      });
    }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'team') KM.refresh(); });

  /* ================= overlay: staff-new (add a team member) ================= */
  var ROLES = ['Senior Stylist', 'Makeup Artist', 'Hair Stylist', 'Beautician', 'Trainee', 'Helper'];
  var TYPES = ['Full time', 'Part time', 'Intern'];
  KM.overlay('staff-new', {
    title: 'Add staff', kind: 'sheet', size: 'sm', role: 'owner',
    render: function () {
      return h`<form class="stack tm-new" data-tm-new novalidate>
        <label class="field"><span class="label">Name</span><input class="input" name="name" autocomplete="off" placeholder="e.g. Keerthana Selvam" autofocus></label>
        <label class="field"><span class="label">Mobile</span><input class="input" name="phone" type="tel" inputmode="numeric" maxlength="11" placeholder="10 digits"></label>
        <label class="field"><span class="label">Role</span><select class="select" name="role">${ROLES.map(function (r) { return h`<option>${r}</option>`; })}</select></label>
        <div class="field"><span class="label" id="tm-new-type">Works</span>
          <div class="seg is-block" role="radiogroup" aria-labelledby="tm-new-type">${TYPES.map(function (t, i) {
            return h`<button type="button" class="seg-item ${i === 0 ? 'is-active' : ''}" role="radio" aria-checked="${i === 0 ? 'true' : 'false'}" data-tm-type="${t}">${t}</button>`;
          })}</div></div>
        <div class="tm-new-pay">
          <label class="field"><span class="label">Pay (₹)</span><input class="input" name="amount" inputmode="numeric" placeholder="15000"></label>
          <label class="field"><span class="label">Per</span><select class="select" name="kind"><option value="monthly">Month</option><option value="daily">Day</option></select></label>
        </div>
        <label class="field"><span class="label">Shift starts</span><input class="input" type="time" name="shift" value="10:00"></label>
        <div class="hint is-warn" data-tm-new-err role="alert"></div>
      </form>`;
    },
    footer: function () {
      return h`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" data-tm-new-save>Add staff</button>`;
    },
    mount: function (el) {
      var f = el.querySelector('[data-tm-new]');
      function save() {
        var err = el.querySelector('[data-tm-new-err]');
        var name = f.elements.name.value.trim().replace(/\s+/g, ' ');
        var phone = f.elements.phone.value.replace(/\D/g, '').slice(-10);
        var amount = +String(f.elements.amount.value).replace(/\D/g, '');
        var msg = !name ? 'Add a name.' : phone.length !== 10 ? 'Mobile number needs 10 digits.' : !amount ? 'Add the pay amount.' : '';
        err.textContent = msg;
        if (msg) return;
        var base = name.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g, '') || 'staff', id = base, n = 2;
        while (q.staff(id)) id = base + (n++);
        var type = el.querySelector('[data-tm-type].is-active');
        KM.data.staff.push({ id: id, name: name, role: f.elements.role.value, phone: phone, type: type ? type.getAttribute('data-tm-type') : 'Full time',
          pay: { kind: f.elements.kind.value === 'daily' ? 'daily' : 'monthly', amount: amount }, shift: f.elements.shift.value || '10:00',
          leave: 12, joined: today(), pin: String(1000 + Math.floor(Math.random() * 9000)), kyc: 'Not added', bank: 'Not added' });
        KM.emit('data:changed', 'staff');
        KM.close();
        KM.toast(name.split(' ')[0] + ' added · PIN sent on WhatsApp', { kind: 'success', action: { label: 'Open', fn: function () { KM.go('/team/' + id); } } });
      }
      el.addEventListener('click', function (e) {
        var t = e.target.closest('[data-tm-type]');
        if (t) {
          t.parentElement.querySelectorAll('[data-tm-type]').forEach(function (b) { b.classList.toggle('is-active', b === t); b.setAttribute('aria-checked', b === t ? 'true' : 'false'); });
          return;
        }
        if (e.target.closest('[data-tm-new-save]')) { e.preventDefault(); save(); }
      });
      f.addEventListener('submit', function (e) { e.preventDefault(); save(); });
    }
  });

  /* ================= overlay: payslip ================= */
  function resolveSlip(ctx) {
    var p = ctx.params || {};
    var meId = KM.state.role === 'staff' && KM.state.user ? KM.state.user.id : null;
    var sid = p.staff || meId || 'meena';
    if (meId && sid !== meId) return { denied: true };
    var mList = KM.data.payslips.filter(function (x) { return x.staff === sid && x.status === 'paid'; }).map(function (x) { return x.month; }).sort();
    var ym = /^\d{4}-\d{2}$/.test(p.month || '') ? p.month : (mList[mList.length - 1] || thisMonth());
    var x = slip(sid, ym);
    if (!x) return null;
    if (meId && x.status === 'draft') return { notReady: true, x: x };
    return x;
  }
  function waText(x) {
    return 'Vanakkam ' + first(x.s) + '! 🙏 Your ' + D.monthName(x.month, true) + ' payslip from ' + KM.data.settings.studio.name + ':\n' +
      'Days worked: ' + fmtDays(x.days) + '\nGross: ' + F.inr(x.base + x.events) + (x.lop + x.advance ? '\nDeductions: ' + F.inr(x.lop + x.advance) : '') +
      '\nNet pay: ' + F.inr(x.net) + (x.status === 'paid' ? '\nPaid on ' + F.date(x.paidOn, 'dmy') + ' by ' + (x.mode === 'cash' ? 'cash' : 'UPI') : '') + '\nThank you for your lovely work ✨';
  }
  function payslipDoc(x) {
    var st = KM.data.settings.studio, s = x.s, isCur = x.month === thisMonth(), dim = D.daysInMonth(x.month);
    var gross = x.base + x.events, ded = x.lop + x.advance;
    // the pay rate is said once, inside the earnings line (days worked are in the header)
    var earnings = [[s.pay.kind === 'daily' ? 'Daily wages · ' + F.inr(s.pay.amount) + ' / day'
      : x.base !== s.pay.amount ? 'Basic salary · pro-rated from ' + F.inr(s.pay.amount) + ' / month' : 'Basic salary', x.base]];
    if (x.eventList && x.eventList.length) x.eventList.forEach(function (e) { earnings.push(['Event · ' + e.client + ' (' + e.what + ', ' + F.date(e.date) + ')', e.amount]); });
    else if (x.events) earnings.push(['Event wages & allowances', x.events]);
    // only the deductions that happened — no column of ₹0 lines
    var deductions = [['Loss of pay', x.lop], ['Salary advance recovered', x.advance]].filter(function (r) { return r[1]; });
    var period = '1–' + (isCur && x.status === 'draft' ? +today().slice(8) : dim) + ' ' + D.monthName(x.month) + ' ' + x.month.slice(0, 4);
    return h`<article class="ps-doc ${x.status !== 'paid' ? 'is-unpaid' : ''}" aria-label="Payslip for ${s.name}, ${D.monthName(x.month, true)}">
      ${x.status !== 'paid' ? h`<div class="ps-stamp" aria-hidden="true">${x.status === 'ready' ? 'Ready' : 'Draft'}</div>` : ''}
      <header class="ps-head">
        <div class="ps-brand"><span class="ps-mark" aria-hidden="true">K</span><div><div class="ps-studio">${st.name}</div><div class="ps-tag">${st.tagline}</div></div></div>
        <div class="ps-title"><div class="ps-kind">Payslip</div><div class="ps-month">${D.monthName(x.month, true)}</div><div class="ps-no">No. KM/${x.month.replace('-', '')}/${pad(staffIdx(s.id) + 1)}</div></div>
      </header>
      <div class="ps-addr">${st.address} · ${st.phone}</div>
      <dl class="ps-meta">
        <div><dt>Employee</dt><dd>${s.name}</dd></div>
        <div><dt>Employee ID</dt><dd>${empId(s.id)}</dd></div>
        <div><dt>Role</dt><dd>${s.role} · ${s.type}</dd></div>
        <div><dt>Date of joining</dt><dd>${F.date(s.joined, 'dmy')}</dd></div>
        <div><dt>Pay period</dt><dd>${period}</dd></div>
        <div><dt>Days worked</dt><dd>${fmtDays(x.days)}${isCur && x.status === 'draft' ? ' so far' : ' of ' + dim}</dd></div>
        <div><dt>Bank</dt><dd>${s.bank}</dd></div>
      </dl>
      <div class="ps-tables">
        <table class="ps-table"><thead><tr><th scope="col">Earnings</th><th scope="col" class="r">Amount</th></tr></thead>
          <tbody>${earnings.map(function (r) { return h`<tr><td>${r[0]}</td><td class="r num">${F.inr(r[1])}</td></tr>`; })}</tbody>
          ${earnings.length > 1 ? h`<tfoot><tr><th scope="row">Gross earnings</th><td class="r num">${F.inr(gross)}</td></tr></tfoot>` : ''}</table>
        <table class="ps-table"><thead><tr><th scope="col">Deductions</th><th scope="col" class="r">Amount</th></tr></thead>
          <tbody>${deductions.length ? deductions.map(function (r) { return h`<tr><td>${r[0]}</td><td class="r num">−${F.inr(r[1])}</td></tr>`; })
            : h`<tr><td>No deductions</td><td class="r num">—</td></tr>`}</tbody>
          ${deductions.length > 1 ? h`<tfoot><tr><th scope="row">Total deductions</th><td class="r num">−${F.inr(ded)}</td></tr></tfoot>` : ''}</table>
      </div>
      <div class="ps-net">
        <div class="ps-net-text"><div class="ps-net-label">Net pay</div><div class="ps-words">${words(x.net)}</div></div>
        <div class="ps-net-amt num">${F.inr(x.net)}</div>
      </div>
      <div class="ps-paid ${x.status === 'paid' ? 'is-paid' : ''}">${x.status === 'paid'
        ? h`${I('circle-check')}<span>Paid on <b>${F.date(x.paidOn, 'long')}</b> by ${x.mode === 'cash' ? 'cash' : 'UPI / bank transfer'}</span>`
        : h`${I('hourglass')}<span>${x.status === 'ready' ? 'Ready to pay — not paid yet' : 'Draft — the final slip comes after month end'}</span>`}</div>
      <div class="ps-sign">
        <div><span class="ps-line"></span><span>Kalai · Proprietor</span></div>
        <div><span class="ps-line"></span><span>${s.name}</span></div>
      </div>
      <p class="ps-foot">Computer-generated payslip.</p>
    </article>`;
  }

  KM.overlay('payslip', {
    // no sub-line: the slip itself names the person and the month
    title: 'Payslip', kind: 'modal', size: 'lg', role: 'any',
    render: function (ctx) {
      var x = resolveSlip(ctx);
      if (!x) return h`<div class="empty"><div class="empty-icon">${I('file-x')}</div><div class="empty-title">Payslip not found</div></div>`;
      if (x.denied) return h`<div class="empty"><div class="empty-icon">${I('lock')}</div><div class="empty-title">You can only open your own payslips</div><div class="empty-body">Payslips are private between you and Kalai.</div></div>`;
      if (x.notReady) return h`<div class="empty"><div class="empty-icon">${I('hourglass')}</div><div class="empty-title">${D.monthName(x.x.month, true)} is still being prepared</div><div class="empty-body">Kalai shares your payslip after the month closes.</div></div>`;
      return payslipDoc(x);
    },
    footer: function (ctx) {
      var x = resolveSlip(ctx);
      if (!x || !x.s) return h`<button class="btn btn-secondary" data-close>Close</button>`;
      return h`<button class="btn btn-secondary" data-ps-print>${I('printer')} Print</button>
        <a class="btn btn-wa" href="${KM.wa(x.s.phone, waText(x))}" target="_blank" rel="noopener">${I('brand-whatsapp')} Share on WhatsApp</a>`;
    },
    mount: function (el) {
      el.addEventListener('click', function (e) { if (e.target.closest('[data-ps-print]')) { e.preventDefault(); window.print(); } });
    }
  });
})();

</script>
<script>KM.boot();</script>
</body>
</html>
