    tb.innerHTML = h`
      <a class="tb-mobile-brand" href="#/${KM.homeFor(KM.state.role)}" aria-label="Kalai Makeover home">
        <span class="sb-mark" aria-hidden="true">K</span>
        <span class="tb-title">Kalai Makeover</span>
      </a>
      <button class="tb-search" data-open="search" aria-label="Search">${I('search')}<span>Search customers, bookings, staff…</span><span class="kbd">Ctrl K</span></button>
      <div class="tb-spacer"></div>
      <button class="tb-icon tb-search-m" data-open="search" aria-label="Search">${I('search')}</button>
      ${newControl(def)}
      <button class="tb-icon" data-open="alerts" aria-label="${alerts} alerts">${I('bell')}${alerts ? h`<span class="dot">${alerts}</span>` : ''}</button>`;
  }
  function newControl(def) {
    var p = KM.primaryFor(def);
    if (!p) return h`<div class="tb-new"><button data-open="quick">${I('plus')} New</button></div>`;
    return h`<div class="tb-new"><button ${openAttrs(p)}>${I('plus')} ${p.label}</button><button data-open="quick" aria-label="Other things to add" title="Other things to add">${I('chevron-down')}</button></div>`;
  }

  function renderBottomNav(active) {
    var bn = document.getElementById('km-bottomnav');
    var tabs = KM.TABS[KM.state.role];
    var inMore = navItems().some(function (it) { return it.id === active; }) && !tabs.some(function (t) { return t.id === active; });
    bn.innerHTML = tabs.map(function (t) {
      if (t.fab) return String(h`<button class="bn-fab" data-open="quick" aria-label="Quick add">${I('plus')}</button>`);
      if (t.more) return String(h`<button class="bn-item ${inMore ? 'is-active' : ''}" data-open="more">${I(t.icon)}<span>${t.label}</span></button>`);
      var b = navItems().filter(function (n) { return n.id === t.id; })[0];
      var bc = b ? badge(b) : '';
      return String(h`<a class="bn-item ${t.id === active ? 'is-active' : ''}" href="#/${t.id}" ${t.id === active ? KM.raw('aria-current="page"') : ''}>${I(t.icon)}<span>${t.label}</span>${bc ? h`<span class="bn-badge">${bc}</span>` : ''}</a>`);
    }).join('');
  }

  function renderProto() {
    var p = document.getElementById('km-proto');
    var r = KM.state.role, t = KM.state.theme;
    p.innerHTML = h`
      <button class="proto-btn proto-mini" id="km-proto-mini" aria-label="Prototype controls" aria-expanded="${p.classList.contains('is-open') ? 'true' : 'false'}">${I(p.classList.contains('is-open') ? 'x' : 'adjustments-horizontal')}<span class="proto-mini-label">PROTOTYPE</span></button>
      <span class="proto-tag">PROTOTYPE</span>
      <span class="proto-seg"><button class="proto-btn ${r === 'owner' ? 'is-on' : ''}" data-proto-role="owner">${I('crown')}Owner</button><button class="proto-btn ${r === 'staff' ? 'is-on' : ''}" data-proto-role="staff">${I('user')}Staff</button></span>
      <button class="proto-btn" data-proto-theme>${I(t === 'dark' ? 'sun' : 'moon')}${t === 'dark' ? 'Light' : 'Dark'}</button>
      <button class="proto-btn" data-open="phone">${I('device-mobile')}Phone</button>
      <button class="proto-btn" data-open="screens">${I('sitemap')}Screens</button>`;
  }

  KM.on('route', function (e) {
    renderSidebar(e.id);
    renderTopbar(e.def);
    renderBottomNav(e.id);
  });
  /* phones: mark tab strips that scroll sideways (CSS fades their edge until scrolled to the end) */
  function markScroll(el) {
    var can = el.scrollWidth > el.clientWidth + 2;
    el.classList.toggle('is-scrollable', can);
    el.classList.toggle('is-end', !can || el.scrollLeft + el.clientWidth >= el.scrollWidth - 4);
  }
  function markAllScroll() { document.querySelectorAll('#km-page .tabs, #km-page .seg').forEach(markScroll); }
  KM.on('route', function () { requestAnimationFrame(markAllScroll); });
  window.addEventListener('resize', markAllScroll);
  document.addEventListener('scroll', function (e) { var t = e.target; if (t && t.classList && (t.classList.contains('tabs') || t.classList.contains('seg'))) markScroll(t); }, true);
  KM.on('data:changed', function () {
    var r = KM.parse();
    var def = KM.screens[r.id];
    renderSidebar(r.id); renderTopbar(def); renderBottomNav(r.id);
  });

  /* ---------------- theme & role ---------------- */
  KM.setTheme = function (t) {
    KM.state.theme = t === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', KM.state.theme);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', KM.state.theme === 'light' ? '#f7f6f3' : '#0e0b08');
    try { localStorage.setItem('km-theme', KM.state.theme); } catch (e) {}
    syncUrl();
    renderProto();
    KM.emit('theme', KM.state.theme);
  };
  KM.setRole = function (role, staffId) {
    KM.state.role = role === 'staff' ? 'staff' : 'owner';
    KM.state.user = KM.state.role === 'staff' ? (q.staff(staffId || (KM.state.user && KM.state.user.id) || 'meena')) : null;
    syncUrl();
    renderProto();
    history.replaceState(null, '', '#/' + KM.homeFor(KM.state.role));
    KM.refresh();
  };
  function syncUrl() {
    var u = new URL(location.href);
    u.searchParams.set('theme', KM.state.theme);
    u.searchParams.set('role', KM.state.role);
    history.replaceState(null, '', u.pathname + u.search + location.hash);
  }

  /* ---------------- needs attention: ONE list for the bell badge, its drawer and Today's card ---------------- */
  KM.dueHref = function (d) { return d.kind === 'booking' ? '/bookings/' + d.ref : d.kind === 'academy' ? '/academy/' + d.ref : '/customers/' + d.ref; };
  // a jewel out past its due date first (someone else may have booked it), then overdue money, largest first
  KM.attention = function () {
    var out = [];
    q.jewelList().filter(function (j) { return j.status === 'overdue'; }).forEach(function (j) {
      out.push({ title: j.name + ' not returned', meta: j.active.client + ' · ' + F.plural(j.overdueDays, 'day') + ' late · ' + F.inr(j.active.deposit) + ' deposit held',
        go: '/jewels/' + j.id, action: { label: 'Return', open: 'return', params: { rental: j.active.id } } });
    });
    q.overdueDues().slice().sort(function (a, b) { return b.amount - a.amount; }).forEach(function (d) {
      out.push({ title: d.name, meta: d.what + ' · ' + (d.age > 0 ? F.plural(d.age, 'day') + ' late' : 'due today'), amount: d.amount,
        go: KM.dueHref(d), action: { label: 'Collect', open: 'collect', params: { kind: d.kind, id: d.id } } });
    });
    return out;
  };
  KM.attentionRow = function (x) {
    return h`<div class="list-item attn-row">
      <a class="li-body" href="#${x.go}" data-close-go="${x.go}"><span class="li-title">${x.title}</span><span class="li-meta">${x.meta}</span></a>
      <span class="li-trail">${x.amount ? h`<span class="money num is-due">${F.inr(x.amount)}</span>` : ''}<button class="btn btn-secondary btn-sm" ${openAttrs(x.action)} aria-label="${x.action.label} · ${x.title}">${x.action.label}</button></span>
    </div>`;
  };
  /* Section back link on detail pages — same arrow, same place, section name only. */
  KM.backLink = function (href, label, cls) { return h`<a class="page-back ${cls || ''}" href="#${href}">${I('arrow-left')} ${label}</a>`; };
  KM.alerts = function () {
    if (KM.state.role !== 'staff') return KM.attention();
    // staff: their functions in the next two days
    var out = [], me = KM.state.user || KM.data.staff[0];
    q.upcoming(2).filter(function (b) { return b.team.indexOf(me.id) >= 0; }).forEach(function (b) {
      out.push({ tone: 'accent', title: b.client + ' · ' + b.title, body: 'Call time ' + F.time(b.fns[0].call) + ' · ' + F.rel(b.start) + ' · ' + b.venue, go: '/staff-schedule' });
    });
    return out;
  };

  /* ---------------- shared overlays ---------------- */
  KM.overlay('quick', {
    title: 'Add', kind: 'modal', size: 'sm', role: 'any',
    render: function () {
      // this page's main action first (it is also the desktop top-bar button), then everything else
      var here = KM.parse().id, p = KM.primaryFor(KM.screens[here]);
      // staff home's main card IS the punch button — don't offer it a second time
      var items = KM.QUICK[KM.state.role].filter(function (a) { return !(here === 'staff' && a.open === 'punch'); });
      var first = p ? (items.filter(function (a) { return a.open === p.open; })[0] || { open: p.open, icon: p.icon || 'plus', title: p.label, sub: '' }) : null;
      var rest = items.filter(function (a) { return a !== first; });
      var item = function (a, sug) {
        var attrs = sug ? openAttrs(p) : h`data-open="${a.open}"`;
        return h`<button class="menu-item ${sug ? 'is-suggested' : ''}" ${attrs}><span class="mi-icon">${I(a.icon)}</span><span><span class="mi-title">${a.title}</span>${a.sub ? h`<span class="mi-sub">${a.sub}</span>` : ''}</span></button>`;
      };
      return h`<div class="menu-list">${first ? h`${item(first, true)}<div class="menu-sep"></div>` : ''}${rest.map(function (a) { return item(a); })}</div>
      <p class="subtle xsmall quick-hint">Press <span class="kbd">N</span> to open this · <span class="kbd">Ctrl K</span> to search</p>`;
    }
  });

  KM.overlay('search', {
    title: 'Search', kind: 'modal', role: 'any',
    render: function () {
      var shortcuts = navItems().map(function (n) { return h`<a class="list-item" href="#/${n.id}" data-close-go="/${n.id}"><span class="li-icon">${I(n.icon)}</span><span class="li-body"><span class="li-title" style="display:block">${n.label}</span></span>${I('chevron-right')}</a>`; });
      return h`<div class="search" style="margin-bottom:12px">${I('search')}<input class="input" id="km-search-input" placeholder="Name, phone, venue, jewel…" autocomplete="off" autofocus aria-label="Search"></div>
        <div id="km-search-results"><div class="eyebrow" style="margin:6px 0 4px">Go to</div><div class="list">${shortcuts}</div></div>`;
    },
    mount: function (el) {
      var input = el.querySelector('#km-search-input'), out = el.querySelector('#km-search-results');
      var base = out.innerHTML;
      input.addEventListener('input', function () {
        if (KM.state.role === 'staff') { out.innerHTML = String(h`<div class="empty"><div class="empty-body">Staff search covers today's clients only in this prototype.</div></div>`); return; }
        var res = q.search(input.value);
        if (!input.value.trim()) { out.innerHTML = base; return; }
        out.innerHTML = res.length ? String(h`<div class="list">${res.map(function (r) {
          return h`<a class="list-item" href="#${r.go}" data-close-go="${r.go}"><span class="li-icon">${I(r.icon)}</span><span class="li-body"><span class="li-title" style="display:block">${r.title}</span><span class="li-meta" style="display:block">${r.kind} · ${r.meta}</span></span>${I('chevron-right')}</a>`;
        })}</div>`) : String(h`<div class="empty"><div class="empty-icon">${I('search-off')}</div><div class="empty-title">No matches</div><div class="empty-body">Try a phone number or first name.</div></div>`);
      });
    }
  });

  KM.overlay('alerts', {
    title: function () { return KM.state.role === 'staff' ? 'Coming up' : 'Needs attention'; }, sub: function () { return F.plural(KM.alerts().length, 'item'); }, kind: 'drawer', size: 'sm', role: 'any',
    render: function () {
      var a = KM.alerts();
      if (!a.length) return h`<div class="empty"><div class="empty-icon">${I('circle-check')}</div><div class="empty-title">All clear</div><div class="empty-body">Nothing needs your attention right now.</div></div>`;
      if (KM.state.role !== 'staff') return h`<div class="list">${a.map(KM.attentionRow)}</div>`;
      return h`<div class="list">${a.map(function (x) {
        return h`<a class="list-item" href="#${x.go}" data-close-go="${x.go}" style="align-items:flex-start">
          <span class="status is-${x.tone === 'accent' ? 'accent' : x.tone}" style="margin-top:6px" aria-hidden="true"></span>
          <span class="li-body"><span class="li-title" style="white-space:normal">${x.title}</span><span class="li-meta" style="white-space:normal">${x.body}</span></span></a>`;
      })}</div>`;
    }
  });

  KM.overlay('more', {
    title: 'More', kind: 'sheet', role: 'any',
    render: function () {
      var tabIds = KM.TABS[KM.state.role].map(function (t) { return t.id; });
      var rest = navItems().filter(function (n) { return tabIds.indexOf(n.id) < 0; });
      return h`<div class="menu-list">${rest.map(function (n) {
        return h`<a class="menu-item" href="#/${n.id}" data-close-go="/${n.id}"><span class="mi-icon">${I(n.icon)}</span><span class="mi-title">${n.label}</span></a>`;
      })}
        <div class="menu-sep"></div>
        <button class="menu-item" data-proto-theme><span class="mi-icon">${I(KM.state.theme === 'dark' ? 'sun' : 'moon')}</span><span class="mi-title">${KM.state.theme === 'dark' ? 'Light theme' : 'Dark theme'}</span></button>
        <button class="menu-item" data-open="role"><span class="mi-icon">${I('switch-horizontal')}</span><span class="mi-title">Switch user (${user().name})</span></button>
        <a class="menu-item" href="#/login" data-close-go="/login"><span class="mi-icon">${I('lock')}</span><span class="mi-title">Lock app</span></a>
      </div>`;
    }
  });

  KM.overlay('role', {
    title: 'Switch user', sub: 'Owner needs a PIN · staff use their own PIN', kind: 'modal', size: 'sm', role: 'any',
    render: function () {
      return h`<div class="stack">
        <button class="panel row" data-role-pick="owner" style="text-align:left"><span class="avatar is-gold">K</span><span class="li-body"><span class="li-title" style="display:block">Kalai (Owner)</span><span class="li-meta" style="display:block">Full access · money, payroll, settings</span></span>${I('chevron-right')}</button>
        ${KM.data.staff.map(function (s) { return h`<button class="panel row" data-role-pick="staff" data-staff="${s.id}" style="text-align:left">${KM.avatar(s.name)}<span class="li-body"><span class="li-title" style="display:block">${s.name}</span><span class="li-meta" style="display:block">${s.role} · staff portal</span></span>${I('chevron-right')}</button>`; })}
        <p class="subtle xsmall">In the real app this asks for the person's PIN. In the prototype it switches instantly.</p></div>`;
    },
    mount: function (el) {
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-role-pick]'); if (!b) return;
        var role = b.getAttribute('data-role-pick'), sid = b.getAttribute('data-staff');
        KM.close();
        setTimeout(function () { KM.setRole(role, sid); KM.toast(role === 'owner' ? 'Welcome back, Kalai 👑' : 'Vanakkam, ' + q.staff(sid).name.split(' ')[0] + '!', { kind: 'success' }); }, 30);
      });
    }
  });

  KM.overlay('screens', {
    title: 'Prototype screens', sub: 'Every screen and panel in this mock — click to jump', kind: 'drawer', role: 'any',
    render: function () {
      var groups = [
        ['Owner app', [['home', 'Today dashboard'], ['bookings', 'Bookings — list & calendar'], ['bookings/nithya', 'Booking detail'], ['customers', 'Customers'], ['customers/lakshmi', 'Customer profile'],
          ['money', 'Money — dues, expenses, cash drawer'], ['insights', 'Insights & P&L'], ['academy', 'Academy'], ['jewels', 'Jewel rental'], ['team', 'Team'], ['team?tab=attendance', 'Attendance'], ['team?tab=payroll', 'Payroll'], ['team/meena', 'Staff profile'], ['assistant', 'AI assistant'], ['settings', 'Settings']]],
        ['Panels (owner)', [['home?open=walkin', 'Walk-in bill (POS)'], ['bookings?open=booking-new', 'New booking'], ['money?open=collect', 'Collect payment'], ['money?open=expense', 'Add expense'],
          ['money?open=scan', 'Scan a bill'], ['academy?open=enroll', 'Enroll student'], ['jewels?open=rent', 'Rent a jewel'], ['team?open=staff-new', 'Add staff'], ['home?open=voice', 'Voice entry'], ['home?open=quick', 'Add menu'], ['home?open=alerts', 'Alerts']]],
        ['Staff app', [['staff', 'Staff home & punch-in'], ['staff-schedule', 'My schedule'], ['staff-me', 'My attendance & payslips']]],
        ['Entry', [['login', 'Login & PIN']]]
      ];
      return h`<div class="stack-lg">${groups.map(function (g) {
        return h`<div><div class="eyebrow" style="margin-bottom:6px">${g[0]}</div><div class="list">${g[1].map(function (s) {
          var role = g[0] === 'Staff app' ? 'staff' : (g[0] === 'Entry' ? null : 'owner');
          var ok = !!KM.screens[s[0].split(/[/?]/)[0]];
          return h`<button class="list-item" data-jump="${s[0]}" data-jump-role="${role || ''}" ${ok ? '' : KM.raw('disabled style="opacity:.5"')}><span class="li-body"><span class="li-title" style="display:block">${s[1]}</span><span class="li-meta" style="display:block">#/${s[0]}</span></span>${I('arrow-right')}</button>`;
        })}</div></div>`;
      })}</div>`;
    },
    mount: function (el) {
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-jump]'); if (!b) return;
        var target = b.getAttribute('data-jump'), role = b.getAttribute('data-jump-role');
        KM.close();
        setTimeout(function () {
          if (role && role !== KM.state.role) { KM.state.role = role; KM.state.user = role === 'staff' ? KM.data.staff[0] : null; syncUrl(); renderProto(); }
          location.hash = '#/' + target;
          KM.refresh();
        }, 40);
      });
    }
  });

  KM.overlay('phone', {
    title: 'Phone preview', sub: '390 × 844 — the same prototype at mobile size', kind: 'full', role: 'any',
    render: function () {
      var u = new URL(location.href);
      u.searchParams.set('embed', '1'); u.searchParams.set('theme', KM.state.theme); u.searchParams.set('role', KM.state.role);
      var r = KM.parse(); var hash = '#/' + [r.id].concat(r.params).join('/');
      return h`<div class="phone-frame"><iframe title="Phone preview" src="${u.pathname + u.search + hash}"></iframe></div>`;
    }
  });

  /* ---------------- prototype toolbar & keyboard ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-proto-role],[data-proto-theme],#km-proto-mini');
    if (!t) return;
    if (t.id === 'km-proto-mini') { document.getElementById('km-proto').classList.toggle('is-open'); renderProto(); return; }
    if (t.hasAttribute('data-proto-theme')) { KM.setTheme(KM.state.theme === 'dark' ? 'light' : 'dark'); if (document.querySelector('.ov[data-overlay="more"]')) KM.close(); return; }
    KM.setRole(t.getAttribute('data-proto-role'));
  });
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    var typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (KM.parse().id === 'login') return; // the entry screen owns the keyboard (PIN keypad)
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); KM.open('search'); }
    else if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'n' && !document.querySelector('.ov')) { e.preventDefault(); KM.open('quick'); }
  });

  /* ---------------- boot ---------------- */
  KM.boot = function () {
    var sp = new URLSearchParams(location.search);
    var theme = sp.get('theme');
    if (!theme) { try { theme = localStorage.getItem('km-theme'); } catch (e) {} }
    KM.state.theme = theme === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', KM.state.theme);
    KM.state.role = sp.get('role') === 'staff' ? 'staff' : 'owner';
    KM.state.user = KM.state.role === 'staff' ? q.staff(sp.get('staff') || 'meena') : null;
    KM.state.embed = sp.get('embed') === '1';
    KM.state.chrome = sp.get('chrome') !== '0';
    if (KM.state.embed) document.documentElement.classList.add('is-embed');
    if (!KM.state.chrome) document.documentElement.classList.add('no-chrome');
    frame();
    renderProto();
    window.addEventListener('hashchange', KM.route);
    if (!location.hash || location.hash === '#' || location.hash === '#/') history.replaceState(null, '', '#/' + KM.homeFor(KM.state.role));
    KM.route();
  };
})();

</script>
<script data-screen="academy">
/* ===== screens/academy.js ===== */
/* Academy — makeup training: students, fees, weekly progress, certificates.
   Owner screen `academy` (+ `academy/<id>` student profile), the `academy-message` WhatsApp sheet (owner) and the
   `enroll` overlay (role any — staff enroll walk-ins, but never see academy revenue totals).
   Clean pass: "Enroll student" is the shell's primary action only; two fee numbers at the top; one action per student
   row (Collect); reminders, status changes and the certificate live on the profile, each shown once.
   The 6-month fee chart moved to Insights → "Income by stream" (academy is one of the streams). */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  var ST = { active: { label: 'Active' }, certified: { label: 'Certified' }, 'on-hold': { label: 'On hold' } };
  var RANK = { active: 0, 'on-hold': 1, certified: 2 };
  var FILTERS = [['active', 'Active'], ['certified', 'Certified'], ['on-hold', 'On hold'], ['all', 'All']];

  function first(n) { return String(n || '').split(' ')[0]; }
  function rec(id) { return KM.data.students.filter(function (s) { return s.id === id; })[0]; }
  function digits(v) { return String(v || '').replace(/\D/g, '').slice(-10); }
  function r100(x) { return Math.round(x / 100) * 100; }
  function endOf(s) { return D.add(s.start, s.weeks * 7); }
  function weeksDone(s) {
    if (s.status === 'certified') return s.weeks;
    if (s.status === 'on-hold') { var at = s.heldOn || s.lastPaid || s.start; return Math.min(s.weeks, Math.max(0, Math.floor(D.diff(at, s.start) / 7))); }
    return s.progressWeeks;
  }
  function readyToCertify(s) { return s.status === 'active' && s.progressWeeks >= s.weeks; }
  /* Late = a balance after the course has ended, or no instalment for over a month. On hold = reminders paused, never late. */
  function isLate(s) { return q.studentLate(s); } // the shared rule in core, so Money and Today agree
  function monthPaid(ym) {
    return q.sum(KM.data.students, function (s) { return q.sum(s.payments.filter(function (p) { return p.date.slice(0, 7) === ym; }), function (p) { return p.amount; }); });
  }
  function modeLabel(m) { return m === 'cash' ? 'Cash' : 'UPI'; }
  function certDate(s) {
    if (s.certifiedOn) return s.certifiedOn;
    var e = endOf(s);
    return e < KM.state.today ? e : KM.state.today;
  }
  function certNo(s) {
    var i = KM.data.students.map(function (x) { return x.id; }).indexOf(s.id);
    return 'KMA-' + s.start.slice(0, 4) + '-' + String(101 + i).padStart(3, '0');
  }

  /* ---------- WhatsApp copy (warm, Tamil-English) ---------- */
  var UPI = KM.data.settings.studio.upi;
  function remindText(s) {
    return 'Vanakkam ' + first(s.name) + '! 🙏 ' + (s.status === 'certified' ? 'Congratulations again on completing the ' + s.courseName + ' course.' : 'Hope your ' + s.courseName + ' classes are going well.') +
      ' A gentle reminder from Kalai Makeover Academy — ' + F.inr(s.due) + ' of your course fee is pending. You can pay at the studio or GPay to ' + UPI + '. Nandri! ✨';
  }
  function detailsText(s) {
    return 'Vanakkam ' + first(s.name) + '! 🌸 Your Kalai Makeover Academy course details:\n' +
      '• Course: ' + s.courseName + ' (' + F.plural(s.weeks, 'week') + ')\n' +
      '• Batch: ' + s.batch + '\n' +
      '• Dates: ' + F.date(s.start, 'dow') + ' → ' + F.date(endOf(s), 'dow') + '\n' +
      '• Fee: ' + F.inr(s.fee) + ' · paid ' + F.inr(s.paid) + (s.due > 0 ? ' · balance ' + F.inr(s.due) : ' · fully paid ✓') + '\n' +
      (s.status === 'on-hold' ? 'Your seat is kept — we will see you when you rejoin! 💛 — Kalai'
        : s.status === 'active' && s.progressWeeks < s.weeks ? 'Please bring your own brush set and a notebook. See you in class! ✨ — Kalai' : 'Thank you for learning with us ✨ — Kalai');
  }
  function thanksText(s) {
    return 'Thank you for learning with us, ' + first(s.name) + '! 🌸 It was a joy teaching you the ' + s.courseName + ' course. ' +
      'If you enjoyed it, a Google review would mean the world to us — and do send your friends our way. All the best for your first bookings! ✨ — Kalai';
  }
  function holdText(s) {
    return 'Vanakkam ' + first(s.name) + '! Missing you at the academy 💛 Whenever you are ready to rejoin the ' + s.courseName +
      ' batch (' + s.batch + '), just reply here and we will keep your seat. — Kalai';
  }
  function certText(s) {
    return 'Congratulations ' + first(s.name) + '! 🎓✨ You have completed the ' + s.courseName + ' course at Kalai Makeover Academy. ' +
      'Your certificate is ready — collect it from the studio or we can send a copy here. So proud of you! — Kalai';
  }
  function welcomeText(s, c) {
    var paid = q.sum(s.payments, function (p) { return p.amount; });
    return 'Vanakkam ' + first(s.name) + '! 🌸 Welcome to Kalai Makeover Academy.\n' +
      '• Course: ' + c.name + ' (' + F.plural(c.weeks, 'week') + ')\n' +
      '• Batch: ' + c.batch + ', starting ' + F.date(s.start, 'dow') + '\n' +
      '• Fee: ' + F.inr(s.fee) + (paid ? ' · received ' + F.inr(paid) : '') + (s.fee - paid > 0 ? ' · balance ' + F.inr(s.fee - paid) : ' · fully paid ✓') + '\n' +
      'Studio: ' + KM.data.settings.studio.address + '. See you in class! ✨';
  }

  /* =========================================================================
     Owner overview — two fee numbers, the student list (main), the course list (side).
     ========================================================================= */
  function kpis(all) {
    var T = KM.state.today;
    var owing = all.filter(function (s) { return s.status !== 'on-hold' && s.due > 0; }); // a certified student can still owe a balance
    var late = owing.filter(isLate).length; // a count, not a sum — the overdue row already shows its amount
    var firstPay = all.reduce(function (m, s) { return s.payments.reduce(function (mm, p) { return !mm || p.date < mm ? p.date : mm; }, m); }, '');
    return h`<section class="kpi-row ac-kpis" aria-label="Academy fees">
      <a class="kpi" href="#/money?tab=dues"><div class="kpi-label">Fees to collect</div><div class="kpi-value">${F.inr(q.sum(owing, function (s) { return s.due; }))}</div>
        <div class="kpi-foot"><span>${F.plural(owing.length, 'student')}${late ? h` · <span class="money is-due">${late} overdue</span>` : ''}</span></div></a>
      <a class="kpi" href="#/insights"><div class="kpi-label">Collected in ${F.date(T, 'month').split(' ')[0]}</div><div class="kpi-value">${F.inr(monthPaid(T.slice(0, 7)))}</div>
        <div class="kpi-foot">${F.inr(q.sum(all, function (s) { return s.paid; }))} since ${firstPay ? F.date(firstPay, 'month') : 'the start'}</div></a>
    </section>`;
  }

  function studentRow(s) {
    var ready = readyToCertify(s), late = isLate(s);
    var meta = s.status === 'on-hold' ? h`${s.courseName} · on hold`
      : s.status === 'certified' ? h`${s.courseName} · certified ${F.date(certDate(s))}`
      : ready ? h`<span>${s.courseName}</span><span class="status is-success">Ready to certify</span>`
      : h`${s.courseName} · week ${weeksDone(s) + 1} of ${s.weeks}`;
    return h`<div class="list-item ac-row">
      <a class="li-body ac-who" href="#/academy/${s.id}">${KM.avatar(s.name)}
        <span class="ac-id"><span class="li-title">${s.name}</span><span class="li-meta">${meta}</span></span></a>
      <span class="li-trail ac-trail">
        ${s.due > 0 ? h`<span class="ac-amt"><span class="money num ${late ? 'is-due' : ''}">${F.inr(s.due)}</span> <span class="subtle">due</span></span>` : h`<span class="subtle small">Paid</span>`}
        ${s.due > 0 && s.status !== 'on-hold' ? h`<button class="btn btn-secondary btn-sm" data-open="collect" data-p-kind="academy" data-p-id="${s.id}">Collect</button>` : ''}
      </span>
    </div>`;
  }

  function studentList(all, ctx) {
    var status = ctx.query.status || 'active';
    if (!ST[status] && status !== 'all') status = 'active';
    var course = q.course(ctx.query.course || '') ? ctx.query.course : '';
    var pool = course ? all.filter(function (s) { return s.course === course; }) : all;
    var count = function (k) { return k === 'all' ? pool.length : pool.filter(function (s) { return s.status === k; }).length; };
    var list = (status === 'all' ? pool : pool.filter(function (s) { return s.status === status; })).slice()
      .sort(function (a, b) { return (RANK[a.status] - RANK[b.status]) || (b.due - a.due) || b.start.localeCompare(a.start); });
    // no empty filters (count 0), and no filter bar at all when it would only hold one option
    var segs = FILTERS.filter(function (f) { return f[0] === 'all' || f[0] === status || count(f[0]) > 0; });
    return h`<section class="card ac-students" aria-labelledby="ac-h-students">
      <div class="card-head"><h2 class="card-title" id="ac-h-students">Students</h2></div>
      <div class="ac-filters">
        ${segs.length > 1 ? h`<div class="seg" role="group" aria-label="Filter by status">
          ${segs.map(function (f) {
            var on = status === f[0];
            return h`<button class="seg-item ${on ? 'is-active' : ''}" data-ac-status="${f[0]}" aria-pressed="${on ? 'true' : 'false'}">${f[1]} <span class="ac-count">${count(f[0])}</span></button>`;
          })}
        </div>` : ''}
        ${course ? h`<button class="chip is-selected no-check" data-ac-course="" aria-label="Clear course filter ${q.course(course).name}">${q.course(course).name} ${I('x')}</button>` : ''}
      </div>
      ${list.length ? h`<div class="list">${list.map(studentRow)}</div>`
        : h`<div class="empty"><div class="empty-title">No ${status === 'all' ? '' : ST[status].label.toLowerCase() + ' '}students${course ? ' in ' + q.course(course).name : ''}</div>
            ${status === 'active' || status === 'all' ? h`<button class="btn btn-primary btn-sm" data-open="enroll" ${course ? KM.raw('data-p-course="' + KM.esc(course) + '"') : ''}>${I('user-plus')} Enroll student</button>` : ''}</div>`}
    </section>`;
  }

  function courseList(sel) {
    return h`<section class="card ac-courses" aria-labelledby="ac-h-courses">
      <div class="card-head"><h2 class="card-title" id="ac-h-courses">Courses</h2></div>
      <div class="list">${KM.data.courses.map(function (c) {
        var on = sel === c.id;
        return h`<a class="list-item ac-course ${on ? 'is-selected' : ''}" href="${on ? '#/academy?status=active' : '#/academy?course=' + c.id + '&status=all'}" ${on ? KM.raw('aria-current="true"') : ''}>
          <span class="li-body"><span class="li-title">${c.name}</span><span class="li-meta">${F.plural(c.weeks, 'week')} · ${c.batch}</span></span>
          <span class="li-trail"><span class="num ac-fee">${F.inr(c.fee)}</span></span></a>`;
      })}</div>
    </section>`;
  }

  function overview(ctx) {
    var all = q.students();
    return h`
      <header class="page-head">
        <div class="page-head-text"><h1 class="page-title">Academy</h1></div>
      </header>
      ${kpis(all)}
      <div class="ac-cols">
        ${studentList(all, ctx)}
        ${courseList(ctx.query.course)}
      </div>`;
  }

  /* =========================================================================
     Student profile — course & status, fees & payments, certificate. One WhatsApp button in the head opens the messages.
     ========================================================================= */
  function courseCard(s) {
    var wd = weeksDone(s), ready = readyToCertify(s);
    var label;
    if (s.status === 'certified') label = 'Certified on ' + F.date(certDate(s), 'dow');
    else if (s.status === 'on-hold') label = 'Paused after week ' + wd + ' of ' + s.weeks + (s.heldOn ? ' · since ' + F.date(s.heldOn, 'dow') : '');
    else if (wd >= s.weeks) label = 'All ' + s.weeks + ' weeks done · ready to certify';
    else label = 'Week ' + (wd + 1) + ' of ' + s.weeks + ' · ends ' + F.date(endOf(s), 'dow');
    var segs = [];
    for (var i = 0; i < s.weeks; i++) {
      var cls = i < wd ? 'is-done' : (i === wd && s.status === 'active' ? 'is-now' : '');
      segs.push(h`<span class="${cls}" title="Week ${i + 1}"></span>`);
    }
    // one gold button per view: Collect owns it while a balance is due
    var main = s.due > 0 ? 'btn-secondary' : 'btn-primary';
    var btns;
    if (s.status === 'active') btns = h`<button class="btn ${ready ? main : 'btn-secondary'} btn-sm" data-ac-set="certified">${I('certificate')} Mark certified</button>
        <button class="btn btn-ghost btn-sm" data-ac-set="on-hold">Put on hold</button>`;
    else if (s.status === 'on-hold') btns = h`<button class="btn ${main} btn-sm" data-ac-set="active">${I('player-play')} Resume course</button>`;
    else btns = h`<button class="btn btn-ghost btn-sm" data-ac-set="active">Move back to active</button>`;
    return h`<section class="card ac-course-card" aria-labelledby="ac-h-course">
      <div class="card-head"><h2 class="card-title" id="ac-h-course">${s.courseName}</h2></div>
      <div class="card-body">
        <p class="subtle small ac-line">${s.batch} · started ${F.date(s.start, 'dow')}</p>
        <div class="strong ac-prog-label">${label}</div>
        <div class="ac-weeks ${s.status === 'on-hold' ? 'is-paused' : ''}" role="img" aria-label="${wd} of ${s.weeks} weeks completed">${segs}</div>
        ${s.note ? h`<p class="small muted ac-note">${s.note}</p>` : ''}
      </div>
      <div class="card-foot ac-foot">${btns}</div>
    </section>`;
  }

  function feesCard(s) {
    var c = q.course(s.course), off = c.fee - s.fee, late = isLate(s);
    return h`<section class="card" aria-labelledby="ac-h-fees">
      <div class="card-head"><h2 class="card-title" id="ac-h-fees">Fees</h2></div>
      <div class="card-body">
        <div class="kv">
          <div class="kv-row"><span>Course fee</span><span class="num">${F.inr(s.fee)}${off > 0 ? h` <span class="subtle">· ${F.inr(off)} off list</span>` : ''}</span></div>
          ${s.due > 0 ? h`<div class="kv-row"><span>Paid</span><span class="num">${F.inr(s.paid)}</span></div>` : ''}
          <div class="kv-row is-total"><span>Balance</span>${s.due > 0 ? h`<span class="num ${late ? 'money is-due' : ''}">${F.inr(s.due)}</span>` : h`<span>Paid in full</span>`}</div>
        </div>
        <h3 class="ac-sub-h">Payments</h3>
        ${s.payments.length ? h`<div class="list ac-pays">${s.payments.map(function (p) {
          return h`<div class="list-item"><span class="li-body"><span class="li-title">${p.note || 'Payment'}</span><span class="li-meta">${F.date(p.date, 'dow')} · ${modeLabel(p.mode)}</span></span>
            <span class="li-trail"><span class="num strong">+${F.inr(p.amount)}</span></span></div>`;
        })}</div>` : h`<p class="subtle small">No payments yet.</p>`}
      </div>
    </section>`;
  }

  function certificate(s) {
    return h`<section class="card ac-cert-card" aria-labelledby="ac-h-cert">
      <div class="card-head"><h2 class="card-title" id="ac-h-cert">Certificate</h2><span class="card-sub ac-push">No. ${certNo(s)}</span></div>
      <div class="card-body">
        <figure class="ac-cert" aria-label="Certificate of Completion for ${s.name}">
          <div class="ac-cert-inner">
            <div class="ac-cert-brand">Kalai Makeover Academy · Chennai</div>
            <div class="ac-cert-title">Certificate of Completion</div>
            <div class="ac-cert-orn" aria-hidden="true"><i></i>${I('diamond', { size: 12 })}<i></i></div>
            <div class="ac-cert-pre">This is to certify that</div>
            <div class="ac-cert-name">${s.name}</div>
            <div class="ac-cert-body">has successfully completed the <b>${s.courseName}</b> course (${F.plural(s.weeks, 'week')}) with hands-on training at Kalai Makeover Academy.</div>
            <div class="ac-cert-foot">
              <div class="ac-cert-sig"><span class="ac-cert-line">${F.date(certDate(s), 'dmy')}</span><span>Date</span></div>
              <div class="ac-cert-seal" aria-hidden="true"><span>K</span></div>
              <div class="ac-cert-sig"><span class="ac-cert-line ac-cert-hand">Kalai</span><span>Founder &amp; Lead Artist</span></div>
            </div>
          </div>
        </figure>
        <button class="btn btn-secondary btn-sm ac-cert-dl" data-toast="Certificate PDF saved (prototype)">${I('download')} Download PDF</button>
      </div>
    </section>`;
  }

  /* WhatsApp messages that apply to this student, most relevant first: [kind, seg label, head-button label, text].
     One outlined button in the page head opens them in the `academy-message` sheet (same pattern as a booking). */
  function messages(s) {
    var opts = [];
    if (s.due > 0 && s.status !== 'on-hold') opts.push(['remind', 'Fee reminder', 'Send reminder', remindText(s)]);
    if (s.status === 'certified') { opts.push(['cert', 'Certificate', 'Send certificate', certText(s)]); opts.push(['thanks', 'Thank you', 'Say thank you', thanksText(s)]); }
    if (s.status === 'on-hold') opts.push(['hold', 'Check in', 'Check in', holdText(s)]);
    opts.push(['details', 'Course details', 'WhatsApp', detailsText(s)]);
    return opts;
  }

  function profile(id) {
    var s = q.student(id);
    if (!s) {
      return h`${KM.backLink('/academy', 'Academy')}
        <div class="empty"><div class="empty-title">Student not found</div>
        <div class="empty-body">This student may have been removed.</div><a class="btn btn-secondary btn-sm" href="#/academy">Back to Academy</a></div>`;
    }
    var msg = messages(s)[0];
    return h`
      ${KM.backLink('/academy?status=' + s.status, 'Academy')}
      <header class="page-head ac-prof-head">
        ${KM.avatar(s.name, 'avatar-lg')}
        <div class="page-head-text">
          <h1 class="page-title">${s.name}</h1>
          <p class="page-sub">${s.area ? s.area + ' · ' : ''}<a class="ac-tel" href="tel:+91${s.phone}">${F.phone(s.phone)}</a>${s.addedBy ? ' · added by ' + q.firstName(s.addedBy) : ''}</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-wa" data-open="academy-message" data-p-id="${s.id}" data-p-kind="${msg[0]}">${I('brand-whatsapp')}${msg[2]}</button>
          ${s.due > 0 ? h`<button class="btn btn-primary" data-open="collect" data-p-kind="academy" data-p-id="${s.id}">Collect fee</button>` : ''}
        </div>
      </header>
      <div class="ac-prof ${s.status === 'certified' ? '' : 'is-single'}">
        <div class="ac-prof-main">${courseCard(s)}${feesCard(s)}</div>
        ${s.status === 'certified' ? h`<div class="ac-prof-side">${certificate(s)}</div>` : ''}
      </div>`;
  }

  /* =========================================================================
     Status changes (local helper)
     ========================================================================= */
  function setStatus(id, to) {
    var s = q.student(id), r = rec(id);
    if (!s || !r) return;
    var f = first(s.name);
    var cfg = {
      certified: { title: 'Mark ' + f + ' as certified?', confirmLabel: 'Mark certified',
        body: s.due > 0 ? F.inr(s.due) + ' of the fee is still due. The certificate is issued now and the balance stays on her ledger.' : 'Issues the Certificate of Completion for ' + s.courseName + '.',
        toast: f + ' is certified 🎓 — certificate ready to send' },
      'on-hold': { title: 'Put ' + f + ' on hold?', confirmLabel: 'Put on hold',
        body: 'Her seat in the ' + s.batch + ' batch is kept and fee reminders pause until she resumes.', toast: f + "'s course is on hold" },
      active: { title: (s.status === 'certified' ? 'Move ' + f + ' back to active?' : 'Resume ' + f + "'s course?"), confirmLabel: s.status === 'certified' ? 'Move to active' : 'Resume',
        body: s.status === 'certified' ? 'The certificate will be withdrawn until you certify again.' : 'She rejoins the ' + s.batch + ' batch from this week.', toast: f + ' is back in class ✨' }
    }[to];
    KM.confirm({ title: cfg.title, body: cfg.body, confirmLabel: cfg.confirmLabel }).then(function (ok) {
      if (!ok) return;
      r.status = to;
      if (to === 'certified') r.certifiedOn = KM.state.today; else delete r.certifiedOn;
      if (to === 'on-hold') r.heldOn = KM.state.today;
      if (to === 'active') delete r.heldOn;
      KM.emit('data:changed', 'student');
      KM.toast(cfg.toast, { kind: 'success' });
    });
  }

  function onClick(e) {
    if (KM.parse().id !== 'academy') return;
    var t = e.target.closest('[data-ac-status],[data-ac-course],[data-ac-set]');
    if (!t) return;
    if (t.hasAttribute('data-ac-status')) { e.preventDefault(); KM.setQuery({ status: t.getAttribute('data-ac-status') }, true); return; }
    if (t.hasAttribute('data-ac-course')) { e.preventDefault(); KM.setQuery({ course: t.getAttribute('data-ac-course') }, true); return; }
    if (t.hasAttribute('data-ac-set')) { e.preventDefault(); setStatus(KM.parse().params[0], t.getAttribute('data-ac-set')); }
  }

  KM.screen('academy', {
    title: 'Academy', icon: 'school', role: 'owner',
    // the one create action on every academy view; a course-filtered list pre-selects that course
    primary: function (r) {
      var c = !r.params[0] && r.query.course && q.course(r.query.course) ? r.query.course : null;
      return { label: 'Enroll student', open: 'enroll', icon: 'user-plus', params: c ? { course: c } : {} };
    },
    render: function (ctx) { return ctx.params[0] ? profile(ctx.params[0]) : overview(ctx); },
    mount: function (root) { root.removeEventListener('click', onClick); root.addEventListener('click', onClick); },
    unmount: function () { var p = document.getElementById('km-page'); if (p) p.removeEventListener('click', onClick); }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'academy') KM.refresh(); });

  /* =========================================================================
     Overlay: WhatsApp message for a student (fee reminder / certificate / thank you / check in / course details).
     The most relevant one is pre-selected; the text stays editable before sending.
     ========================================================================= */
  function msgOf(s, kind) { var ms = messages(s); return ms.filter(function (m) { return m[0] === kind; })[0] || ms[0]; }
  KM.overlay('academy-message', {
    title: 'WhatsApp message',
    sub: function (ctx) { var s = q.student(ctx.params.id); return s ? KM.esc('To ' + s.name + ' · +91 ' + F.phone(s.phone)) : ''; },
    kind: 'modal', size: 'sm', role: 'owner',
    render: function (ctx) {
      var s = q.student(ctx.params.id);
      if (!s) return h`<div class="empty"><div class="empty-title">Student not found</div></div>`;
      var ms = messages(s), cur = msgOf(s, ctx.params.kind);
      return h`${ms.length > 1 ? h`<div class="seg is-block ac-msg-kinds" role="group" aria-label="Message">${ms.map(function (m) {
          var on = m[0] === cur[0];
          return h`<button type="button" class="seg-item ${on ? 'is-active' : ''}" data-ac-kind="${m[0]}" aria-pressed="${on ? 'true' : 'false'}">${m[1]}</button>`;
        })}</div>` : ''}
        <textarea class="wa-preview ac-wa-text" id="ac-wa-text" rows="7" aria-label="Message text">${cur[3]}</textarea>`;
    },
    footer: function (ctx) {
      var s = q.student(ctx.params.id);
      if (!s) return '';
      return h`<button class="btn btn-secondary" data-ac-copy>${I('copy')}Copy</button>
        <a class="btn btn-wa" href="${KM.wa(s.phone, msgOf(s, ctx.params.kind)[3])}" target="_blank" rel="noopener" data-ac-wa-open autofocus>${I('brand-whatsapp')}Open WhatsApp</a>`;
    },
    mount: function (el, ctx) {
      var s = q.student(ctx.params.id);
      if (!s) return;
      var ta = el.querySelector('#ac-wa-text'), open = el.querySelector('[data-ac-wa-open]');
      var sync = function () { if (open && ta) open.setAttribute('href', KM.wa(s.phone, ta.value)); };
      if (ta) ta.addEventListener('input', sync);
      el.addEventListener('click', function (e) {
        var k = e.target.closest('[data-ac-kind]');
        if (k && ta) {
          el.querySelectorAll('[data-ac-kind]').forEach(function (x) { var on = x === k; x.classList.toggle('is-active', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
          ta.value = msgOf(s, k.getAttribute('data-ac-kind'))[3]; sync();
          return;
        }
        if (e.target.closest('[data-ac-copy]')) {
          var txt = ta ? ta.value : '';
          try { navigator.clipboard.writeText(txt).then(function () { KM.toast('Message copied'); }, function () { KM.toast('Message copied'); }); } catch (err) { KM.toast('Message copied'); }
        }
        if (e.target.closest('[data-ac-wa-open]')) setTimeout(function () { KM.close(); KM.toast('Opening WhatsApp…', { kind: 'info' }); }, 60);
      });
    }
  });

  /* =========================================================================
     Overlay: enroll (role any — staff can enroll walk-ins)
     ========================================================================= */
  function lookup(d) {
    var s = KM.data.students.filter(function (x) { return x.phone === d; })[0];
    if (s) return { kind: 'student', s: q.student(s.id) };
    var c = q.findByPhone(d);
    if (c) return { kind: 'customer', name: c.name, area: c.area };
    var b = KM.data.bookings.filter(function (x) { return x.phone === d; })[0];
    if (b) return { kind: 'booking', name: b.client, area: b.area };
    return null;
  }

  function enrollForm(ctx) {
    var T = KM.state.today;
    var cid = ctx.params.course && q.course(ctx.params.course) ? ctx.params.course : 'bridal';
    var c = q.course(cid);
    return h`<form class="ac-enroll" novalidate autocomplete="off">
      <fieldset class="ac-fs">
        <legend class="ac-legend">Student</legend>
        <label class="field"><span class="label">Mobile number <span class="req">*</span></span>
          <span class="input-group ac-tel-in"><span class="input-prefix">+91</span><input class="input" name="phone" type="tel" inputmode="numeric" maxlength="14" placeholder="98400 00000" autofocus aria-describedby="ac-hint-phone"></span>
          <span class="hint" id="ac-hint-phone" data-hint="phone"></span></label>
        <div class="form-grid cols-2">
          <label class="field"><span class="label">Full name <span class="req">*</span></span><input class="input" name="name" placeholder="Student's name" aria-describedby="ac-hint-name"><span class="hint" id="ac-hint-name" data-hint="name"></span></label>
          <label class="field"><span class="label">Area</span><input class="input" name="area" placeholder="e.g. Velachery"></label>
        </div>
      </fieldset>

      <fieldset class="ac-fs">
        <legend class="ac-legend">Course</legend>
        <div class="ac-pick" role="radiogroup" aria-label="Course">
          ${KM.data.courses.map(function (x) {
            var on = x.id === cid;
            return h`<button type="button" class="ac-pick-item ${on ? 'is-selected' : ''}" role="radio" aria-checked="${on ? 'true' : 'false'}" data-course="${x.id}">
              <span class="ac-pick-name">${x.name}</span>
              <span class="ac-pick-meta">${F.plural(x.weeks, 'week')} · ${x.batch.split(' · ')[0]}</span>
              <span class="ac-pick-fee num">${F.inr(x.fee)}</span>
            </button>`;
          })}
        </div>
        <div class="form-grid cols-2 ac-two">
          <label class="field"><span class="label">Agreed fee</span>
            <span class="input-group"><span class="input-prefix">₹</span><input class="input num" name="fee" inputmode="numeric" value="${c.fee}" aria-describedby="ac-hint-fee"></span>
            <span class="hint" id="ac-hint-fee" data-hint="fee"></span></label>
          <label class="field"><span class="label">Start date</span>
            <input class="input" type="date" name="start" value="${T}" min="${D.add(T, -30)}" aria-describedby="ac-hint-start">
            <span class="hint" id="ac-hint-start" data-hint="start"></span></label>
        </div>
      </fieldset>

      <fieldset class="ac-fs">
        <legend class="ac-legend">First payment</legend>
        <div class="chips" role="radiogroup" aria-label="First payment" data-pay-chips></div>
        <div class="form-grid cols-2 ac-two ac-pay-row">
          <label class="field"><span class="label">Amount received</span>
            <span class="input-group"><span class="input-prefix">₹</span><input class="input num" name="amount" inputmode="numeric" value="0" aria-describedby="ac-hint-amt"></span>
            <span class="hint" id="ac-hint-amt" data-hint="amount" aria-live="polite"></span></label>
          <div class="field"><span class="label" id="ac-mode-l">Paid by</span>
            <div class="seg is-block" role="radiogroup" aria-labelledby="ac-mode-l">
              <button type="button" class="seg-item" role="radio" data-mode="cash">${I('cash')} Cash</button>
              <button type="button" class="seg-item" role="radio" data-mode="upi">${I('device-mobile-dollar')} UPI / GPay</button>
            </div></div>
        </div>
      </fieldset>
    </form>`;
  }

  function enrollFooter() {
    return h`<button type="button" class="btn btn-secondary ac-foot-cancel" data-close>Cancel</button>
      <button type="button" class="btn btn-primary" data-enroll-save><span data-save-label>Enroll</span></button>`;
  }

  function mountEnroll(el, ctx) {
    var body = el.querySelector('.ov-body'), foot = el.querySelector('.ov-foot');
    var form = body.querySelector('.ac-enroll');
    if (!form) return;
    var T = KM.state.today;
    var cid = ctx.params.course && q.course(ctx.params.course) ? ctx.params.course : 'bridal';
    var s = { course: cid, fee: q.course(cid).fee, pay: 'p25', amount: 0, mode: 'upi', autoName: false };
    var $ = function (sel) { return form.querySelector(sel); };
    var hint = function (k) { return form.querySelector('[data-hint="' + k + '"]'); };

    function payOpts() {
      return [['p0', 'Pay later', 0], ['p25', '25%', r100(s.fee * 0.25)], ['p50', '50%', r100(s.fee * 0.5)], ['full', 'Full fee', s.fee]];
    }
    function setHint(k, text, tone) { var x = hint(k); if (!x) return; x.textContent = text || ''; x.className = 'hint' + (tone ? ' is-' + tone : ''); }

    function sync() {
      var c = q.course(s.course);
      form.querySelectorAll('[data-course]').forEach(function (b) { var on = b.getAttribute('data-course') === s.course; b.classList.toggle('is-selected', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
      // fee hint only when it differs from the list fee (the course tile already shows the list fee)
      var off = c.fee - s.fee;
      if (!s.fee) setHint('fee', 'Enter the fee agreed with the student', 'warn');
      else if (off > 0) setHint('fee', F.inr(off) + ' off the list fee', 'warn');
      else if (off < 0) setHint('fee', F.inr(-off) + ' above the list fee');
      else setHint('fee', '');
      var start = $('[name=start]').value || T;
      setHint('start', 'Ends ' + F.date(D.add(start, c.weeks * 7), 'dow'));
      var opts = payOpts();
      if (s.pay !== 'custom') { var o = opts.filter(function (x) { return x[0] === s.pay; })[0]; s.amount = o ? o[2] : 0; $('[name=amount]').value = String(s.amount); }
      form.querySelector('[data-pay-chips]').innerHTML = String(h`${opts.map(function (o) {
        var on = s.pay === o[0];
        return h`<button type="button" class="chip no-check ${on ? 'is-selected' : ''}" role="radio" aria-checked="${on ? 'true' : 'false'}" data-pay="${o[0]}">${o[1]}</button>`;
      })}`);
      form.querySelectorAll('[data-mode]').forEach(function (b) { var on = b.getAttribute('data-mode') === s.mode; b.classList.toggle('is-active', on); b.setAttribute('aria-checked', on ? 'true' : 'false'); });
      // one line: what's left after today
      var amt = Math.min(s.amount, s.fee || 0), bal = Math.max(0, (s.fee || 0) - amt);
      if (s.amount > s.fee && s.fee) setHint('amount', 'More than the fee — capped at ' + F.inr(s.fee), 'warn');
      else setHint('amount', bal ? 'Balance ' + F.inr(bal) : 'Paid in full');
      var lbl = foot && foot.querySelector('[data-save-label]');
      if (lbl) lbl.textContent = amt ? 'Enroll · collect ' + F.inr(amt) : 'Enroll · pay later';
    }

    form.addEventListener('submit', function (e) { e.preventDefault(); save(); });
    form.addEventListener('click', function (e) {
      var b = e.target.closest('[data-course],[data-pay],[data-mode]');
      if (!b) return;
      e.preventDefault();
      if (b.hasAttribute('data-course')) { s.course = b.getAttribute('data-course'); s.fee = q.course(s.course).fee; $('[name=fee]').value = String(s.fee); }
      if (b.hasAttribute('data-pay')) s.pay = b.getAttribute('data-pay');
      if (b.hasAttribute('data-mode')) s.mode = b.getAttribute('data-mode');
      sync();
    });
    form.addEventListener('input', function (e) {
      var n = e.target.name;
      if (n === 'phone') onPhone();
      if (n === 'name') { s.autoName = false; setHint('name', ''); }
      if (n === 'fee') { s.fee = parseInt(digitsAll(e.target.value), 10) || 0; sync(); }
      if (n === 'amount') { s.pay = 'custom'; s.amount = parseInt(digitsAll(e.target.value), 10) || 0; sync(); }
      if (n === 'start') sync();
    });
    function digitsAll(v) { return String(v || '').replace(/\D/g, ''); }

    function onPhone() {
      var d = digits($('[name=phone]').value);
      if (d.length < 10) { setHint('phone', ''); return; }
      var f = lookup(d);
      var nameEl = $('[name=name]'), areaEl = $('[name=area]');
      if (!f) { setHint('phone', 'New contact — add her name below.', 'good'); if (s.autoName) { nameEl.value = ''; areaEl.value = ''; s.autoName = false; } return; }
      if (f.kind === 'student') {
        setHint('phone', 'Already a student: ' + f.s.name + ' · ' + f.s.courseName + ' (' + ST[f.s.status].label + '). Enrolling again adds a new course.', 'warn');
        if (!nameEl.value || s.autoName) { nameEl.value = f.s.name; areaEl.value = f.s.area || ''; s.autoName = true; }
        return;
      }
      if (!nameEl.value || s.autoName) { nameEl.value = f.name; if (!areaEl.value || s.autoName) areaEl.value = f.area || ''; s.autoName = true; }
      setHint('phone', (f.kind === 'customer' ? 'Salon customer' : 'Bridal client') + ' · ' + f.name + (f.area ? ', ' + f.area : '') + ' — details filled in.', 'good');
    }

    function save() {
      var phone = digits($('[name=phone]').value), name = $('[name=name]').value.trim(), area = $('[name=area]').value.trim();
      var start = $('[name=start]').value || T;
      if (phone.length !== 10) { setHint('phone', 'Enter a 10-digit mobile number', 'err'); $('[name=phone]').focus(); return; }
      if (!name) { setHint('name', 'Add the student\'s name', 'err'); $('[name=name]').focus(); return; }
      if (!s.fee) { setHint('fee', 'Enter the agreed fee', 'err'); $('[name=fee]').focus(); return; }
      var amount = Math.max(0, Math.min(s.amount, s.fee));
      var who = KM.state.role === 'staff' && KM.state.user ? KM.state.user.id : null;
      var stu = q.addStudent({ name: name, phone: phone, area: area, course: s.course, fee: s.fee, start: start, addedBy: who,
        payments: amount ? [{ date: T, amount: amount, mode: s.mode, note: 'Joining' }] : [] });
      KM.toast(first(name) + ' enrolled in ' + q.course(s.course).name + (amount ? ' · ' + F.inr(amount) + ' received' : ''), { kind: 'success' });
      done(stu);
    }

    function done(stu) {
      var c = q.course(stu.course);
      var paid = q.sum(stu.payments, function (p) { return p.amount; });
      var title = el.querySelector('.ov-title'); if (title) title.textContent = 'Welcome, ' + first(stu.name) + '!';
      var sub = el.querySelector('.ov-sub'); if (sub) sub.textContent = '';
      body.innerHTML = String(h`<div class="ac-done">
        <p class="muted small">${c.name} · starts ${F.date(stu.start, 'dow')}${paid ? h` · ${F.inr(paid)} received by ${stu.payments[0].mode === 'cash' ? 'cash' : 'UPI'}` : ' · no payment yet'}</p>
        <div class="wa-preview">${welcomeText(stu, c)}</div>
        <a class="btn btn-wa btn-block" href="${KM.wa(stu.phone, welcomeText(stu, c))}" target="_blank" rel="noopener">${I('brand-whatsapp')} Send welcome on WhatsApp</a>
        ${KM.state.role === 'owner' ? h`<a class="link" href="#/academy/${stu.id}" data-close-go="/academy/${stu.id}">Open ${first(stu.name)}'s profile ${I('chevron-right', { size: 14 })}</a>` : ''}
      </div>`);
      if (foot) {
        foot.innerHTML = String(h`<button type="button" class="btn btn-secondary" data-enroll-again>Enroll another</button><button type="button" class="btn btn-primary" data-close>Done</button>`);
        foot.querySelector('[data-enroll-again]').addEventListener('click', function () {
          if (title) title.textContent = 'Enroll a student';
          body.innerHTML = String(enrollForm(ctx));
          foot.innerHTML = String(enrollFooter());
          mountEnroll(el, ctx);
          var p = body.querySelector('[name=phone]'); if (p) p.focus();
        });
      }
    }

    if (foot) { var sv = foot.querySelector('[data-enroll-save]'); if (sv) sv.addEventListener('click', save); }
    sync();
  }

  KM.overlay('enroll', {
    title: 'Enroll a student', kind: 'sheet', role: 'any',
    render: enrollForm, footer: enrollFooter, mount: mountEnroll
  });
})();

</script>

(function () {

  function cap(s) { return String(s || '').replace(/(^|[\s.'-])([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); }); }
  function byIdx(a, b) { return a.idx - b.idx; }

  function firstName(n) { return String(n || '').split(' ')[0]; }

  /* =====================================================================================

  var LB = '(?<![\\p{L}\\p{M}\\d])', LA = '(?![\\p{L}\\p{M}\\d])';

  function rx(list) {

  function blank(s) { return new Array(s.length + 1).join(' '); }

  var CANON = [

  var TL_WORDS = ['naalai', 'naalaikku', 'naalaiku', 'nalaiku', 'inniku', 'innaikku', 'indru', 'nethu', 'maasam', 'masam', 'vaadagai', 'vadagai',

    'panninom', 'irukku', 'iruku', 'la', 'ku', 'ayiram', 'aayiram', 'nooru', 'rendu', 'moonu', 'indha', 'intha'];
  var TL_RE = rx(TL_WORDS);
  var TA_NUM = [['ஆயிரத்து ஐநூறு', 1500], ['ஆயிரத்து இருநூறு', 1200], ['ஆயிரம்', 1000], ['எழுநூறு', 700], ['ஐநூறு', 500]];

    sixty: 60, seventy: 70, eighty: 80, ninety: 90, oru: 1, rendu: 2, moonu: 3, naalu: 4, anju: 5, aaru: 6, ezhu: 7, ettu: 8, onbadhu: 9, pathu: 10 };
  var MULT = { hundred: 100, nooru: 100, thousand: 1000, ayiram: 1000, aayiram: 1000, lakh: 100000, lakhs: 100000 };
  var DIGIT = { zero: 0, oh: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9 };

  function wordsToNumbers(s, flag) {
    TA_NUM.forEach(function (t) { s = s.replace(rx(t[0]), function () { flag.words = flag.words || t[0]; return ' ' + t[1] + ' '; }); });
    // spoken phone digits: a run of 5+ single-digit words
    s = s.replace(/(?:\b(?:zero|oh|one|two|three|four|five|six|seven|eight|nine)\b[\s,.…-]*){5,}/g, function (m) {
      return ' ' + m.match(/zero|oh|one|two|three|four|five|six|seven|eight|nine/g).map(function (w) { return DIGIT[w]; }).join('') + ' ';
    });
    var W = Object.keys(UNIT).concat(Object.keys(MULT)).join('|');
    s = s.replace(new RegExp('(?:\\b(?:' + W + '|and)\\b[\\s-]*)+', 'g'), function (m) {
      var words = m.trim().split(/[\s-]+/).filter(function (w) { return w && w !== 'and'; });
      if (!words.some(function (w) { return MULT[w]; })) return m;

      flag.words = flag.words || m.trim();
      return ' ' + (total + cur) + ' ';
    });

    .split(' ').forEach(function (w) { FILLER[w] = 1; });
  var MONS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];

  function parse(raw) {
    var src = String(raw || '').trim();

    var flag = {};
    var p = { raw: src, lang: /[஀-௿]/.test(src) ? 'ta' : (TL_RE.test(lower) ? 'tl' : 'en'), numbers: [], services: [], pay: [] };
    TL_RE.lastIndex = 0;
    var s = lower.replace(/[“”"!]/g, ' ').replace(/[’']/g, "'");
    CANON.forEach(function (c) { s = s.replace(rx(c[1]), ' ' + c[0] + ' '); });
    s = wordsToNumbers(s, flag);

    take(new RegExp('\\b(?:on\\s+)?' + MON_RE + '\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b', 'g'), function (a) { p.date = mkDate(+a[2], a[1]); });
    take(/\b(\d{1,2})\/(\d{1,2})(?:\/\d{2,4})?\b/g, function (a) { p.date = mkDate(+a[1], +a[2] - 1); });
    take(/\bon\s+(?:the\s+)?(\d{1,2})(?:st|nd|rd|th)\b/g, function (a) { p.date = mkDate(+a[1]); if (D.diff(p.date, T) < 0) p.date = D.addMonths(p.date.slice(0, 7), 1) + p.date.slice(7); });

    take(/\b(?:this|current) month\b/g, function () { p.period = 'month'; });
    take(/\blast month\b/g, function () { p.period = 'last-month'; });
    take(/\b(?:this|last) week\b/g, function () { p.period = 'week'; });
    FN_SYN.forEach(function (f) { take(rx(f[1]), function (a, idx) { if (!p.fn || idx < p.fnIdx) { p.fn = f[0]; p.fnIdx = idx; } }); });
    MK_SYN.forEach(function (f) { take(rx(f[1]), function () { p.makeup = p.makeup || f[0]; }); });
    take(/\b(enquiry|inquiry|booking|book|bride|bridal)\b/g, function () { p.bookingWord = true; });
    CAT_SYN.forEach(function (c) { take(rx(c[1]), function (a, idx) { if (!p.cat || idx < p.catIdx) { p.cat = c[0]; p.catIdx = idx; } }); });
    // services: synonym table + any custom service names added in Settings
    var syn = [];
    KM.data.services.forEach(function (sv) { (SVC_SYN[sv.id] || []).concat(sv.name && sv.name.trim().length > 2 ? [sv.name.trim().toLowerCase()] : []).forEach(function (x) { syn.push([x, sv.id]); }); });
    syn.sort(function (a, b) { return b[0].length - a[0].length; });
    syn.forEach(function (x) { take(rx(x[0]), function (a, idx) { p.services.push({ svc: x[1], idx: idx }); }); });
    KM.data.staff.forEach(function (st) {
      var fn = firstName(st.name).toLowerCase();
      take(new RegExp('(?:\\b(?:served\\s+by|done\\s+by|by|with)\\s+)?\\b' + fn + '\\b', 'g'), function (a, idx) {
        if (/^\s*(served|done|by|with)/.test(a[0]) || idx > 2) { p.staff = st.id; return; }
        return false;
      });
    });
    take(/(\d+)\s*(?:in\s+|by\s+|through\s+|via\s+)?(cash|upi)\b/g, function (a, idx) { p.pay.push({ amount: +a[1], mode: a[2], idx: idx }); });
    take(/\b(cash|upi)\s*(\d+)/g, function (a, idx) { p.pay.push({ amount: +a[2], mode: a[1], idx: idx }); });
    var modes = {};
    take(/\b(split|half\s*half|both)\b/g, function () { modes.split = true; });

    else {

    take(/\b(pending|due|later|credit|unpaid|not\s+paid|balance)\b/g, function () { p.status = 'pending'; });
    take(/\b(paid|done|full|received|settled)\b/g, function () { p.status = p.status || 'paid'; });
    var areas = []; KM.data.customers.forEach(function (c) { if (areas.indexOf(c.area) < 0) areas.push(c.area); });
    areas.concat(['Chennai', 'Anna Nagar', 'Kodambakkam', 'Pallavaram', 'Guindy', 'Nungambakkam', 'Saidapet']).forEach(function (ar) {

    var toks = [], m, tre = /[\p{L}\p{M}][\p{L}\p{M}'.-]*/gu;

  function isQuestion(p) {

  function intentOf(n) {

  function lastOfCat(cat) { return KM.data.expenses.filter(function (e) { return e.cat === cat; }).sort(function (a, b) { return b.date.localeCompare(a.date); })[0] || null; }
  function buildExpense(p) {

          </div>

        </div>
        ${row('Payment', h`${modeSeg(d, MODES)}${d.mode === 'split' ? h`<div class="as-split"><label>Cash <span class="as-price"><span aria-hidden="true">₹</span>${inp('cash', d.cash, { num: true, cls: 'as-num', label: 'Cash amount' })}</span></label><label>UPI <span class="as-price"><span aria-hidden="true">₹</span>${inp('upi', d.upi || Math.max(0, total - (d.cash || 0)), { num: true, cls: 'as-num', label: 'UPI amount' })}</span></label></div>` : ''}`, 'mode', d)}

        ${d.rating ? row('Rating', h`<span class="as-stars" aria-label="${d.rating} out of 5">${[1, 2, 3, 4, 5].map(function (i) { return I(i <= d.rating ? 'star-filled' : 'star', { size: 16 }); })}</span>`, null, d) : ''}

    } else if (d.type === 'expense') {
      body = h`
        ${d.dup ? h`<div class="as-dup">${I('alert-triangle')}<span><b>${D.monthName(d.date.slice(0, 7), true).split(' ')[0]} ${d.cat.toLowerCase()} is already recorded</b> — ${F.inr(d.dup.amount)} on ${F.date(d.dup.date)} by ${d.dup.mode === 'upi' ? 'UPI' : 'cash'}. Save only if this is a second payment.</span></div>` : ''}
        ${row('Category', h`<select class="as-input as-select" data-f="cat" aria-label="Category">${KM.data.expenseCats.map(function (c) { return h`<option ${c.name === d.cat ? KM.raw('selected') : ''}>${c.name}</option>`; })}</select>`, 'cat', d)}
        ${row('Amount', h`<span class="as-price as-price-lg"><span aria-hidden="true">₹</span>${inp('amount', d.amount || '', { num: true, cls: 'as-num', label: 'Amount' })}</span>`, 'amount', d)}
        ${row('Paid by', modeSeg(d, MODES.slice(0, 2)), 'mode', d)}
        ${row('Note', inp('note', d.note, { label: 'Note' }), null, d)}
        ${row('Date', h`<span class="as-static">${F.date(d.date, 'long')}${d.date === T ? ' · today' : ''}</span>`, null, d)}`;
      saveLabel = d.dup ? 'Save anyway' : 'Save expense';
      actions = h`<button type="button" class="btn btn-ghost btn-sm" data-open="expense" data-p-cat="${d.cat}">Edit in full form</button>`;
    } else {
      var clash = d.date ? q.bookingsOn(d.date) : [];
      body = h`
        ${row('Bride', inp('name', d.name, { ph: 'Client name', label: 'Client name' }), 'name', d)}

        ${row('Date', h`<input class="as-input" type="date" data-f="date" value="${d.date || ''}" aria-label="Function date">${d.date && q.isMuhurtham(d.date) ? h`<span class="as-tag">Muhurtham day</span>` : ''}`, 'date', d)}
        ${clash.length ? h`<div class="as-dup">${I('calendar-exclamation')}<span><b>${F.plural(clash.length, 'booking')} already that day</b> — ${clash.map(function (b) { return b.client + ' (' + b.title + ')'; }).join(', ')}.</span></div>` : ''}
        ${row('Makeup', h`<select class="as-input as-select" data-f="makeup" aria-label="Makeup package">${KM.data.makeupTypes.map(function (x) { return h`<option value="${x.name}" ${x.name === d.makeup ? KM.raw('selected') : ''}>${x.name} · ${F.inr(x.price)}</option>`; })}</select>`, null, d)}
        ${row('Quote', h`<span class="as-price as-price-lg"><span aria-hidden="true">₹</span>${inp('price', d.price, { num: true, cls: 'as-num', label: 'Quoted price' })}</span>`, 'price', d)}
        ${d.advance ? row('Advance', h`<span class="as-static">${F.inr(d.advance)} · ${d.mode === 'cash' ? 'Cash' : 'UPI'}</span>`, null, d) : ''}`;
      saveLabel = d.advance ? 'Save booking' : 'Save as enquiry';

    return h`<div class="as-card is-draft" data-card="${m.id}">
      ${head}<div class="as-fields">${body}</div>
      ${o.noActions ? '' : h`<div class="as-card-actions"><button type="button" class="btn btn-primary btn-sm" data-as-save>${saveLabel}</button>${actions}</div>`}
    </div>`;
  }

  function billText(v, c) {
    var lines = v.items.map(function (i) { return '• ' + i.name + ' — ' + F.inr(i.price); }).join('\n');

  }
  function savedCard(m, o) {

      return h`<div class="as-card is-saved" data-saved="${m.id}">
        <div class="as-card-head">
          <div class="as-card-titles"><div class="as-card-kind">Walk-in bill saved</div><div class="as-card-sub">${c.name} · ${F.date(v.date, 'dow')}, ${F.time(v.time)}</div></div></div>
        <div class="kv as-receipt">
          ${v.items.map(function (i) { return h`<div class="kv-row"><span>${i.name}</span><span class="num">${F.inr(i.price)}</span></div>`; })}
          <div class="kv-row is-total"><span>Total</span><span class="num">${F.inr(v.total)}</span></div>
          <div class="kv-row"><span>Payment</span><span>${pay}</span></div>
          ${v.staff ? h`<div class="kv-row"><span>Served by</span><span>${q.staffName(v.staff)}</span></div>` : ''}
        </div>
        ${c.phone || !(staff || o.noLink) ? h`<div class="as-card-actions">
          ${c.phone ? h`<a class="btn btn-wa btn-sm" href="${KM.wa(c.phone, billText(v, c))}" target="_blank" rel="noopener">${I('brand-whatsapp')}WhatsApp bill</a>` : ''}
          ${staff || o.noLink ? '' : h`<a class="link as-rec-link" href="#/customers/${c.id}" ${o.inOverlay ? KM.raw('data-close-go="/customers/' + KM.esc(c.id) + '"') : ''}>${firstName(c.name)}’s record</a>`}
        </div>` : ''}</div>`;

      return h`<div class="as-card is-saved">
        <div class="as-card-head">
          <div class="as-card-titles"><div class="as-card-kind">Expense saved</div><div class="as-card-sub">${F.date(e.date, 'dow')} · ${e.mode === 'upi' ? 'UPI' : 'Cash'}</div></div></div>
        <div class="as-exp-line"><span class="li-body"><span class="li-title">${e.cat}</span><span class="li-meta">${e.note}</span></span><span class="num strong">${F.inr(e.amount)}</span></div>
        <a class="as-answer-link" href="#/money?tab=expenses">See expenses ${I('arrow-right', { size: 15 })}</a></div>`;
    }
    var b = q.booking(s.id);
    if (!b) return '';
    var st = q.STATE[b.state];
    // badge only for the exception (an enquiry); a confirmed booking needs no badge
    return h`<div class="as-card is-saved">
      <div class="as-card-head">
        <div class="as-card-titles"><div class="as-card-kind">Booking saved</div><div class="as-card-sub">${b.client} · ${b.title} · ${F.date(b.start, 'long')}</div></div>
        ${b.state === 'enquiry' ? h`<span class="badge badge-${st.badge}">${st.label}</span>` : ''}</div>
      <div class="kv as-receipt"><div class="kv-row"><span>${b.makeup[0].name}</span><span class="num">${F.inr(b.total)}</span></div>
        <div class="kv-row"><span>Advance</span><span>${b.paid ? F.inr(b.paid) : 'Not yet'}</span></div></div>
      <a class="as-answer-link" href="#/bookings/${b.id}">Open booking ${I('arrow-right', { size: 15 })}</a></div>`;
