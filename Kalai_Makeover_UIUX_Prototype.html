  /* ---------- answers to questions (computed from live data at the time of asking) ---------- */
  var PREF = { tamil: 'ta', tanglish: 'tl', english: 'en' };
  // Replies mirror the language you used, unless Settings → 'Reply in the language I use' is off (then: the chosen AI language).
  function say(lang, v) { if (SET.aiMirror === false) lang = PREF[SET.aiLang] || lang; return lang === 'ta' ? (v.ta || v.tl || v.en) : lang === 'tl' ? (v.tl || v.en) : v.en; }
  // The reply text carries the headline; the card holds the detail — never the same number twice.
  function aCard(title, sub, body, link) {
    return h`<div class="as-card as-answer">
      <div class="as-card-head"><div class="as-card-titles"><div class="as-card-kind">${title}</div>${sub ? h`<div class="as-card-sub">${sub}</div>` : ''}</div></div>
      <div class="as-answer-body">${body}</div>
      ${link ? h`<a class="as-answer-link" href="#${link[0]}">${link[1]} ${I('arrow-right', { size: 15 })}</a>` : ''}</div>`;
  }
  function attLine(a) {
    if (a.status === 'present') return { tone: 'success', text: 'In at ' + F.time(a.in) };
    if (a.status === 'late') return { tone: 'warning', text: 'Late · in at ' + F.time(a.in) };
    if (a.status === 'not-in') return { tone: 'neutral', text: 'Not in yet · shift ' + F.time(a.person.shift) };
    var st = q.ATT[a.status] || { label: a.status, badge: 'neutral' };
    return { tone: st.badge, text: st.label };
  }
  function answer(p) {
    var n = ' ' + p.norm + ' ', L = p.lang, intent = intentOf(n);
    var cardHTML, text;
    if (intent === 'bookings') {
      var date = p.date || null;
      var list = date ? q.bookingsOn(date) : q.upcoming(7).filter(function (b) { return b.state !== 'enquiry'; });
      var rows = [];
      list.forEach(function (b) { b.fns.filter(function (f) { return !date || f.date === date; }).forEach(function (f) { rows.push({ b: b, f: f }); }); });
      rows.sort(function (a, b) { return (a.f.date + a.f.call).localeCompare(b.f.date + b.f.call); });
      var label = date ? (p.day === 'tomorrow' ? 'Tomorrow' : p.day === 'today' ? 'Today' : F.rel(date)) + ' · ' + F.date(date, 'long') : 'Next 7 days';
      var firstCall = rows[0] ? F.time(rows[0].f.call) : '';
      text = rows.length
        ? say(L, { en: (date ? (p.day === 'tomorrow' ? 'Tomorrow' : 'That day') + ' you have ' : 'Coming up: ') + F.plural(rows.length, 'function') + ' — first team call at ' + firstCall + '.',
                   tl: (p.day === 'tomorrow' ? 'Naalaikku ' : '') + F.plural(rows.length, 'function') + ' irukku — first call time ' + firstCall + '.',
                   ta: (p.day === 'tomorrow' ? 'நாளைக்கு ' : '') + rows.length + ' functions இருக்கு — முதல் call time ' + firstCall + '.' })
        : say(L, { en: 'Nothing booked ' + (date ? 'for ' + F.date(date, 'long') : 'this week') + ' — a free day for walk-ins.', tl: 'Booking edhuvum illa — walk-ins ku free day.', ta: 'Booking எதுவும் இல்லை — walk-ins-க்கு free day.' });
      if (!rows.length) return { kind: 'reply', text: text };
      // balances on upcoming functions are normal, not late → plain text, not red
      cardHTML = aCard(label, date && q.isMuhurtham(date) ? 'Muhurtham day' : '',
        h`<div class="as-alist">${rows.map(function (r) {
          var b = r.b, f = r.f;
          return h`<a class="as-arow" href="#/bookings/${b.id}">
            <span class="as-when"><b>${F.time(f.time)}</b><span>${date ? 'call ' + F.time(f.call) : F.date(f.date, 'dow')}</span></span>
            <span class="li-body"><span class="li-title">${b.client} · ${f.name}</span>
            <span class="li-meta">${b.venue}${b.team.length ? ' · ' + b.team.map(q.firstName).join(', ') : ''}</span></span>
            <span class="as-trail subtle small">${b.due > 0 ? F.inr(b.due) + ' due' : 'Paid'}</span></a>`;
        })}</div>`,
        ['/bookings?view=calendar', 'Open calendar']);
    } else if (intent === 'dues') {
      var dues = q.dues(), total = q.sum(dues, function (d) { return d.amount; });
      var over = dues.filter(function (d) { return !d.upcoming; });
      var ym = T.slice(0, 7);
      var thisM = q.sum(dues.filter(function (d) { return d.date && d.date.slice(0, 7) === ym; }), function (d) { return d.amount; });
      text = say(L, { en: F.inr(total) + ' is still to collect — ' + F.inr(thisM) + ' of it from ' + D.monthName(ym, true).split(' ')[0] + '. Call these first:',
                      tl: F.inr(total) + ' baaki irukku — idhula ' + F.inr(thisM) + ' indha maasam. Mudhalla ivangala call pannunga:',
                      ta: F.inr(total) + ' பாக்கி இருக்கு — இந்த மாசம் ' + F.inr(thisM) + '. முதல்ல இவங்கள call பண்ணுங்க:' });
      cardHTML = aCard('Overdue', F.plural(over.length, 'person', 'people'),
        h`<div class="as-alist">${over.slice(0, 4).map(function (d) {
          return h`<a class="as-arow" href="#${d.kind === 'booking' ? '/bookings/' + d.ref : d.kind === 'academy' ? '/academy/' + d.ref : '/customers/' + d.ref}">
            <span class="li-body"><span class="li-title">${d.name}</span><span class="li-meta">${d.what} · ${d.age > 0 ? F.plural(d.age, 'day') + ' late' : 'due today'}</span></span>
            <span class="money is-due">${F.inr(d.amount)}</span></a>`;
        })}</div>`, ['/money?tab=dues', 'All dues & WhatsApp reminders']);
    } else if (intent === 'top') {
      var r = q.range(p.period || 'month');
      var top = q.topServices(r).slice(0, 5), max = top.length ? top[0].revenue : 1;
      text = top.length ? say(L, { en: top[0].name + ' leads ' + r.label.toLowerCase() + '.', tl: r.label + ' ' + top[0].name + ' dhaan top.', ta: top[0].name + ' தான் top.' }) : 'No salon bills in that period yet.';
      if (!top.length) return { kind: 'reply', text: text };
      cardHTML = aCard('Top services', r.label + ' · by revenue', h`<ol class="as-rank">${top.map(function (s, i) {
        return h`<li><span class="as-rank-n">${i + 1}</span><span class="as-rank-body"><span class="split"><span class="strong small">${s.name}</span><span class="num small strong">${F.inr(s.revenue)}</span></span>
          <span class="progress is-sm"><span style="width:${Math.max(4, Math.round(s.revenue / max * 100))}%"></span></span><span class="subtle xsmall">${F.plural(s.count, 'client')}</span></span></li>`;
      })}</ol>`, ['/insights', 'Insights & P&L']);
    } else if (intent === 'expense') {
      var re = q.range(p.day === 'today' ? 'today' : p.period || 'month');
      var ex = q.expensesIn(re), tot = q.sum(ex, function (e) { return e.amount; });
      var cats = {}; ex.forEach(function (e) { cats[e.cat] = (cats[e.cat] || 0) + e.amount; });
      var ck = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
      text = say(L, { en: re.label + ' you’ve spent ' + F.inr(tot) + (ck[0] ? ' — most on ' + ck[0] + '.' : '.'), tl: re.label + ' selavu ' + F.inr(tot) + (ck[0] ? ' — adhigam ' + ck[0] + '.' : '.'), ta: 'செலவு ' + F.inr(tot) + (ck[0] ? ' — அதிகம் ' + ck[0] + '.' : '.') });
      if (!ck.length) return { kind: 'reply', text: text };
      cardHTML = aCard('By category', F.plural(ex.length, 'expense'),
        h`<div class="kv">${ck.slice(0, 5).map(function (k) { return h`<div class="kv-row"><span>${k}</span><span class="num">${F.inr(cats[k])}</span></div>`; })}</div>`, ['/money?tab=expenses', 'See all expenses']);
    } else if (intent === 'income') {
      var per = p.day === 'today' ? 'today' : p.day === 'yesterday' ? { from: p.date, to: p.date, label: 'Yesterday' } : p.period || 'month';
      var pl = q.pnl(per), lab = pl.range.label === 'This month' ? F.date(T, 'month').split(' ')[0] + ' so far' : pl.range.label;
      // profit + margin in the sentence; income, expenses and the split by business in the card
      text = say(L, { en: lab + ': ' + F.inr(pl.profit) + ' profit, a ' + pl.margin + '% margin.',
                      tl: lab + ' labam ' + F.inr(pl.profit) + ' (' + pl.margin + '% margin).',
                      ta: lab + ': லாபம் ' + F.inr(pl.profit) + ' (' + pl.margin + '% margin).' });
      cardHTML = aCard('Income & expenses', F.plural(pl.billCount, 'salon bill'), h`<div class="kv as-kv">
          <div class="kv-row"><span>Income</span><span class="num">${F.inr(pl.income)}</span></div>
          <div class="kv-row"><span>Expenses</span><span class="num">${F.inr(pl.expense)}</span></div></div>
        ${pl.income ? KM.chart.splitbar(q.STREAMS.map(function (s) { return { label: s.label, value: pl.byStream[s.key], slot: s.slot }; }), { pct: true }) : ''}`, ['/insights', 'Insights & P&L']);
    } else if (intent === 'team') {
      var aDate = p.date && p.day !== 'tomorrow' ? p.date : T;
      var att = q.attendanceOn(aDate);
      var inN = att.filter(function (a) { return a.in; }).length;
      text = say(L, { en: inN + ' of ' + att.length + ' are in today.', tl: att.length + ' perla ' + inN + ' per vandhaachu.', ta: att.length + ' பேர்ல ' + inN + ' பேர் வந்தாச்சு.' });
      cardHTML = aCard('Team', aDate === T ? '' : F.date(aDate, 'long'), h`<div class="as-alist">${att.map(function (a) {
        var l = attLine(a);
        return h`<a class="as-arow" href="#/team/${a.person.id}">${KM.avatar(a.person.name, 'avatar-sm')}
          <span class="li-body"><span class="li-title">${a.person.name}</span></span>
          <span class="status is-${l.tone}">${l.text}</span></a>`;
      })}</div>`, ['/team?tab=attendance', 'Attendance']);
    } else {
      return { kind: 'reply', text: say(L, { en: 'I can answer these right now — tap one:', tl: 'Idhellam kekkalaam — onna tap pannunga:', ta: 'இதெல்லாம் கேட்கலாம் — ஒன்றை tap பண்ணுங்க:' }), chips: ASK };
    }
    return { kind: 'reply', text: text, html: String(cardHTML) };
  }

  /* =====================================================================================
     Conversation state + rendering
     ===================================================================================== */
  // one example per kind of entry + two questions — shown once, in the welcome (and again only when I don't understand)
  var EXAMPLES = ['Swetha hair spa 700 cash, Meena', 'Rent 12000 GPay', 'Aishu muhurtham 19 Nov airbrush 18000', 'நாளைக்கு என்ன bookings?', 'How much is pending this month?'];
  var ASK = ['How much is pending this month?', 'நாளைக்கு என்ன bookings?', 'Indha maasam profit evlo?', 'Top services this month', 'Who’s in today?'];
  var chat = { msgs: null, seeded: false };
  function reset() { chat.msgs = [{ id: uid(), from: 'ai', kind: 'welcome' }]; }

  function makeDraftMsg(text) {
    var p = parse(text), d = buildEntry(p);
    if (!d) return null;
    var m = { id: uid(), from: 'ai', kind: 'reply', d: d, state: 'draft', lang: p.lang };
    m.text = intro(d, p.lang);
    CARDS[m.id] = m;
    return m;
  }
  function intro(d, L) {
    var n = uCount(d);
    if (d.type === 'visit') {
      var who = firstName(d.name) || 'her';
      return n ? say(L, { en: 'Here’s the bill for ' + who + '. Check the highlighted ' + (n > 1 ? 'bits' : 'bit') + ', then save.', tl: who + ' bill ready — highlight pannadha check pannitu save pannunga.', ta: who + ' பில் ரெடி — highlight செய்ததை சரி பார்த்து save பண்ணுங்க.' })
        : say(L, { en: 'Got it — a walk-in bill for ' + who + '. Looks right?', tl: who + ' ku bill ready. Save pannalaama?', ta: who + '-க்கு பில் ரெடி. Save பண்ணலாமா?' });
    }

      : say(L, { en: 'An expense for ' + d.cat + ' — confirm and save.', tl: d.cat + ' selavu — confirm pannunga.', ta: d.cat + ' செலவு — confirm பண்ணுங்க.' });
    return say(L, { en: 'Sounds like a new ' + d.fn.toLowerCase() + ' enquiry. I’ll save it to Bookings once you confirm.', tl: 'Pudhu ' + d.fn + ' enquiry — confirm panna Bookings la save aagum.', ta: 'புது ' + d.fn + ' enquiry — confirm பண்ணா Bookings-ல save ஆகும்.' });

  function respond(text) {
    var p = parse(text);
    if (p.isQ) { var a = answer(p); return Object.assign({ id: uid(), from: 'ai' }, a); }
    var m = makeDraftMsg(text);
    if (m) { m.src = text; return m; }
    return { id: uid(), from: 'ai', kind: 'reply', text: say(p.lang, { en: 'I couldn’t tell what to record from that. Say the customer, service and amount — or ask me a question:', tl: 'Puriyala 🙏 Customer, service, amount sollunga — illa oru question kelunga:', ta: 'புரியல 🙏 Customer, service, amount சொல்லுங்க:' }), chips: EXAMPLES.slice(0, 3).concat(ASK.slice(3)) };
  }

  function seedDemo() {

    var M = chat.msgs;
    var kv = find(KM.data.visits, function (v) { return v.cust === 'kavya' && v.date === T; });
    M.push({ id: uid(), from: 'me', text: 'Kavya threading facial 850 — 350 cash, 500 gpay, Meena', time: '10:06', voice: true });
    // like a live save: the card says "Walk-in bill saved" and carries the WhatsApp bill button — no extra sentence

    M.push(Object.assign(respond('Priya facial 1200 paid gpay'), { time: '11:44', src: 'Priya facial 1200 paid gpay' }));

  function chipsHTML(list, cls) {
    return h`<div class="chips ${cls || ''}">${list.map(function (t) { return h`<button type="button" class="chip as-say" data-as-say="${t}">${t}</button>`; })}</div>`;
  }
  function msgHTML(m) {

      return h`<div class="as-msg is-me" data-mid="${m.id}"><div class="as-stack">

    if (m.kind === 'typing') inner = h`<div class="as-bubble as-typing" role="status" aria-label="Assistant is thinking"><i></i><i></i><i></i></div>`;

      inner = h`<div class="as-bubble as-welcome">
        <div class="as-hello">Vanakkam Kalai</div>

  function composerHTML() {
    return h`<form class="as-composer" data-as-form autocomplete="off">
      <div class="as-input-row">
        <button type="button" class="as-mic" data-open="voice" aria-label="Speak an entry">${I('microphone')}</button>
        <label class="sr-only" for="as-text">Type an entry or a question</label>
        <textarea id="as-text" class="as-text-in" rows="1" placeholder="Type an entry or ask…" data-ph-wide="Type an entry or ask… e.g. Priya facial 1200 gpay" enterkeyhint="send"></textarea>

  /* ---------- live DOM updates ---------- */
  var root = null, ac = null;
  function log() { return root && root.querySelector('.as-log'); }
  function scrollBottom(smooth) { window.scrollTo({ top: document.documentElement.scrollHeight, behavior: smooth ? 'smooth' : 'auto' }); }
  function appendMsg(m) {
    chat.msgs.push(m);
    var l = log(); if (!l) return;
    l.insertAdjacentHTML('beforeend', String(msgHTML(m)));
    if (KM.chart && KM.chart.hydrate) KM.chart.hydrate(l.lastElementChild);
    scrollBottom(true);
  }
  function replaceMsg(old, m) {
    var i = chat.msgs.indexOf(old); if (i >= 0) chat.msgs[i] = m; else chat.msgs.push(m);
    var el = root && root.querySelector('[data-mid="' + old.id + '"]');
    if (el) { el.outerHTML = String(msgHTML(m)); scrollBottom(true); }
  }
  function rerenderCard(container, m) {
    var el = container.querySelector('[data-card="' + m.id + '"], [data-saved="' + m.id + '"]');
    if (!el) return;
    var holder = el.closest('[data-mid]');
    if (holder && chat.msgs.indexOf(m) >= 0 && container === root) { holder.outerHTML = String(msgHTML(m)); return; }
    el.outerHTML = String(m.state === 'saved' ? savedCard(m, container !== root ? { inOverlay: true } : null) : draftCard(m, container !== root ? { noActions: true } : null));
  }
  function send(text, opts) {
    text = String(text || '').trim(); if (!text) return;
    appendMsg({ id: uid(), from: 'me', text: text, time: nowHM(), voice: opts && opts.voice });
    var typing = { id: uid(), from: 'ai', kind: 'typing' };
    appendMsg(typing);
    setTimeout(function () { var r = respond(text); r.time = nowHM(); replaceMsg(typing, r); }, 600);
  }

  /* ---------- save a draft card (chat or voice) ---------- */
  function saveDraft(m) {
    var d = m.d;
    if (d.type === 'visit') {
      if (!d.items.length || d.items.some(function (i) { return !i.svc; })) { KM.toast('Pick the service first', { kind: 'warn' }); return false; }
      if (!String(d.name || '').trim()) { KM.toast('Add the customer’s name', { kind: 'warn' }); return false; }
      var ph = String(d.phone || '').replace(/\D/g, '');
      if (ph && ph.length !== 10) { KM.toast('Phone number needs 10 digits', { kind: 'warn' }); return false; }
      var total = totalOf(d), cash = 0, upi = 0;
      if (d.mode === 'cash') cash = total; else if (d.mode === 'upi') upi = total;
      else if (d.mode === 'split') { cash = Math.min(total, +d.cash || 0); upi = Math.min(total - cash, d.upi != null && d.upi !== '' ? +d.upi : total - cash); }
      var keep = d.cust && custOf(d.cust) && firstName(custOf(d.cust).name).toLowerCase() === firstName(d.name).toLowerCase();
      var r = q.addVisit({ customerId: keep ? d.cust : null, name: cap(String(d.name).trim()), phone: ph, area: d.area,
        items: d.items.map(function (i) { return { svc: i.svc, name: i.name, price: +i.price || 0 }; }),
        cash: cash, upi: upi, staff: d.staff || null, date: d.date, time: nowHM() });
      if (d.rating) { var c = custOf(r.customer.id); if (c) c.rating = d.rating; }
      m.saved = { type: 'visit', visit: r.visit.id, cust: r.customer.id };
      KM.toast('Bill saved · ' + F.inr(total) + ' from ' + firstName(r.customer.name), { kind: 'success' });
    } else if (d.type === 'expense') {
      if (!(+d.amount > 0)) { KM.toast('Add the amount', { kind: 'warn' }); return false; }
      var e = q.addExpense({ date: d.date, cat: d.cat, amount: +d.amount, mode: d.mode === 'upi' ? 'upi' : 'cash', note: d.note || d.cat, addedBy: null, time: nowHM() });
      m.saved = { type: 'expense', id: e.id };
      KM.toast('Expense saved · ' + d.cat + ' ' + F.inr(+d.amount), { kind: 'success' });
    } else {
      if (!String(d.name || '').trim()) { KM.toast('Add the client’s name', { kind: 'warn' }); return false; }
      if (!d.date) { KM.toast('Pick the function date', { kind: 'warn' }); return false; }
      var b = q.addBooking({ client: cap(d.name), phone: String(d.phone || '').replace(/\D/g, ''), area: d.area || '', venue: 'Venue to confirm',
        functions: [{ name: d.fn, date: d.date, time: d.fn === 'Reception' ? '18:30' : '07:00', call: d.fn === 'Reception' ? '15:30' : '04:30' }],
        makeup: [{ name: d.makeup, fn: d.fn, price: +d.price || 0 }], addons: [], travel: 0,
        payments: d.advance ? [{ date: T, amount: d.advance, mode: d.mode, note: 'Advance' }] : [], wages: [],
        status: d.advance ? 'confirmed' : 'enquiry', notes: 'Added from the AI assistant: “' + (m.src || '') + '”' });
      m.saved = { type: 'booking', id: b.id };
      KM.toast((d.advance ? 'Booking saved · ' : 'Enquiry saved · ') + cap(firstName(d.name)) + ', ' + d.fn + ' ' + F.date(d.date), { kind: 'success' });
    }
    m.state = 'saved';
    m.text = '';   // the card itself says "… saved"
    return true;
  }

  /* ---------- delegated handlers for draft cards inside a container ---------- */
  function cardFrom(t) { var el = t.closest('[data-card]'); return el ? CARDS[el.getAttribute('data-card')] : null; }
  function bindCards(container, signal, onSaved) {
    container.addEventListener('click', function (e) {
      var t = e.target;
      var m = cardFrom(t);
      if (!m || m.state !== 'draft') return;
      var d = m.d, b;
      if ((b = t.closest('[data-as-mode]'))) { d.mode = b.getAttribute('data-as-mode'); delete d.unsure.mode; if (d.mode === 'split' && !d.cash) { var tt = totalOf(d); d.cash = Math.round(tt / 2 / 50) * 50; d.upi = tt - d.cash; } rerenderCard(container, m); return; }
      if ((b = t.closest('[data-as-rm]'))) { var i = +b.getAttribute('data-as-rm'); d.items.splice(i, 1); Object.keys(d.unsure).forEach(function (k) { if (/^price/.test(k)) delete d.unsure[k]; }); rerenderCard(container, m); return; }
      if ((b = t.closest('[data-as-ok]'))) { delete d.unsure[b.getAttribute('data-as-ok')]; rerenderCard(container, m); return; }
      if ((b = t.closest('[data-as-alt]'))) {
        var k = b.getAttribute('data-as-alt'), u = d.unsure[k] || {};
        if (/^price\d/.test(k)) { if (u.alt === 'Use list prices') d.items.forEach(function (it) { if (it.list) it.price = it.list; }); else { var it2 = d.items[+k.slice(5)]; if (it2 && it2.list) it2.price = it2.list; } }
        else if (k === 'mode') d.mode = d.mode === 'upi' ? 'cash' : 'upi';
        else if (k === 'name') { d.cust = null; d.name = d.spoken || d.name.split(' ')[0]; }
        else if (k === 'amount' && u.altVal) d.amount = u.altVal;
        delete d.unsure[k]; rerenderCard(container, m); return;
      }
      if (t.closest('[data-as-save]')) { if (saveDraft(m)) { rerenderCard(container, m); if (onSaved) onSaved(m); } }
    }, { signal: signal });
    container.addEventListener('input', function (e) {
      var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
      var m = f && cardFrom(t); if (!m || m.state !== 'draft') return;
      var d = m.d, row = t.closest('.as-item') || t.closest('.as-row');
      if (f === 'price' && d.type === 'visit') { var it = d.items[+t.getAttribute('data-i')]; if (it) it.price = +t.value.replace(/\D/g, '') || 0; delete d.unsure['price' + t.getAttribute('data-i')]; }
      else if (f === 'price' || f === 'amount' || f === 'cash' || f === 'upi') { d[f] = +t.value.replace(/\D/g, '') || 0; delete d.unsure[f]; }
      else if (f === 'name' || f === 'phone' || f === 'area' || f === 'note') { d[f] = t.value; if (f === 'name') delete d.unsure.name; }
      else return;
      if (row && row.classList.contains('is-unsure')) { row.classList.remove('is-unsure'); var c = row.nextElementSibling && row.nextElementSibling.classList.contains('as-check') ? row.nextElementSibling : row.querySelector(':scope > .as-check'); if (c) c.remove(); }
      var tot = t.closest('[data-card]').querySelector('[data-total]'); if (tot && d.items) tot.textContent = F.inr(totalOf(d));
      if (d.type === 'visit' && d.mode === 'split' && f === 'cash') { d.upi = Math.max(0, totalOf(d) - d.cash); var u = t.closest('[data-card]').querySelector('[data-f="upi"]'); if (u) u.value = d.upi; }
    }, { signal: signal });
    container.addEventListener('change', function (e) {
      var t = e.target, f = t.getAttribute && t.getAttribute('data-f');
      var m = f && cardFrom(t); if (!m || m.state !== 'draft') return;
      var d = m.d;
      if (f === 'add' && t.value) { var sv = svcOf(t.value); d.items.push({ svc: sv.id, name: sv.name, price: sv.price, list: sv.price }); delete d.unsure.svc; rerenderCard(container, m); }
      else if (f === 'svc' && t.value) { var s2 = svcOf(t.value), it = d.items[+t.getAttribute('data-i')]; it.svc = s2.id; it.name = s2.name; it.list = s2.price; delete d.unsure.svc; rerenderCard(container, m); }
      else if (f === 'staff') d.staff = t.value || null;
      else if (f === 'cat') { d.cat = t.value; d.dup = null; delete d.unsure.cat; rerenderCard(container, m); }
      else if (f === 'fn' || f === 'makeup') { d[f] = t.value; if (f === 'makeup') { var pk = find(KM.data.makeupTypes, function (x) { return x.name === t.value; }); if (pk && d.unsure.price) d.price = pk.price; } rerenderCard(container, m); }
      else if (f === 'date') { d.date = t.value || null; delete d.unsure.date; rerenderCard(container, m); }
    }, { signal: signal });
  }

  /* =====================================================================================
     Screen: #/assistant
     ===================================================================================== */
  KM.screen('assistant', {
    title: 'AI assistant', icon: 'sparkles', role: 'owner',
    // No top-bar create button here: the composer (type, or tap the mic to speak) IS this page's action.
    // A "+ Speak an entry" in the top bar would repeat the mic; "Speak an entry" stays in the + / FAB menu.
    primary: function () { return null; },
    render: function (ctx) {
      if (ctx.query.demo && !chat.seeded) seedDemo();
      if (!chat.msgs) reset();
      return h`
        <header class="page-head as-head">
          <div class="page-head-text"><h1 class="page-title">AI assistant</h1></div>
          <div class="page-actions as-head-actions">
            <button type="button" class="btn btn-ghost btn-sm" data-as-clear ${chat.msgs.length < 2 ? KM.raw('hidden') : ''}>Clear chat</button>
          </div>
        </header>
        <section class="as-chat" aria-label="Conversation with Kalai AI">
          <div class="as-log" role="log" aria-live="polite" aria-relevant="additions">${chat.msgs.map(msgHTML)}</div>
          ${composerHTML()}
        </section>`;
    },
    mount: function (el, ctx) {
      if (ac) ac.abort();
      ac = new AbortController();
      root = el;
      var sig = ac.signal;
      var ta = el.querySelector('#as-text');
      var form = el.querySelector('[data-as-form]');
      function grow() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 132) + 'px'; }
      function started() { var c = el.querySelector('[data-as-clear]'); if (c) c.hidden = false; }
      if (window.matchMedia('(min-width: 760px)').matches) ta.placeholder = ta.getAttribute('data-ph-wide');
      ta.addEventListener('input', grow, { signal: sig });
      ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } }, { signal: sig });
      form.addEventListener('submit', function (e) { e.preventDefault(); var v = ta.value; if (!v.trim()) { ta.focus(); return; } ta.value = ''; grow(); send(v); started(); }, { signal: sig });
      el.addEventListener('click', function (e) {
        var b = e.target.closest('[data-as-say]');
        if (b) { send(b.getAttribute('data-as-say')); started(); return; }
        if (e.target.closest('[data-as-clear]')) {
          KM.confirm({ title: 'Clear this conversation?', body: 'Saved bills and expenses stay saved — only the chat is cleared.', confirmLabel: 'Clear chat' }).then(function (ok) {
            if (!ok) return; reset(); KM.refresh(); KM.toast('Chat cleared', { kind: 'info' });
          });
        }
      }, { signal: sig });
      bindCards(el, sig);
      if (chat.msgs.length > 1) setTimeout(function () { scrollBottom(false); }, 30);
    },
    unmount: function () { if (ac) ac.abort(); ac = null; root = null; }
  });

  /* =====================================================================================
     Overlay: voice — listening → processing → result (→ saved). Tap the orb to advance.
     ===================================================================================== */
  var VOICE = {
    tamil: { label: 'Tamil', live: 'பிரியா, ஒன்பது எட்டு நாலு பூஜ்ஜியம்… ஃபேஷியல் ஆயிரத்து இருநூறு, ஜிபே', heard: 'பிரியா, 98400 12345 — ஃபேஷியல் ஆயிரத்து இருநூறு, ஜிபே',
      eg: 'சுவேதா ஹேர் ஸ்பா 700 காசு, மீனா' },
    tanglish: { label: 'Tanglish', live: 'Priya, nine eight four zero… facial twelve hundred, GPay', heard: 'Priya, 98400 12345 — facial twelve hundred, GPay',
      eg: 'Swetha hair spa 700 kaasu, Meena pannanga' },
    english: { label: 'English', live: 'Priya, nine eight four zero… one facial, twelve hundred, paid by GPay', heard: 'Priya, 98400 12345 — one facial, twelve hundred, paid by GPay',
      eg: 'Swetha, hair spa, 700 in cash, done by Meena' }
  };
  var LANG_KEY = { tamil: 'tamil', tanglish: 'tanglish', english: 'english' };
  var vs = { state: 'listening', lang: null, m: null, sec: 4, timers: [], el: null };
  function vClear() { vs.timers.forEach(function (t) { clearInterval(t); clearTimeout(t); }); vs.timers = []; }
  function vLang() { return vs.lang || LANG_KEY[SET.aiLang] || 'tanglish'; }
  function vDraft() {
    if (!vs.m || vs.m.state === 'saved' && vs.state !== 'saved') {
      var m = makeDraftMsg(VOICE[vLang()].heard.replace(/[—,]/g, ' '));
      m.src = VOICE[vLang()].heard; m.voice = true;
      vs.m = m;
    }
    return vs.m;
  }
  function vTime() { return '0:' + String(vs.sec).padStart(2, '0'); }
  /* One centred column. Listening/processing: the orb is the stage — one "listening" signal (the orb + a timer line),
     the live words once (no waveform, no chips repeating the same words), one example line.
     Result/saved: what I heard + the card — no orb or "got it" line (the card's own badge and the footer's Save / Retry already say that). */
  function voiceBody() {
    var st = vs.state, L = vLang(), V = VOICE[L], staff = isStaff();
    var words = (st === 'listening' ? V.live : V.heard).split(' ');
    var transcript = h`<blockquote class="vc-transcript ${st === 'listening' ? 'is-live' : ''} ${L === 'tamil' ? 'ta' : ''}" lang="${L === 'tamil' ? 'ta' : 'en'}">
        ${st !== 'listening' ? h`<span class="vc-heard">Heard · ${V.label}</span>` : ''}${words.map(function (wd, i) { return h`<span class="vc-w" style="--i:${i}">${wd} </span>`; })}${st === 'listening' ? h`<span class="vc-caret" aria-hidden="true"></span>` : ''}
      </blockquote>`;
    if (st === 'result' || st === 'saved') {
      var m = vDraft();
      return h`<div class="vc vc-${st}">${transcript}
        ${m.state === 'saved' ? savedCard(m, { inOverlay: true }) : draftCard(m, { noActions: true })}
        ${m.state === 'saved' ? '' : h`<button type="button" class="link vc-full" data-open="walkin" data-p-customer="${m.d.cust || ''}">Edit in the full walk-in form</button>`}</div>`;
    }
    return h`<div class="vc vc-${st}">
      ${st === 'listening' ? h`<div class="seg vc-lang" role="radiogroup" aria-label="Language you are speaking">${['tamil', 'tanglish', 'english'].map(function (k) {
        return h`<button type="button" class="seg-item ${k === L ? 'is-active' : ''}" role="radio" aria-checked="${k === L ? 'true' : 'false'}" data-vc-lang="${k}">${VOICE[k].label}</button>`;
      })}</div>` : ''}
      <div class="vc-orb-wrap">
        <button type="button" class="vc-orb is-${st}" data-vc-orb autofocus aria-label="${st === 'listening' ? 'Stop and review' : 'Show the result'}">
          <span class="vc-ring"></span><span class="vc-ring"></span><span class="vc-ring"></span>
          <span class="vc-core">${I(st === 'listening' ? 'microphone' : 'sparkles')}</span>
        </button>
      </div>
      <div class="vc-status" role="status">${st === 'listening' ? h`<span class="vc-rec"></span>Listening · <span class="num" data-vc-time>${vTime()}</span>` : 'Understanding…'}</div>
      ${transcript}
      ${st === 'listening' ? h`<p class="vc-tip">${staff ? 'Walk-in bills only. ' : ''}Say it in any order, e.g.<span class="${L === 'tamil' ? 'ta' : ''}">“${V.eg}”</span></p>` : ''}
    </div>`;
  }
  function voiceFoot() {
    var st = vs.state;
    if (st === 'listening') return h`<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" data-vc-next>${I('player-stop-filled')} Stop & review</button>`;
    // the spinning orb already says "working" — no disabled look-alike primary button
    if (st === 'processing') return h`<button class="btn btn-secondary" data-close>Cancel</button>`;
    if (st === 'saved') return h`<button class="btn btn-secondary" data-vc-retry>${I('microphone')} Speak another</button><button class="btn btn-primary" data-close>Done</button>`;
    return h`<button class="btn btn-secondary" data-vc-retry>${I('refresh')} Retry</button><button class="btn btn-primary" data-vc-save>${I('check')} Save bill</button>`;
  }
  function vPaint() {
    var el = vs.el; if (!el) return;
    el.querySelector('.ov-body').innerHTML = String(voiceBody());
    var f = el.querySelector('.ov-foot'); if (f) f.innerHTML = String(voiceFoot());
    vTimers();
  }
  function vTimers() {
    vClear();
    if (vs.state === 'listening') vs.timers.push(setInterval(function () { vs.sec++; var t = vs.el && vs.el.querySelector('[data-vc-time]'); if (t) t.textContent = vTime(); if (vs.sec >= 30) vGo('processing', true); }, 1000));
  }
  function vGo(st, auto) {
    vs.state = st;
    if (st === 'listening') { vs.sec = 0; vs.m = null; }
    vPaint();
    if (st === 'processing' && auto) vs.timers.push(setTimeout(function () { vGo('result'); }, 1500));
  }

  KM.overlay('voice', {
    title: 'Speak an entry', kind: 'full', role: 'any',
    render: function (ctx) {
      var st = ctx.params.state;
      vs.state = st === 'processing' || st === 'result' ? st : 'listening';
      vs.sec = 4; vs.m = null;
      return voiceBody();
    },
    footer: function () { return voiceFoot(); },
    mount: function (el) {
      vs.el = el;
      vTimers();
      var ctl = new AbortController();
      el._vcAbort = ctl;
      el.addEventListener('click', function (e) {
        var t = e.target, b;
        if ((b = t.closest('[data-vc-lang]'))) { vs.lang = b.getAttribute('data-vc-lang'); if (vs.state === 'result' && vs.m && vs.m.state === 'draft') vs.m.src = VOICE[vLang()].heard; vPaint(); return; }
        if (t.closest('[data-vc-orb]')) { vGo(vs.state === 'listening' ? 'processing' : vs.state === 'processing' ? 'result' : 'listening', vs.state === 'listening'); return; }
        if (t.closest('[data-vc-next]')) { vGo('processing', true); return; }
        if (t.closest('[data-vc-retry]')) { vGo('listening'); return; }
        if (t.closest('[data-vc-save]')) {
          var m = vDraft();
          if (saveDraft(m)) {
            if (!isStaff()) {
              var me = { id: uid(), from: 'me', text: m.src || VOICE[vLang()].heard, time: nowHM(), voice: true };
              var ai = { id: m.id, from: 'ai', kind: 'reply', text: '', state: 'saved', saved: m.saved, d: m.d, time: nowHM() };
              if (!chat.msgs) reset();
              if (root && document.contains(root) && KM.parse().id === 'assistant') { appendMsg(me); appendMsg(ai); var c = root.querySelector('[data-as-clear]'); if (c) c.hidden = false; } else { chat.msgs.push(me, ai); }
            }
            vs.state = 'saved'; vPaint();
          }
        }
      }, { signal: ctl.signal });
      bindCards(el, ctl.signal);
    },
    unmount: function (el) { vClear(); if (el && el._vcAbort) el._vcAbort.abort(); vs.el = null; vs.lang = null; }
  });
})();

</script>
<script data-screen="bookings">
/* ===== screens/bookings.js ===== */
/* Bookings — bridal & events. Each fact is shown once per view; creating a booking lives in the shell (def.primary).
   #/bookings                list: 3 KPIs in one panel, a status `.seg` with counts, plain rows grouped by month
   #/bookings?view=calendar  month grid (Muhurtham dots) + the selected day
   #/bookings/<id>           detail: one record action + ONE WhatsApp button in the head, then functions & package,
                             payments, team & wages, jewels, details & notes, review (cards with nothing to say are left out)
   overlay booking-new       4-step wizard (client → functions & dates → makeup & add-ons → payment & review)
   overlay booking-message   the one WhatsApp sheet: confirmation / reminder / quote / review / own words, editable */
(function () {
  'use strict';
  var KM = window.KM, h = KM.h, I = KM.icon, F = KM.fmt, q = KM.q, D = KM.date;

  /* =====================================================================================
     Shared helpers
     ===================================================================================== */
  function today() { return KM.state.today; }
  function digits(s) { return String(s || '').replace(/\D/g, '').slice(-10); }
  function first(name) { return String(name || '').trim().split(/\s+/)[0] || ''; }
  function uniq(arr) { return arr.filter(function (x, i) { return arr.indexOf(x) === i; }); }
  function isUpcoming(b) { return b.state !== 'cancelled' && D.diff(b.end, today()) >= 0; }
  function attr(on, s) { return on ? KM.raw(s) : ''; }
  function isDay(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }

  var FN_TIMES = { 'Muhurtham': ['06:00', '03:30'], 'Reception': ['18:30', '15:30'], 'Engagement': ['10:00', '07:30'], 'Baby Shower': ['10:30', '08:30'],
    'Puberty Function': ['09:00', '06:30'], 'Party Makeup': ['18:00', '16:00'], 'Saree Draping': ['08:00', '07:00'] };
  var WAGE = { meena: 1500, lavanya: 1200, divya: 600, saranya: 500 };

  function toMin(t) { var m = /(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; }
  function fromMin(n) { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); }

  /** Days a balance-due booking is late (0 = finished today, not yet paid). */
  function lateBy(b) { return b.state === 'balance-due' ? Math.max(0, D.diff(today(), b.end)) : 0; }

  /** At most ONE badge, and only for exceptions. Confirmed / completed / paid get none.
      The detail page skips "Today": its function rows already say which function is today. */
  function flag(b, inDetail) {
    var m = b.state === 'today' ? (inDetail ? null : ['accent', 'Today'])
      : b.state === 'enquiry' ? ['info', 'Enquiry']
      : b.state === 'awaiting-advance' ? ['warning', 'No advance']
      : b.state === 'balance-due' ? ['danger', lateBy(b) > 0 ? 'Overdue' : 'Unpaid']
      : null;
    return m ? h`<span class="badge badge-${m[0]}">${m[1]}</span>` : '';
  }

  /** Relative time as plain meta text (never a badge): Tomorrow / In 3 days / In 2 weeks / 23 days late. */
  function when(b) {
    if (b.state === 'balance-due') { var n0 = lateBy(b); return n0 > 0 ? F.plural(n0, 'day') + ' late' : 'Due today'; }
    var n = b.daysTo;
    if (b.isPast || b.state === 'completed' || b.state === 'cancelled' || b.state === 'today' || n <= 0) return '';
    if (n === 1) return 'Tomorrow';
    if (n <= 13) return 'In ' + n + ' days';
    if (n <= 59) return 'In ' + Math.round(n / 7) + ' weeks';
    return 'In ' + Math.round(n / 30) + ' months';
  }

  /** Date lead: weekday over day number (+ month when there is no month heading above). */
  function dateLead(d, withMonth) {
    return h`<span class="bk-date" aria-hidden="true"><span>${F.date(d, 'day')}</span><b>${+String(d).slice(8, 10)}</b>${withMonth ? h`<span>${F.date(d, 'mon')}</span>` : ''}</span>`;
  }

  function eventsByDate() {
    var map = {};
    q.bookings().forEach(function (b) {
      if (b.state === 'cancelled') return;
      b.fns.forEach(function (f) { (map[f.date] = map[f.date] || []).push({ b: b, f: f }); });
    });
    Object.keys(map).forEach(function (k) { map[k].sort(function (x, y) { return x.f.time.localeCompare(y.f.time); }); });
    return map;
  }

  /* ---------- WhatsApp messages (studio templates) ---------- */
  function fnDates(b) { return uniq(b.fns.map(function (f) { return F.date(f.date, 'dow'); })).join(' & '); }
  function msgFor(b, kind) {
    var t = KM.data.settings.templates, name = first(b.client);
    if (kind === 'reminder') return t.reminder.replace('{name}', name).replace('{amount}', F.inr(b.due)).replace('{what}', b.title + ' makeup');
    if (kind === 'quote') {
      var adv = Math.max(1000, Math.round(b.total * 0.25 / 500) * 500);
      return 'Vanakkam ' + name + '! 🙏 Thank you for considering Kalai Makeover. Your quote for ' + b.title + ' makeup on ' + fnDates(b) + ' is ' + F.inr(b.total) +
        ' (incl. add-ons & travel). An advance of ' + F.inr(adv) + ' blocks the date for you ✨';
    }
    if (kind === 'review') return 'Vanakkam ' + name + '! 💛 It was a joy getting you ready for your ' + b.title + '. Could you share a quick review of Kalai Makeover? It means a lot to our team 🙏';
    if (kind === 'note') return 'Vanakkam ' + name + '! ';
    return t.booking.replace('{name}', name).replace('{what}', b.title).replace('{date}', fnDates(b)).replace('{paid}', F.inr(b.paid))
      .replace('{due}', F.inr(Math.max(0, b.due))).replace('{venue}', b.venue === 'Venue to confirm' ? 'the venue' : b.venue).replace('{call}', F.time(b.fns[0].call));
  }
  /** The messages that make sense for this booking, most relevant first; "note" (own words) is always last. */
  var MSG_LABEL = { confirm: 'Confirmation', reminder: 'Reminder', quote: 'Quote', review: 'Review', note: 'Own message' };
  var MSG_BUTTON = { confirm: 'Send confirmation', reminder: 'Send reminder', quote: 'Send quote', review: 'Ask for review', note: 'WhatsApp' };
  function msgKinds(b) {
    var past = b.isPast || b.status === 'completed' || b.state === 'balance-due';
    var k = [];
    if (b.state === 'balance-due') k.push('reminder');
    if (b.state === 'enquiry') k.push('quote');
    else if (!past) k.push('confirm');
    if (b.due > 0 && b.state !== 'enquiry' && k.indexOf('reminder') < 0) k.push('reminder');
    if (past && !b.rating) k.push('review');
    k.push('note');
    return k;
  }

  /* =====================================================================================
     List view
     ===================================================================================== */
  // 'week' is reached from the "Next 7 days" KPI and only shows in the filter while it is the active one;
  // statuses with a zero count are dropped (except the default one).
  var FILTERS = [
    { key: 'upcoming', label: 'Upcoming' },
    { key: 'week', label: 'Next 7 days', onlyActive: true },
    { key: 'enquiry', label: 'Enquiries' },
    { key: 'advance', label: 'No advance' },
    { key: 'due', label: 'Overdue' },
    { key: 'done', label: 'Completed' }
  ];
  var EMPTY = {
    upcoming: ['No upcoming bookings', true],
    week: ['Nothing booked in the next 7 days'],
    advance: ['Every booking has its advance'],
    enquiry: ['No open enquiries', true],
    due: ['No overdue balances'],
    done: ['Nothing completed yet']
  };
  var searchText = '';

  function filterOf(ctx) { return FILTERS.some(function (f) { return f.key === ctx.query.filter; }) ? ctx.query.filter : 'upcoming'; }
  function inFilter(b, key) {
    var T = today(), wk = D.add(T, 6);
    switch (key) {
      case 'week': return isUpcoming(b) && b.state !== 'enquiry' && b.fns.some(function (f) { return f.date >= T && f.date <= wk; });
      case 'advance': return b.state === 'awaiting-advance';
      case 'enquiry': return b.state === 'enquiry';
      case 'due': return b.state === 'balance-due';
      case 'done': return b.state === 'completed';
      default: return isUpcoming(b);
    }
  }
  function matches(b, t) {
    if (!t) return true;
    var d = t.replace(/\D/g, '');
    var hay = [b.client, b.venue, b.area, b.title].join(' ').toLowerCase();
    return hay.indexOf(t) >= 0 || (d.length >= 3 && digits(b.phone).indexOf(d) >= 0);
  }

  /** Row = date + client (+ one exception badge) + one meta line + one value. Overdue rows only appear under the "Overdue"
      filter, so they skip the badge: the late balance in red, "N days late" and the single "Collect" action say it. */
  function row(b) {
    var late = b.state === 'balance-due';
    var meta = [when(b), b.title, b.venue].filter(Boolean).join(' · ');
    var val = late ? h`<span class="money is-due">${F.inr(b.due)}</span>`
      : h`<b>${F.inr(b.total)}</b><span class="bk-sub">${b.state === 'enquiry' ? 'Quote' : b.due > 0 ? F.inr(b.due) + ' due' : 'Paid'}</span>`;
    return h`<div class="list-item bk-row">
      <a class="bk-link" href="#/bookings/${b.id}">
        ${dateLead(b.start)}
        <span class="li-body"><span class="bk-name"><span class="li-title">${b.client}</span>${late ? '' : flag(b)}</span><span class="li-meta">${meta}</span></span>
        <span class="bk-val">${val}</span>
      </a>
      ${late ? h`<button class="btn btn-secondary btn-sm" data-open="collect" data-p-kind="booking" data-p-id="${b.id}">Collect</button>` : ''}
    </div>`;
  }

  function groups(list) {
    var out = [], cur = null;
    list.forEach(function (b) {
      var m = b.start.slice(0, 7);
      if (!cur || cur.m !== m) { cur = { m: m, items: [] }; out.push(cur); }
      cur.items.push(b);
    });
    return h`<div class="bk-groups">${out.map(function (g) {
      return h`<section class="card bk-group" aria-labelledby="bkm-${g.m}">
        <div class="card-head"><h2 class="card-title" id="bkm-${g.m}">${D.monthName(g.m, true)}</h2></div>
        <div class="list">${g.items.map(row)}</div>
      </section>`;
    })}</div>`;
  }

  function results(filter) {
    var all = q.bookings();
    var t = searchText.trim().toLowerCase();
    var list = all.filter(function (b) { return inFilter(b, filter) && matches(b, t); });
    if (filter === 'done' || filter === 'due') list.reverse();
    if (list.length) return groups(list);
    if (t) {
      var elsewhere = FILTERS.filter(function (f) { return f.key !== filter && !f.onlyActive; }).map(function (f) {
        return { f: f, n: all.filter(function (b) { return inFilter(b, f.key) && matches(b, t); }).length };
      }).filter(function (x) { return x.n; });
      return h`<div class="card bk-empty"><div class="empty">
        <div class="empty-title">No match for “${searchText.trim()}”</div>
        ${elsewhere.length ? h`<div class="chips bk-elsewhere">${elsewhere.map(function (x) {
          return h`<a class="chip no-check" href="#/bookings?filter=${x.f.key}">${x.f.label}<span class="chip-count">${x.n}</span></a>`;
        })}</div>` : h`<div class="empty-body">Try a first name, the venue or the last digits of the phone.</div>`}
      </div></div>`;
    }
    var e = EMPTY[filter] || EMPTY.upcoming;
    // an empty list may offer the one button that creates its first item
    return h`<div class="card bk-empty"><div class="empty"><div class="empty-title">${e[0]}</div>
      ${e[1] ? h`<button class="btn btn-secondary btn-sm" data-open="booking-new">New booking</button>` : ''}</div></div>`;
  }

  function kpis(all) {
    var T = today(), wk = D.add(T, 6);
    var conf = all.filter(function (b) { return isUpcoming(b) && b.state !== 'enquiry'; });
    var fnN = 0, days = {};
    conf.forEach(function (b) { b.fns.forEach(function (f) { if (f.date >= T && f.date <= wk) { fnN++; days[f.date] = 1; } }); });
    var dayN = Object.keys(days).length;
    var booked = q.sum(conf, function (b) { return b.total; }), adv = q.sum(conf, function (b) { return b.paid; });
    var odSum = q.sum(all.filter(function (b) { return b.state === 'balance-due'; }), function (b) { return b.due; });
    var toCollect = q.sum(conf, function (b) { return Math.max(0, b.due); }) + odSum;
    return h`<section class="kpi-row bk-kpis" aria-label="Bookings at a glance">
      <a class="kpi" href="#/bookings?filter=week"><div class="kpi-label">Next 7 days</div><div class="kpi-value">${F.plural(fnN, 'function')}</div>
        <div class="kpi-foot">${dayN ? 'on ' + F.plural(dayN, 'day') : 'A calm week'}</div></a>
      <a class="kpi" href="#/bookings"><div class="kpi-label">Booked ahead</div><div class="kpi-value">${F.inr(booked)}</div>
        <div class="kpi-foot">${F.inr(adv)} advance in</div></a>
      <a class="kpi" href="#/bookings?filter=due"><div class="kpi-label">To collect</div><div class="kpi-value">${F.inr(toCollect)}</div>
        <div class="kpi-foot">${odSum ? h`<span><span class="money is-due">${F.inr(odSum)}</span> overdue</span>` : 'Nothing overdue'}</div></a>
    </section>`;
  }

  /** Status filter = the same `.seg` with counts that Academy uses (underline tabs are for page sections only). */
  function listView(ctx) {
    var all = q.bookings();
    var filter = filterOf(ctx);
    var segs = FILTERS.map(function (f) { return { f: f, n: all.filter(function (b) { return inFilter(b, f.key); }).length }; })
      .filter(function (x) { return x.f.key === filter || (!x.f.onlyActive && (x.n > 0 || x.f.key === 'upcoming')); });
    return h`
      ${kpis(all)}
      <div class="bk-toolbar">
        <nav class="seg bk-filters" aria-label="Filter bookings">${segs.map(function (x) {
          var on = x.f.key === filter;
          return h`<a class="seg-item ${on ? 'is-active' : ''}" href="#/bookings${x.f.key === 'upcoming' ? '' : '?filter=' + x.f.key}" ${attr(on, 'aria-current="true"')}>${x.f.label}<span class="bk-count">${x.n}</span></a>`;
        })}</nav>
        ${all.length > 10 ? h`<div class="search bk-search">${I('search')}<input class="input" id="bk-q" type="search" placeholder="Search bookings" autocomplete="off" value="${searchText}" aria-label="Search bookings"></div>` : ''}
      </div>
      <div id="bk-results" aria-live="polite">${results(filter)}</div>`;
  }

  /* =====================================================================================
     Calendar view
     ===================================================================================== */
  function calHref(m, d) { return '#/bookings?view=calendar&month=' + m + (d ? '&day=' + d : ''); }

  function dayPanel(day, evs) {
    var T = today(), past = day < T;
    var team = uniq([].concat.apply([], evs.map(function (e) { return e.b.team; })));
    var sub = [day === T ? 'Today' : day === D.add(T, 1) ? 'Tomorrow' : '', q.isMuhurtham(day) ? 'Muhurtham day' : ''].filter(Boolean).join(' · ');
    return h`<section class="card bk-day" aria-labelledby="bk-day-t">
      <div class="card-head"><div class="bk-day-head"><h2 class="card-title" id="bk-day-t">${F.date(day, 'full')}</h2>${sub ? h`<p class="bk-day-sub">${sub}</p>` : ''}</div></div>
      ${evs.length ? h`<div class="list">${evs.map(function (e) {
        // the start time leads the row, so the meta only adds when the team leaves (Today's wording)
        return h`<a class="list-item" href="#/bookings/${e.b.id}">
          <span class="bk-time">${F.time(e.f.time)}</span>
          <span class="li-body"><span class="li-title">${e.b.client}</span><span class="li-meta">${e.f.name} · Team leaves ${F.time(e.f.call)} · ${e.b.venue}</span></span>
          ${e.b.state === 'enquiry' ? h`<span class="badge badge-info">Enquiry</span>` : ''}</a>`;
      })}</div>
      <div class="card-body bk-day-foot"><p class="subtle small">${team.length ? 'Team out: ' + team.map(q.firstName).join(', ') : 'No team assigned yet'}</p></div>`
      : h`<div class="card-body"><p class="subtle small">${past ? 'No bookings on this day.' : 'Free — nothing booked yet.'}</p></div>`}
      ${past || evs.length ? '' : h`<div class="card-body bk-book-m"><button class="btn btn-secondary btn-block" data-open="booking-new" data-p-date="${day}">Book this date</button></div>`}
    </section>`;
  }

  function calView(ctx) {
    var T = today();
    var qd = isDay(ctx.query.day) ? ctx.query.day : null;
    var m = /^\d{4}-\d{2}$/.test(ctx.query.month || '') ? ctx.query.month : (qd ? qd.slice(0, 7) : T.slice(0, 7));
    var sel = qd && qd.slice(0, 7) === m ? qd : (m === T.slice(0, 7) ? T : null);
    var ev = eventsByDate();
    var firstDow = D.parse(m + '-01').getDay();
    var start = D.add(m + '-01', -firstDow);
    var cells = Math.ceil((firstDow + D.daysInMonth(m)) / 7) * 7;
    var days = [];
    for (var i = 0; i < cells; i++) days.push(D.add(start, i));

    var grid = days.map(function (d) {
      var es = ev[d] || [], out = d.slice(0, 7) !== m, muh = q.isMuhurtham(d);
      var label = F.date(d, 'full') + (muh ? ', Muhurtham day' : '') + (es.length ? ', ' + F.plural(es.length, 'booking') : '');
      return h`<a class="cal-day ${out ? 'is-out' : ''} ${d === T ? 'is-today' : ''} ${d === sel ? 'is-selected' : ''} ${muh ? 'is-muhurtham' : ''} ${d < T ? 'is-past' : ''}"
        href="${calHref(d.slice(0, 7), d)}" aria-label="${label}" ${attr(d === sel, 'aria-current="date"')}>
        <span class="cal-num">${+d.slice(8, 10)}</span>
        ${es.slice(0, 2).map(function (e) {
          var cls = e.b.state === 'enquiry' ? 'is-enquiry' : (e.b.isPast || e.b.state === 'completed' || e.b.state === 'balance-due') ? 'is-past' : '';
          return h`<span class="cal-ev ${cls}" title="${e.b.client} · ${e.f.name} ${F.time(e.f.time)}">${first(e.b.client)}</span>`;
        })}
        ${es.length > 2 ? h`<span class="bk-cal-more">+${es.length - 2} more</span>` : ''}
        ${es.length ? h`<span class="cal-dots">${es.slice(0, 3).map(function (e) { return h`<i class="${e.b.state === 'enquiry' ? 'is-enquiry' : ''}"></i>`; })}</span>` : ''}
      </a>`;
    });

    return h`<div class="bk-cal-layout">
      <section class="card bk-cal" aria-labelledby="bk-cal-t">
        <div class="bk-cal-head">
          <a class="icon-btn" href="${calHref(D.addMonths(m, -1))}" aria-label="Previous month">${I('chevron-left')}</a>
          <h2 class="bk-cal-title" id="bk-cal-t">${D.monthName(m, true)}</h2>
          <a class="icon-btn" href="${calHref(D.addMonths(m, 1))}" aria-label="Next month">${I('chevron-right')}</a>
          ${m !== T.slice(0, 7) ? h`<a class="link bk-cal-today" href="${calHref(T.slice(0, 7), T)}">Today</a>` : ''}
        </div>
        <div class="bk-cal-body">
          <div class="calendar">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(function (d) { return h`<span class="cal-dow"><span class="bk-dow-l">${d}</span><span class="bk-dow-s" aria-hidden="true">${d.charAt(0)}</span></span>`; })}${grid}</div>
          <div class="bk-legend" aria-label="Legend"><span><i class="lg-muh"></i>Muhurtham day</span><span><i class="lg-enq"></i>Enquiry</span></div>
        </div>
      </section>
      <div class="bk-cal-side">
        ${sel ? dayPanel(sel, ev[sel] || []) : h`<section class="card"><div class="card-body"><p class="subtle small">Pick a day to see its bookings.</p></div></section>`}
      </div>
    </div>`;
  }

  /* =====================================================================================
     Detail
     ===================================================================================== */
  function notFound() {
    return h`${KM.backLink('/bookings', 'Bookings')}
      <div class="card"><div class="empty"><div class="empty-title">Booking not found</div>
      <div class="empty-body">It may have been removed.</div></div></div>`;
  }

  /** The page's ONE WhatsApp button, named after the message that matters now; the sheet it opens switches between
      the other messages (reminder, review, own words), so payments and contact details carry no WhatsApp links of their own. */
  function headMessage(b) {
    var k = msgKinds(b)[0];
    return [k, MSG_BUTTON[k]];
  }

  function fnCard(b, canComplete) {
    var T = today();
    return h`<section class="card bk-fncard bk-c-fn" aria-labelledby="bk-fn-t">
      <div class="card-head"><h2 class="card-title" id="bk-fn-t">${b.fns.length > 1 ? 'Functions' : 'Function'}</h2>
        ${canComplete ? h`<button class="link bk-head-link" data-bk-complete="${b.id}">Mark completed</button>` : ''}</div>
      <div class="list">${b.fns.map(function (f) {
        var mk = b.makeup.filter(function (m) { return m.fn === f.name; })[0];
        var dd = D.diff(f.date, T);
        // same words as Today: "Team leaves 3:00 PM, starts 6:00 PM"
        var meta = [dd === 0 ? 'Today' : dd === 1 ? 'Tomorrow' : '', 'Team leaves ' + F.time(f.call) + ', starts ' + F.time(f.time), mk ? mk.name : ''].filter(Boolean).join(' · ');
        return h`<div class="list-item ${dd < 0 ? 'is-done' : ''}">${dateLead(f.date, true)}
          <span class="li-body"><span class="li-title">${f.name}</span><span class="li-meta">${meta}</span></span>
          <span class="num bk-price">${mk ? F.inr(mk.price) : ''}</span></div>`;
      })}</div>
      <div class="bk-pkg"><div class="kv">
        ${b.addons.map(function (a) { return h`<div class="kv-row"><span>${a.name}</span><span class="num">${F.inr(a.price)}</span></div>`; })}
        ${b.travel ? h`<div class="kv-row"><span>Travel</span><span class="num">${F.inr(b.travel)}</span></div>` : ''}
        <div class="kv-row is-total"><span>Total</span><span class="num">${F.inr(b.total)}</span></div>
      </div></div>
    </section>`;
  }

  /** Nothing paid yet (an enquiry, or confirmed without advance): no card — the badge and "Record advance"/"Collect" in
      the head say it, and the balance would only repeat the Total above. A late balance always shows, in red. */
  function paymentsCard(b) {
    var late = b.state === 'balance-due', age = lateBy(b);
    if (!b.payments.length && !late) return '';
    return h`<section class="card bk-c-pay" aria-labelledby="bk-pay-t">
      <div class="card-head"><h2 class="card-title" id="bk-pay-t">Payments</h2></div>
      ${b.payments.length ? h`<div class="list">${b.payments.map(function (p) {
        return h`<div class="list-item"><span class="li-body"><span class="li-title">${p.note || 'Payment'}</span>
          <span class="li-meta">${F.date(p.date, 'long')} · ${p.mode === 'cash' ? 'Cash' : 'UPI / GPay'}</span></span>
          <span class="num bk-price">${F.inr(p.amount)}</span></div>`;
      })}</div>` : ''}
      <div class="bk-pkg ${b.payments.length ? '' : 'is-first'}">
        ${b.due > 0 ? h`<div class="kv"><div class="kv-row is-total"><span>${late ? (age ? 'Balance · ' + F.plural(age, 'day') + ' late' : 'Balance · due today') : 'Balance'}</span>
          <span class="${late ? 'money is-due' : ''} num">${F.inr(b.due)}</span></div></div>`
          : h`<p class="bk-paid">Paid in full</p>`}
      </div>
    </section>`;
  }

  /** No team yet: no empty card — Details carries a one-line "Team · Not assigned yet". */
  function teamCard(b) {
    if (!b.wages.length) return '';
    return h`<section class="card bk-c-team" aria-labelledby="bk-team-t">
      <div class="card-head"><h2 class="card-title" id="bk-team-t">Team & wages</h2></div>
      <div class="list">${b.wages.map(function (w) {
        var s = q.staff(w.staff);
        return h`<a class="list-item" href="#/team/${w.staff}">${KM.avatar(s ? s.name : w.staff, 'avatar-sm')}
          <span class="li-body"><span class="li-title">${s ? s.name : w.staff}</span><span class="li-meta">${s ? s.role : ''}</span></span>
          <span class="num bk-price">${F.inr(w.amount)}</span></a>`;
      })}</div>
      <div class="bk-pkg"><div class="kv"><div class="kv-row is-total"><span>Studio keeps</span><span class="num">${F.inr(b.profit)}</span></div></div></div>
    </section>`;
  }

  function jewelsCard(b) {
    var T = today();
    var rs = KM.data.rentals.filter(function (r) { return digits(r.phone) === digits(b.phone); }).sort(function (a, c) { return c.from.localeCompare(a.from); });
    if (!rs.length) return '';
    return h`<section class="card bk-c-jw" aria-labelledby="bk-jw-t">
      <div class="card-head"><h2 class="card-title" id="bk-jw-t">Jewels</h2></div>
      <div class="list">${rs.map(function (r) {
        var j = q.jewel(r.jewel) || { name: r.jewel };
        var late = r.status === 'out' && r.due < T;
        return h`<a class="list-item" href="#/jewels/${r.jewel}">
          <span class="li-body"><span class="li-title">${j.name}</span><span class="li-meta">${F.date(r.from)} → ${F.date(r.due)} · fee ${F.inr(r.fee)} · deposit ${F.inr(r.deposit)}</span></span>
          ${late ? h`<span class="badge badge-danger">Overdue</span>` : h`<span class="subtle xsmall">${r.status === 'returned' ? 'Returned' : 'With client'}</span>`}</a>`;
      })}</div>
    </section>`;
  }

  function detailsCard(b) {
    return h`<section class="card bk-c-dt" aria-labelledby="bk-dt-t">
      <div class="card-head"><h2 class="card-title" id="bk-dt-t">Details</h2>
        <button class="link bk-head-link" data-toast="Editing is out of scope for the prototype" data-kind="info">Edit</button></div>
      <div class="card-body"><div class="kv">
        <div class="kv-row"><span>Phone</span><a class="link" href="tel:+91${digits(b.phone)}">+91 ${F.phone(b.phone)}</a></div>
        ${b.area ? h`<div class="kv-row"><span>Area</span><span>${b.area}</span></div>` : ''}
        ${b.wages.length || b.state === 'cancelled' ? '' : h`<div class="kv-row"><span>Team</span><span class="subtle">Not assigned yet</span></div>`}
        ${b.cust ? h`<div class="kv-row"><span>Customer</span><a class="link" href="#/customers/${b.cust}">View profile</a></div>` : ''}
        ${b.addedBy ? h`<div class="kv-row"><span>Booked by</span><span>${q.staffName(b.addedBy)}</span></div>` : ''}
      </div>
      ${b.notes ? h`<p class="bk-notes">${b.notes}</p>` : ''}</div>
    </section>`;
  }

  function reviewCard(b) {
    if (!b.rating) return '';
    var stars = [1, 2, 3, 4, 5].map(function (n) { return I(n <= b.rating ? 'star-filled' : 'star', { cls: n <= b.rating ? 'is-on' : '' }); });
    return h`<section class="card bk-c-rv" aria-labelledby="bk-rv-t">
      <div class="card-head"><h2 class="card-title" id="bk-rv-t">Review</h2></div>
      <div class="card-body"><div class="bk-stars" aria-label="${b.rating} out of 5 stars">${stars}</div>
        ${b.review ? h`<blockquote class="bk-quote">“${b.review}”</blockquote>` : ''}</div>
    </section>`;
  }

  function detail(id) {
    var b = q.booking(id);
    if (!b) return notFound();
    var canComplete = b.status !== 'completed' && b.state !== 'enquiry' && b.state !== 'cancelled' && b.daysTo <= 0;
    var msg = headMessage(b);
    var main = b.state === 'cancelled' ? ''
      : b.state === 'enquiry' || b.state === 'awaiting-advance' ? h`<button class="btn btn-primary" data-open="collect" data-p-kind="booking" data-p-id="${b.id}">Record advance</button>`
      : b.due > 0 ? h`<button class="btn btn-primary" data-open="collect" data-p-kind="booking" data-p-id="${b.id}">Collect balance</button>` : '';
    var venue = b.venue !== 'Venue to confirm';
    var side = [paymentsCard(b), teamCard(b), jewelsCard(b), reviewCard(b)].filter(Boolean);
    return h`
      ${KM.backLink('/bookings', 'Bookings')}
      <header class="page-head bk-dhead">
        <div class="page-head-text">
          <div class="bk-dtitle"><h1 class="page-title">${b.client}</h1>${flag(b, true)}</div>
          <p class="page-sub">${b.venue}${venue ? h` · <a class="link bk-map" href="${'https://maps.google.com/?q=' + encodeURIComponent(b.venue)}" target="_blank" rel="noopener">Map</a>` : ''}</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-wa" data-open="booking-message" data-p-id="${b.id}" data-p-kind="${msg[0]}">${I('brand-whatsapp')}${msg[1]}</button>
          ${main}
        </div>
      </header>
      <div class="bk-detail ${side.length ? '' : 'is-single'}">
        <div class="bk-col">${fnCard(b, canComplete)}${detailsCard(b)}</div>
        ${side.length ? h`<div class="bk-col">${side}</div>` : ''}
      </div>`;
  }

  /* =====================================================================================
     Screen
     ===================================================================================== */
  function head(view) {
    return h`<header class="page-head bk-head">
      <div class="page-head-text"><h1 class="page-title">Bookings</h1></div>
      <div class="page-actions">
        <div class="seg" role="group" aria-label="View">
          <a class="seg-item ${view === 'list' ? 'is-active' : ''}" href="#/bookings" ${attr(view === 'list', 'aria-current="page"')}>List</a>
          <a class="seg-item ${view === 'calendar' ? 'is-active' : ''}" href="#/bookings?view=calendar" ${attr(view === 'calendar', 'aria-current="page"')}>Calendar</a>
        </div>
      </div>
    </header>`;
  }

  var NEW = { label: 'New booking', open: 'booking-new', icon: 'calendar-plus' };
  KM.screen('bookings', {
    title: 'Bookings', icon: 'calendar-heart', role: 'owner',
    /* the one create action for this view (shell top-bar button + first in the Add menu) */
    primary: function (r) {
      if (r.params[0]) {
        var b = q.booking(r.params[0]);
        if (b && b.cust && (b.isPast || b.status === 'completed')) return { label: 'Book again', open: 'booking-new', icon: 'calendar-plus', params: { customer: b.cust } };
        return NEW;
      }
      var d = r.query.view === 'calendar' && isDay(r.query.day) ? r.query.day : null;
      if (d && d >= today()) return { label: 'Book ' + F.date(d), open: 'booking-new', icon: 'calendar-plus', params: { date: d } };
      return NEW;
    },
    render: function (ctx) {
      if (ctx.params[0]) return h`<div class="bk-root">${detail(ctx.params[0])}</div>`;
      var view = ctx.query.view === 'calendar' ? 'calendar' : 'list';
      return h`<div class="bk-root">${head(view)}${view === 'calendar' ? calView(ctx) : listView(ctx)}</div>`;
    },
    mount: function (page, ctx) {
      var root = page.querySelector('.bk-root');
      if (!root) return;
      // a 5th status (e.g. "Next 7 days" from the KPI) can make the seg scroll inside itself on phones: keep the active one in view
      var segs = root.querySelector('.bk-filters'), sel = segs && segs.querySelector('.is-active');
      if (sel && segs.scrollWidth > segs.clientWidth) {
        var over = sel.getBoundingClientRect().right - segs.getBoundingClientRect().right;
        if (over > 0) segs.scrollLeft = over + 24;
      }
      var input = root.querySelector('#bk-q');
      if (input) {
        var filter = filterOf(ctx);
        input.addEventListener('input', function () {
          searchText = input.value;
          var out = root.querySelector('#bk-results');
          if (out) out.innerHTML = String(results(filter));
        });
      }
      root.addEventListener('click', function (e) {
        var c = e.target.closest('[data-bk-complete]');
        if (!c) return;
        var b = q.booking(c.getAttribute('data-bk-complete'));
        if (!b) return;
        KM.confirm({
          title: 'Mark ' + first(b.client) + '’s booking completed?',
          body: b.due > 0 ? F.inr(b.due) + ' is still to be collected — it stays under “Overdue” until it’s paid.' : 'All payments are in. It moves to Completed.',
          confirmLabel: 'Mark completed'
        }).then(function (ok) {
          if (!ok) return;
          q.setBookingStatus(b.id, 'completed');
          KM.toast(b.due > 0 ? 'Marked completed · ' + F.inr(b.due) + ' still due' : first(b.client) + '’s booking is completed ✨', { kind: 'success' });
        });
      });
    }
  });
  KM.on('data:changed', function () { if (KM.parse().id === 'bookings') KM.refresh(); });

  /* =====================================================================================
     Overlay: WhatsApp message preview
     ===================================================================================== */
  /* The one WhatsApp sheet for a booking: the message that matters now is pre-selected; the switch offers the others
     that apply (confirmation / reminder / quote / review / own words) and the text stays editable before sending. */
  function msgKindOf(b, kind) { var ks = msgKinds(b); return ks.indexOf(kind) >= 0 ? kind : ks[0]; }
  KM.overlay('booking-message', {
    title: 'WhatsApp message',
    sub: function (ctx) { var b = q.booking(ctx.params.id); return b ? KM.esc('To ' + b.client + ' · +91 ' + F.phone(b.phone)) : ''; },
    kind: 'modal', size: 'sm', role: 'owner',
    render: function (ctx) {
      var b = q.booking(ctx.params.id);
      if (!b) return h`<div class="empty"><div class="empty-title">Booking not found</div></div>`;
      var ks = msgKinds(b), cur = msgKindOf(b, ctx.params.kind);
      return h`${ks.length > 1 ? h`<div class="seg is-block bk-msg-kinds" role="group" aria-label="Message">${ks.map(function (k) {
          return h`<button type="button" class="seg-item ${k === cur ? 'is-active' : ''}" data-bk-kind="${k}" aria-pressed="${k === cur ? 'true' : 'false'}">${MSG_LABEL[k]}</button>`;
        })}</div>` : ''}
        <textarea class="wa-preview bk-wa-text" id="bk-wa-text" rows="7" aria-label="Message text">${msgFor(b, cur)}</textarea>`;
    },
    footer: function (ctx) {
      var b = q.booking(ctx.params.id);
      if (!b) return '';
      return h`<button class="btn btn-secondary" data-bk-copy>${I('copy')}Copy</button>
        <a class="btn btn-wa" href="${KM.wa(b.phone, msgFor(b, msgKindOf(b, ctx.params.kind)))}" target="_blank" rel="noopener" data-bk-wa-open autofocus>${I('brand-whatsapp')}Open WhatsApp</a>`;
    },
    mount: function (el, ctx) {
      var b = q.booking(ctx.params.id);
      if (!b) return;
      var ta = el.querySelector('#bk-wa-text'), open = el.querySelector('[data-bk-wa-open]');
      var sync = function () { if (open && ta) open.setAttribute('href', KM.wa(b.phone, ta.value)); };
      if (ta) ta.addEventListener('input', sync);
      el.addEventListener('click', function (e) {
        var k = e.target.closest('[data-bk-kind]');
        if (k && ta) {
          var kind = k.getAttribute('data-bk-kind');
          el.querySelectorAll('[data-bk-kind]').forEach(function (x) { var on = x === k; x.classList.toggle('is-active', on); x.setAttribute('aria-pressed', on ? 'true' : 'false'); });
          ta.value = msgFor(b, kind); sync();
          if (kind === 'note') { try { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } catch (err) {} }
          return;
        }
        if (e.target.closest('[data-bk-copy]')) {
          var txt = ta ? ta.value : '';
          try { navigator.clipboard.writeText(txt).then(function () { KM.toast('Message copied'); }, function () { KM.toast('Message copied'); }); } catch (err) { KM.toast('Message copied'); }
        }
        if (e.target.closest('[data-bk-wa-open]')) setTimeout(function () { KM.close(); KM.toast('Opening WhatsApp…', { kind: 'info' }); }, 60);
      });
    }
  });

  /* =====================================================================================
     Overlay: New booking wizard
     ===================================================================================== */
  var STEPS = [['Client', 'Client'], ['Functions & dates', 'Dates'], ['Makeup & add-ons', 'Makeup'], ['Payment & review', 'Payment']];
  var W = null;

  function mkType(n) { return KM.data.makeupTypes.filter(function (m) { return m.name === n; })[0]; }
  function addonPrice(n) { var a = KM.data.addonTypes.filter(function (x) { return x.name === n; })[0]; return a ? a.price : 0; }
  function teamOf(id) { return W.team.filter(function (t) { return t.id === id; })[0]; }
  function newFn(name, date) {
    var t = FN_TIMES[name] || ['10:00', '08:00'];
    return { name: name, date: date || '', time: t[0], call: t[1], callAuto: true, mk: '', price: '' };
  }
  function lookup(d) {
    if (!d || d.length !== 10) return null;
    var c = q.findByPhone(d);
    var bks = q.bookings().filter(function (b) { return digits(b.phone) === d; });
    if (c) return { key: c.id, cust: c.id, name: c.name, area: c.area, c: c, bookings: bks };
    if (bks.length) return { key: 'b' + d, cust: null, name: bks[0].client, area: bks[0].area, bookings: bks };
    return null;
  }
  function applyLookup(found) {
    W.look = found ? found.key : null;
    W.cust = found ? found.cust : null;
    if (found) {
      if (!W.name || W.autoName) { W.name = found.name; W.autoName = true; }
      if (!W.area || W.autoArea) { W.area = found.area || ''; W.autoArea = true; }
    } else {
      if (W.autoName) { W.name = ''; W.autoName = false; }
      if (W.autoArea) { W.area = ''; W.autoArea = false; }
    }
  }

  function wInit(ctx) {
    var p = ctx.params || {};
    W = { step: 1, maxStep: 1, phone: '', name: '', area: '', cust: null, look: null, autoName: false, autoArea: false, venue: '',
      fns: [], active: 0, calMonth: today().slice(0, 7), prefDate: null, addons: [], travel: '', team: [],
      adv: '', mode: 'upi', confirmNoAdv: true, notes: '', sendWa: true, errors: {}, el: null };
    if (p.customer) {
      var c = q.customer(p.customer);
      if (c) { W.phone = c.phone; applyLookup(lookup(c.phone)); }
    }
    if (isDay(p.date) && p.date >= today()) { W.prefDate = p.date; W.calMonth = p.date.slice(0, 7); }
    var step = parseInt(p.step, 10);
    if (step >= 2 && step <= 4) { demoFill(step); W.step = step; W.maxStep = step; }
  }
  /** Prototype-only: `_step=N` jumps straight to a step with believable data so every step can be reviewed. */
  function demoFill(step) {
    if (!W.phone) { W.phone = '9840002012'; applyLookup(lookup(W.phone)); }
    if (!W.venue) W.venue = 'Kamatchi Mahal, Porur';
    if (!W.fns.length) {
      var a = newFn('Reception', '2026-11-19'), b = newFn('Muhurtham', '2026-11-20');
      W.fns = [a, b]; W.active = 1; W.calMonth = '2026-11';
    }
    if (step >= 3) {
      W.fns[0].mk = 'HD Makeup'; W.fns[0].price = '12000';
      if (W.fns[1]) { W.fns[1].mk = 'Airbrush Makeup'; W.fns[1].price = '18000'; }
      W.addons = ['Groom: Face Makeup', 'Bridesmaid: Saree Draping'];
      W.travel = '800';
      W.team = [{ id: 'meena', wage: WAGE.meena }, { id: 'lavanya', wage: WAGE.lavanya }];
    }
    if (step >= 4) { W.adv = '10000'; W.mode = 'upi'; W.notes = 'Soft glam, kemp set from our collection. Jasmine jadai for Muhurtham.'; }
  }

  function wTotals() {
    var mk = q.sum(W.fns, function (f) { return +f.price || 0; });
    var ad = q.sum(W.addons, addonPrice);
    var tr = +W.travel || 0;
    var wages = q.sum(W.team, function (t) { return +t.wage || 0; });
    var total = mk + ad + tr;
    var adv = Math.max(0, +W.adv || 0);
    return { mk: mk, ad: ad, tr: tr, wages: wages, total: total, adv: adv, due: total - adv, net: total - wages };
  }

  function wErr(key) {
    var m = W.errors[key];
    return m ? h`<span class="bkw-err" data-err="${key}" role="alert">${I('alert-circle')}${m}</span>` : '';
  }
  function inv(key) { return attr(!!W.errors[key], 'aria-invalid="true"'); }
  /** The step bar already names the step, so the pane heading is for screen readers and focus only. */
  function wHead(title) {
    var focusTitle = !(W.step === 1 && !W.phone);   // step 1 with no phone focuses the phone field instead
    return h`<h3 class="bkw-title sr-only" tabindex="-1" ${attr(focusTitle, 'autofocus')}>${title}</h3>`;
  }

  function wSteps() {
    return h`<ol class="bkw-steps" aria-label="Steps">${STEPS.map(function (s, i) {
      var n = i + 1;
      var cls = n === W.step ? 'is-current' : n < W.step ? 'is-done' : n <= W.maxStep ? 'is-reached' : '';
      return h`<li class="bkw-step ${cls}"><button type="button" class="bkw-step-btn" data-step-go="${n}" ${attr(n > W.maxStep, 'disabled')} ${attr(n === W.step, 'aria-current="step"')}>
        <span class="bkw-step-num">${n < W.step ? I('check') : n}</span>
        <span class="bkw-step-label"><span class="bkw-long">${s[0]}</span><span class="bkw-short">${s[1]}</span></span></button></li>`;
    })}</ol>`;
  }

  /* ---------- step 1: client ---------- */
  function wLookup() {
    var d = W.phone;
    if (d.length < 10) return d.length ? h`<span class="hint">${10 - d.length} more digits</span>` : '';
    var f = lookup(d);
    if (!f) return h`<span class="status is-info">New client</span>`;
    var c = f.c, up = f.bookings.filter(isUpcoming);
    var facts = c ? ['Returning', F.plural(c.visitCount, 'visit'), c.lastVisit ? 'last ' + F.date(c.lastVisit) : '', F.inr(c.lifetime) + ' spent']
      : ['Booked with us before', F.plural(f.bookings.length, 'booking')];
    return h`<span class="status is-success">${facts.filter(Boolean).join(' · ')}</span>
      ${up.length ? h`<span class="status is-warning">Already booked: ${up[0].title} on ${F.date(up[0].start)}</span>` : ''}`;
  }
  function wStep1() {
    var areas = uniq(KM.data.customers.map(function (c) { return c.area; })).sort();
    return h`${wHead('Client')}
      <div class="bkw-narrow form-grid cols-2">
        <div class="field span-all">
          <label class="label" for="bkw-phone">Mobile number <span class="req">*</span></label>
          <div class="input-group bkw-phone"><span class="input-prefix">+91</span><input class="input is-big" id="bkw-phone" data-w="phone" type="tel" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="98400 00000" value="${W.phone}" ${inv('phone')} ${attr(W.step === 1 && !W.phone, 'autofocus')}></div>
          <div class="bkw-lookup" id="bkw-lookup" aria-live="polite">${wLookup()}</div>
          ${wErr('phone')}
        </div>
        <div class="field"><label class="label" for="bkw-name">Client name <span class="req">*</span></label>
          <input class="input" id="bkw-name" data-w="name" autocomplete="off" placeholder="e.g. Nithya Balaji" value="${W.name}" ${inv('name')}>${wErr('name')}</div>
        <div class="field"><label class="label" for="bkw-area">Area</label>
          <input class="input" id="bkw-area" data-w="area" list="bkw-areas" autocomplete="off" placeholder="e.g. Velachery" value="${W.area}">
          <datalist id="bkw-areas">${areas.map(function (a) { return h`<option value="${a}"></option>`; })}</datalist></div>
      </div>`;
  }

  /* ---------- step 2: functions & dates ---------- */
  /** Only what needs attention: a clash with another booking, or a Muhurtham on a non-Muhurtham date. */
  function wFnNote(f) {
    if (!f.date) return '';
    var ev = (eventsByDate()[f.date] || []);
    var muh = q.isMuhurtham(f.date);
    return h`${muh ? h`<span class="status bk-muh-status">Muhurtham day</span>` : f.name === 'Muhurtham' ? h`<span class="status is-warning">Not a Muhurtham date</span>` : ''}
      ${ev.length ? h`<span class="status is-warning bkw-clash">Also that day: ${ev.map(function (e) { return first(e.b.client) + ' · ' + e.f.name + ' (team leaves ' + F.time(e.f.call) + ')'; }).join('; ')}</span>` : ''}`;
  }
  function wFnCard(f, i) {
    var on = i === W.active;
    return h`<div class="bkw-fn ${on ? 'is-active' : ''}" data-fn-card="${i}">
      <div class="bkw-fn-head">
        <button type="button" class="bkw-fn-name" data-fn-activate="${i}" aria-pressed="${on ? 'true' : 'false'}" aria-label="${f.name} — pick its date on the calendar">${f.name}</button>
        <button type="button" class="icon-btn bkw-fn-x" data-fn-toggle="${f.name}" aria-label="Remove ${f.name}">${I('x')}</button>
      </div>
      <div class="bkw-fn-grid">
        <label class="field"><span class="label">Date <span class="req">*</span></span><input class="input" type="date" data-fn="${i}" data-k="date" min="${today()}" value="${f.date}" ${inv('fn' + i)}></label>
        <label class="field"><span class="label">Ceremony</span><input class="input" type="time" data-fn="${i}" data-k="time" value="${f.time}"></label>
        <label class="field"><span class="label">Team leaves</span><input class="input" type="time" data-fn="${i}" data-k="call" value="${f.call}"></label>
      </div>
      <div class="bkw-fn-note" id="bkw-fn-note-${i}">${wFnNote(f)}</div>
      ${wErr('fn' + i)}
    </div>`;
  }
  function wCal() {
    var T = today(), m = W.calMonth, ev = eventsByDate();
    var mine = {};
    W.fns.forEach(function (f) { if (f.date) (mine[f.date] = mine[f.date] || []).push(f.name); });
    var act = W.fns[W.active];
    var firstDow = D.parse(m + '-01').getDay(), dim = D.daysInMonth(m);
    var cells = [];
    for (var i = 0; i < firstDow; i++) cells.push(null);
    for (var d = 1; d <= dim; d++) cells.push(m + '-' + String(d).padStart(2, '0'));
    return h`<div class="bkw-cal-head">
        <button type="button" class="icon-btn" data-cal-nav="-1" aria-label="Previous month" ${attr(m <= T.slice(0, 7), 'disabled')}>${I('chevron-left')}</button>
        <div class="bkw-cal-title">${D.monthName(m, true)}</div>
        <button type="button" class="icon-btn" data-cal-nav="1" aria-label="Next month">${I('chevron-right')}</button>
      </div>
      <div class="bkw-cal-for">${act ? h`Date for <b>${act.name}</b>` : 'Pick a function first'}</div>
      <div class="calendar bkw-grid">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(function (x) { return h`<span class="cal-dow">${x}</span>`; })}${cells.map(function (dt) {
        if (!dt) return h`<span aria-hidden="true"></span>`;
        var n = (ev[dt] || []).length, muh = q.isMuhurtham(dt), my = mine[dt], past = dt < T;
        var label = F.date(dt, 'full') + (muh ? ', Muhurtham day' : '') + (n ? ', ' + F.plural(n, 'booking') + ' already' : '') + (my ? ', your ' + my.join(' & ') : '');
        return h`<button type="button" class="cal-day bkw-day ${muh ? 'is-muhurtham' : ''} ${dt === T ? 'is-today' : ''} ${my ? 'is-picked' : ''}" data-cal-pick="${dt}" aria-label="${label}" ${attr(past, 'disabled')}>
